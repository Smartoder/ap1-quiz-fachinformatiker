/* ---------- Nettokostenvergleich über mehrere Jahre ---------- */
{
  t: 'ap2', id: 'ap2-nettokosten', j: 1, bereich: 'kundenauftrag', titel: 'Angebotsvergleich über die Nutzungsdauer', punkte: 10,
  quelle: 'AP2 · Beschaffung und Investitionsrechnung',
  gen() {
    const preisA = R(5, 12) * 100;
    const rabattB = pick([5, 10, 15]);
    const preisB = r2(preisA * (1 + R(2, 8) / 100));
    const leistungA = pick([90, 120, 150]);
    const leistungB = pick([50, 60, 70]);
    const stunden = pick([6, 8, 10]);
    const tage = 250;
    const strom = 0.30;
    const jahre = pick([3, 4, 5]);

    const bezugA = r2(preisA);
    const bezugB = r2(preisB * (1 - rabattB / 100));
    const kwhA = r2(leistungA / 1000 * stunden * tage);
    const kwhB = r2(leistungB / 1000 * stunden * tage);
    const stromA = r2(kwhA * strom);
    const stromB = r2(kwhB * strom);
    const gesamtA = r2(bezugA + stromA * jahre);
    const gesamtB = r2(bezugB + stromB * jahre);
    const vorteil = r2(Math.abs(gesamtA - gesamtB));
    const besser = gesamtB < gesamtA ? 'B' : 'A';

    return {
      szenario: `<p>Die <b>BüroWelt GmbH</b> vergleicht zwei Geräte für einen Arbeitsplatz. Richten Sie einen
        <strong>Kostenvergleich über die Nutzungsdauer</strong> ein: erst der Bezugspreis nach Rabatt, dann die
        jährlichen Stromkosten, zuletzt die Gesamtkosten.</p>
        <p>Strompreis 0,30 €/kWh. Nutzungsdauer ${jahre} Jahre, ${tage} Betriebstage mit ${stunden} Stunden.</p>`,
      daten: `<table>
        <tr><th class="z">Größe</th><th class="z">Angebot A</th><th class="z">Angebot B</th></tr>
        <tr><td>Listenpreis netto</td><td class="z">${eur(preisA)} €</td><td class="z">${eur(preisB)} €</td></tr>
        <tr><td>Lieferrabatt</td><td class="z">0 %</td><td class="z">${pv(rabattB)}</td></tr>
        <tr><td>Leistungsaufnahme</td><td class="z">${leistungA} W</td><td class="z">${leistungB} W</td></tr>
      </table>`,
      rows: [
        { name: 'Bezugspreis Angebot A', op: '', unit: '€', answer: bezugA },
        { name: `Bezugspreis Angebot B (nach ${pv(rabattB)} Rabatt)`, op: '', unit: '€', answer: bezugB },
        { name: 'Stromverbrauch A pro Jahr', op: '', unit: 'kWh', answer: kwhA, tol: { abs: 0.5 }, dec: 1 },
        { name: 'Stromverbrauch B pro Jahr', op: '', unit: 'kWh', answer: kwhB, tol: { abs: 0.5 }, dec: 1 },
        { name: 'Stromkosten A pro Jahr', op: '', unit: '€', answer: stromA },
        { name: 'Stromkosten B pro Jahr', op: '', unit: '€', answer: stromB },
        { name: `Gesamtkosten A über ${jahre} Jahre`, op: '=', unit: '€', answer: gesamtA, ergebnis: true },
        { name: `Gesamtkosten B über ${jahre} Jahre`, op: '=', unit: '€', answer: gesamtB, ergebnis: true },
        { name: 'Kostenvorteil der günstigeren Variante', op: '', unit: '€', answer: vorteil, ergebnis: true }
      ],
      weg: [
        `Bezugspreis A = ${eur(preisA)} € = ${eur(bezugA)} €`,
        `Bezugspreis B = ${eur(preisB)} € × (1 − ${num(rabattB / 100, 2)}) = ${eur(bezugB)} €`,
        `Stromverbrauch A = ${num(leistungA / 1000, 3)} kW × ${stunden} h × ${tage} = ${num(kwhA, 1)} kWh → ${eur(stromA)} €/Jahr`,
        `Stromverbrauch B = ${num(leistungB / 1000, 3)} kW × ${stunden} h × ${tage} = ${num(kwhB, 1)} kWh → ${eur(stromB)} €/Jahr`,
        `Gesamt A = ${eur(bezugA)} + ${jahre} × ${eur(stromA)} = ${eur(gesamtA)} €`,
        `Gesamt B = ${eur(bezugB)} + ${jahre} × ${eur(stromB)} = ${eur(gesamtB)} €`,
        `Vorteil = ${eur(vorteil)} € zugunsten von Angebot ${besser}`
      ],
      hinweis: 'Merksatz: Der niedrigere Anschaffungspreis entscheidet nicht — erst die <em>Gesamtkosten über die Nutzungsdauer</em> machen Angebote vergleichbar. Formel: Preis nach Rabatt + (Leistung in kW × Stunden × Tage × Strompreis) × Jahre.'
    };
  }
},

/* ---------- Amortisation einer Mehrinvestition ---------- */
{
  t: 'ap2', id: 'ap2-amort', j: 1, bereich: 'kundenauftrag', titel: 'Amortisation einer Mehrinvestition', punkte: 6,
  quelle: 'AP2 · Investitionsrechnung',
  gen() {
    const mehrkosten = R(3, 15) * 100;
    const jahrEinspar = Math.max(50, Math.round(mehrkosten / pick([1.5, 2, 2.5, 3, 4]) / 10) * 10);
    const amort = r2(mehrkosten / jahrEinspar);

    return {
      szenario: `<p>Eine sparsamere Gerätevariante kostet <b>${eur(mehrkosten)} € mehr</b> in der Anschaffung,
        senkt aber die Betriebskosten um <b>${eur(jahrEinspar)} € pro Jahr</b>. Prüfen Sie, ob sich der Aufpreis
        über eine Nutzungsdauer von ${laufzeit} Jahren lohnt.</p>`,
      rows: [
        { name: 'Mehrkosten der sparsameren Variante', op: '', unit: '€', gegeben: true, wert: eur(mehrkosten) },
        { name: 'Jährliche Einsparung', op: '', unit: '€', gegeben: true, wert: eur(jahrEinspar) },
        { name: 'Amortisationszeit', op: '=', unit: 'Jahre', answer: amort, dec: 2, ergebnis: true },
        { name: `Vorteil über ${laufzeit} Jahre`, op: '=', unit: '€', answer: vorteil, ergebnis: true }
      ],
      weg: [
        `Amortisationszeit = Mehrkosten ÷ jährliche Einsparung = ${eur(mehrkosten)} ÷ ${eur(jahrEinspar)} = ${num(amort, 2)} Jahre`,
        `Vorteil = ${laufzeit} × ${eur(jahrEinspar)} − ${eur(mehrkosten)} = ${eur(vorteil)} €`
      ],
      hinweis: amort <= 1
        ? 'Ergebnis: Der Aufpreis ist nach höchstens einem Jahr zurückgeflossen — die sparsamere Variante ist wirtschaftlich klar überlegen.'
        : 'Ergebnis: Erst wenn die Amortisationszeit <em>unter</em> der geplanten Nutzungsdauer liegt, lohnt die Mehrinvestition. Ist der Vorteil positiv, hat sie sich über die Laufzeit bezahlt.'
    };
  }
},

/* ---------- Break-even und Deckungsbeitrag ---------- */
{
  t: 'ap2', id: 'ap2-breakeven', j: 1, bereich: 'kaufmaennisch', titel: 'Break-even & Deckungsbeitrag', punkte: 8,
  quelle: 'AP2 · Kostenrechnung',
  gen() {
    const fix = R(20, 150) * 100;
    const vk = R(15, 60);
    const varK = Math.max(3, vk - pick([5, 8, 10, 12, 15]));
    const db = vk - varK;
    const be = Math.round(fix / db);
    const plan = be + R(5, 60) * 5;
    const gewinn = r2(plan * vk - (fix + plan * varK));

    return {
      szenario: `<p>Für ein neues Serviceprodukt liegen die Fixkosten bei <b>${eur(fix)} € pro Jahr</b>.
        Der Verkaufspreis beträgt <b>${eur(vk)} €</b>, die variablen Kosten je Stück <b>${eur(varK)} €</b>.
        Bestimmen Sie Deckungsbeitrag, Break-even-Menge und den Gewinn bei ${num(plan, 0)} Stück.</p>`,
      rows: [
        { name: 'Fixkosten pro Jahr', op: '', unit: '€', gegeben: true, wert: eur(fix) },
        { name: 'Verkaufspreis je Stück', op: '', unit: '€', gegeben: true, wert: eur(vk) },
        { name: 'Variable Kosten je Stück', op: '', unit: '€', gegeben: true, wert: eur(varK) },
        { name: 'Deckungsbeitrag je Stück', op: '=', unit: '€', answer: db },
        { name: 'Break-even-Menge', op: '=', unit: 'Stück', answer: be, tol: { abs: 1 }, dec: 0, ergebnis: true },
        { name: `Gewinn bei ${num(plan, 0)} Stück`, op: '=', unit: '€', answer: gewinn, ergebnis: true }
      ],
      weg: [
        `Deckungsbeitrag = Verkaufspreis − variable Kosten = ${eur(vk)} − ${eur(varK)} = ${eur(db)} €`,
        `Break-even-Menge = Fixkosten ÷ Deckungsbeitrag = ${eur(fix)} ÷ ${eur(db)} ≈ ${num(be, 0)} Stück`,
        `Gewinn = ${num(plan, 0)} × ${eur(db)} − ${eur(fix)} = ${eur(gewinn)} €`
      ],
      hinweis: 'Der Deckungsbeitrag deckt zuerst die Fixkosten; erst oberhalb der Break-even-Menge entsteht Gewinn. Merke: <span style="font-family:var(--mono)">Break-even-Menge = Fixkosten ÷ Deckungsbeitrag je Stück</span>.'
    };
  }
},

/* ---------- Zuschlagskalkulation ---------- */
{
  t: 'ap2', id: 'ap2-zuschlag', j: 1, bereich: 'kaufmaennisch', titel: 'Zuschlagskalkulation', punkte: 10,
  quelle: 'AP2 · Kosten- und Leistungsrechnung',
  gen() {
    const mek = R(20, 100) * 10;
    const mgk = pick([10, 15, 20]);
    const fek = R(30, 120) * 10;
    const fgk = pick([80, 100, 120, 150]);
    const vwgk = pick([10, 12, 15]);
    const gew = pick([10, 12, 15, 20]);

    const mk = r2(mek * mgk / 100);
    const fk = r2(fek * fgk / 100);
    const hk = r2(mek + mk + fek + fk);
    const vw = r2(hk * vwgk / 100);
    const sk = r2(hk + vw);
    const gewinn = r2(sk * gew / 100);
    const nvp = r2(sk + gewinn);
    const ust = r2(nvp * 0.19);
    const brutto = r2(nvp + ust);

    return {
      szenario: `<p>Kalkulieren Sie einen Auftrag mit der <strong>Zuschlagskalkulation</strong>. Tragen Sie

        { name: 'Fertigungseinzelkosten', op: '', unit: '€', gegeben: true, wert: eur(fek) },
        { name: `+ Fertigungsgemeinkosten ${pv(fgk)}`, op: '+', unit: '€', answer: fk },
        { name: '= Herstellkosten', op: '=', unit: '€', answer: hk, ergebnis: true },
        { name: `+ Verwaltung & Vertrieb ${pv(vwgk)}`, op: '+', unit: '€', answer: vw },
        { name: '= Selbstkosten', op: '=', unit: '€', answer: sk, ergebnis: true },
        { name: `+ Gewinnzuschlag ${pv(gew)}`, op: '+', unit: '€', answer: gewinn },
        { name: '= Nettoverkaufspreis', op: '=', unit: '€', answer: nvp, ergebnis: true },
        { name: '+ Umsatzsteuer 19 %', op: '+', unit: '€', answer: ust },
        { name: '= Bruttoverkaufspreis', op: '=', unit: '€', answer: brutto, ergebnis: true }
      ],
      weg: [

        `Fertigungsgemeinkosten = ${eur(fek)} × ${pv(fgk)} = ${eur(fk)} €`,
        `Herstellkosten = ${eur(mek)} + ${eur(mk)} + ${eur(fek)} + ${eur(fk)} = ${eur(hk)} €`,
        `Verwaltung & Vertrieb = ${eur(hk)} × ${pv(vwgk)} = ${eur(vw)} €`,
        `Selbstkosten = ${eur(hk)} + ${eur(vw)} = ${eur(sk)} €`,
        `Gewinn = ${eur(sk)} × ${pv(gew)} = ${eur(gewinn)} €`,

/* ---------- Lineare und degressive Abschreibung ---------- */
{
  t: 'ap2', id: 'ap2-abschreibung', j: 1, bereich: 'kaufmaennisch', titel: 'Lineare & degressive Abschreibung', punkte: 7,
  quelle: 'AP2 · Rechnungswesen',
  gen() {
    const ak = R(10, 60) * 1000;
    const nd = pick([5, 8, 10]);
    const lin = r2(ak / nd);
    const satz = pick([20, 25, 30]);
    const deg1 = r2(ak * satz / 100);
    const rest1 = r2(ak - deg1);
    const deg2 = r2(rest1 * satz / 100);
    const kum2 = r2(deg1 + deg2);
    const rest2 = r2(ak - kum2);

    return {
      szenario: `<p>Eine Maschine wird für <b>${eur(ak)} €</b> angeschafft und über <b>${nd} Jahre</b> genutzt.
        Stellen Sie die <strong>lineare Abschreibung</strong> der <strong>degressiven Abschreibung</strong>
        (${num(satz, 0)} % vom Restbuchwert) gegenüber.</p>`,
      rows: [
        { name: 'Anschaffungskosten', op: '', unit: '€', gegeben: true, wert: eur(ak) },
        { name: `Lineare Abschreibung je Jahr (${nd} Jahre)`, op: '=', unit: '€', answer: lin },
        { name: `Degressive Abschreibung Jahr 1 (${num(satz, 0)} %)`, op: '=', unit: '€', answer: deg1 },
        { name: 'Restbuchwert nach Jahr 1', op: '=', unit: '€', answer: rest1 },
        { name: 'Degressive Abschreibung Jahr 2', op: '=', unit: '€', answer: deg2 },
        { name: 'Restbuchwert nach Jahr 2', op: '=', unit: '€', answer: rest2, ergebnis: true }
      ],
      weg: [
        `Linear = ${eur(ak)} ÷ ${nd} = ${eur(lin)} € pro Jahr`,
        `Degressiv Jahr 1 = ${eur(ak)} × ${num(satz / 100, 2)} = ${eur(deg1)} €`,
        `Restbuchwert 1 = ${eur(ak)} − ${eur(deg1)} = ${eur(rest1)} €`,
        `Degressiv Jahr 2 = ${eur(rest1)} × ${num(satz / 100, 2)} = ${eur(deg2)} €`,
        `Restbuchwert 2 = ${eur(ak)} − (${eur(deg1)} + ${eur(deg2)}) = ${eur(rest2)} €`
      ],
      hinweis: 'Die lineare Abschreibung verteilt den Betrag gleichmäßig. Die degressive Abschreibung rechnet einen festen Prozentsatz vom <em>Restbuchwert</em> — die Beträge sinken also von Jahr zu Jahr und werden nie null. Abschreibungen sind Aufwand, aber keine Auszahlung.'
    };
  }
},

/* ---------- Verfügbarkeit, MTTR und MTBF ---------- */
{
  t: 'ap2', id: 'ap2-verfuegbarkeit', j: 1, bereich: 'systemloesung', titel: 'Verfügbarkeit, MTTR & MTBF', punkte: 8,
  quelle: 'AP2 · Betrieb und Zuverlässigkeit',
  gen() {
    const betrieb = pick([2190, 4380, 8760]);
    const ausfaelle = R(3, 12);
    const proAusfall = r2(R(4, 40) / 4);   // 1,0 bis 10,0 Stunden
    const gesamtAusfall = r2(ausfaelle * proAusfall);
    const verf = r2((betrieb - gesamtAusfall) / betrieb * 100);
    const mttr = r2(gesamtAusfall / ausfaelle);
    const mtbf = r2((betrieb - gesamtAusfall) / ausfaelle);

    return {
      szenario: `<p>Ein Server wird über einen betrachteten Zeitraum von <b>${num(betrieb, 0)} Stunden</b>
        beobachtet. In dieser Zeit fiel er <b>${ausfaelle}-mal</b> aus, jeweils im Mittel
        <b>${num(proAusfall, 1)} Stunden</b>. Berechnen Sie die Verfügbarkeit sowie MTTR und MTBF.</p>`,
      rows: [
        { name: 'Betrachteter Zeitraum', op: '', unit: 'h', gegeben: true, wert: num(betrieb, 0) },
        { name: 'Anzahl Ausfälle', op: '', unit: '', gegeben: true, wert: num(ausfaelle, 0) },
        { name: 'Ausfallzeit je Ausfall (Mittel)', op: '', unit: 'h', gegeben: true, wert: num(proAusfall, 1) },
        { name: 'Gesamte Ausfallzeit', op: '=', unit: 'h', answer: gesamtAusfall, tol: { abs: 0.1 }, dec: 1 },
        { name: 'Verfügbarkeit', op: '=', unit: '%', answer: verf, tol: { abs: 0.1 }, dec: 2, ergebnis: true },
        { name: 'MTTR (mittlere Wiederherstellungszeit)', op: '=', unit: 'h', answer: mttr, tol: { abs: 0.1 }, dec: 2 },
        { name: 'MTBF (mittlere störungsfreie Zeit)', op: '=', unit: 'h', answer: mtbf, tol: { abs: 0.5 }, dec: 2, ergebnis: true }
      ],
      weg: [
        `Gesamtausfall = ${num(ausfaelle, 0)} × ${num(proAusfall, 1)} h = ${num(gesamtAusfall, 1)} h`,
        `Verfügbarkeit = (${num(betrieb, 0)} − ${num(gesamtAusfall, 1)}) ÷ ${num(betrieb, 0)} × 100 = ${num(verf, 2)} %`,
        `MTTR = Gesamtausfall ÷ Anzahl Ausfälle = ${num(gesamtAusfall, 1)} ÷ ${num(ausfaelle, 0)} = ${num(mttr, 2)} h`,
        `MTBF = (Betriebszeit − Ausfallzeit) ÷ Anzahl Ausfälle = ${num(betrieb - gesamtAusfall, 1)} ÷ ${num(ausfaelle, 0)} = ${num(mtbf, 2)} h`
      ],
      hinweis: 'Verfügbarkeit = (geplante Zeit − Ausfallzeit) ÷ geplante Zeit. MTTR ist die mittlere Zeit bis zum Wiederanlauf, MTBF die mittlere Zeit zwischen zwei Ausfällen. Ein einzelner Ausfall sagt nichts über die Jahresverfügbarkeit — der betrachtete Zeitraum gehört dazu.'
    };
  }
},

/* ---------- Subnetting aus der Präfixlänge ---------- */
{
  t: 'ap2', id: 'ap2-subnetz', j: 1, bereich: 'systemloesung', titel: 'Subnetting: Adressen und Masken', punkte: 5,
  quelle: 'AP2 · Netzwerktechnik',
  gen() {
    const praefix = pick([26, 27, 28, 29]);
    const hostbits = 32 - praefix;
    const adressen = Math.pow(2, hostbits);
    const hosts = adressen - 2;
    const letztesOktett = 256 - adressen;
    const subnetze = Math.pow(2, praefix - 24);

    return {
      szenario: `<p>Ein Netz soll in <strong>/24</strong> unterteilt werden. Geplant sind Subnetze mit der
        Präfixlänge <b>/${praefix}</b>. Ermitteln Sie alle Kennzahlen.</p>`,
      rows: [
        { name: `Präfixlänge /${praefix}`, op: '', unit: 'Bit', gegeben: true, wert: num(praefix, 0) },
        { name: 'Hostbits', op: '=', unit: 'Bit', answer: hostbits, dec: 0 },
        { name: 'Adressen im Subnetz', op: '=', unit: 'Adressen', answer: adressen, dec: 0 },
        { name: 'Nutzbare Hosts', op: '=', unit: 'Hosts', answer: hosts, dec: 0, ergebnis: true },
        { name: 'Letztes Oktett der Subnetzmaske', op: '=', unit: '', answer: letztesOktett, dec: 0 },
        { name: 'Subnetze dieser Größe in einem /24', op: '=', unit: 'Stück', answer: subnetze, dec: 0, ergebnis: true }
      ],
      weg: [
        `Hostbits = 32 − ${praefix} = ${hostbits}`,
        `Adressen = 2^${hostbits} = ${num(adressen, 0)}`,
        `Nutzbare Hosts = ${num(adressen, 0)} − 2 = ${num(hosts, 0)} (Netz- und Broadcastadresse)`,
        `Maske = 256 − ${num(adressen, 0)} = ${num(letztesOktett, 0)} … ${praefix <= 24 ? '255' : '255.255.255.' + num(letztesOktett, 0)}`,
        `Subnetze in /24 = 2^(${praefix} − 24) = ${num(subnetze, 0)}`
      ],
      hinweis: 'Nutzbare Hosts = 2^(32 − Präfix) − 2. Die erste Adresse ist das Netz, die letzte der Broadcast. Merktabelle: /26 → 62 Hosts, /27 → 30, /28 → 14, /29 → 6.'
    };
  }
},

/* ---------- Backup-Volumen über einen Zeitraum ---------- */
{
  t: 'ap2', id: 'ap2-backup', j: 1, bereich: 'systemloesung', titel: 'Backup-Volumen & Sicherungsart', punkte: 8,
  quelle: 'AP2 · Datensicherung',
  gen() {
    const daten = R(50, 300);
    const aenderung = pick([5, 8, 10, 12]);
    const tage = R(5, 10);
    const daily = r2(daten * aenderung / 100);
    const vollGesamt = r2(daten * tage);
    const diffLast = r2(daily * tage);
    const diffGesamt = r2(daten + daily * (tage * (tage + 1) / 2));
    const ersparnis = r2(vollGesamt - diffGesamt);

    return {
      szenario: `<p>Ein Datenbestand von <b>${num(daten, 0)} GB</b> ändert sich täglich um rund
        <b>${num(aenderung, 0)} %</b>. Vergleichen Sie <strong>tägliche Vollsicherung</strong> mit
        <strong>Vollsicherung plus täglich differenzieller Sicherung</strong> über <b>${tage} Tage</b>.</p>`,
      rows: [
        { name: 'Datenbestand', op: '', unit: 'GB', gegeben: true, wert: num(daten, 0) },
        { name: 'Tägliche Änderungsmenge', op: '=', unit: 'GB', answer: daily, tol: { abs: 0.1 }, dec: 1 },
        { name: `Gesamtvolumen bei ${tage}× Vollsicherung`, op: '=', unit: 'GB', answer: vollGesamt, dec: 1 },
        { name: 'Differentielle Sicherung am letzten Tag', op: '=', unit: 'GB', answer: diffLast, dec: 1 },
        { name: `Gesamtvolumen Voll + ${tage}× differenziell`, op: '=', unit: 'GB', answer: diffGesamt, tol: { abs: 0.5 }, dec: 1, ergebnis: true },
        { name: 'Ersparnis gegenüber täglicher Vollsicherung', op: '=', unit: 'GB', answer: ersparnis, tol: { abs: 0.5 }, dec: 1 }
      ],
      weg: [
        `Tägliche Änderung = ${num(daten, 0)} GB × ${num(aenderung, 0)} % = ${num(daily, 1)} GB`,
        `Tägliche Vollsicherung: ${num(daten, 0)} GB × ${tage} = ${num(vollGesamt, 1)} GB`,
        `Differentiell am Tag ${tage} = alle Änderungen seit der Vollsicherung = ${num(daily, 1)} × ${tage} = ${num(diffLast, 1)} GB`,
        `Voll + differenziell = ${num(daten, 0)} GB + (${num(daily, 1)} + 2·${num(daily, 1)} + … + ${tage}·${num(daily, 1)}) = ${num(diffGesamt, 1)} GB`,
        `Ersparnis = ${num(vollGesamt, 1)} − ${num(diffGesamt, 1)} = ${num(ersparnis, 1)} GB`
      ],
      hinweis: 'Differenziell sichert alle Änderungen <em>seit der letzten Vollsicherung</em> — die Rücksicherung braucht nur Voll + letzte Differenz. Inkrementell sichert seit der letzten Sicherung überhaupt und ist sparsamer, braucht zur Rücksicherung aber alle Schritte. Immer nach der 3-2-1-Regel planen.'
    };
  }
},

/* ---------- Make or Buy ---------- */
{
  t: 'ap2', id: 'ap2-makebuy', j: 1, bereich: 'kaufmaennisch', titel: 'Eigenfertigung oder Fremdbezug', punkte: 7,
  quelle: 'AP2 · Beschaffung und Kostenvergleich',
  gen() {
    const stueck = R(2, 20) * 100;
    const eigenVar = R(3, 15) * 2;
    const fix = R(20, 120) * 100;
    const fremd = eigenVar + pick([3, 5, 8, 10]);
    const eigenStk = r2(eigenVar + fix / stueck);
    const differenz = r2(Math.abs(fremd - eigenStk));
    const vorteilJahr = r2(differenz * stueck);
    const lohnt = eigenStk < fremd;

    return {
      szenario: `<p>Ein Bauteil wird künftig in <b>${num(stueck, 0)} Stück</b> pro Jahr benötigt. Prüfen Sie,
        ob <strong>Eigenfertigung</strong> oder <strong>Fremdbezug</strong> wirtschaftlicher ist.</p>
        <p>Bei Eigenfertigung fallen variable Kosten von ${eur(eigenVar)} € je Stück und zusätzliche Fixkosten von
        ${eur(fix)} € pro Jahr an. Der Fremdbezugspreis liegt bei ${eur(fremd)} € je Stück.</p>`,
      daten: `<table>
        <tr><th>Variante</th><th class="z">Kosten je Stück</th></tr>
        <tr><td>Eigenfertigung (variabel)</td><td class="z">${eur(eigenVar)} €</td></tr>
        <tr><td>Zusätzliche Fixkosten (je Jahr)</td><td class="z">${eur(fix)} €</td></tr>
        <tr><td>Fremdbezug</td><td class="z">${eur(fremd)} €</td></tr>
      </table>`,
      rows: [
        { name: `Selbstkosten je Stück bei ${num(stueck, 0)} Stück`, op: '=', unit: '€', answer: eigenStk },
        { name: 'Fremdbezugspreis je Stück', op: '', unit: '€', gegeben: true, wert: eur(fremd) },
        { name: 'Kostendifferenz je Stück', op: '=', unit: '€', answer: differenz },
        { name: 'Vorteil der günstigeren Variante pro Jahr', op: '=', unit: '€', answer: vorteilJahr, ergebnis: true }
      ],
      weg: [
        `Selbstkosten je Stück = variable Kosten + Fixkosten ÷ Menge = ${eur(eigenVar)} + ${eur(fix)} ÷ ${num(stueck, 0)} = ${eur(eigenStk)} €`,
        `Fremdbezug = ${eur(fremd)} € je Stück`,
        `Differenz = |${eur(eigenStk)} − ${eur(fremd)}| = ${eur(differenz)} € je Stück`,
        `Vorteil pro Jahr = ${eur(differenz)} × ${num(stueck, 0)} = ${eur(vorteilJahr)} €`
      ],
      hinweis: lohnt
        ? 'Ergebnis: Die Eigenfertigung ist bei dieser Menge günstiger. Achtung — unterhalb der kritischen Menge kippt das Ergebnis, weil die Fixkosten auf weniger Stück verteilt werden.'
        : 'Ergebnis: Der Fremdbezug ist bei dieser Menge günstiger. Make or Buy hängt immer von der Menge ab: Bei größerer Stückzahl sinkt der Fixkostenanteil je Stück und die Eigenfertigung kann kippen.'
    };
  }
},

/* ---------- Stundensatz kalkulieren ---------- */
{
  t: 'ap2', id: 'ap2-stundensatz', j: 1, bereich: 'kundenauftrag', titel: 'Stundensatz eines Servicetechnikers', punkte: 8,
  quelle: 'AP2 · Angebotskalkulation und Dienstleistung',
  gen() {
    const gehalt = R(40, 70) * 1000;      // Jahresbrutto
    const agAnteil = 0.21;                 // Arbeitgeberanteil Sozialversicherung
    const neben = r2(gehalt * pick([5, 6, 8, 10]) / 100);
    const sach = R(5, 20) * 100;
    const verwaltung = R(5, 20) * 100;
    const urlaub = pick([30, 32]);
    const krank = pick([8, 10, 12]);
    const schulung = pick([3, 5]);
    const bruttoStd = 40;
    const wochen = 52;

    const agKosten = r2(gehalt * agAnteil);
    const personalkosten = r2(gehalt + agKosten + neben);
    const gesamtkosten = r2(personalkosten + sach + verwaltung);
    const produktiv = Math.round((wochen * bruttoStd) - (urlaub * 8) - (krank * 8) - (schulung * 8));
    const selbstkostensatz = r2(gesamtkosten / produktiv);
    const gewinn = r2(selbstkostensatz * 0.15);
    const stundensatz = r2(selbstkostensatz + gewinn);

    return {
      szenario: `<p>Für einen Servicetechniker soll ein <strong>verrechenbarer Stundensatz</strong> kalkuliert
        werden. Jahresbruttogehalt ${eur(gehalt)} €, Arbeitgeberanteil zur Sozialversicherung 21 %,
        Personalnebenkosten ${eur(neben)} €, Sachkosten ${eur(sach)} € und Verwaltungsgemeinkosten
        ${eur(verwaltung)} € pro Jahr.</p>
        <p>Bei einer 40-Stunden-Woche (52 Wochen) fallen ${urlaub} Urlaubstage, ${krank} Krankheitstage und
        ${schulung} Weiterbildungstage weg. Gewinnzuschlag 15 %.</p>`,
      rows: [
        { name: 'Jahresbruttogehalt', op: '', unit: '€', gegeben: true, wert: eur(gehalt) },
        { name: 'Arbeitgeberanteil Sozialversicherung', op: '=', unit: '€', answer: agKosten },
        { name: 'Personalkosten gesamt', op: '=', unit: '€', answer: personalkosten, ergebnis: true },
        { name: 'Gesamtkosten pro Jahr', op: '=', unit: '€', answer: gesamtkosten, ergebnis: true },
        { name: 'Produktive Stunden pro Jahr', op: '=', unit: 'h', answer: produktiv, tol: { abs: 1 }, dec: 0 },
        { name: 'Selbstkostensatz je Stunde', op: '=', unit: '€', answer: selbstkostensatz, tol: { abs: 0.05 }, dec: 2 },
        { name: 'Stundensatz (mit 15 % Gewinn)', op: '=', unit: '€', answer: stundensatz, tol: { abs: 0.05 }, dec: 2, ergebnis: true }
      ],
      weg: [
        `Arbeitgeberanteil = ${eur(gehalt)} × 21 % = ${eur(agKosten)} €`,
        `Personalkosten = ${eur(gehalt)} + ${eur(agKosten)} + ${eur(neben)} = ${eur(personalkosten)} €`,
        `Gesamtkosten = ${eur(personalkosten)} + ${eur(sach)} + ${eur(verwaltung)} = ${eur(gesamtkosten)} €`,
        `Produktive Stunden = ${wochen} × 40 − (${urlaub} + ${krank} + ${schulung}) × 8 = ${num(produktiv, 0)} h`,
        `Selbstkostensatz = ${eur(gesamtkosten)} ÷ ${num(produktiv, 0)} h = ${eur(selbstkostensatz)} €`,
        `Stundensatz = ${eur(selbstkostensatz)} × 1,15 = ${eur(stundensatz)} €`
      ],
      hinweis: 'Ein Stundensatz wird nie aus dem Gehalt allein gerechnet. Erst Arbeitgeberanteil, Nebenkosten, Sach- und Gemeinkosten summieren, dann durch die <em>produktiven</em> Stunden teilen — Urlaub, Krankheit und Weiterbildung sind keine verrechenbare Zeit.'
    };
  }
}

];

     | 2 Einführen einer IT-Systemlösung | schriftlich | 90 min | 10 % |
     | 3 Kaufmännische Unterstützungsprozesse | schriftlich | 90 min | 10 % |
     | 4 Wirtschafts- und Sozialkunde | schriftlich | 60 min | 10 % |

   Bestanden ist Teil 2 nur, wenn das Gesamtergebnis mindestens „ausreichend"
   ist, mindestens drei der vier Bereiche mindestens „ausreichend" sind und
   kein Bereich „ungenügend". Das ist die Begründung, warum dieses Oberfläche
   nach *Bereichen* filtert und nicht nach Zeit: der Kunde lernt das, was
   Punkte bringt — und das ist der Kundenauftrag mit der Hälfte der Note.

   Achse dieses Teils: die vier Prüfungsbereiche, benannt wie im eigenen
   Schriftverkehr des Betriebs (Kundenauftrag, Systemlösung, Kaufmännisches,
   WiSo) — nicht nach der Kurzform A/B/C, die beim ersten Blick auf das
   Deckblatt niemand zuordnen kann.
   ============================================================ */
const BEREICHE2 = [
  { id: 'kundenauftrag', name: 'Kundenauftrag (50 %)', neben: '50 % · Projekt', z: 'Projektarbeit, Dokumentation, Präsentation, Fachgespräch' },
  { id: 'systemloesung', name: 'IT-Systemlösung (10 %)', neben: '90 min', z: 'Technische Lösung entwerfen, begründen, dokumentieren' },
  { id: 'kaufmaennisch', name: 'Kaufmännisches (10 %)', neben: '90 min', z: 'Kosten, Kalkulation, Prozesse, Beschaffung' },
  { id: 'wiso', name: 'WiSo (10 %)', neben: '60 min', z: 'Wirtschafts- und Sozialkunde' }
];

/* ============================================================
   PRÜFUNGSTEIL (AP1 / AP2) — die zwei Oberflächen
   ------------------------------------------------------------
   Der Trainer führt zwei voneinander getrennte Bereiche. Jeder hat eigene
   Themenbereiche, eigene Inhalte und einen eigenen Fortschritt im Speicher.

   Warum getrennt und nicht in einem Datenbestand mit einem Feld:
     · die beiden Prüfungen haben keine gemeinsamen Themenbereiche; ein
       gemeinsames `b` hätte die zwölf AP1-Bereiche mit AP2-Begriffen
       vermischt und die Bereichszuordnung unbrauchbar gemacht;
     · die Jahres-Filterung gilt nur in AP1. In AP2 wird nach Prüfungsbereich
       gefiltert („wo stehe ich?"), nicht nach Ausbildungsjahr;
     · ein Fehler in einer Datensammlung kann so die andere nicht treffen.

   Der Fortschritt liegt in `fortschritt.tasks` unter Schlüsseln, die mit
   „ap2-" beginnen. Ein eigener Zähler und eine eigene Kartensammlung halten
   die Statistik der Kopfzeile sauber gegenüber AP1.
   ============================================================ */
const TEIL_STORE = 'ap1-trainer-teil';
let teil = 'ap1';
try { const g = localStorage.getItem(TEIL_STORE); if (g === 'ap1' || g === 'ap2') teil = g; } catch (e) { }
const teilSpeichern = () => { try { localStorage.setItem(TEIL_STORE, teil); } catch (e) { } };
const istAp2 = () => teil === 'ap2';

/* Alle AP1-Datensammlungen und -Achsen als Funktionen. Ein Aufruf ohne
   Argument ist die jeweilige AP1-Ansicht. */
function daten(t) {
  return t === 'ap2'
    ? { QUIZ: QUIZ2, KARTEN: KARTEN2, LUECKEN: LUECKEN2, FEHLER: FEHLER2, FAELLE: FAELLE2, TASKS: TASKS2, BEREICHE: BEREICHE2 }
    : { QUIZ, KARTEN, LUECKEN, FEHLER, FAELLE, TASKS, BEREICHE };
}
/* Die Achse des offenen Teils: die zwölf AP1-Bereiche bzw. die AP2-Prüfungsbereiche. */
function achse() { return istAp2() ? BEREICHE2 : BEREICHE; }
function bereichName(id) {
  const b = achse().find(x => x.id === id);
  return b ? b.name : '';
}
/* Der zweite Achsenwert neben dem Bereich: in AP1 die Häufigkeit, in AP2 der
   Untertitel. Heißt in beiden Achsen `neben`, damit die Railschleife nur eine
   Zeile braucht. */
function achseNeben(b) { return b && b.neben ? b.neben : ''; }

/* Filtert eine Eintragsliste nach Prüfungsteil, Jahr und Bereich.
   In AP1 gilt der Jahrgangs-Filter, in AP2 nur der Bereich. */
function hole(art, bereich, t) {
  t = t || teil;
  const b = bereich || null;
  return daten(t)[art].filter(o => (t === 'ap1' ? passtJahr(o) : true) && (!b || o.b === b));
}

/* ============================================================
   JAHRGÄNGE (Level) — abgeleitet aus dem KMK-Rahmenlehrplan
   LF 1-5 = 1. Jahr · LF 6-9 = 2. Jahr · LF 10-13 = 3. Jahr
   j = ab welchem Ausbildungsjahr ist dieser Stoff dran
   ============================================================ */
const JAHRE = [
  { id: 1, name: '1. Ausbildungsjahr',   kurz: '1. Jahr',  z: 'Anfang der Ausbildung' },
  { id: 2, name: '2. Ausbildungsjahr',   kurz: '2. Jahr',  z: 'baut auf dem 1. Jahr auf' },
  { id: 3, name: 'Prüfungsvorbereitung', kurz: 'Prüfung',  z: 'alles gemischt' }
];
let jahr = null;
const JAHR_STORE = 'ap1-trainer-jahr';
try { const g = JSON.parse(localStorage.getItem(JAHR_STORE)); if (g === 0 || g === 1 || g === 2 || g === 3) jahr = g; } catch (e) {}
const jahrSpeichern = () => { try { localStorage.setItem(JAHR_STORE, JSON.stringify(jahr)); } catch (e) {} };
/* Kumulativ: wer im 2. Jahr ist, hat das 1. Jahr schon gehabt. */
function passtJahr(aufgabe) {
  if (!jahr) return true;
  const j = aufgabe && aufgabe.j ? aufgabe.j : 1;
  return j <= jahr;
}

/* ============================================================
   PROFILE
   Jeder Nutzer bekommt einen Namen und eine Profil-Kennung (primary key).
   Die Kennung bleibt im Browser gespeichert — auf demselben Rechner ist man
   damit beim nächsten Öffnen schon angemeldet. Auf einem anderen Rechner
   wählt man sein Profil aus der Liste.

   Der Fortschritt liegt im Backend (getrennte Datenbank auf dem eigenen
   Server), damit Schulrechner und Heim-PC denselben Stand zeigen.
   ============================================================ */
const PROFIL_STORE = 'ap1-trainer-profil';
const API = '/ap1';
const DECKUNG = 0.85;          // ab wann der Server-Stand den lokalen ersetzt

let profil = null;             // { id, name, jahr }
let profilListe = [];          // Namen für die Auswahl
let syncStand = 'aus';         // 'aus' | 'gut' | 'fehler'

try {
  const g = JSON.parse(localStorage.getItem(PROFIL_STORE));
  if (g && typeof g.id === 'string' && g.id.length === 36) profil = g;
} catch (e) { /* kein Speicher */ }
const profilMerken = () => {
  try {
    if (profil) localStorage.setItem(PROFIL_STORE, JSON.stringify(profil));
    else localStorage.removeItem(PROFIL_STORE);
  } catch (e) { /* kein Speicher */ }
};

/* ---------- Server-Aufrufe ---------- */
/* Kein Schlüssel im Browser: Fortschritt und Jahr weisen sich über die
   Kennung aus. Für das Anlegen neuer Profile genügt der Name — der Server
   hat eine Obergrenze und eine Bremse gegen zu viele Versuche. */
async function api(weg, methode = 'GET', koerper) {
  const r = await fetch(API + weg, {
    method: methode,
    headers: koerper ? { 'content-type': 'application/json' } : undefined,
    body: koerper ? JSON.stringify(koerper) : undefined
  });
  let daten = null;
  try { daten = await r.json(); } catch (e) { }
  if (!r.ok) {
    const e = new Error((daten && daten.fehler) || ('Server antwortete ' + r.status));
    e.status = r.status;
    throw e;
  }
  return daten;
}

/* Holt die Namen, die schon vergeben sind. */
async function profileLaden() {
  try {
    const j = await api('/profile');
    profilListe = (j.profile || []).map(p => ({ id: p.id, name: p.name, jahr: p.jahr }));
    return profilListe;
  } catch (e) {
    profilListe = [];
    return [];
  }
}

/* Schreibt den Fortschritt zum Server. Wird gebündelt aufgerufen, damit
   nicht jede einzelne Antwort eine Anfrage auslöst. */
let syncGeber = null;
function syncPlanen() {
  if (!profil) return;
  clearTimeout(syncGeber);
  syncGeber = setTimeout(() => syncJetzt(), 1200);
}

async function syncJetzt() {
  if (!profil) return;
  try {
    await api('/fortschritt/' + profil.id, 'PUT', {
      data: {
        tasks: fortschritt.tasks,
        serie: fortschritt.serie,
        punkte: fortschritt.punkte,
        karten: kartenFaecher,
        stand: new Date().toISOString()
      }
    });
    syncStand = 'gut';
  } catch (e) {
    syncStand = 'fehler';
  }
  kopfJahrZeichnen();
}

/* Holt den Stand vom Server. Nur laden, wenn der Server weiter ist als der
   Browser — sonst würde ein frisch gelöstes Blatt wieder überschrieben. */
async function standHolen() {
  if (!profil) return false;
  try {
    const j = await api('/fortschritt/' + profil.id);
    const d = j && j.data;
    if (!d || !d.tasks) return false;

    const servPunkte = Object.values(d.tasks).reduce((a, t) => a + (t.max || 0), 0);
    const lokalPunkte = Object.values(fortschritt.tasks).reduce((a, t) => a + (t.max || 0), 0);

    if (servPunkte > 0 && (lokalPunkte === 0 || servPunkte >= lokalPunkte * DECKUNG)) {
      fortschritt.tasks = d.tasks || {};
      fortschritt.serie = d.serie || 0;
      fortschritt.punkte = d.punkte || 0;
      if (d.karten && typeof d.karten === 'object') kartenFaecher = d.karten;
      try { localStorage.setItem(STORE, JSON.stringify(fortschritt)); } catch (e) { }
      try { localStorage.setItem(KARTEN_STORE, JSON.stringify(kartenFaecher)); } catch (e) { }
      syncStand = 'gut';
      return true;
    }
    return false;
  } catch (e) {
    syncStand = 'fehler';
    return false;
  }
}

/* ---------- Jahr wechseln, auch am Server ---------- */
async function jahrZumServer(j) {
  if (!profil || !j) return;
  try {
    await api('/profile/' + profil.id + '/jahr', 'PUT', { jahr: j });
    profil.jahr = j;
    profilMerken();
  } catch (e) { /* Das Jahr bleibt lokal richtig; der Server zieht beim nächsten Mal nach. */ }
}


/* ============================================================
   ZUSTAND & RENDERING
   ============================================================ */
let aktuell = null;     // { task, inst }
let sim = null;         // { queue:[ids], idx, punkte, max, start, ende }
let zeitGeber = null;
let modus = 'rechnen';  // 'rechnen' | 'quiz' | 'karten' | 'luecken' | 'fehler' | 'fall'
let quizLauf = null;    // { reihe:[fragen], idx, richtig, beantwortet, gewaehlt:[] }
let kartenLauf = null;  // { stapel:[karten], idx, aufgedeckt, gewusst, nicht }
let lueckenLauf = null; // { ex, werte:[], geprueft }
let fehlerLauf = null;  // { ex, urteil:[] , geprueft }
let fallLauf = null;    // { fall, idx, punkte, max, beantwortet, gewaehlt }

const blatt = document.getElementById('blatt');
const rail = document.getElementById('rail');

function railZeichnen() {
  rail.innerHTML = '';

  /* Sprungmarke zur Position im Baum – die Zahl wird unten gesetzt. */
  const zUnter = document.createElement('span');
  zUnter.setAttribute('aria-hidden', 'true');
  const zOben = document.createElement('span');
  zOben.setAttribute('aria-hidden', 'true');

  /* --- Ebene 1: die sechs Formate ---
     Sie sind die Hauptwege und stehen deshalb in einem eigenen, gerahmten
     Block mit Nummer. Nummern sind hier berechtigt: die Lernwege folgen
     einer Reihenfolge (erst rechnen, dann prüfen, dann abfragen), nicht
     einer bloßen Aufzählung. */
  const fGruppe = document.createElement('div');
  fGruppe.className = 'rail-gruppe';
  const fh = document.createElement('div');
  fh.className = 'rail-kopf';
  fh.innerHTML = '<span>Formate</span><span class="haeufig">6</span>';
  fGruppe.appendChild(fh);
  const fBlock = document.createElement('div');
  fBlock.className = 'rail-formate';
  const formate = [
    { id: 'start', name: 'Startseite', z: 'Info', fn: startseiteZeigen },
    { id: 'rechnen', name: 'Rechen-Aufgaben', z: hole('TASKS').length + ' Stück', fn: () => { modus = 'rechnen'; starteAufgabe(ersteAufgabe().id); } },
    { id: 'quiz', name: 'Multiple-Choice-Quiz', z: hole('QUIZ').length + ' Fragen', fn: starteQuiz },
    { id: 'karten', name: 'Karteikarten', z: hole('KARTEN').length + ' Karten', fn: starteKarten },
    { id: 'luecken', name: 'Lückentexte', z: hole('LUECKEN').length + ' Texte', fn: starteLuecken },
    { id: 'fehler', name: 'Fehlersuche', z: hole('FEHLER').length + ' Blöcke', fn: starteFehler },
    { id: 'fall', name: 'Fallstudien', z: hole('FAELLE').length + ' Fälle', fn: starteFall }
  ];
  formate.forEach((f, i) => {
    const btn = document.createElement('button');
    /* „Aktiv" erst, wenn wirklich gelernt wird: ohne Profil oder Jahr zeigt
       das Blatt die Anmeldung bzw. die Jahr-Wahl — dann ist kein Weg offen
       und keiner darf hervorgehoben sein. In AP2 gibt es keine Jahr-Wahl,
       dort genügt das Profil. */
    const bereit = profil && (istAp2() || jahr !== null);
    const istAktiv = bereit && modus === f.id;
    btn.className = 'rail-item' + (istAktiv ? ' aktiv' : '');
    btn.type = 'button';
    const links = document.createElement('span');
    const nr = document.createElement('span');
    nr.className = 'nr';
    nr.textContent = f.id === 'start' ? '·' : String(i);
    nr.setAttribute('aria-hidden', 'true');
    const nm = document.createElement('span');
    nm.textContent = f.name;
    links.append(nr, nm);
    const zs = document.createElement('span');
    zs.className = 'z';
    zs.textContent = f.z;
    btn.append(links, zs);
    btn.onclick = () => { sim = null; clearInterval(zeitGeber); starteBereich(f.id); mobilEinklappen(); };
    fBlock.appendChild(btn);
  });
  fGruppe.appendChild(fBlock);
  rail.appendChild(fGruppe);

  /* --- Ebene 2 bis 4: Bereich → Aufgabe → Quiz/Karten --- */
  for (const b of achse()) {
    const aufgaben = hole('TASKS', b.id);
    const quizN = hole('QUIZ', b.id).length;
    const kartenN = hole('KARTEN', b.id).length;
    if (!aufgaben.length && !quizN && !kartenN) continue;

    const gruppe = document.createElement('div');
    gruppe.className = 'rail-gruppe';

    /* Ebene 2: Der Bereich ist eine Titelzeile, kein Knopf. Er gliedert die
       Liste; anklickbar ist erst die Aufgabe darunter. */
    const h = document.createElement('div');
    h.className = 'rail-kopf titel';
    h.innerHTML = `<span>${b.name}</span><span class="haeufig" title="${istAp2() ? 'Gewicht bzw. Dauer dieses Prüfungsbereichs' : 'Wie häufig dieses Thema in AP1 vorkam (Auswertung 2021–2026)'}">${achseNeben(b)}</span>`;
    gruppe.appendChild(h);

    /* Ebene 3: eine Rechenaufgabe. Der Fortschritt steht als kleine Marke,
       nicht als nackte Prozentzahl — er ist ein Zustand, kein Wert. */
    for (const t of aufgaben) {
      const btn = document.createElement('button');
      btn.className = 'rail-item tief' + (modus === 'rechnen' && aktuell && aktuell.task.id === t.id ? ' aktiv' : '');
      btn.type = 'button';
      const f = fortschritt.tasks[t.id];
      const q = f && f.max ? Math.round(f.punkte / f.max * 100) : null;
      const links = document.createElement('span');
      links.textContent = t.titel;
      const marke = document.createElement('span');
      marke.className = 'stand-marke' + (q !== null && q >= 80 ? ' voll' : '');
      marke.textContent = q === null ? '–' : q + ' %';
      marke.setAttribute('aria-hidden', 'true');
      btn.append(links, marke);
      /* Fortschritt ist eine Prozentzahl, keine bloße Ziffer: für Vorleser
         als "84 Prozent" statt "84" ausgeben. */
      btn.setAttribute('aria-label', t.titel + (q === null ? ', noch kein Versuch' : ', ' + q + ' Prozent Fortschritt'));
      btn.onclick = () => {
        sim = null; clearInterval(zeitGeber); modus = 'rechnen'; starteAufgabe(t.id);
        mobilEinklappen();
      };
      gruppe.appendChild(btn);
    }

    /* Ebene 4: Direkteinstieg in Quiz/Karten. Bewusst kleiner, weiter
       eingerückt und ohne Fortschrittsmarke — die Zahl hier ist die Menge
       der Fragen, und das ist keine Leistung. */
    if (quizN) {
      const btn = document.createElement('button');
      btn.className = 'rail-item spross' + (modus === 'quiz' && quizLauf && quizLauf.bereich === b.id ? ' aktiv' : '');
      btn.type = 'button';
      btn.innerHTML = `<span>Quiz zu diesem Bereich</span><span class="z">${quizN}</span>`;
      btn.setAttribute('aria-label', `Quiz zu ${b.name}: ${quizN} Fragen`);
      btn.onclick = () => { sim = null; clearInterval(zeitGeber); adresseSetzen(b.id); starteQuiz(b.id); mobilEinklappen(); };
      gruppe.appendChild(btn);
    }
    if (kartenN) {
      const btn = document.createElement('button');
      btn.className = 'rail-item spross' + (modus === 'karten' && kartenLauf && kartenLauf.bereich === b.id ? ' aktiv' : '');
      btn.type = 'button';
      btn.innerHTML = `<span>Karteikarten zu diesem Bereich</span><span class="z">${kartenN}</span>`;
      btn.setAttribute('aria-label', `Karteikarten zu ${b.name}: ${kartenN} Karten`);
      btn.onclick = () => { sim = null; clearInterval(zeitGeber); adresseSetzen(b.id); starteKarten(b.id); mobilEinklappen(); };
      gruppe.appendChild(btn);
    }
    rail.appendChild(gruppe);
  }

  const fuss = document.createElement('div');
  fuss.className = 'rail-fuss rail-gruppe';
  fuss.innerHTML = `<div class="rail-kopf"><span>Mehr</span></div>`;
  /* Prüfungssimulation nur in AP1: sie mischt ausschließlich Rechenaufgaben
     und ist auf den 90-Minuten-Rahmen von Teil 1 zugeschnitten. */
  if (!istAp2()) {
    const b1 = document.createElement('button');
    b1.className = 'rail-item'; b1.type = 'button';
    b1.innerHTML = '<span>Prüfungssimulation starten</span><span class="z">90 min</span>';
    b1.onclick = () => { modus = 'rechnen'; starteSimulation(); mobilEinklappen(); };
    fuss.appendChild(b1);
  }
  const b2 = document.createElement('button');
  b2.className = 'rail-item'; b2.type = 'button';
  b2.innerHTML = '<span>Quellen &amp; kostenlose Übungen</span><span class="z">Links</span>';
  b2.onclick = () => { sim = null; quellenZeigen(); mobilEinklappen(); };
  const b3 = document.createElement('button');
  b3.className = 'rail-item'; b3.type = 'button';
  b3.innerHTML = '<span>Fortschritt zurücksetzen</span><span class="z">reset</span>';
  b3.onclick = () => { zurueckDialogOeffnen(); };
  const b5 = document.createElement('button');
  b5.className = 'rail-item'; b5.type = 'button';
  b5.innerHTML = '<span>Profil wechseln</span><span class="z">' + (profil ? profil.name : '–') + '</span>';
  b5.onclick = () => { abmelden(); mobilEinklappen(); };
  /* Das Ausbildungsjahr steht seit dem Umbau in der Kopfzeile und wird hier
     nicht wiederholt — ein Weg, nicht zwei. */
  fuss.append(b2, b3, b5);

  /* Lesehilfe zuletzt: die Zahlen in der Liste sind Fortschritt, die
     Prozentwerte an den Bereichen sind AP1-Häufigkeit. Ohne diesen Satz
     sind sie zu leicht zu verwechseln. Mobil steht er über `order` unten. */
  const legende = document.createElement('p');
  legende.className = 'rail-legende';
  legende.textContent = istAp2()
    ? 'Prozent bzw. Dauer neben einem Bereich = Prüfungsanteil bzw. Prüfungszeit in Teil 2. Zahl in der Marke = dein Fortschritt (grün ab 80 %).'
    : 'Prozent neben einem Bereich = wie häufig das Thema in AP1 vorkam. Zahl in der Marke = dein Fortschritt (grün ab 80 %).';
  fuss.appendChild(legende);
  rail.appendChild(fuss);
  uebersichtKnopfSetzen();

  /* Position im Baum: "Bereich 3, Thema 5 von 12" – ohne diesen Satz liest ein
     Screenreader die lange Liste ohne jeden Anker vor. */
  const sichtbar = [...rail.querySelectorAll('.rail-item')].filter(b => b.offsetParent !== null);
  const pos = sichtbar.indexOf(rail.querySelector('.rail-item.aktiv')) + 1;
  rail.setAttribute('aria-label', 'Aufgabenbereiche' + (pos ? ' – Position ' + pos + ' von ' + sichtbar.length : ''));
}

/* ---------- Bestätigung mit eigener Fläche ---------- */
function bestaetigen(titel, text, onJa) {
  const dlg = document.getElementById('bestaetig');
  document.getElementById('bestaetig-titel').textContent = titel;
  document.getElementById('bestaetig-text').textContent = text;
  const ja = document.getElementById('bestaetig-ja');
  const nein = document.getElementById('bestaetig-nein');
  const schliessen = () => { if (dlg.open) dlg.close(); };
  nein.onclick = schliessen;
  ja.onclick = () => { schliessen(); onJa(); };
  dlg.showModal();
  nein.focus();
}

function zurueckDialogOeffnen() {
  bestaetigen(
    'Gesamten Fortschritt zurücksetzen?',
    'Alle Aufgaben, Quizfragen und Karten dieses Prüfungsteils beginnen von vorn. Das lässt sich nicht rückgängig machen.',
    () => {
      /* Nur den offenen Teil zurücksetzen: AP1-Schlüssel ohne, AP2-Schlüssel mit
         dem Präfix 'ap2-'. Der andere Teil behält seinen Fortschritt. */
      const istAp2Key = (k) => k.startsWith('ap2-');
      const behalten = {};
      for (const k in fortschritt.tasks) if (istAp2Key(k) !== istAp2()) behalten[k] = fortschritt.tasks[k];
      fortschritt.tasks = behalten;
      fortschritt.punkte = Object.values(behalten).reduce((a, t) => a + (t.punkte || 0), 0);
      if (istAp2()) { serieAp2 = 0; } else { fortschritt.serie = 0; }
      try { localStorage.setItem(SERIE2_STORE, String(serieAp2)); } catch (e) { }
      speichern(); statistikZeichnen(); railZeichnen();
    }
  );
}

function mobilEinklappen() {
  if (window.innerWidth <= 900) {
    document.body.classList.remove('rail-offen');
    document.getElementById('rail-toggle').setAttribute('aria-expanded', 'false');
  }
}

/* Zeigt den Rückweg zur Übersicht nur beim Lernen – auf Startseite, Anmeldung
   und Jahresauswahl wäre er doppelt. */
function uebersichtKnopfSetzen() {
  const el = document.getElementById('btn-uebersicht');
  if (!el) return;
  const lehren = ['rechnen', 'quiz', 'karten', 'luecken', 'fehler', 'fall'];
  el.hidden = !(profil && (istAp2() || jahr !== null) && lehren.includes(modus));
}

function starteAufgabe(id) {
  const task = daten(teil).TASKS.find(t => t.id === id);
  if (!task) return nichtsDa('Rechen-Aufgaben');
  const inst = task.gen();

}

  felder.forEach((f, i) => {

function zeileHTML(r, i) {
  const op = r.op ? `<span class="op">${r.op}</span>` : '';
  const klassen = ['zeile'];
  if (r.gegeben) klassen.push('gegeben');
  if (r.ergebnis) klassen.push('ergebnis');

  const feld = r.gegeben
    ? `<span class="wert">${r.wert}</span>`
    : `<input type="text" inputmode="decimal" name="antwort-${i}" autocomplete="off"
         spellcheck="false" placeholder="z. B. 1.234,50"
         aria-label="${r.name.replace(/"/g, '')}"
         id="f${i}">`;

  return `<div class="${klassen.join(' ')}" id="z${i}">
      <span class="marke" id="m${i}"></span>
      <span class="name">${op}${r.name}</span>
      <span class="feld">${feld}</span>
      <span class="einheit">${r.unit || ''}</span>
    </div>`;
}

/* ---------- Prüfen ---------- */
function pruefen() {
  const { task, inst } = aktuell;
  let richtig = 0, gesamt = 0;

  inst.rows.forEach((r, i) => {
    if (r.gegeben) return;
    gesamt++;
    const z = document.getElementById('z' + i);
    const m = document.getElementById('m' + i);
    const inp = document.getElementById('f' + i);
    z.classList.remove('richtig', 'falsch');

    let ok = false;
    if (r.text !== undefined) {
      ok = r.text.indexOf(' ') >= 0
        ? normText(inp.value) === normText(r.antwortText || r.text)
        : gleichBuchstaben(inp.value, r.text);
      if (!ok && /^[A-Za-z]$/.test(r.text)) ok = normText(inp.value) === normText(r.text);
      if (!ok && r.text === 'ja') ok = ['JA', 'J', 'YES'].includes(normText(inp.value));
      if (!ok && r.text === 'nein') ok = ['NEIN', 'N', 'NO'].includes(normText(inp.value));
      if (!ok) ok = normText(inp.value) === normText(r.antwortText || r.text);
    } else {
      const v = parseNum(inp.value);
      const tol = r.tol || { abs: 0.02 };
      ok = Number.isFinite(v) && Math.abs(v - r.answer) <= tol.abs;
    }

    if (ok) {
      richtig++; m.textContent = '✓'; z.classList.add('richtig');
    } else {
      m.textContent = '✗'; z.classList.add('falsch');
      if (r.text === undefined) inp.value = inp.value.trim() === '' ? '' : inp.value;
      const korr = document.createElement('span');
      korr.className = 'korrektur';
      korr.textContent = 'richtig: ' + (r.text !== undefined ? (r.antwortText || r.text)
        : num(r.answer, r.dec === undefined ? 2 : r.dec));
      z.querySelector('.einheit').prepend(korr);
    }
  });

  const punkte = Math.round(richtig / gesamt * task.punkte);
  const f = fortschritt.tasks[task.id] || { punkte: 0, max: 0 };
  f.punkte += punkte; f.max += task.punkte; f.versuche = (f.versuche || 0) + 1;
  fortschritt.tasks[task.id] = f;
  fortschritt.punkte = (fortschritt.punkte || 0) + punkte;
  serieSetzen(punkte === task.punkte ? (teil === 'ap2' ? serieAp2 + 1 : fortschritt.serie + 1) : 0);
  speichern(); statistikZeichnen();

  /* Stempel setzen */
  const alt = document.querySelector('.stempel'); if (alt) alt.remove();
  const st = document.createElement('div');
  st.className = 'stempel' + (punkte === task.punkte ? ' gut' : '');
  st.innerHTML = `<b>${punkte}/${task.punkte} P</b><span>${richtig} von ${gesamt} richtig</span>`;
  document.getElementById('schema').appendChild(st);

  document.getElementById('rueckmeldung').textContent =
    punkte === task.punkte ? 'Alles richtig – Serie hält.' :
      richtig === 0 ? 'Noch kein Treffer. Lösungsweg ansehen, dann neue Zahlen.' :
        'Fast – die roten Zeilen noch einmal nachrechnen.';

  /* Stempel in den sichtbaren Bereich holen, falls er aus dem Bild gescrollt ist */
  const sr = st.getBoundingClientRect();
  if (sr.top < 8 || sr.bottom > window.innerHeight) {
    const ziel = document.getElementById('schema').getBoundingClientRect().top + window.scrollY - 26;
    window.scrollTo({ top: ziel, behavior: 'smooth' });
  }

  document.getElementById('btn-pruefen').disabled = true;

  if (sim) {
    sim.punkte += punkte; sim.max += task.punkte;
    const btn = document.createElement('button');
    btn.className = 'akt'; btn.type = 'button';
    btn.textContent = sim.idx + 1 < sim.queue.length ? 'Nächste Aufgabe' : 'Simulation auswerten';
    btn.onclick = naechsteSimAufgabe;
    document.querySelector('.aktionen').appendChild(btn);
  }

  railZeichnen();
}

/* ============================================================
   PRÜFUNGSSIMULATION
   ============================================================ */
function starteSimulation() {
  const passend = hole('TASKS');
  if (!passend.length) return nichtsDa('Prüfungssimulation');
  const ids = passend.map(t => t.id);
  /* nach Bereichen mischen, damit alle Cluster vorkommen */
  const proBereich = {};
  ids.forEach(id => {
    const b = TASKS.find(t => t.id === id).bereich;
    (proBereich[b] = proBereich[b] || []).push(id);
  });
  const queue = [];
  Object.values(proBereich).forEach(a => { queue.push(pick(a)); });
  while (queue.length < 8) {
    const rest = ids.filter(i => !queue.includes(i));
    if (!rest.length) break;
    queue.push(pick(rest));
  }
  const gemischt = queue.slice(0, 8).sort(() => Math.random() - 0.5);

  sim = { queue: gemischt, idx: 0, punkte: 0, max: 0, rest: 90 * 60 };
  aktuell = { task: TASKS.find(t => t.id === gemischt[0]), inst: null };
  aktuell.inst = aktuell.task.gen();
  zeichneAufgabe();
  timerStarten();
}

function timerStarten() {
  clearInterval(zeitGeber);
  if (!sim) return;
  zeitGeber = setInterval(() => {
    sim.rest--;
    const el = document.getElementById('sim-timer');
    if (el) el.textContent = `${String(Math.floor(sim.rest / 60)).padStart(2, '0')}:${String(sim.rest % 60).padStart(2, '0')}`;
    if (sim.rest <= 0) { clearInterval(zeitGeber); auswertungZeigen(); }
  }, 1000);
}

function naechsteSimAufgabe() {
  sim.idx++;
  if (sim.idx >= sim.queue.length) { auswertungZeigen(); return; }
  const task = daten(teil).TASKS.find(t => t.id === sim.queue[sim.idx]);
  aktuell = { task, inst: task.gen() };
  zeichneAufgabe();
}

function auswertungZeigen() {
  clearInterval(zeitGeber);
  const p = sim.punkte, m = sim.max;
  const q = m ? Math.round(p / m * 100) : 0;
  const noten = [[92, 1], [81, 2], [67, 3], [50, 4], [30, 5], [0, 6]];
  const note = noten.find(n => q >= n[0])[1];
  const benoetigt = sim.rest > 0 ? `${Math.floor((90 * 60 - sim.rest) / 60)} min ${((90 * 60 - sim.rest) % 60)} s` : '90 min';
  const detail = sim.queue.map((id, i) => {
    const t = daten(teil).TASKS.find(x => x.id === id);
    return `<tr><td>${i + 1}. ${t.titel}</td><td class="z">${t.punkte} P</td></tr>`;
  }).join('');

  blatt.innerHTML = `<div class="ergebnis">
      <h3>Simulation abgeschlossen</h3>
      <div class="quote">${p} / ${m} Punkte</div>
      <div class="note">${q} % · entspricht Note ${note} · Bearbeitungszeit ${benoetigt}</div>
      <p style="font-size:13.5px;color:var(--schwach);margin:0">Zum Vergleich: Die IHK vergibt ab 92 % eine 1, ab 81 % eine 2, ab 67 % eine 3 und ab 50 % eine 4. Zum Bestehen genügen 50 %.</p>
      <table>${detail}</table>
      <div class="aktionen">
        <button class="akt" id="sim-neu" type="button">Neue Simulation</button>
        <button class="akt zweit" id="sim-ende" type="button">Zurück zum Training</button>
      </div>
    </div>`;
  document.getElementById('sim-neu').onclick = starteSimulation;
  document.getElementById('sim-ende').onclick = () => { sim = null; starteAufgabe(ersteAufgabe().id); };
  sim = null;
  railZeichnen();
}

/* ============================================================
   PRÜFUNGSTEIL WECHSELN
   ------------------------------------------------------------
   Der Wechsel ist ein Neustart des sichtbaren Teils: laufende Läufe werden
   verworfen, der Modus geht zurück auf die Startseite, und die Adresse wird
   vom Bereichsparameter befreit (der Bereich gilt nur für einen Teil).
   Der Fortschritt beider Teile bleibt unberührt — er liegt getrennt im
   Speicher und wird nur anders gezählt.
   ============================================================ */
function teilWechseln() {
  teil = istAp2() ? 'ap1' : 'ap2';
  teilSpeichern();
  sim = null;
  clearInterval(zeitGeber);
  quizLauf = kartenLauf = lueckenLauf = fehlerLauf = fallLauf = null;

/* ---------- Ausbildungsjahr: Anzeige & Wechsel ---------- */
function jahrText() {
  if (jahr === null) return 'nicht gewählt';
  if (jahr === 0) return 'ohne Auswahl';
  const x = JAHRE.find(y => y.id === jahr);
  return x ? x.name : 'ohne Auswahl';
}
/* Satzform für Fließtext: „im 1. Ausbildungsjahr" statt „bis 1. Ausbildungsjahr" */
function jahrWo() {
  if (jahr === null) return 'in keinem Jahr';
  if (jahr === 0) return 'in allen Jahrgängen';
  const x = JAHRE.find(y => y.id === jahr);
  if (!x) return 'in allen Jahrgängen';
  return jahr === 3 ? 'zur Prüfungsvorbereitung' : 'im ' + x.name;
}
function jahrKurz() {
  if (jahr === null) return 'nicht gewählt';
  if (jahr === 0) return 'ohne Auswahl';
  const x = JAHRE.find(y => y.id === jahr);
  return x ? x.kurz : 'ohne Auswahl';
}
function ersteAufgabe() {
  const liste = daten(teil).TASKS;
  return liste.filter(t => teil === 'ap2' || passtJahr(t))[0] || liste[0];
}

function kopfJahrZeichnen() {
  const el = document.querySelector('.kopf .unter');
  const knopf = document.getElementById('btn-profil');
  const jahrKnopf = document.getElementById('btn-jahr');
  const teilKnopf = document.getElementById('btn-teil');
  const standEl = document.getElementById('kopf-stand');
  /* Der Teil benennt, WAS hier liegt; AP1 und AP2 sind eigene Prüfungen. */
  if (teilKnopf) {
    teilKnopf.textContent = istAp2() ? 'AP2' : 'AP1';
    teilKnopf.setAttribute('aria-label', istAp2()
      ? 'Angemeldet für Teil 2. Zu Teil 1 wechseln.'
      : 'Angemeldet für Teil 1. Zu Teil 2 wechseln.');
    teilKnopf.title = istAp2() ? 'Prüfungsteil 2 — Teil 1 öffnen' : 'Prüfungsteil 1 — Teil 2 öffnen';
  }
  if (el) {
    el.textContent = istAp2()
      ? 'Kaufmann für IT-System-Management · Prüfungsteil 2' + (profil ? ' · ' + profil.name : '')
      : 'Kaufmann für IT-System-Management · Prüfungsteil 1' + (profil && jahr !== null ? ' · ' + jahrKurz() : (profil ? ' · ' + profil.name : ''));
  }

  /* Der Zustand der Ablage ist eine Auskunft, kein Knopf. Er steht als
     kleine Zeile über der Wahl — auf dem Handy, wo die Unterzeile entfällt,
     bleibt er so sichtbar. */
  if (standEl) {
    if (!profil) {
      standEl.textContent = '';
      standEl.className = 'kopf-stand';
    } else if (syncStand === 'gut') {
      standEl.textContent = 'auf dem Server gespeichert';
      standEl.className = 'kopf-stand gut';
    } else if (syncStand === 'fehler') {
      standEl.textContent = 'nur auf diesem Rechner';
      standEl.className = 'kopf-stand fehler';
    } else {
      standEl.textContent = 'wird gespeichert …';
      standEl.className = 'kopf-stand';
    }
  }
  /* Auf dem Handy ist die Kopfzeile-Unterzeile ausgeblendet – der Name steht
     deshalb am Knopf, damit immer sichtbar ist, wessen Fortschritt gerade läuft. */
  if (knopf) {
    knopf.textContent = profil ? 'Profil: ' + profil.name : 'Profil wählen';
    knopf.setAttribute('aria-label', profil
      ? `Angemeldet als ${profil.name}, ${istAp2() ? 'Prüfungsteil 2' : 'Ausbildungsjahr ' + jahrKurz()}. Profil wechseln.`
      : 'Profil wählen');
  }
  /* Das Jahr bekommt einen eigenen Knopf. Vorher lag es nur im Menü „Mehr" —
     es ist aber die Wahl, die den sichtbaren Stoff bestimmt, und gehört
     damit nach oben in die Kopfzeile. */
  if (jahrKnopf) {
    /* Teil 2 kennt keine Jahrgänge — dort wird nach Prüfungsbereich gefiltert.
       Der Jahr-Knopf hat in AP2 nichts zu suchen und wird ausgeblendet. */
    jahrKnopf.hidden = istAp2();
    jahrKnopf.textContent = profil && jahr !== null ? jahrKurz() : 'Ausbildungsjahr';
    jahrKnopf.setAttribute('aria-label', `Ausbildungsjahr ${jahrKurz()} wechseln`);
  }
}

function jahrSetzen(j) {
  jahr = j;
  jahrSpeichern();
  jahrZumServer(j);
  startseiteZeigen();
}

/* ---------- Info-Button: erklärt die Aufgabe, nicht die Lösung ---------- */
/* Reihenfolge bewusst: erst prüfen, ob ein fest hinterlegter Text existiert,
   dann der automatische Satz aus dem Aufgabentyp. So bleibt das Schema offen,
   ohne dass eine Aufgabe ohne Hilfe dasteht. */
function infoText(o, art, bereichId) {
  if (o && o.info && (o.info.zweck || o.info.vorgehen)) return o.info;
  const b = achse().find(x => x.id === bereichId);
  const INFO_ART = {
    rechnen: {
      vorgehen: 'Die grauen Felder sind vorgegeben. Trage nur in die hellen Felder ein – ' +
        'runde kaufmännisch auf zwei Nachkommastellen.',
      formal: 'Punkte gibt es nur für vollständig richtige Zahlen. Mit „Prüfen" siehst du, ' +
        'welche Zeile stimmt.'
    },
    quiz: {
      vorgehen: 'Lies alle vier Antworten, bevor du klickst. Es ist genau eine richtig.',
      formal: 'Nach der Antwort erscheint die Erklärung – sie erklärt, warum die anderen falsch sind.'
    },
    karten: {
      vorgehen: 'Erst laut antworten, dann aufdecken. Das Abfragen bringt den Effekt, nicht das Lesen.',
      formal: '„Gewusst" hebt die Karte ein Fach höher, „Noch nicht" setzt sie zurück auf Fach 1.'
    },
    luecken: {
      vorgehen: 'Ein Feld = ein Begriff. Nur den Begriff eintragen, ohne Satzzeichen.',
      formal: 'Groß- und Kleinschreibung wird geprüft, Einheiten wie „%„ oder „€" sind optional.'
    },
    fehler: {
      vorgehen: 'Jede Zeile einzeln beurteilen. Manche Zeilen sind korrekt – das ist Absicht.',
      formal: 'Es zählt das richtige Urteil je Zeile, nicht die Begründung.'
    },
    fall: {
      vorgehen: 'Erst entscheiden, dann die Begründung lesen. Es gibt eine beste Entscheidung.',
      formal: 'Jede Entscheidung bringt eigene Punkte; das Ergebnis am Ende zeigt deine Treffer.'
    }
  };
  const art_ = INFO_ART[art] || {};
  return {
    zweck: o.titel || o.t || 'Aufgabe',
    vorgehen: art_.vorgehen,
    formal: (b ? 'Themenbereich: ' + b.name + '.' : '') + (art_.formal ? ' ' + art_.formal : '')
  };
}

function infoBlock(o, art, bereichId) {
  const i = infoText(o, art, bereichId);
  return `
    <div class="info">
      <button class="info-knopf" type="button" id="info-auf" aria-expanded="false" aria-controls="info-text">
        <b>Info</b><span>Was ist hier zu tun?</span>

        ${i.zweck ? `<p><b>${i.zweck}</b></p>` : ''}

/* Wird nach jedem Neuzeichnen aufgerufen. Ohne erneutes Verketten wäre der
   Knopf beim zweiten Aufruf tot – deshalb onclick neu setzen, nicht addieren. */
function infoVerdrahten() {
  const knopf = document.getElementById('info-auf');
  const text = document.getElementById('info-text');
  if (!knopf || !text) return;
  knopf.onclick = () => {
    const offen = knopf.getAttribute('aria-expanded') === 'true';
    knopf.setAttribute('aria-expanded', offen ? 'false' : 'true');
    text.hidden = offen;
  };
}
