    r: 3, e: 'Technisch-organisatorische Maßnahmen sind die konkreten Schutzmaßnahmen, mit denen die Grundsätze der DSGVO umgesetzt werden – etwa Zutritts-, Zugangs-, Zugriffs-, Weitergabe-, Eingabe- und Verfügbarkeitskontrolle. PK-06 nennt den Begriff ausdrücklich.', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, q: 'Wofür ist der IT-Sicherheitsbeauftragte im Unterschied zum Datenschutzbeauftragten zuständig?',
    a: ['Für die gesamte Informationssicherheit des Betriebs', 'Für die Einhaltung von DSGVO und BDSG im Betrieb', 'Für die Betreuung der betroffenen Personen', 'Für die Zertifizierung des Qualitätsmanagements'],
    r: 0, e: 'Der Datenschutzbeauftragte achtet auf die Einhaltung von DSGVO und BDSG und ist weisungsfrei. Der IT-Sicherheitsbeauftragte verantwortet die Informationssicherheit im Ganzen – also auch nicht-personenbezogene Systeme. PK-06 verlangt ausdrücklich die Unterscheidung.', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, q: 'Welche Angaben gelten als personenbezogene Daten?',
    a: ['Nur Name und Anschrift einer natürlichen Person', 'Alle Informationen über eine identifizierbare Person', 'Nur besonders sensible Daten wie Gesundheit und Religion', 'Nur verschlüsselt gespeicherte Kundendaten'],
    r: 1, e: 'Personenbezogen ist jede Information über eine identifizierte oder identifizierbare Person – dazu zählen auch IP-Adresse, Kundennummer, Standortdaten oder Kennzeichen, wenn ein Personenbezug herstellbar ist. Der Begriff ist sehr weit gefasst.', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, q: 'Was unterscheidet Anonymisierung von Pseudonymisierung?',
    a: ['Beide Verfahren löschen die Daten endgültig und unwiderruflich', 'Bei der Pseudonymisierung ist der Bezug nur mit Zusatzwissen herstellbar', 'Bei der Anonymisierung ist der Personenbezug endgültig aufgehoben', 'Beide Verfahren ersetzen nur den Namen durch eine Nummer'],
    r: 2, e: 'Pseudonymisierte Daten können mit Zusatzwissen wieder zugeordnet werden – die DSGVO gilt deshalb weiter. Anonymisierte Daten sind endgültig nicht mehr zuordenbar und fallen aus dem Anwendungsbereich der DSGVO heraus. PK-06 nennt beide Maßnahmen.', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, q: 'Welches ist KEIN Grundsatz der DSGVO-Verarbeitung?',
    a: ['Zweckbindung und Datenminimierung', 'Richtigkeit und Speicherbegrenzung', 'Integrität und Vertraulichkeit', 'Unbegrenzte Speicherung aller Daten'],
    r: 3, e: 'Die DSGVO verlangt im Gegenteil Speicherbegrenzung: Daten dürfen nur so lange gespeichert werden, wie der Zweck es erfordert. Weitere Grundsätze sind Rechtmäßigkeit, Zweckbindung, Datenminimierung, Richtigkeit, Integrität und Vertraulichkeit sowie Rechenschaftspflicht.', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, q: 'Der Kunde möchte wissen, welche Daten über ihn gespeichert sind. Welches Betroffenenrecht nimmt er wahr?',
    a: ['Das Recht auf Auskunft', 'Das Recht auf Berichtigung', 'Das Recht auf Vergessenwerden', 'Das Recht auf Widerspruch'],
    r: 0, e: 'Das Auskunftsrecht gibt jeder Person das Recht zu erfahren, welche Daten verarbeitet werden und zu welchem Zweck. Weitere Betroffenenrechte sind Berichtigung, Löschung („Vergessenwerden"), Einschränkung, Datenübertragbarkeit und Widerspruch.', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, q: 'Wie viele Schlüssel gibt es bei der symmetrischen Verschlüsselung?',
    a: ['Zwei Schlüssel: einen öffentlichen und einen privaten', 'Einen gemeinsamen Schlüssel für beide Seiten', 'Keinen Schlüssel, sondern nur einen Hashwert', 'So viele Schlüssel wie beteiligte Personen'],
    r: 1, e: 'Symmetrisch heißt: Sender und Empfänger nutzen denselben Schlüssel. Das ist schnell, aber das Schlüsselverteilungsproblem ist ungelöst – man muss den Schlüssel über einen sicheren Weg austauschen. Bekannte Vertreter: AES und DES.', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, q: 'Was ist der Vorteil der asymmetrischen Verschlüsselung?',
    a: ['Sie ist deutlich schneller als symmetrische Verfahren', 'Sie benötigt überhaupt keinen Schlüssel zum Arbeiten', 'Der öffentliche Schlüssel kann offen verteilt werden', 'Sie verschlüsselt Dateien ohne Leistungsverlust'],
    r: 2, e: 'Bei der asymmetrischen Verschlüsselung (RSA) gibt es ein Schlüsselpaar: Mit dem öffentlichen Schlüssel wird verschlüsselt, entschlüsseln kann nur der private. Das löst das Schlüsselverteilungsproblem, ist aber rechenintensiv.', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, q: 'Warum nutzt TLS eine hybride Verschlüsselung?',
    a: ['Weil symmetrische Verfahren allein nicht sicher genug sind', 'Weil die DSGVO diese Verfahrensart vorschreibt', 'Weil hybride Verfahren ganz ohne Schlüssel auskommen', 'Weil sie sicheren Schlüsselaustausch und Geschwindigkeit verbindet'],
    r: 3, e: 'Hybrid heißt: Zuerst wird über ein asymmetrisches Verfahren sicher ein Sitzungsschlüssel ausgetauscht, danach läuft die eigentliche Datenübertragung mit dem schnellen symmetrischen Verfahren. So bekommt man Sicherheit und Performance.', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, q: 'Was leistet ein Hashwert?',
    a: ['Er erzeugt eine nicht umkehrbare Prüfsumme', 'Er verschlüsselt Daten wieder entschlüsselbar', 'Er komprimiert Dateien für die Übertragung', 'Er signiert Dokumente rechtlich verbindlich'],
    r: 0, e: 'Eine Hashfunktion erzeugt aus beliebigen Daten eine Prüfsumme fester Länge. Sie ist nicht umkehrbar und extrem kollisionsresistent – schon eine winzige Änderung ergibt einen völlig anderen Hashwert. Damit lassen sich Integrität und Unverfälschtheit prüfen.', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, q: 'Was wird bei einer digitalen Signatur verschlüsselt?',
    a: ['Die gesamte Nachricht mit dem privaten Schlüssel des Senders', 'Der Hashwert der Nachricht mit dem privaten Schlüssel', 'Die Empfängeradresse mit dem öffentlichen Schlüssel der CA', 'Ein Namensbild mit dem öffentlichen Schlüssel des Empfängers'],
    r: 1, e: 'Beim Signieren wird der Hashwert der Nachricht mit dem privaten Schlüssel des Senders verschlüsselt. Der Empfänger entschlüsselt ihn mit dem öffentlichen Schlüssel und vergleicht mit dem selbst gebildeten Hash. So sind Integrität und Authentizität nachweisbar.', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, q: 'Bei welchem Backup-Verfahren werden jeden Tag nur die Änderungen seit der letzten Vollsicherung gesichert?',
    a: ['Bei der Vollsicherung', 'Bei der inkrementellen Sicherung', 'Bei der differenziellen Sicherung', 'Bei der Spiegelung'],
    r: 2, e: 'Die differenzielle Sicherung sammelt immer die Änderungen seit der letzten Vollsicherung – die Rücksicherung braucht also nur zwei Sicherungen (Voll + letzte Differenz), benötigt aber wachsenden Speicher. Die inkrementelle Variante sichert nur seit der letzten Sicherung überhaupt.', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, q: 'Was bedeutet „Security by Default"?',
    a: ['Alle Passwörter sind werkseitig einheitlich gesetzt', 'Der Nutzer wählt beim ersten Start die Sicherheitsstufe', 'Sicherheit wird erst nach einem Angriff aktiviert', 'Die sicherste Einstellung ist ab Werk voreingestellt'],
    r: 3, e: 'Security by Default heißt: Ein System ist ab Werk sicher konfiguriert – unnötige Dienste sind deaktiviert, Standardpasswörter müssen geändert werden, Verschlüsselung ist aktiv. Security by Design bedeutet dagegen, Sicherheit schon beim Entwurf mitzudenken.', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, q: 'Aus welchen Faktoren besteht eine Zwei-Faktor-Authentifizierung?',
    a: ['Aus zwei Kategorien wie Wissen und Besitz', 'Aus zwei unterschiedlichen Kennwörtern für das Konto', 'Aus Benutzername und zugehörigem Kennwort', 'Aus Kennwort und einer Sicherheitsfrage'],
    r: 0, e: 'Echte Zwei-Faktor-Authentifizierung kombiniert zwei verschiedene Kategorien – etwa Wissen (Passwort) mit Besitz (Token, App, Smartcard) oder mit Biometrie (Fingerabdruck). Benutzername plus Passwort sind beide Wissen und damit nur ein Faktor.', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, q: 'Welche Anforderung stellt eine gute Passwort-Policy?',
    a: ['Möglichst kurze Passwörter für schnelle Eingabe', 'Länge, Komplexität, Wechsel und keine Mehrfachnutzung', 'Passwörter aufschreiben und am Monitor befestigen', 'Immer den Firmennamen als Kennwort verwenden'],
    r: 1, e: 'Wirksame Passwörter sind lang (heute mindestens 12 Zeichen), enthalten Zeichen aus mehreren Kategorien, werden nirgends wiederverwendet und regelmäßig gewechselt. Zusätzlich empfiehlt sich ein Passwortmanager – nicht der Zettel am Monitor.', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, q: 'Was ist die Aufgabe eines ISMS?',
    a: ['Es entfernt Schadsoftware automatisch von allen Arbeitsplätzen', 'Es speichert alle Kennwörter zentral und verschlüsselt', 'Es regelt systematisch, wie Sicherheitsziele erreicht werden', 'Es zertifiziert die Hardware des gesamten Unternehmens'],
    r: 2, e: 'Ein ISMS ist kein Produkt, sondern ein Managementsystem: Es legt Sicherheitsziele, Verantwortlichkeiten, Maßnahmen und Prüfverfahren fest und verbessert sie kontinuierlich. International standardisiert in der ISO/IEC 27001. PK-06 verlangt, das ISMS zu kennen und zu unterstützen.', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, q: 'Welches Werk ist nach dem Urheberrechtsgesetz geschützt?',
    a: ['Nur Musik- und Filmwerke mit Copyright-Zeichen', 'Nur Werke, die beim Patentamt eingetragen sind', 'Nur gedruckte Bücher und Fachzeitschriften', 'Jedes Werk aus Literatur, Wissenschaft und Kunst'],
    r: 3, e: 'Das Urheberrecht schützt Werke in den Bereichen Literatur, Wissenschaft und Kunst – dazu zählen auch Software, Texte, Bilder, Grafiken und Datenbanken. Der Schutz entsteht automatisch mit der Schöpfung, ein Copyright-Zeichen ist nicht nötig.', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, q: 'Was bedeutet die Härtung eines Betriebssystems?',
    a: ['Das Reduzieren auf ein sicheres Mindestmaß an Diensten', 'Die Installation einer zusätzlichen Antivirensoftware', 'Die vollständige Neuinstallation des Systems', 'Das Verschlüsseln der gesamten Festplatte'],
    r: 0, e: 'Härtung heißt: unnötige Dienste und Ports abschalten, Software aktuell halten, Standardkonten sperren, Rechte nach dem Minimalprinzip vergeben, Firewall und Logging konfigurieren. PK-06 nennt „Härtung Betriebssystem" ausdrücklich.', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, q: 'Warum ist ein NAS eine Maßnahme zur Sicherung der Verfügbarkeit?',
    a: ['Weil es die Daten verschlüsselt speichert', 'Weil es zentralen, mehrfach gesicherten Speicher bereitstellt', 'Weil es den Zugriff auf das Internet sperrt', 'Weil es die Passwörter zentral verwaltet'],
    r: 1, e: 'Ein Network Attached Storage stellt zentralen Speicher im Netz bereit – meist mit mehreren Platten (RAID) und damit gegen den Ausfall einzelner Platten geschützt. Es dient als Ablage- und Sicherungsziel und sichert damit die Verfügbarkeit. PK-06 nennt NAS ausdrücklich.', q_: 'PK6' },

  { t: 'ap1', b: 'software', j: 2, q: 'Worin unterscheiden sich Compiler und Interpreter?',
    a: ['Beide übersetzen den Code vorab und erzeugen eine Programmdatei', 'Der Interpreter übersetzt vorab, der Compiler führt zur Laufzeit aus', 'Der Compiler übersetzt vorab, der Interpreter führt Zeile für Zeile aus', 'Der Compiler erzeugt Fehlerlisten, der Interpreter den Maschinencode'],
    r: 2, e: 'Der Compiler übersetzt den kompletten Quellcode einmal in eine ausführbare Datei – danach läuft sie schnell, aber Änderungen erfordern Neukompilieren. Der Interpreter liest und führt den Code zeilenweise aus – flexibler und plattformunabhängig, aber langsamer.', q_: 'PK4' },
  { t: 'ap1', b: 'software', j: 2, q: 'Welche Aufgabe hat der Linker?',
    a: ['Er schreibt den Quellcode nach Vorgabe des Entwicklers', 'Er sucht inhaltliche Fehler im geschriebenen Quellcode', 'Er führt das fertige Programm auf dem Rechner aus', 'Er verbindet Objektdateien und Bibliotheken zur Programmdatei'],
    r: 3, e: 'Der Compiler erzeugt aus jeder Quelldatei ein Objektfile. Der Linker fügt diese Objektdateien und die eingebundenen Bibliotheken zu einer einzigen ausführbaren Datei zusammen und löst die Verweise zwischen ihnen auf.', q_: 'PK4' },
  { t: 'ap1', b: 'software', j: 2, q: 'Was ist Pseudocode?',
    a: ['Eine sprachunabhängige Beschreibung eines Algorithmus', 'Ein kompilierbarer Programmcode für viele Systeme', 'Eine verschlüsselte Darstellung von Programmabläufen', 'Ein Fehlerprotokoll des verwendeten Compilers'],
    r: 0, e: 'Pseudocode beschreibt den Lösungsweg mit Kontrollstrukturen (Verzweigung, Schleife) in einer an Programmiersprachen angelehnten, aber nicht ausführbaren Notation. So lässt sich der Algorithmus unabhängig von der späteren Sprache planen und prüfen – PK-04-Pflichtstoff.', q_: 'PK4' },
  { t: 'ap1', b: 'software', j: 2, q: 'Welches UML-Diagramm zeigt, welche Akteure welche Funktionen eines Systems nutzen?',
    a: ['Das Klassendiagramm', 'Das Anwendungsfalldiagramm', 'Das Aktivitätsdiagramm', 'Das Sequenzdiagramm'],
    r: 1, e: 'Das Use-Case- bzw. Anwendungsfalldiagramm stellt Akteure (Strichfiguren) und ihre Anwendungsfälle (Ellipsen) gegenüber und grenzt den Systemumfang ab. Es zeigt, WAS das System leisten soll – nicht wie. In AP1 ist es nachweislich vorgekommen.', q_: 'PK4' },
  { t: 'ap1', b: 'software', j: 2, q: 'Welches UML-Diagramm stellt die zeitliche Reihenfolge von Nachrichten zwischen Objekten dar?',
    a: ['Das Klassendiagramm', 'Das Anwendungsfalldiagramm', 'Das Sequenzdiagramm', 'Das Zustandsdiagramm'],
    r: 2, e: 'Das Sequenzdiagramm zeigt beteiligte Objekte als Lebenslinien und den Nachrichtenaustausch in zeitlicher Abfolge. Das Klassendiagramm zeigt den statischen Aufbau mit Klassen, Attributen und Methoden – das Aktivitätsdiagramm dagegen den Ablauf von Arbeitsschritten.', q_: 'PK4' },
  { t: 'ap1', b: 'software', j: 2, q: 'Was wird bei einem Schreibtischtest gemacht?',
    a: ['Der Code wird auf dem Schreibtisch liegend abgelegt', 'Der Bildschirm wird für die Ausgabe kalibriert', 'Der Code wird automatisch durch eine Testsoftware geprüft', 'Der Algorithmus wird gedanklich mit Beispieldaten durchgespielt'],
    r: 3, e: 'Beim Schreibtischtest geht man den Code oder das Modell gedanklich mit konkreten Werten durch und notiert die Variablenbelegung nach jedem Schritt. So findet man Logikfehler, bevor überhaupt ein Rechner beteiligt ist – ein Klassiker in der AP1 (2024 und 2025 abgefragt).', q_: 'PK4' },
  { t: 'ap1', b: 'software', j: 2, q: 'Was kennzeichnet Standardsoftware gegenüber Individualsoftware?',
    a: ['Sie ist fertig entwickelt und schnell verfügbar', 'Sie wird für einen einzelnen Kunden neu programmiert', 'Sie ist immer kostenlos und ohne Lizenz nutzbar', 'Sie kann grundsätzlich nicht gewartet werden'],
    r: 0, e: 'Standardsoftware ist sofort verfügbar, erprobt und günstig, passt aber nicht zu jedem Prozess. Individualsoftware wird passgenau entwickelt, ist dafür teurer, langwieriger und wartungsintensiver. Auch die Kombination (Anpassung von Standardsoftware) ist üblich.', q_: 'PK4' },
  { t: 'ap1', b: 'software', j: 2, q: 'Was bedeutet Open Source im Gegensatz zu proprietärer Software?',
    a: ['Die Software ist in jedem Fall kostenlos nutzbar', 'Der Quellcode ist offen und darf verändert werden', 'Die Software hat überhaupt keine Lizenzbedingungen', 'Sie darf nur im privaten Umfeld genutzt werden'],
    r: 1, e: 'Open Source heißt: Der Quellcode ist verfügbar und darf je nach Lizenz eingesehen, verändert und weitergegeben werden. Kostenlos ist nicht dasselbe – auch Open Source kann Kosten für Support verursachen. Proprietäre Software verbietet Änderungen und Weitergabe.', q_: 'PK4' },
  { t: 'ap1', b: 'software', j: 2, q: 'Wofür steht EULA?',
    a: ['Enterprise Unified License Application', 'European Uniform License Act', 'End User License Agreement', 'Endless Use License Agreement'],
    r: 2, e: 'Die EULA ist der Lizenzvertrag zwischen Hersteller und Endnutzer. Sie legt fest, wie viele Geräte die Software nutzen dürfen, ob sie übertragen werden darf und was ausdrücklich verboten ist. PK-04 nennt EULA, OEM und GNU als Lizenzarten.', q_: 'PK4' },
  { t: 'ap1', b: 'software', j: 2, q: 'Was besagt eine OEM-Lizenz?',
    a: ['Sie ist frei weitergebbar und auf andere Geräte übertragbar', 'Sie ist nur für Behörden und Schulen gültig', 'Sie gilt für beliebig viele Geräte gleichzeitig', 'Sie ist an ein Gerät gebunden und wird damit verkauft'],
    r: 3, e: 'OEM (Original Equipment Manufacturer) bedeutet: Die Lizenz wird zusammen mit einem neuen Gerät ausgeliefert und ist an dieses gebunden – sie darf nicht auf andere Rechner übertragen werden. Das ist deutlich günstiger als eine Einzelhandelslizenz.', q_: 'PK4' },
  { t: 'ap1', b: 'software', j: 2, q: 'Welche Freiheit gewährt die GNU General Public License (GPL)?',
    a: ['Die Software darf genutzt, geändert und weitergegeben werden', 'Nur die private Nutzung auf einem einzigen Gerät', 'Die Software darf nur gegen Gebühr verwendet werden', 'Die Software darf nur im Quellcode gelesen werden'],
    r: 0, e: 'Die GPL ist eine freie Copyleft-Lizenz: Nutzen, Verändern und Weitergeben sind erlaubt. Wer die Software verändert weitergibt, muss den Quellcode offenlegen und wieder unter GPL stellen („viraler Effekt"). Das prüft PK-04 unter den Lizenzarten.', q_: 'PK4' },
  { t: 'ap1', b: 'software', j: 2, q: 'Was gehört NICHT zu den Grundprinzipien der objektorientierten Programmierung?',
    a: ['Kapselung', 'Sequenz', 'Polymorphie', 'Vererbung'],
    r: 1, e: 'Die drei Grundprinzipien sind Kapselung (Zugriff nur über definierte Schnittstellen), Vererbung (Unterklassen übernehmen Eigenschaften der Oberklasse) und Polymorphie (gleicher Aufruf, unterschiedliche Umsetzung). Prozedurale Programmierung arbeitet dagegen mit Funktionen ohne Objekte.', q_: 'PK4' },
  { t: 'ap1', b: 'software', j: 2, q: 'Welche Kontrollstrukturen kennzeichnet der Prüfungskatalog für Programmiersprachen?',
    a: ['Ausschließlich Schleifen', 'Ausschließlich Variablen', 'Verzweigung und Schleife', 'Klassen und Objekte'],
    r: 2, e: 'PK-04 nennt Verzweigung (if, else, switch) und Schleife (for, while, do-while) als die beiden Kontrollstrukturen. Dazu kommen Variablen, Datentypen, Prozeduren und Funktionen, Klassen mit Attributen und Methoden sowie Sichtbarkeit.', q_: 'PK4' },
  { t: 'ap1', b: 'software', j: 2, q: 'Wozu dient ein Debugger?',
    a: ['Er schreibt Programmcode automatisch fertig', 'Er verschlüsselt den Quellcode vor dem Kompilieren', 'Er beschleunigt die Ausführung des fertigen Programms deutlich', 'Er führt Programme schrittweise aus und zeigt Werte an'],
    r: 3, e: 'Ein Debugger ist das wichtigste Werkzeug zur Fehlersuche: Er erlaubt Haltepunkte (Breakpoints), Einzelschrittausführung und die Beobachtung von Variablen zur Laufzeit. So findet man formal korrekte, aber inhaltlich falsche Logik.', q_: 'PK4' },
  { t: 'ap1', b: 'software', j: 2, q: 'Was ist eine IDE?',
    a: ['Eine Integrierte Entwicklungsumgebung mit Editor und Debugger', 'Ein Betriebssystem, das speziell für Entwickler gedacht ist', 'Ein Datenbankmanagementsystem für betriebliche Anwendungen', 'Ein Netzwerkprotokoll zur Verteilung von Quellcode'],
    r: 0, e: 'Eine Integrated Development Environment bündelt alle Werkzeuge an einem Ort: Editor mit Syntaxhervorhebung, Compiler bzw. Interpreter, Debugger, Versionsverwaltung und Projektverwaltung. Das erhöht die Produktivität und senkt Fehlerquellen. PK-04 nennt die IDE namentlich.', q_: 'PK4' },
  { t: 'ap1', b: 'software', j: 2, q: 'Welcher Konsolenbefehl zeigt unter Windows die aktuelle IP-Konfiguration eines Rechners?',
    a: ['ping', 'ipconfig', 'nslookup', 'chmod'],
    r: 1, e: 'ipconfig zeigt IP-Adresse, Subnetzmaske und Gateway (unter Linux ifconfig bzw. ip). ping prüft die Erreichbarkeit, nslookup fragt den DNS-Server ab, traceroute bzw. tracert verfolgt den Weg zum Ziel – chmod setzt unter Linux Dateirechte.', q_: 'PK4' },
  { t: 'ap1', b: 'software', j: 2, q: 'Sie wollen prüfen, ob ein Server überhaupt erreichbar ist. Welches Werkzeug nutzen Sie?',
    a: ['nslookup', 'chmod', 'ping', 'mkdir'],
    r: 2, e: 'ping sendet ICMP-Pakete und misst die Antwortzeit – ein fehlendes Echo spricht für fehlende Erreichbarkeit (oder eine blockierende Firewall). Für die Namensauflösung nimmt man nslookup, für den Weg durchs Netz tracert bzw. traceroute.', q_: 'PK4' },
  { t: 'ap1', b: 'software', j: 2, q: 'Wozu dient der Befehl chmod unter Linux?',
    a: ['Er zeigt den freien Arbeitsspeicher an', 'Er wechselt das aktuelle Arbeitsverzeichnis', 'Er löscht ausgewählte Dateien ohne Rückfrage', 'Er setzt die Zugriffsrechte einer Datei'],
    r: 3, e: 'chmod (change mode) setzt Lese-, Schreib- und Ausführungsrechte für Eigentümer, Gruppe und andere. Es gehört zu den Konsolenbefehlen für Dateioperationen, die PK-04 verlangt – neben dir/ls, mkdir, cp/copy, del, alias und arp.', q_: 'PK4' },
  { t: 'ap1', b: 'software', j: 2, q: 'Welche Geräteklasse nutzt vor allem die Leistung eines zentralen Servers?',
    a: ['Der Thin Client ohne eigene Rechenleistung', 'Der All-in-One-PC mit integriertem Bildschirm', 'Das Notebook für den mobilen Einsatz', 'Die Workstation für rechenintensive Aufgaben'],
    r: 0, e: 'Der Thin Client hat kaum eigene Rechenleistung und bezieht Anwendungen und Daten über Terminalserver. Vorteile: geringe Anschaffungskosten, zentrale Administration, weniger Energiekosten und weniger Diebstahlrisiko. Geräteklassen sind PK-04-Pflichtstoff.', q_: 'PK4' },
  { t: 'ap1', b: 'software', j: 2, q: 'Worin liegt ein Vorteil von UEFI gegenüber dem klassischen BIOS?',
    a: ['UEFI kann deutlich mehr Partitionen verwalten als GPT', 'UEFI unterstützt GPT und Datenträger über 2 TB', 'UEFI benötigt kein installiertes Betriebssystem', 'UEFI arbeitet ausschließlich mit klassischen Disketten'],
    r: 1, e: 'UEFI ersetzt das BIOS: schnellerer Start, Unterstützung von GPT und Datenträgern über 2 TB, grafische Oberfläche, Mausbedienung und Sicherheitsfunktionen wie Secure Boot. PK-04 nennt BIOS und UEFI ausdrücklich als Konfigurationsgegenstand.', q_: 'PK4' },
  { t: 'ap1', b: 'software', j: 2, q: 'Welches Dateisystem gehört zu Linux?',
    a: ['NTFS', 'APFS', 'ext4', 'FAT32'],
    r: 2, e: 'ext4 ist das Standarddateisystem für Linux. NTFS gehört zu Windows, APFS zu macOS, FAT32 ist ein herstellerübergreifendes, aber stark limitiertes Altformat (maximal 4 GB pro Datei). PK-04 nennt genau diese vier Beispiele.', q_: 'PK4' },
  { t: 'ap1', b: 'software', j: 2, q: 'Warum ist Barrierefreiheit am Arbeitsplatz auch wirtschaftlich sinnvoll?',
    a: ['Weil sie zusätzliche Kosten verursacht', 'Weil sie das Netzwerk beschleunigt', 'Weil sie die Hardware verbilligt', 'Weil sie mehr Fachkräfte erschließt'],
    r: 3, e: 'Barrierefreiheit erschließt zusätzliche Fachkräfte, senkt krankheitsbedingte Ausfälle und erfüllt gesetzliche Vorgaben. PK-03 und PK-04 nennen sie ausdrücklich – etwa größere Monitore, breitere oder spezielle Tastaturen sowie zusätzliche Ein-/Ausgabegeräte.', q_: 'PK4' },
  { t: 'ap1', b: 'software', j: 1, q: 'Der Kunde klagt über Nackenschmerzen bei der Bildschirmarbeit. Welche Empfehlung gehört zur Ergonomie?',
    a: ['Monitorhöhe, Sitzhöhe, Abstand und Beleuchtung anpassen', 'Einen möglichst kleinen Monitor anschaffen', 'Den Monitor als zusätzliche Lichtquelle nutzen', 'Möglichst weit nach unten auf die Tastatur schauen'],
    r: 0, e: 'Ergonomie umfasst die richtige Höhe und Neigung von Monitor, Tastatur und Stuhl, ausreichenden Sehabstand (etwa 50–80 cm), blendfreie Beleuchtung und eine bewegungsfördernde Sitzhaltung. PK-03 nennt Ergonomie als ökonomischen und gesundheitlichen Aspekt bei der Systembeurteilung.', q_: 'PK3' },
  { t: 'ap1', b: 'software', j: 1, q: 'Welches Gütesiegel kennzeichnet besonders energieeffiziente IT-Geräte?',
    a: ['Das CE-Zeichen der Europäischen Union', 'Das Energy Star Siegel', 'Das GS-Zeichen für geprüfte Sicherheit', 'Die RoHS-Richtlinie für Gefahrstoffe'],
    r: 1, e: 'Energy Star kennzeichnet besonders sparsame Geräte. Das CE-Zeichen bestätigt die Einhaltung EU-weiter Richtlinien (kein Umweltzeichen), GS steht für geprüfte Sicherheit, RoHS verbietet bestimmte Gefahrstoffe. PK-03 fordert Gütesiegel für Energieeffizienz und Recyclingfähigkeit.', q_: 'PK3' },
  { t: 'ap1', b: 'software', j: 1, q: 'Was bedeutet Green IT im Beschaffungszusammenhang?',
    a: ['Beschaffung nach rein wirtschaftlichen Kriterien', 'Nur der Kauf von grün lackierter Hardware', 'Beschaffung nach Energieverbrauch, Langlebigkeit und Recycling', 'Der vollständige Verzicht auf IT-Ausstattung'],
    r: 2, e: 'Green IT betrachtet den gesamten Lebenszyklus: Energieverbrauch im Betrieb, Langlebigkeit und Aufrüstbarkeit, Recyclingfähigkeit der Materialien sowie Schadstofffreiheit. Die offizielle Beispielaufgabe verlangt genau diese Begründung, wenn ein Unternehmen einer GreenIT-Initiative beigetreten ist.', q_: 'PK3' },
  { t: 'ap1', b: 'software', j: 1, q: 'Welches Cloud-Modell stellt fertige Anwendungen über das Internet bereit?',
    a: ['IaaS – Infrastructure as a Service', 'PaaS – Platform as a Service', 'DaaS – Desktop as a Service', 'SaaS – Software as a Service'],
    r: 3, e: 'SaaS liefert fertige Anwendungen (z. B. E-Mail oder Office im Browser). IaaS liefert Infrastruktur (virtuelle Server, Speicher), PaaS eine Entwicklungs- und Laufzeitumgebung. PK-03 nennt SaaS und virtuelle Desktops ausdrücklich.', q_: 'PK3' },
  { t: 'ap1', b: 'software', j: 1, q: 'Was ist ein virtueller Desktop?',
    a: ['Ein Betriebssystem auf einem Server, auf das man zugreift', 'Ein besonders großer Bildschirm am Arbeitsplatz', 'Ein zweiter Bildschirm am gleichen Arbeitsplatz', 'Eine vollständige lokale Kopie aller Firmendaten am Client'],
    r: 0, e: 'Beim virtuellen Desktop (VDI) läuft das Betriebssystem in einer virtuellen Maschine auf einem Server – der Nutzer greift per Client oder Browser darauf zu. Vorteile: zentrale Administration, Daten bleiben im Rechenzentrum, Geräteunabhängigkeit. PK-03 nennt virtuelle Desktops (Cloud oder lokal) neu im Katalog.', q_: 'PK3' },
  { t: 'ap1', b: 'software', j: 1, q: 'Wofür steht ERP?',
    a: ['Für ein Netzwerkprotokoll zur sicheren Datenübertragung', 'Für ein System zur Steuerung der Unternehmensressourcen', 'Für ein Verschlüsselungsverfahren im Zahlungsverkehr', 'Für ein Dateisystem auf Servern'],
    r: 1, e: 'Enterprise Resource Planning bündelt zentrale Geschäftsprozesse wie Beschaffung, Lager, Produktion, Vertrieb und Buchhaltung in einem System. Daneben stehen CRM (Kundenbeziehungen) und SCM (Lieferkette). PK-03 nennt ERP, SCM und CRM als typische Branchensoftware.', q_: 'PK3' },
  { t: 'ap1', b: 'software', j: 1, q: 'Ein Notebook soll einen 3-stündigen Ausfall überbrücken und ist mit 92 Wh nutzbarer Kapazität angegeben. Wie hoch ist die durchschnittliche Aufnahme bei dieser Laufzeit?',
    a: ['rund 9,2 W', 'rund 276 W', 'rund 30,7 W', 'rund 92 W'],
    r: 2, e: 'Aufnahme = Energie ÷ Zeit = 92 Wh ÷ 3 h ≈ 30,7 W. Der Akku liefert also im Schnitt etwa 31 Watt. Wer Energie und Zeit multipliziert statt teilt, erhält entgegengesetzt zu hohe Werte – ein typischer Rechenfehler.', q_: 'PK3' },

  { t: 'ap1', b: 'qs', j: 1, q: 'Was ist der Zweck einer Zertifizierung nach einer QS-Norm wie ISO 9001?',
    a: ['Sie ist nur für Großunternehmen möglich', 'Sie garantiert, dass das einzelne Produkt fehlerfrei ist', 'Sie ersetzt jede Prüfung durch den Kunden', 'Ein unabhängiger Prüfer bestätigt die Normerfüllung'],
    r: 3, e: 'Zertifizierung bedeutet: Ein unabhängiges Prüfunternehmen bestätigt, dass das QM-System die Anforderungen der Norm erfüllt. Zertifiziert wird das System – nicht das einzelne Produkt. Deshalb ist sie ein Wettbewerbsvorteil, aber kein Produktversprechen.', q_: 'PK5' },
  { t: 'ap1', b: 'qs', j: 1, q: 'Was unterscheidet Qualitätsplanung von Qualitätslenkung?',
    a: ['Die Planung legt Ist und Ziel fest, die Lenkung setzt um', 'Die Lenkung legt den Ziel-Zustand fest, die Planung setzt um', 'Beide Begriffe bezeichnen im QM denselben Vorgang', 'Die Planung betrifft ausschließlich die entstehenden Kosten'],
    r: 0, e: 'In der Qualitätsplanung wird der Ist-Zustand ermittelt und der anzustrebende Ziel-Zustand festgelegt. Die Qualitätslenkung ist die Umsetzungsphase: Sie sorgt dafür, dass die Prozesse diesen Ziel-Zustand tatsächlich erreichen. PK-05 fordert beide Begriffe.', q_: 'PK5' },
  { t: 'ap1', b: 'qs', j: 1, q: 'Welche Aufgabe hat ein Testprotokoll beim Einrichten eines Arbeitsplatzes?',
    a: ['Es ersetzt die Rechnung gegenüber dem Kunden', 'Es dokumentiert nachvollziehbar die durchgeführten Prüfungen', 'Es beschreibt die ursprünglichen Wünsche des Kunden', 'Es listet die Gehälter der beteiligten Techniker'],
    r: 1, e: 'Das Testprotokoll hält fest, was geprüft wurde (z. B. Hardware, Netzwerk, Drucker), mit welchen Ergebnissen und wer die Prüfung durchgeführt hat. Es ist Prüfungsnachweis, Grundlage der Abnahme und Beleg gegenüber dem Kunden – PK-05 nennt es als Pflicht-Stoff.', q_: 'PK5' },
  { t: 'ap1', b: 'qs', j: 1, q: 'Welchen Nutzen hat das Vier-Augen-Prinzip in der Qualitätssicherung?',
    a: ['Es verdoppelt die Kosten ohne jeden erkennbaren Nutzen', 'Es verlangsamt jeden Arbeitsschritt erheblich', 'Ein zweiter Blick findet Fehler, die einer übersieht', 'Es ersetzt jede technische Prüfung vollständig'],
    r: 2, e: 'Das Vier-Augen-Prinzip verlangt eine zweite unabhängige Prüfung, bevor ein Ergebnis freigegeben wird. So sinkt die Fehlerquote in kritischen Schritten deutlich, und die Kontrolle ist nachweisbar dokumentiert – wesentlich etwa bei Freischaltungen oder Zahlungsfreigaben.', q_: 'PK5' },
  { t: 'ap1', b: 'qs', j: 1, q: 'Welche Aussage über PDCA im Qualitätsmanagement ist richtig?',
    a: ['PDCA ist ein einmalig abzuarbeitendes Verfahren im Projekt', 'PDCA ersetzt jede Form von Kundenfeedback', 'PDCA gilt ausschließlich in der Produktion', 'PDCA ist ein Kreislauf der kontinuierlichen Verbesserung'],
    r: 3, e: 'PDCA ist ausdrücklich ein Zyklus: Nach dem Handeln (Act) folgt erneut die Planung. So werden Prozesse schrittweise verbessert (KVP). PK-05 nennt PDCA als den zentralen Qualitätsmanagementzyklus.', q_: 'PK5' },

  { t: 'ap1', b: 'pm', j: 1, q: 'Was verlangt das SMART-Prinzip von einem Projektziel?',
    a: ['Spezifisch, Messbar, Attraktiv, Realistisch, Terminiert', 'Es soll möglichst intelligent formuliert sein', 'Schnell, Modern, Agil, Robust und Testbar', 'Strategisch, Motivierend, Aktiv und Transparent'],
    r: 0, e: 'SMART fordert fünf Eigenschaften: spezifisch (eindeutig formuliert), messbar (überprüfbare Kriterien), attraktiv bzw. akzeptiert, realistisch erreichbar und terminiert. PK-01 nennt das SMART-Prinzip ausdrücklich im Projektmanagement-Themenkreis.', q_: 'PK1' },
  { t: 'ap1', b: 'pm', j: 1, q: 'Worin unterscheiden sich Netzplan und Gantt-Diagramm?',
    a: ['Das Gantt-Diagramm zeigt Pufferzeiten genauer als der Netzplan', 'Der Netzplan zeigt Abhängigkeiten, das Gantt-Diagramm Balken', 'Beide Diagramme stellen Projekte völlig identisch dar', 'Der Netzplan eignet sich ausschließlich für kleine Projekte'],
    r: 1, e: 'Der Netzplan arbeitet mit Knoten und Pfeilen und macht Abhängigkeiten, früheste/späteste Termine und Puffer sichtbar – ideal zur Terminberechnung. Das Gantt-Diagramm zeigt Vorgänge als Balken auf einer Zeitachse und ist leichter lesbar, aber schwächer bei Abhängigkeiten.', q_: 'PK1' },
  { t: 'ap1', b: 'pm', j: 1, q: 'Welche Phasen der Teambildung werden in der richtigen Reihenfolge genannt?',
    a: ['Planen, Umsetzen, Prüfen, Handeln', 'Storming, Forming, Performing, Norming', 'Forming, Storming, Norming, Performing', 'Start, Mitte, Ende, Abschluss'],
    r: 2, e: 'Nach Tuckman läuft Teamentwicklung in vier Phasen: Forming (Orientierung), Storming (Konflikte), Norming (Regelbildung) und Performing (Leistungsphase). PK-01 fordert, die Phasen der Teamentwicklung zu kennen.', q_: 'PK1' },
  { t: 'ap1', b: 'pm', j: 1, q: 'Was wird in einer Machbarkeitsanalyse geprüft?',
    a: ['Nur die technische Umsetzbarkeit des Projekts', 'Nur die Verfügbarkeit der Mitarbeiter', 'Nur die Höhe der entstehenden Kosten', 'Technik, Wirtschaftlichkeit, Recht und Termine'],
    r: 3, e: 'Die Machbarkeitsanalyse betrachtet mehrere Dimensionen: technische Umsetzbarkeit, Wirtschaftlichkeit (Budgetvorgabe), rechtliche Zulässigkeit, terminliche Realisierbarkeit und personelle Ressourcen. PK-01 nennt sie zusammen mit der Budgetvorgabe und der Stakeholder-Beurteilung.', q_: 'PK1' },
  { t: 'ap1', b: 'pm', j: 1, q: 'Was ist ein Meilenstein?',
    a: ['Ein terminierbares Ereignis ohne eigene Dauer', 'Ein einzelner Arbeitsschritt im gesamten Projektverlauf', 'Der Abschluss des gesamten Projekts', 'Ein besonders teures Arbeitspaket'],
    r: 0, e: 'Ein Meilenstein ist ein terminierbares Ereignis ohne eigene Dauer – etwa „Konzept freigegeben" oder „Abnahme erfolgt". Er strukturiert das Projekt und dient der Fortschrittskontrolle. PK-01 nennt ihn ausdrücklich.', q_: 'PK1' },
  { t: 'ap1', b: 'pm', j: 1, q: 'Worin unterscheidet sich das Wasserfallmodell grundlegend von Scrum?',
    a: ['Scrum arbeitet streng sequenziell, das Wasserfallmodell iterativ', 'Wasserfall arbeitet streng sequenziell, Scrum in kurzen Sprints', 'Beide Modelle arbeiten mit völlig identischen Phasen', 'Scrum kennt keine festen Rollen im Projektteam'],
    r: 1, e: 'Im Wasserfallmodell werden die Phasen Analyse, Entwurf, Umsetzung, Test und Einführung strikt nacheinander durchlaufen – Änderungen sind teuer. Scrum arbeitet in kurzen Sprints mit Rollen (Product Owner, Scrum Master, Team), Daily und Retrospektive – Änderungen sind eingeplant.', q_: 'PK1' },
  { t: 'ap1', b: 'pm', j: 1, q: 'Was ist eine Risikoanalyse im Projekt?',
    a: ['Die nachträgliche Auswertung bereits aufgetretener Fehler', 'Die Prüfung der Qualifikation aller Mitarbeiter', 'Die Bewertung von Risiken nach Wahrscheinlichkeit und Schaden', 'Die Berechnung des erwarteten Projektgewinns'],
    r: 2, e: 'Bei der Risikoanalyse werden mögliche Risiken gesammelt, nach Eintrittswahrscheinlichkeit und Schadenshöhe bewertet (oft in einer Matrix) und mit Gegenmaßnahmen hinterlegt. PK-01 nennt sie im Themenkreis zur Wirtschaftlichkeit und Machbarkeit.', q_: 'PK1' },
  { t: 'ap1', b: 'pm', j: 1, q: 'Wozu dient eine Retrospektive wie Lessons Learned?',
    a: ['Um im Projekt die Schuldigen zu identifizieren', 'Um das Projekt künstlich zu verlängern', 'Um die Abschlussrechnung für den Kunden zu erstellen', 'Um aus dem Verlauf zu lernen und Prozesse zu verbessern'],
    r: 3, e: 'Lessons Learned sammelt am Projektende (oder am Sprintende) systematisch, was gut lief und was nicht – ohne Schuldzuweisung. Die Erkenntnisse fließen in die Verbesserung der Arbeitsprozesse ein. PK-01 nennt Reflexionsmethoden und Feedback-Kultur.', q_: 'PK1' },
  { t: 'ap1', b: 'pm', j: 1, q: 'Was unterscheidet First-Level- von Second-Level-Support?',
    a: ['Der First-Level löst Standardfälle, der Second-Level die komplexen', 'Der First-Level bearbeitet nur Hardware, der Second-Level Software', 'Der Second-Level ist der direkte Erstkontakt zum Kunden', 'Beide Supportebenen bearbeiten identische Anliegen'],
    r: 0, e: 'Der First-Level-Support ist die erste Anlaufstelle: Er erfasst Tickets, löst Standardprobleme und dokumentiert. Was er nicht löst, geht an den Second-Level (Spezialisten) und im Third-Level ggf. an den Hersteller. PK-01 nennt First-, Second- und Thirdlevelsupport ausdrücklich.', q_: 'PK1' },
  { t: 'ap1', b: 'pm', j: 1, q: 'Wozu dient ein Ticketsystem im Support?',
    a: ['Ausschließlich zur Erfassung der geleisteten Arbeitszeiten', 'Zur zentralen Erfassung und Nachverfolgung aller Anfragen', 'Zum Versenden von Werbeangeboten an Kunden', 'Zur Berechnung der Gehälter im Support'],
    r: 1, e: 'Ein Ticketsystem erfasst Anfragen zentral, vergibt eine eindeutige Nummer, klassifiziert und priorisiert sie und dokumentiert den Bearbeitungsstatus. So bleiben Anfragen nachvollziehbar und auswertbar – PK-01 nennt die Bearbeitung mittels Ticketsystem und KI-Unterstützung.', q_: 'PK1' },
  { t: 'ap1', b: 'pm', j: 1, q: 'Was gehört in einen Projektstrukturplan?',
    a: ['Die Gehälter aller am Projekt Beteiligten', 'Ausschließlich der verbindliche Endtermin', 'Die Zerlegung in Teilaufgaben und Arbeitspakete', 'Die Liste aller möglichen Lieferanten'],
    r: 2, e: 'Der Projektstrukturplan (PSP) zerlegt das Gesamtprojekt hierarchisch in Teilaufgaben und Arbeitspakete. Er schafft die Grundlage für Aufwandsschätzung, Terminplanung und Verantwortlichkeiten – PK-01 nennt Strukturplan, Netzplan und Gantt-Diagramm zusammen.', q_: 'PK1' },
  { t: 'ap1', b: 'pm', j: 1, q: 'Was bedeutet die Angabe „Verfügbarkeit 99,5 %" in einem Servicevertrag?',
    a: ['Mindestens 99,5 % der gespeicherten Datensätze sind korrekt', '99,5 % aller Supportanfragen werden beantwortet', 'Es arbeiten 99,5 % aller Mitarbeiter völlig fehlerfrei zusammen', 'Das System ist jährlich höchstens rund 44 Stunden ausgefallen'],
    r: 3, e: '0,5 % von 8.760 Stunden sind rund 43,8 Stunden. Verfügbarkeitswerte gehören typischerweise in ein SLA und müssen immer auf einen Zeitraum bezogen werden – sonst sind sie nicht überprüfbar.', q_: 'PK1' },
  { t: 'ap1', b: 'pm', j: 2, q: 'Ein Vorgang hat einen Gesamtpuffer von 4 Tagen. Was folgt daraus?',
    a: ['Er kann sich um bis zu 4 Tage verzögern, ohne den Endtermin zu gefährden', 'Er liegt auf dem kritischen Pfad des Projekts', 'Er ist unkritisch und darf ganz entfallen', 'Der Projektendtermin verschiebt sich um 4 Tage'],
    r: 0, e: 'Der Gesamtpuffer ist die Zeitspanne, um die sich ein Vorgang verschieben darf, ohne den Endtermin zu verschieben. Puffer 0 bedeutet dagegen: Der Vorgang liegt auf dem kritischen Pfad – jede Verzögerung schlägt direkt auf das Projekt durch.', q_: 'PM' },
  { t: 'ap1', b: 'pm', j: 1, q: 'Sie sollen ein neues Qualitätsziel formulieren. Welche Formulierung ist SMART?',
    a: ['Wir wollen in Zukunft insgesamt deutlich besser werden', 'Die Fehlerquote sinkt bis 31.03. von 8 % auf 3 %', 'Mehr Qualität für alle Beteiligten im ganzen Betrieb', 'Der Kunde soll mit uns zufriedener sein als bisher'],
    r: 1, e: 'Nur die zweite Formulierung ist spezifisch (Fehlerquote bei der Übergabe), messbar (8 % auf 3 %), realistisch, terminiert (31.03.) und für die Beteiligten nachvollziehbar. Die anderen sind Wünsche ohne Prüfmaßstab – typische Null-Antworten.', q_: 'PK5' },

  /* ---------- KI, Maschinelles Lernen & Deep Learning ---------- */
  { t: 'ap1', b: 'ki', j: 1, q: 'In welcher Beziehung stehen Künstliche Intelligenz (KI), Maschinelles Lernen (ML) und Deep Learning (DL)?',
    a: ['KI ist ein Teilgebiet von DL, das wiederum ein Teilgebiet von ML ist', 'KI umfasst ML, und ML umfasst DL', 'ML und DL sind dasselbe, KI ist der Oberbegriff für beide', 'DL ist der Oberbegriff und umfasst KI und ML'],
    r: 1, e: 'Es gilt die Hierarchie KI ⊃ ML ⊃ DL: KI ist der Oberbegriff, ML ist ein Teilgebiet der KI (lernen aus Daten ohne explizite Regeln), DL ist wiederum ein Subfeld des ML mit tiefen neuronalen Netzen.', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 1, q: 'Wer entwickelte 1957 das Perzeptron – das Ur-Modell eines künstlichen Neurons?',
    a: ['Marvin Minsky', 'Warren McCulloch', 'Frank Rosenblatt', 'Donald Hebb'],
    r: 2, e: 'Frank Rosenblatt stellte 1957 das Perzeptron vor. McCulloch und Pitts führten 1943 das logische Schwellwert-Element ein, Hebb formulierte 1949 die Hebb-Lernregel. Minsky und Papert kritisierten das Perzeptron 1969 wegen des XOR-Problems.', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 1, q: 'Welche Aufgabe hat der Bias b in einem künstlichen Neuron?',
    a: ['Er verschiebt die Aktivierungsschwelle des Neurons', 'Er multipliziert die Eingaben mit den Gewichten', 'Er normiert die Ausgabe auf Werte zwischen 0 und 1', 'Er ersetzt die Aktivierungsfunktion'],
    r: 0, e: 'Der Bias ist ein zusätzlicher Parameter, der die gewichtete Summe verschiebt – er entspricht einem negativen Schwellenwert. Erst zusammen mit den Gewichten bestimmt er, ab wann ein Neuron auslöst.', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 1, q: 'Welche Aufgabe hat eine Aktivierungsfunktion wie ReLU oder Sigmoid in einem neuronalen Netz?',
    a: ['Sie speichert die Trainingsdaten zwischen', 'Sie führt Nichtlinearität ein, damit auch komplexe Muster lernbar sind', 'Sie zählt die Schichten des Netzes', 'Sie ersetzt die Gewichte'],
    r: 1, e: 'Ohne Nichtlinearität bliebe jedes noch so tiefe Netz eine einzige lineare Funktion. Aktivierungsfunktionen wie ReLU oder Sigmoid machen das Modell erst fähig, nichtlineare Zusammenhänge abzubilden.', q_: 'DL' },
  { t: 'ap1', b: 'ki', j: 1, q: 'Was beschreibt die Backpropagation in einem neuronalen Netz?',
    a: ['Das Vorwärtsleiten der Eingaben durch die Schichten', 'Das zufällige Initialisieren der Gewichte', 'Das Rückführen des Fehlers, um die Gewichte anzupassen', 'Das Aufteilen der Daten in Trainings- und Testdaten'],
    r: 2, e: 'Bei der Backpropagation wird der Fehler (Abweichung zwischen Vorhersage und Ziel) rückwärts durch das Netz geführt und die Gewichte entsprechend angepasst. Das Vorwärtsleiten heißt Vorwärtspropagation.', q_: 'DL' },
  { t: 'ap1', b: 'ki', j: 1, q: 'Ein Neuron hat die Eingaben x₁ = 1 und x₂ = 0,6, die Gewichte w₁ = 0,4 und w₂ = −0,5 sowie den Bias b = 0,1. Die Aktivierung ist ReLU. Wie groß ist die Ausgabe a?',
    a: ['−0,2', '0,2', '0,0', '0,5'],
    r: 1, e: 'z = x₁·w₁ + x₂·w₂ + b = 1·0,4 + 0,6·(−0,5) + 0,1 = 0,4 − 0,3 + 0,1 = 0,2. ReLU gibt max(0, z) aus, hier also 0,2.', q_: 'DL' },
  { t: 'ap1', b: 'ki', j: 1, q: 'Was ist die Voraussetzung für überwachtes Lernen?',
    a: ['Unbeschriftete Daten', 'Beschriftete Daten mit bekannten Zielwerten (Labels)', 'Ein Belohnungssystem für den Agenten', 'Eine Datenbank ohne Schema'],
    r: 1, e: 'Überwachtes Lernen braucht Daten mit zugehörigen Labels (Ground Truth): Input plus gewünschte Ausgabe. Unüberwachtes Lernen arbeitet ohne Labels, bestärkendes Lernen über Belohnung und Strafe.', q_: 'ML' },
  { t: 'ap1', b: 'ki', j: 1, q: 'Welche Aufgabe ist typisch für unüberwachtes Lernen?',
    a: ['Vorhersage des Hauspreises aus Wohnfläche', 'Erkennung von Spam anhand gelernter Beispiele', 'Bildung von Kundengruppen (Segmentierung) ohne Vorgaben', 'Klassifikation handgeschriebener Ziffern'],
    r: 2, e: 'Unüberwachtes Lernen erkennt Strukturen in Daten ohne Labels – etwa Cluster (Kundensegmente) oder reduzierte Dimensionen. Die übrigen Aufgaben sind überwacht, weil Zielwerte oder Klassen bekannt sind.', q_: 'ML' },
  { t: 'ap1', b: 'ki', j: 1, q: 'Was macht der K-Means-Algorithmus?',
    a: ['Er teilt Datenpunkte in k Gruppen ein, deren Zentroide die geringste Gesamtabweichung haben', 'Er berechnet eine Gerade durch alle Punkte', 'Er klassifiziert Daten anhand vorher bekannter Labels', 'Er sortiert Zahlen der Größe nach'],
    r: 0, e: 'K-Means ist ein Verfahren des unüberwachten Lernens: k Cluster werden schrittweise so gebildet, dass die Summe der quadrierten Abstände der Punkte zu ihrem Clusterzentrum (Zentroid) minimal wird.', q_: 'ML' },
  { t: 'ap1', b: 'ki', j: 1, q: 'Was ist ein Dendrogramm?',
    a: ['Eine Tabelle mit allen Trainingsdaten', 'Ein Baumdiagramm zur Darstellung hierarchischen Clustering', 'Ein Maß für die Genauigkeit eines Modells', 'Ein Optimierungsverfahren für neuronale Netze'],
    r: 1, e: 'Das Dendrogramm zeigt das Ergebnis hierarchischer Clusterverfahren: Die horizontale Achse führt die Objekte, die vertikale die Verschmelzungsdistanz. Eine hohe Verbindungslinie bedeutet geringe Ähnlichkeit.', q_: 'ML' },
  { t: 'ap1', b: 'ki', j: 1, q: 'Warum gilt ein Entscheidungsbaum als White-Box-Modell?',
    a: ['Weil er keine Trainingsdaten benötigt', 'Weil jeder Entscheidungsschritt logisch nachvollziehbar ist', 'Weil er immer die höchste Genauigkeit liefert', 'Weil er nur bei Zahlen funktioniert'],
    r: 1, e: 'Ein Entscheidungsbaum zerlegt den Datensatz durch nachvollziehbare Regeln (Wurzel → Entscheidungsknoten → Blatt). Deshalb ist er im Gegensatz zu tiefen neuronalen Netzen leicht erklärbar – ein White-Box-Modell.', q_: 'ML' },
  { t: 'ap1', b: 'ki', j: 1, q: 'Was ist ein Random Forest?',
    a: ['Ein einzelner, besonders tiefer Entscheidungsbaum', 'Ein Ensemble aus vielen Entscheidungsbäumen, deren Ergebnis abgestimmt wird', 'Ein neuronales Netz mit genau zwei Schichten', 'Ein Clustering-Verfahren'],
    r: 1, e: 'Der Random Forest kombiniert viele Entscheidungsbäume, die auf zufälligen Stichproben und Merkmalsauswahlen trainiert wurden. Durch Mehrheitsvotum (Klassifikation) bzw. Mittelwert (Regression) reduziert er Overfitting und Varianz.', q_: 'ML' },
  { t: 'ap1', b: 'ki', j: 2, q: 'Was sucht eine Support Vector Machine (SVM)?',
    a: ['Die größte Gruppe ähnlicher Datenpunkte', 'Die Hyperplane mit maximalem Abstand zu den nächstgelegenen Punkten', 'Die kürzeste Verbindung zwischen zwei Klassen', 'Die Häufigkeit der Merkmale im Datensatz'],
    r: 1, e: 'Die SVM sucht die beste Trenngrenze (Hyperplane) zwischen zwei Klassen und maximiert dabei den Abstand (Margin) zu den nächstgelegenen Punkten – den Support Vectors. Für nichtlineare Fälle hilft der Kernel-Trick.', q_: 'ML' },
  { t: 'ap1', b: 'ki', j: 2, q: 'Was bedeutet Overfitting beim maschinellen Lernen?',
    a: ['Das Modell passt sich so stark an die Trainingsdaten an, dass es auf neuen Daten schlecht generalisiert', 'Das Modell ist zu einfach und erkennt kein Muster', 'Die Trainingsdaten wurden falsch formatiert', 'Das Modell rechnet zu langsam'],
    r: 0, e: 'Bei Overfitting lernt das Modell die Trainingsdaten inklusive Rauschen auswendig. Gegenmaßnahmen sind mehr Daten, Regularisierung (z. B. Dropout, L2), Pruning beim Entscheidungsbaum und Kreuzvalidierung.', q_: 'ML' },
  { t: 'ap1', b: 'ki', j: 2, q: 'Warum wird ein Datensatz vor dem Training in Trainings-, Validierungs- und Testdaten aufgeteilt?',
    a: ['Damit die Daten normalisiert werden', 'Damit das Modell auf ungesehenen Daten ehrlich bewertet werden kann', 'Damit weniger Speicher benötigt wird', 'Damit die Labels entfallen'],
    r: 1, e: 'Nur mit zurückgehaltenen Daten lässt sich prüfen, ob ein Modell generalisiert. Üblich sind etwa 70–80 % Training, 10–15 % Validierung (zum Optimieren der Parameter) und 20–30 % Test (zur abschließenden Bewertung).', q_: 'ML' },
  { t: 'ap1', b: 'ki', j: 2, q: 'Warum benötigt Deep Learning häufig eine GPU statt nur einer CPU?',
    a: ['Weil GPUs einen größeren Festplattenspeicher haben', 'Weil dieselben Matrixoperationen für viele Datenpunkte parallel anfallen', 'Weil neuronale Netze nur auf GPUs laufen können', 'Weil GPUs weniger Energie verbrauchen'],
    r: 1, e: 'Das Training eines tiefen Netzes besteht aus sehr vielen Matrixmultiplikationen, die sich gut parallelisieren lassen. GPUs führen Tausende Rechenoperationen gleichzeitig aus und sind dadurch deutlich schneller als CPUs.', q_: 'DL' },
  { t: 'ap1', b: 'ki', j: 2, q: 'Was unterscheidet Klassifikation von Regression?',
    a: ['Klassifikation ordnet diskrete Klassen zu, Regression sagt kontinuierliche Werte voraus', 'Klassifikation ist unüberwacht, Regression überwacht', 'Regression liefert nur Wahrheitswerte', 'Beide sind identisch, nur der Name unterscheidet sich'],
    r: 0, e: 'Klassifikation teilt Objekte in feste Klassen ein (Spam/Nicht-Spam, Tierarten). Regression sagt einen stetigen Zahlenwert voraus (Hauspreis, Umsatz). Beide gehören zum überwachten Lernen.', q_: 'ML' },
  { t: 'ap1', b: 'ki', j: 2, q: 'Was misst der Informationsgewinn (Information Gain) bei einem Entscheidungsbaum?',
    a: ['Die Anzahl der Trainingsdatensätze', 'Die Abnahme der Entropie durch eine Aufteilung', 'Die Tiefe des Baumes', 'Die Rechenzeit des Algorithmus'],
    r: 1, e: 'Der Informationsgewinn ist die Differenz der Entropie vor und nach einem Split. Ein hoher Wert bedeutet, dass die Aufteilung die Zielvariable deutlich besser trennt. Der Gini-Index ist ein recheneffizienteres Maß für dasselbe Ziel.', q_: 'ML' },
  { t: 'ap1', b: 'ki', j: 3, q: 'Welche ethische Herausforderung entsteht, wenn ein KI-Modell mit verzerrten Daten trainiert wird?',
    a: ['Das Modell wird zwangsläufig langsamer', 'Algorithmische Verzerrung (Bias) kann zu unfairen Entscheidungen führen', 'Das Modell vergisst die Trainingsdaten', 'Die Genauigkeit sinkt immer auf null'],
    r: 1, e: 'Ein Modell übernimmt die Vorurteile seiner Trainingsdaten. Gegenmaßnahmen sind repräsentative Daten, Prüfung auf Bias und Erklärbarkeit der Entscheidungen. Ein KI-Modell ist nicht automatisch objektiv.', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 3, q: 'Welche Aufgabe hat der EU Artificial Intelligence Act?',
    a: ['Er verbietet KI vollständig', 'Er regelt den Umgang mit KI-Systemen europaweit nach Risikostufen', 'Er legt die Programmiersprache für KI fest', 'Er ersetzt die DSGVO'],
    r: 1, e: 'Der EU AI Act ist ein Gesetzesrahmen, der KI-Systeme nach ihrem Risiko einordnet und Pflichten vorschreibt. Er tritt neben die DSGVO, die den Umgang mit personenbezogenen Daten regelt.', q_: 'KI' },

  { t: 'ap1', b: 'ki', j: 1, q: 'Was bezeichnet man als generische (generative) KI?',
    a: ['KI, die bestehende Daten nur sortiert', 'KI, die neue Inhalte wie Text, Bilder oder Code erzeugt', 'KI, die ausschließlich rechnet', 'KI, die keine Trainingsdaten benötigt'],
    r: 1, e: 'Generative KI erzeugt neue Inhalte – Text (LLM wie ChatGPT), Bilder (Diffusionsmodelle) oder Code. Grundlage sind meist große neuronale Netze, die aus sehr vielen Beispielen Muster gelernt haben.', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 1, q: 'Wofür steht die Abkürzung LLM im KI-Kontext?',
    a: ['Low Level Machine', 'Large Language Model', 'Logisches Lern-Modul', 'Linear Layer Model'],
    r: 1, e: 'LLM = Large Language Model (großes Sprachmodell). Es ist ein neuronales Netz, das auf sehr großen Textmengen trainiert wurde und Text versteht und erzeugt.', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 1, q: 'Was versteht man unter einem Prompt?',
    a: ['Die Rechenleistung des Modells', 'Die Eingabeaufforderung bzw. Anweisung an ein KI-Modell', 'Die gespeicherten Gewichte', 'Die Fehlerquote des Modells'],
    r: 1, e: 'Der Prompt ist die Eingabe an ein generatives Modell. Je präziser und vollständiger die Anweisung, desto brauchbarer das Ergebnis – das nennt man Prompting.', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 1, q: 'Was ist ein Merkmal eines guten Prompts?',
    a: ['Möglichst kurz und ungenau', 'Klar formuliert, mit Kontext, Ziel und gewünschtem Format', 'Nur ein einzelnes Stichwort', 'Ohne jede Rollen- oder Zielangabe'],
    r: 1, e: 'Ein guter Prompt nennt Aufgabe, Kontext, Zielgruppe und das gewünschte Ausgabeformat. Rollenangaben („Du bist …") und Beispiele verbessern das Ergebnis zusätzlich.', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 1, q: 'Was bedeutet eine „Halluzination" bei einem Sprachmodell?',
    a: ['Das Modell verweigert die Antwort', 'Das Modell erzeugt plausibel klingende, aber falsche Inhalte', 'Das Modell stürzt ab', 'Das Modell rechnet zu langsam'],
    r: 1, e: 'Sprachmodelle erzeugen wahrscheinliche Textfortsetzungen – nicht unbedingt wahre Aussagen. Deshalb müssen Ergebnisse fachlich geprüft werden, besonders bei Zahlen und Fakten.', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 1, q: 'Welche Anwendung ist typisch für KI im IT-Support?',
    a: ['Automatische Klassifizierung und Priorisierung eingehender Tickets', 'Ersetzen des Netzwerkkabels', 'Löschen von Backups', 'Verwalten der Hardware-Garantie'],
    r: 0, e: 'KI kann Tickets klassifizieren und priorisieren, Antwortvorschläge liefern und häufige Anfragen automatisch beantworten. Der Mensch bleibt für Entscheidungen und Ausnahmen zuständig.', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 2, q: 'Was ist ein Chatbot mit „Natural Language Processing" (NLP)?',
    a: ['Ein Programm, das natürliche Sprache versteht und verarbeitet', 'Ein reines Taschenrechner-Programm', 'Ein Netzwerkprotokoll', 'Ein Speichermedium'],
    r: 0, e: 'NLP (Natural Language Processing, natürliche Sprachverarbeitung) ist das Teilgebiet der KI, das sich mit menschlicher Sprache befasst – Übersetzung, Spracherkennung, Chatbots, Textanalyse.', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 2, q: 'Wozu dient ein „Trainings-, Validierungs- und Testdatensatz" im ML?',
    a: ['Nur zum Speichern der Daten', 'Trainieren des Modells, Optimieren der Parameter und ehrliches Bewerten auf ungesehenen Daten', 'Zur Verschlüsselung der Daten', 'Zum Löschen von Ausreißern'],
    r: 1, e: 'Trainingsdaten: Modell lernen. Validierungsdaten: Parameter einstellen. Testdaten: einmalige, ehrliche Bewertung. Wird das Testset zum Optimieren benutzt, verliert es seine Aussagekraft.', q_: 'ML' },
  { t: 'ap1', b: 'ki', j: 2, q: 'Was ist der Unterschied zwischen KI und klassischer Programmierung?',
    a: ['Bei klassischer Programmierung werden Regeln fest vorgegeben; ML lernt Muster aus Daten', 'Klassische Programme benötigen immer eine GPU', 'Beide sind identisch', 'KI kann keine Entscheidungen treffen'],
    r: 0, e: 'Klassische Programmierung: Der Mensch formuliert die Regeln. Maschinelles Lernen: Das Modell leitet die Regeln aus Beispieldaten ab. Deshalb brauchen ML-Modelle viele Daten.', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 2, q: 'Warum ist Erklärbarkeit (Transparenz) bei KI in der Personalauswahl wichtig?',
    a: ['Weil Entscheidungen nachvollziehbar und begründbar sein müssen', 'Weil sonst die Rechenleistung steigt', 'Weil intransparente Modelle immer genauer sind', 'Weil die Daten dann kleiner werden'],
    r: 0, e: 'Bei Bewerberauswahl und Kreditvergabe muss begründet werden können, wie eine Entscheidung zustande kommt. Black-Box-Modelle sind dort problematisch – man bevorzugt erklärbare Verfahren oder ergänzt Erklärbarkeitsmethoden.', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 2, q: 'Was beschreibt der Begriff „Computer Vision"?',
    a: ['Die automatische Analyse und Deutung von Bildern durch KI', 'Das Aufbauen von Monitoren', 'Das Verschlüsseln von Grafiken', 'Das Komprimieren von Videos'],
    r: 0, e: 'Computer Vision ist das KI-Teilgebiet der Bildverarbeitung: Gesichtserkennung, Objekterkennung, Qualitätskontrolle in der Produktion. Meist kommen dabei Convolutional Neural Networks (CNNs) zum Einsatz.', q_: 'DL' },
  { t: 'ap1', b: 'ki', j: 2, q: 'Welche Architektur ist für Bildverarbeitung besonders geeignet?',
    a: ['Long Short-Term Memory (LSTM)', 'Convolutional Neural Network (CNN)', 'Lineare Regression', 'Entscheidungsbaum'],
    r: 1, e: 'CNNs (Convolutional Neural Networks) sind auf Bilder spezialisiert: Faltungsschichten erkennen lokale Muster wie Kanten und Formen. LSTMs bzw. RNNs eignen sich dagegen für Sequenzen wie Text und Zeitreihen.', q_: 'DL' },
  { t: 'ap1', b: 'ki', j: 3, q: 'Welche Aussage über KI und KI-generierte Ergebnisse ist richtig?',
    a: ['KI-Ergebnisse sind immer korrekt und müssen nicht geprüft werden', 'KI-Ergebnisse können falsch sein und müssen fachlich geprüft werden', 'KI kann nur rechnen, nie Text erzeugen', 'KI-Modelle sind immer ethisch neutral'],
    r: 1, e: 'KI-Ergebnisse sind Wahrscheinlichkeitsergebnisse – sie können halluzinieren, veraltet sein oder Bias enthalten. Jede Veröffentlichung braucht eine fachliche Prüfung („human in the loop").', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 3, q: 'Welche Rolle hilft, einfache Aufgaben im Support durch KI zu automatisieren?',
    a: ['Ein Expertensystem oder ein KI-basierter Assistent für Standardfälle', 'Der Austausch aller Server', 'Das Löschen der Wissensdatenbank', 'Die Stilllegung des Ticketsystems'],
    r: 0, e: 'Standardfälle (Passwort zurücksetzen, FAQ, Statusabfrage) lassen sich durch einen KI-Assistenten oder regelbasiertes Expertensystem automatisch beantworten. Das entlastet den First-Level-Support für schwierige Fälle.', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 3, q: 'Was ist bei KI mit personenbezogenen Daten datenschutzrechtlich besonders zu beachten?',
    a: ['Trainingsdaten dürfen beliebig aus dem Internet genommen werden', 'Es gilt die DSGVO – Datenminimierung, Zweckbindung und Rechtsgrundlage sind Pflicht', 'Datenschutz gilt für KI nicht', 'Nur Bilder sind personenbezogen'],
    r: 1, e: 'Auch für KI-Training und -Einsatz gilt die DSGVO: Datenminimierung, Zweckbindung, Rechtsgrundlage, Auskunfts- und Löschrechte. Personenbezogene Daten dürfen nicht ohne Grundlage in Modelle einfließen.', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 1, q: 'Was ist ein Merkmal (Feature) im maschinellen Lernen?',
    a: ['Die gewünschte Ausgabe des Modells', 'Eine Eingabegröße, die das Modell zur Vorhersage nutzt', 'Die Lernrate', 'Ein Fehlertyp'],
    r: 1, e: 'Features sind die Eingabemerkmale (z. B. Wortanzahl, Absender, Alter). Labels sind die Zielwerte. Beim klassischen ML wählt der Mensch Features aus; beim DL findet das Netz sie selbst.', q_: 'ML' },
  { t: 'ap1', b: 'ki', j: 1, q: 'Was bedeutet „Skalierung/Normierung" von Merkmalen vor dem Training?',
    a: ['Merkmale auf vergleichbare Wertebereiche bringen', 'Merkmale löschen', 'Merkmale vervielfachen', 'Das Modell vergrößern'],
    r: 0, e: 'Liegen Merkmale auf stark verschiedenen Skalen (z. B. Alter 0–100 vs. Einkommen 0–100.000), dominieren große Werte. Deshalb werden sie normiert – besonders wichtig für SVM und K-Means.', q_: 'ML' },
  { t: 'ap1', b: 'ki', j: 1, q: 'Was ist der Unterschied zwischen Klassifikation und Clustering?',
    a: ['Klassifikation ordnet bekannten Klassen zu, Clustering findet Gruppen ohne Vorgabe', 'Beide sind unüberwacht', 'Clustering braucht Labels', 'Klassifikation gruppiert nur Zahlen'],
    r: 0, e: 'Klassifikation ist überwacht (bekannte Klassen) und ordnet zu. Clustering ist unüberwacht und entdeckt unbekannte Gruppen. Deshalb spricht man beim Clustering von „Entdecken", bei der Klassifikation von „Zuordnen".', q_: 'ML' },

  { t: 'ap1', b: 'ki', j: 1, q: 'Was ist ein Expertensystem?',
    a: ['Ein regelbasiertes KI-System, das Wissen und Schlussregeln eines Fachexperten nachbildet', 'Ein neuronales Netz mit vielen Schichten', 'Ein Datenbanksystem ohne Regeln', 'Ein reines Rechenprogramm ohne Wissen'],
    r: 0, e: 'Ein Expertensystem gehört zur klassischen, symbolischen KI: Der Mensch hinterlegt Wissen als Regeln (WENN … DANN …). Es braucht keine großen Datenmengen – im Gegensatz zum maschinellen Lernen.', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 1, q: 'Welche Aussage unterscheidet symbolische KI von maschinellem Lernen?',
    a: ['Symbolische KI nutzt feste Regeln, ML lernt Muster aus Daten', 'Beide benötigen keinen Menschen', 'ML arbeitet ohne Daten', 'Symbolische KI braucht immer eine GPU'],
    r: 0, e: 'Symbolische KI (z. B. Expertensystem) arbeitet mit vom Menschen formulierten Regeln. Maschinelles Lernen leitet die Regeln aus Beispieldaten ab. Deshalb brauchen ML und DL viele Daten.', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 2, q: 'Was ist eine „Epoche" beim Training eines Modells?',
    a: ['Ein vollständiger Durchlauf durch alle Trainingsdaten', 'Ein einzelner Datenpunkt', 'Eine einzelne GPU', 'Der gesamte Datensatz im Speicher'],
    r: 0, e: 'Eine Epoche ist ein vollständiger Durchlauf über den gesamten Trainingsdatensatz. Meist werden viele Epochen trainiert; eine „Batch" ist die Teilmenge, die in einem Schritt verarbeitet wird.', q_: 'DL' },
  { t: 'ap1', b: 'ki', j: 2, q: 'Wofür steht die Transformer-Architektur (2017)?',
    a: ['Sie ist die Grundlage moderner Sprachmodelle und nutzt Aufmerksamkeit (Attention) statt fester Reihenfolge', 'Sie ist ein Speichermedium', 'Sie ist ein Netzwerkprotokoll', 'Sie ist ein klassisches Datenbankschema'],
    r: 0, e: 'Der Transformer nutzt den Attention-Mechanismus, um Beziehungen zwischen allen Wörtern eines Textes zu erfassen. Er ist die Grundlage großer Sprachmodelle wie GPT und damit heutiger generativer KI.', q_: 'DL' },
  { t: 'ap1', b: 'ki', j: 2, q: 'Was bedeutet „Transfer Learning"?',
    a: ['Ein bereits trainiertes Modell auf eine neue, ähnliche Aufgabe übertragen und nachtrainieren', 'Daten von einem Rechner auf einen anderen kopieren', 'Ein Modell löschen', 'Ein Modell ohne Daten trainieren'],
    r: 0, e: 'Beim Transfer Learning startet man mit einem vortrainierten Modell und passt es an eine neue Aufgabe an (Feintuning). Das spart Rechenzeit und Daten, weil das Modell schon allgemeine Muster gelernt hat.', q_: 'DL' },
  { t: 'ap1', b: 'ki', j: 2, q: 'Was bedeutet die Abkürzung RAG (Retrieval Augmented Generation)?',
    a: ['Ein Sprachmodell holt relevante Dokumente aus einer Wissensbasis und nutzt sie zum Antworten', 'Ein Verfahren zum Löschen von Daten', 'Ein Netzwerkprotokoll', 'Ein Trainingsverfahren für GPUs'],
    r: 0, e: 'Bei RAG verbindet man ein Sprachmodell mit einer Wissensdatenbank: Zuerst werden passende Dokumente gesucht (Retrieval), dann wird die Antwort daraus erzeugt (Generation). So sinken Halluzinationen und Antworten bleiben aktuell.', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 2, q: 'Was ist ein Diffusionsmodell?',
    a: ['Ein generatives KI-Modell, das Bilder erzeugt, indem es schrittweise Rauschen entfernt', 'Ein Modell zur Berechnung von Netzwerkadressen', 'Ein Datenkompressionsverfahren', 'Ein Sicherheitsprotokoll'],
    r: 0, e: 'Diffusionsmodelle erzeugen Bilder und andere Medien, indem sie aus zufälligem Rauschen schrittweise ein Bild formen. Sie sind neben GANs die Grundlage moderner Bildgenerierung.', q_: 'DL' },
  { t: 'ap1', b: 'ki', j: 2, q: 'Was ist „Prompt Injection" als Sicherheitsrisiko bei LLM-Anwendungen?',
    a: ['Eine versteckte Anweisung in Eingabedaten, die das Modell zu ungewollten Aktionen verleitet', 'Ein Fehler in der Tastatur', 'Ein Angriff auf das Netzwerkkabel', 'Eine Methode zum Modelltraining'],
    r: 0, e: 'Bei der Prompt Injection schmuggelt ein Angreifer Anweisungen in Text, den das Modell verarbeitet (z. B. in eine E-Mail oder Webseite). Das Modell kann dann Regeln umgehen. Gegenmaßnahmen: Eingaben prüfen und Rechte des Modells begrenzen.', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 2, q: 'Wie kann KI für Angriffe missbraucht werden?',
    a: ['Für täuschend echte Phishing-Mails, Deepfakes und automatisiertes Ausprobieren von Passwörtern', 'Nur zum Anzeigen von Werbung', 'KI kann nicht für Angriffe genutzt werden', 'Nur zum Kopieren von Dateien'],
    r: 0, e: 'Generative KI senkt die Hürde für Angriffe: individuelle, fehlerfreie Phishing-Texte, gefälschte Stimmen/Video (Deepfakes) und Automatisierung von Angriffen. Sensibilisierung und technische Schutzmaßnahmen werden dadurch wichtiger.', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 3, q: 'Warum ist der Energie- und Ressourcenverbrauch von KI ein Thema?',
    a: ['Training und Betrieb großer Modelle verbrauchen viel Strom und Kühlung – relevant für Kosten und Nachhaltigkeit', 'KI verbraucht grundsätzlich keinen Strom', 'Nur kleine Modelle verbrauchen Strom', 'Der Verbrauch ist unabhängig von der Modellgröße'],
    r: 0, e: 'Besonders das Training großer Modelle und der Dauerbetrieb in Rechenzentren treiben Strombedarf und Kühlung. Das ist zugleich ein Kosten- und ein Nachhaltigkeitsthema – Effizienz und passende Modellgröße zählen.', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 3, q: 'Was bedeutet „human in the loop" beim Einsatz von KI?',
    a: ['Ein Mensch prüft oder bestätigt die Entscheidung des KI-Systems', 'Der Mensch programmiert das Modell', 'Das Modell arbeitet völlig ohne Kontrolle', 'Der Mensch ersetzt die Hardware'],
    r: 0, e: 'Bei „human in the loop" bleibt der Mensch in der Entscheidungskette: Er prüft Ergebnisse und gibt sie frei. Das ist Pflicht bei kritischen Anwendungen (Personal, Medizin, Recht) und reduziert Fehler durch Halluzinationen oder Bias.', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 1, q: 'Wofür wird KI im Rahmen der Prozessanalyse genutzt?',
    a: ['Für Mustererkennung, Prognosen und Anomalieerkennung in Prozessdaten', 'Zum Ausdrucken von Rechnungen', 'Zum Verlegen von Netzwerkkabeln', 'Zum Aufbau der Hardware'],
    r: 0, e: 'KI hilft in der Prozessanalyse bei Mustererkennung, Vorhersagen (Predictive Maintenance) und Anomalieerkennung. Sie unterstützt Entscheidungen – die fachliche Bewertung bleibt beim Menschen.', q_: 'KI' },

  /* ============ Netzwerktechnik (PK-03/04) ============ */
  { t: 'ap1', b: 'netzwerk', j: 1, q: 'Wie viele Schichten hat das OSI-Modell, und auf welcher Schicht arbeitet ein Router?',
    a: ['4 Schichten; Router auf Schicht 2', '7 Schichten; Router auf Schicht 3 (Vermittlung)', '7 Schichten; Router auf Schicht 1', '5 Schichten; Router auf Schicht 4'],
    r: 1, e: 'Das OSI-Modell hat 7 Schichten. Der Router arbeitet auf Schicht 3 (Vermittlung/Network) und leitet Pakete anhand von IP-Adressen weiter. Ein Switch arbeitet auf Schicht 2 mit MAC-Adressen.', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 1, q: 'Auf welcher Schicht des OSI-Modells arbeiten TCP und UDP?',
    a: ['Schicht 2 (Sicherung)', 'Schicht 3 (Vermittlung)', 'Schicht 4 (Transport)', 'Schicht 7 (Anwendung)'],
    r: 2, e: 'TCP und UDP gehören zur Transportschicht (Schicht 4). Sie entscheiden über die Art der Übertragung: TCP verbindungsorientiert und zuverlässig, UDP verbindungslos und schnell.', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 1, q: 'Was unterscheidet TCP von UDP?',
    a: ['TCP ist verbindungsorientiert und sichert die Übertragung, UDP ist verbindungslos ohne Sicherung', 'UDP ist langsamer, aber sicherer als TCP', 'Beide sind verbindungslos', 'TCP wird nur für Video, UDP nur für E-Mail genutzt'],
    r: 0, e: 'TCP baut eine Verbindung auf (3-Way-Handshake), bestätigt den Empfang und ordnet Pakete – ideal für Dateien und Web. UDP verzichtet darauf – ideal für Streaming oder DNS, wo Tempo wichtiger ist als Vollständigkeit.', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 1, q: 'Wie läuft der 3-Way-Handshake von TCP ab?',
    a: ['SYN → SYN-ACK → ACK', 'ACK → SYN → FIN', 'PING → PONG → PING', 'GET → POST → OK'],
    r: 0, e: 'Der Client sendet SYN, der Server antwortet mit SYN-ACK, der Client bestätigt mit ACK. Danach steht die Verbindung und die Datenübertragung beginnt.', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 1, q: 'Welche Aufgabe hat DHCP in einem Netzwerk?',
    a: ['Es vergibt IP-Adressen und weitere Netzparameter automatisch', 'Es wandelt Domainnamen in IP-Adressen um', 'Es verschlüsselt den Datenverkehr', 'Es filtert unerwünschte Pakete'],
    r: 0, e: 'DHCP (Dynamic Host Configuration Protocol) vergibt IP-Adresse, Subnetzmaske, Gateway und DNS automatisch. Der Ablauf heißt DORA: Discover → Offer → Request → Acknowledge. DNS macht dagegen Namensauflösung.', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 1, q: 'Welche Aufgabe hat DNS?',
    a: ['Es ordnet Domainnamen IP-Adressen zu', 'Es vergibt IP-Adressen', 'Es routet Pakete zwischen Netzen', 'Es verschlüsselt Webseiten'],
    r: 0, e: 'DNS (Domain Name System) ist das „Telefonbuch" des Internets: Es löst Namen wie example.de in IP-Adressen auf. Wichtige Eintragstypen: A (IPv4), AAAA (IPv6), MX (Mail), CNAME (Alias), NS (Nameserver).', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 1, q: 'Welche Netzwerkkomponente verbindet mehrere Geräte in einem LAN und leitet anhand von MAC-Adressen weiter?',
    a: ['Switch', 'Router', 'Gateway', 'Modem'],
    r: 0, e: 'Ein Switch arbeitet auf Schicht 2 und leitet Frames anhand der MAC-Adresse gezielt an den richtigen Port. Ein Router verbindet Netze auf Schicht 3 anhand von IP-Adressen.', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 1, q: 'Welche Rolle hat ein Access Point im Netzwerk?',
    a: ['Er bindet WLAN-Geräte drahtlos an das kabelgebundene Netz an', 'Er vergibt IP-Adressen', 'Er verschlüsselt Festplatten', 'Er ersetzt den Router vollständig'],
    r: 0, e: 'Ein Access Point (AP) ist der drahtlose Zugangspunkt: Er verbindet WLAN-Clients mit dem LAN. Häufig ist er im WLAN-Router integriert. Ein WLAN-Router vereint Router, Switch und Access Point.', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 1, q: 'Wofür steht die Abkürzung LWL, und welcher Vorteil ist typisch?',
    a: ['Lichtwellenleiter – unempfindlich gegen elektromagnetische Störungen und für große Distanzen geeignet', 'Lokales Wähl-Leitungssystem – günstig, aber langsam', 'Langsame WAN-Leitung – nur für Telefonie', 'Leistungsstarker WLAN-Layer – nur für Funk'],
    r: 0, e: 'Lichtwellenleiter (Glasfaser) übertragen Daten als Licht. Vorteile: sehr hohe Bandbreite, große Reichweite und Unempfindlichkeit gegen elektromagnetische Störungen (EMV). Kupferkabel sind günstiger und einfacher zu verlegen.', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 1, q: 'Welcher Befehl zeigt unter Windows die aktuelle IP-Konfiguration an?',
    a: ['ipconfig', 'ip route', 'netstat -r', 'arp -a'],
    r: 0, e: 'Unter Windows zeigt ipconfig IP-Adresse, Subnetzmaske und Gateway. Unter Linux heißen die Werkzeuge ifconfig bzw. ip (iproute2). Mit ipconfig /all erhält man zusätzlich MAC-Adresse und DHCP-Informationen.', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 1, q: 'Sie wollen prüfen, über welche Zwischenstationen ein Ziel im Netz erreicht wird. Welches Werkzeug nutzen Sie?',
    a: ['traceroute (Linux) bzw. tracert (Windows)', 'ping', 'nslookup', 'chmod'],
    r: 0, e: 'traceroute/tracert zeigt alle Zwischenstationen (Hops) bis zum Ziel. ping prüft nur die grundsätzliche Erreichbarkeit. nslookup dient der DNS-Abfrage.', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 1, q: 'Wozu dient der Befehl nslookup?',
    a: ['Zur Abfrage von DNS-Einträgen – welcher IP-Adresse ist ein Name zugeordnet', 'Zum Anzeigen der MAC-Adressen', 'Zum Löschen einer Datei', 'Zum Starten eines Dienstes'],
    r: 0, e: 'nslookup fragt einen DNS-Server: Welche IP steckt hinter einem Namen (oder umgekehrt)? Damit prüft man Namensauflösung, wenn eine Webseite per Ping nicht erreichbar scheint.', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 1, q: 'Welcher Befehl ordnet einer IP-Adresse die zugehörige MAC-Adresse zu?',
    a: ['arp', 'ping', 'ipconfig', 'tracert'],
    r: 0, e: 'ARP (Address Resolution Protocol) und der Befehl arp zeigen die Zuordnung IP-Adresse ↔ MAC-Adresse im lokalen Netz. Diese Zuordnung braucht ein Gerät, um einen Frame im LAN adressieren zu können.', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 2, q: 'Ein Gerät hat die Adresse 169.254.12.5. Was bedeutet das?',
    a: ['Es hat vom DHCP keine Adresse erhalten und sich selbst eine APIPA-Adresse gegeben', 'Es liegt im öffentlichen Internet', 'Es ist ein Server', 'Die Adresse ist ungültig und darf nie vorkommen'],
    r: 0, e: '169.254.0.0/16 ist der APIPA-Bereich. Erscheint so eine Adresse, war der DHCP-Server nicht erreichbar – ein klassisches Troubleshooting-Signal für ein Netzwerkproblem.', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 2, q: 'Welche VPN-Topologie verbindet zwei ganze Standorte dauerhaft miteinander?',
    a: ['Site-to-Site', 'End-to-End', 'End-to-Site', 'Broadcast-to-Broadcast'],
    r: 0, e: 'Site-to-Site verbindet zwei Netzwerke (z. B. Firmenstandorte) über einen Tunnel. End-to-Site bindet ein einzelnes Gerät an ein Netz an (typisch Homeoffice), End-to-End verbindet zwei Endgeräte direkt.', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 2, q: 'Welche Protokolle werden typischerweise für einen VPN-Tunnel verwendet?',
    a: ['IPsec und L2TP', 'HTTP und FTP', 'SMTP und POP3', 'SMB und NFS'],
    r: 0, e: 'Für VPN sind IPsec (Sicherung auf IP-Ebene) und L2TP (Tunnel) typisch, häufig kombiniert (L2TP/IPsec). OpenVPN und WireGuard sind moderne Alternativen. HTTP/FTP sind Anwendungsprotokolle.', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 2, q: 'Warum ist WEP für WLAN heute nicht mehr zu verwenden?',
    a: ['Es gilt als gebrochen und lässt sich in kurzer Zeit knacken – WPA2/WPA3 sind zu verwenden', 'Es ist zu langsam für moderne Geräte', 'Es funktioniert nur mit Kabel', 'Es unterstützt keine IP-Adressen'],
    r: 0, e: 'WEP ist kryptografisch gebrochen. Sicher sind WPA2 und WPA3. Unterschieden wird zwischen PSK (Pre-shared Key, für Zuhause/kleine Netze) und Enterprise (Anmeldung über einen RADIUS-Server, für Betriebe).', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 2, q: 'Was ist eine DMZ?',
    a: ['Eine abgeschirmte Pufferzone zwischen Internet und internem Netz für öffentlich erreichbare Server', 'Ein verschlüsselter Tunnel', 'Ein VLAN ohne IP-Adressen', 'Ein Ersatz für die Firewall'],
    r: 0, e: 'Die DMZ (Demilitarized Zone) liegt zwischen dem externen und dem internen Netz. Dort stehen Server, die aus dem Internet erreichbar sein müssen (Web-, Mailserver). Wird so einer kompromittiert, bleibt das interne Netz geschützt.', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 2, q: 'Welche Firewall-Art prüft den Verbindungszustand und lässt nur Antworten auf zuvor erlaubte Verbindungen durch?',
    a: ['Stateful Inspection Firewall', 'Packet Filter', 'Proxy (Application Layer)', 'Personal Firewall ohne Regeln'],
    r: 0, e: 'Eine Stateful-Inspection-Firewall führt eine Zustandstabelle und lässt nur erwartete Antwortpakete passieren. Ein reiner Packet Filter prüft nur einzelne Pakete nach Adresse/Port. Application-Layer-Firewalls (WAF/Proxy) prüfen zusätzlich Inhalte.', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 2, q: 'Wodurch unterscheiden sich IPv4 und IPv6?',
    a: ['IPv4 nutzt 32 Bit (etwa 4,3 Mrd. Adressen), IPv6 nutzt 128 Bit – dadurch praktisch unerschöpflich', 'IPv6 ist langsamer als IPv4', 'IPv4 arbeitet ohne Subnetzmaske', 'IPv6 ist eine Erweiterung der MAC-Adresse'],
    r: 0, e: 'IPv4 hat 32-Bit-Adressen (Punktnotation), IPv6 hat 128-Bit-Adressen (Hexadezimal mit Doppelpunkten) und vergrößert den Adressraum enorm. IPv6 bringt zusätzlich SLAAC (automatische Konfiguration) und ist heute in vielen Netzen parallel aktiv (Dual-Stack).', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 2, q: 'Ein Subnetz hat die Maske 255.255.255.192. Welche CIDR-Notation und wie viele nutzbare Hosts ergeben sich?',
    a: ['/26 mit 62 nutzbaren Hosts', '/24 mit 254 Hosts', '/27 mit 30 Hosts', '/25 mit 126 Hosts'],

  { t: 'ap1', b: 'netzwerk', j: 3, q: 'Was ist ein VLAN und welchen Zweck erfüllt es?',

  { t: 'ap1', b: 'netzwerk', j: 3, q: 'Welchen Vorteil bringt Virtualisierung in einem Serverumfeld?',

  { t: 'ap1', b: 'netzwerk', j: 1, q: 'Welche Aussage über Ethernet ist richtig?',

  { t: 'ap1', b: 'netzwerk', j: 1, q: 'Ein Dokument mit 12 MB soll über eine Leitung mit 24 Mbit/s übertragen werden. Wie lange dauert die Übertragung etwa?',

  { t: 'ap1', b: 'sicherheit', j: 1, q: 'Warum verschlüsselt ein Hash-Verfahren im Gegensatz zur Verschlüsselung nicht umkehrbar?',

  { t: 'ap1', b: 'sicherheit', j: 1, q: 'Was leistet Security by Design im Gegensatz zu Security by Default?',

  { t: 'ap1', b: 'sicherheit', j: 1, q: 'Warum sind Backups eine Maßnahme der Verfügbarkeit?',

const KARTEN = [
  { t: 'ap1', b: 'hardware', j: 1, f: 'Was ist eine USV?', a: '<p>Unterbrechungsfreie Stromversorgung (engl. UPS) – sichert angeschlossene Systeme bei Netzausfall.</p><p>Bei Unterbrechung oder Werten außerhalb des Toleranzbereichs versorgt sie sofort mit sauberem Strom und schützt vor Überspannungen.</p>', q_: 'USV' },
  { t: 'ap1', b: 'hardware', j: 1, f: 'Wirkleistung vs. Scheinleistung – Definition und Einheit', a: '<ul><li><b>Wirkleistung</b> (W): real verbrauchte Energie.</li><li><b>Scheinleistung</b> (VA): Spannung × Strom, also Wirk- plus Blindleistung.</li><li><b>Blindleistung</b>: pendelt zwischen Erzeuger und Verbraucher, wird nicht bezahlt – aber Kabel und USV müssen sie übertragen.</li></ul><p>Der VA-Wert ist immer ≥ dem Watt-Wert.</p>', q_: 'USV' },
  { t: 'ap1', b: 'hardware', j: 1, f: 'Formeln zur Umrechnung von Wirk- und Scheinleistung', a: '<p>Wirkleistung (W) = Scheinleistung (VA) × 0,65</p><p>Scheinleistung (VA) = Wirkleistung (W) × 1,55</p><p>Leistung (W) = Spannung U × Stromstärke I</p><p>Nutzungszeit (h) = Anzahl Akkus × Spannung je Akku × Ladung Ah ÷ Leistungsabnahme VA</p>', q_: 'USV' },
  { t: 'ap1', b: 'hardware', j: 1, f: 'Die drei USV-Bauarten und ihre Bezeichnungen', a: '<ul><li><b>VFD</b> – Voltage and Frequency Dependant → „Offline-USV", einfachste Art, schaltet bei Totalausfall auf Akku um.</li><li><b>VI</b> – Voltage Independant → „Netzinteraktiv-USV", schützt zusätzlich gegen Netzspannungsschwankungen.</li><li><b>VFI</b> – Voltage and Frequency Independant → „Online-USV", Dauerwandlerprinzip, keine Umschaltzeit, arbeitet immer über den Akku.</li></ul>', q_: 'USV' },
  { t: 'ap1', b: 'hardware', j: 1, f: 'Welche Punkte gehören in eine USV-Dimensionierung?', a: '<ol><li>Wirkleistung aller Verbraucher summieren (W).</li><li>Reserve von 20–25 % aufschlagen.</li><li>Scheinleistung über × 1,55 berechnen (VA).</li><li>Prüfen: Summe Watt ≤ max. USV-Watt und Summe VA ≤ max. USV-VA.</li><li>Autonomiezeit aus Akkukapazität ÷ Last berechnen.</li></ol>', q_: 'USV' },
  { t: 'ap1', b: 'hardware', j: 1, f: 'Welche Zeit überbrückt eine USV – und wofür?', a: '<p>Die Autonomiezeit wird so dimensioniert, dass kritische Systeme</p><ol><li>weiter mit Strom versorgt werden und</li><li>koordinierte Prozesse ablaufen können – z. B. Server-Shutdown, aktuelle Daten sichern.</li></ol><p>Je mehr Systeme angeschlossen sind, desto kürzer die Autonomiezeit.</p>', q_: 'USV' },
  { t: 'ap1', b: 'hardware', j: 1, f: 'Gleichrichter, Wechselrichter, Regler – Aufgabe?', a: '<ul><li><b>Gleichrichter / Ladegerät</b>: Wechselstrom → Gleichstrom (sitzt in jedem Ladegerät).</li><li><b>Wechselrichter</b>: Gleichstrom → Wechselstrom (macht aus Akkuspannung wieder Netzstrom).</li><li><b>Regler</b>: „säubert" Wechselstrom nach Wechselstrom.</li></ul>', q_: 'USV' },
  { t: 'ap1', b: 'hardware', j: 1, f: 'Netzfilter – Funktion und Aufbau', a: '<p>Begrenzt elektrische Störungen vom Gerät ins Netz und erhöht die Störfestigkeit gegen Netzschwankungen → verbessert die <b>EMV</b>.</p><p>Aufbau: Induktivitäten (Spulen) und Kondensatoren wirken zusammen als <b>Tiefpass</b> – niedrige Frequenzen passieren, hohe werden gedämpft.</p><p>Einsatz vor allem im Niederspannungsbereich: Computer, Fernseher, Netzteile.</p>', q_: 'USV' },
  { t: 'ap1', b: 'hardware', j: 1, f: 'Warum werden RAID-Systeme eingesetzt? (Grundprinzip)', a: '<p>RAID verteilt Daten über mehrere Festplatten, um <b>Ausfallsicherheit</b> und/oder <b>Geschwindigkeit</b> zu erhöhen.</p><ul><li>RAID 0: Striping, nur Geschwindigkeit, keine Redundanz.</li><li>RAID 1: Mirroring, Daten gespiegelt, halbe Nettokapazität.</li><li>RAID 5: Striping mit Parität, verträgt eine Platte Ausfall.</li><li>RAID 10: Mirroring + Striping, hohe Sicherheit und Leistung.</li></ul>', q_: 'RAID' },
  { t: 'ap1', b: 'hardware', j: 1, f: 'Nettokapazität: Wie viel nutzbarer Speicher bleibt bei RAID 1 und RAID 5 mit 4 × 2 TB?', a: '<p><b>RAID 1</b>: nur die Hälfte nutzbar → 4 × 2 TB ÷ 2 = <b>4 TB</b>.</p><p><b>RAID 5</b>: eine Platte geht für die Parität verloren → (4 − 1) × 2 TB = <b>6 TB</b>.</p>', q_: 'RAID' },

  { t: 'ap1', b: 'wirtschaft', j: 3, f: 'Das Schema der Handelskalkulation (Vorwärtskalkulation)', a: '<ol><li>Listeneinkaufspreis</li><li>− Lieferrabatt → Zieleinkaufspreis</li><li>− Lieferskonto → Bareinkaufspreis</li><li>+ Bezugskosten → Bezugspreis (Einstandspreis)</li><li>+ Handlungskosten → Selbstkosten</li><li>+ Gewinnzuschlag → Barverkaufspreis</li><li>+ Kundenskonto → Zielverkaufspreis</li><li>+ Kundenrabatt → Listenverkaufspreis (netto)</li><li>+ Umsatzsteuer → Bruttoverkaufspreis</li></ol>', q_: 'HK' },
  { t: 'ap1', b: 'wirtschaft', j: 3, f: '„Auf Hundert“ vs. „im Hundert“ – was ist der Unterschied?', a: '<ul><li><b>Auf Hundert</b> (vom Hundert): Der Prozentsatz wird auf den Ausgangswert aufgeschlagen → Betrag × (1 + p).</li><li><b>Im Hundert</b>: Der Prozentsatz steckt im Zielwert bereits drin → Betrag ÷ (1 − p).</li></ul><p>Typisch im Hundert: Kundenrabatt, Kundenskonto, Umsatzsteuer. Typisch auf Hundert: Lieferrabatt, Lieferskonto, Handlungskosten, Gewinn.</p>', q_: 'HK' },
