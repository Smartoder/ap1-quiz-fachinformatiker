  { t: 'ap1', b: 'wirtschaft', j: 3, f: 'Warum rechnet man Skonto und Rabatt „im Hundert“?', a: '<p>Weil sich Skonto und Rabatt auf den <b>späteren</b> Preis beziehen, der noch nicht bekannt ist.</p><p>Beispiel: Barverkaufspreis 225 € bei 3 % Skonto. 225 € entsprechen 97 %. Also 225 ÷ 97 × 100 = 231,96 € Zielverkaufspreis.</p><p>Falsch wäre 225 × 1,03 = 231,75 €.</p>', q_: 'HK' },
  { t: 'ap1', b: 'wirtschaft', j: 3, f: 'Vorwärts- und Rückwärtskalkulation – wo ist die richtige Bezugsbasis kritisch?', a: '<ul><li><b>Vorwärts</b>: kritisch bei <b>Kundenskonto und Kundenrabatt</b> (im Hundert).</li><li><b>Rückwärts</b>: kritisch bei <b>Lieferrabatt und Lieferskonto</b> – dort dreht sich die Rechenrichtung.</li></ul><p>Gegenprobe: Am Ende immer eine Vorwärtsrechnung durchführen.</p>', q_: 'HK' },
  { t: 'ap1', b: 'wirtschaft', j: 1, f: 'Innen- und Außenfinanzierung – was unterscheidet sie?', a: '<p>Kriterium ist die <b>Herkunft des Geldes</b>:</p><ul><li><b>Innenfinanzierung</b>: Mittel entstehen im Unternehmen – Einbehalt von Gewinnen, Rückstellungen, Abschreibungen, Vermögensumschichtungen.</li><li><b>Außenfinanzierung</b>: Mittel kommen von externen Geldgebern – Erhöhung der Einlagen, Neubeteiligungen, Kreditaufnahme, Factoring, Leasing.</li></ul>', q_: 'FIN' },
  { t: 'ap1', b: 'wirtschaft', j: 1, f: 'Eigenkapital oder Fremdkapital – die Merkmale', a: '<p><b>Eigenkapital</b>:</p><ul><li>fließt ins Eigenkapital, bleibt dauerhaft im Unternehmen</li><li>Geldgeber erhält Mitspracherechte und Gewinnbeteiligung</li><li>im Insolvenzfall haftet er meist mit der gesamten Einlage</li></ul><p><b>Fremdkapital</b>:</p><ul><li>steigert das Fremdkapital, steht befristet zur Verfügung</li><li>keine Mitspracherechte, dafür Zins- und Tilgungsanspruch</li></ul>', q_: 'FIN' },
  { t: 'ap1', b: 'wirtschaft', j: 1, f: 'Finanzierung aus Abschreibungen – Kapitalfreisetzungseffekt', a: '<p>Abschreibungen erscheinen als Aufwand in der GuV, führen aber zu <b>keinem</b> Geldabfluss. Die Mittel bleiben liquide im Unternehmen und senken zusätzlich Steuerlast und Ausschüttung.</p><p><b>Lohmann-Ruchti-Effekt</b> (Kapazitätserweiterungseffekt): Die freigesetzten Mittel werden sofort in zusätzliches Anlagevermögen reinvestiert – ohne Zuführung von Eigen- oder Fremdkapital.</p>', q_: 'FIN' },
  { t: 'ap1', b: 'wirtschaft', j: 1, f: 'Factoring und Leasing – kurz erklärt', a: '<p><b>Factoring</b>: Verkauf von Forderungen an einen Dienstleister. Das Unternehmen erhält den Großteil des Geldes vor dem Fälligkeitstermin. → Außenfinanzierung.</p><p><b>Leasing</b>: Das Objekt steht sofort zur Verfügung, ohne den vollen Kaufpreis. Es fallen Leasingraten an, der Leasinggeber verzichtet zunächst auf Geld. Nach Vertragsende meist Kaufoption zum Restwert.</p>', q_: 'FIN' },
  { t: 'ap1', b: 'wirtschaft', j: 1, f: 'Darlehen vs. Leasing – die Merkmale im Vergleich', a: '<p><b>Darlehen</b>: Darlehensbetrag, Zinssatz pro Jahr, Tilgungsbetrag pro Jahr, Laufzeit in Monaten, Sonderzahlung/Tilgung, Restschuld.</p><p><b>Leasing</b>: Leasingbetrag, eventuelle Anzahlung, Monatsrate (Rückzahlung, Abwicklung, Service, Wartung), Laufzeit, Rückgabe/Restwert, Instandsetzungs- und Reparaturbetrag.</p>', q_: 'FIN' },
  { t: 'ap1', b: 'wirtschaft', j: 1, f: 'Was ist eine Nutzwertanalyse und wie rechnet man sie?', a: '<ol><li>Kriterien festlegen.</li><li>Kriterien gewichten (Summe 100 %).</li><li>Anbieter je Kriterium bewerten (z. B. 1–10 Punkte).</li><li>Teilnutzen = Erfüllungsgrad × Gewichtung.</li><li>Teilnutzen je Anbieter summieren – höchster Wert gewinnt.</li></ol><p>Achtung: Der günstigste Preis muss nicht der höchste Nutzwert sein.</p>', q_: 'FIN' },
  { t: 'ap1', b: 'wirtschaft', j: 1, f: 'Break-even-Point – Formel und Bedeutung', a: '<p>Der Break-even-Point ist die Menge, bei der Erlös und Kosten gleich hoch sind – Gewinn also null.</p><p><b>Break-even-Menge = Fixkosten ÷ (Verkaufspreis − variable Kosten je Stück)</b></p><p>Der Nenner ist der <b>Deckungsbeitrag</b> je Stück. Unterhalb dieser Menge macht das Unternehmen Verlust.</p>', q_: 'FIN' },
  { t: 'ap1', b: 'wirtschaft', j: 1, f: 'Amortisation – wie berechnet man die Amortisationszeit?', a: '<p><b>Amortisationszeit = Anschaffungskosten ÷ jährliche Einsparung</b></p><p>Sie gibt an, nach wie vielen Jahren sich eine Investition bezahlt gemacht hat. Kürzere Zeit = geringeres Risiko. Bei Systemvergleichen oft das entscheidende Kriterium.</p>', q_: 'FIN' },
  { t: 'ap1', b: 'wirtschaft', j: 1, f: 'Zinsrechnung: Wie berechnet man Zinsen und Zinseszins?', a: '<p><b>Zinsen = Kapital × Zinssatz × Tage ÷ (100 × 360)</b> (kaufmännisch: 30 Tage je Monat, 360 Tage je Jahr)</p><p><b>Endkapital = Kapital × (1 + Zinssatz ÷ 100)ⁿ</b> bei jährlicher Verzinsung über n Jahre.</p><p>Beispiel: 5.000 € zu 4 % über 3 Jahre → 5.000 × 1,04³ = 5.624,32 €.</p>', q_: 'FIN' },
  { t: 'ap1', b: 'wirtschaft', j: 3, f: 'Stundensatz: Welche Bestandteile gehören in die Kalkulation?', a: '<ol><li>Jahresbruttogehalt inkl. Arbeitgeberanteil</li><li>+ Personalnebenkosten</li><li>+ Sachkosten (Arbeitsplatz, Werkzeug, Fahrzeug)</li><li>+ Gemeinkosten (Verwaltung, Miete)</li><li>= Gesamtkosten pro Jahr</li><li>÷ produktive Stunden im Jahr (Jahresarbeitszeit − Urlaub, Krankheit, Weiterbildung)</li><li>= Selbstkostensatz, + Gewinnzuschlag = Stundensatz</li></ol>', q_: 'HK' },
  { t: 'ap1', b: 'wirtschaft', j: 3, f: 'Differenzkalkulation – was macht man damit?', a: '<p>Man geht von einem <b>vorgegebenen Marktpreis</b> (Bruttoverkaufspreis) aus und rechnet rückwärts bis zum Selbstkostenpreis.</p><p>Vergleich mit den eigenen Selbstkosten zeigt die <b>Gewinndifferenz</b>: positiver Wert = Gewinn, negativer Wert = Verlust → Angebot ablehnen oder Konditionen verhandeln.</p>', q_: 'HK' },

  { t: 'ap1', b: 'datenbank', j: 1, f: 'Tabelle, Zeile, Spalte – die relationalen Fachbegriffe', a: '<ul><li>Tabelle = <b>Relation</b></li><li>Zeile = <b>Datensatz</b> / Tupel</li><li>Spalte = <b>Attribut</b></li></ul><p>Weitere Begriffe: Redundanz (Mehrfachspeicherung), Konsistenz (Widerspruchsfreiheit), referentielle Integrität (Fremdschlüssel verweist immer auf einen existierenden Datensatz).</p>', q_: 'DBG' },
  { t: 'ap1', b: 'datenbank', j: 1, f: 'Primärschlüssel und Fremdschlüssel – Definition', a: '<p><b>Primärschlüssel (PK)</b>: Attribut, das jeden Datensatz eindeutig identifiziert. Nie NULL, nie doppelt.</p><p><b>Fremdschlüssel (FK)</b>: Attribut, das auf den Primärschlüssel einer anderen Tabelle verweist und so die Beziehung herstellt.</p><p>In UML wird der PK mit <span style="font-family:var(--mono)">&lt;&lt;PK&gt;&gt;</span>, der FK mit <span style="font-family:var(--mono)">&lt;&lt;FK&gt;&gt;</span> gekennzeichnet.</p>', q_: 'DBG' },
  { t: 'ap1', b: 'datenbank', j: 1, f: 'Die drei Kardinalitäten und ihre Umsetzung', a: '<ul><li><b>1:1</b> – PK der einen Seite wird auch in der anderen geführt. Sinnvoll aus Datenschutz-, Performance- oder Strukturierungsgründen.</li><li><b>1:n</b> – PK der 1-Seite wandert als FK in die n-Seite.</li><li><b>m:n</b> – wird über eine Zwischentabelle mit den FKs beider Seiten in zwei 1:n aufgelöst.</li></ul>', q_: 'DBG' },
  { t: 'ap1', b: 'datenbank', j: 1, f: 'ER-Modell (Chen-Notation) vs. relationales Modell (UML)', a: '<p><b>ER-Modell / Chen</b>: Rechtecke = Entitäten, Ellipsen = Attribute, Rauten = Beziehungen, Linien mit Kardinalitäten (1, n, m). Fachliches Modell.</p><p><b>Relationales Modell / UML</b>: Tabellen als Rechtecke mit Spaltenliste, PK und FK gekennzeichnet, Kardinalitäten an den Verbindungslinien. Technisches Modell, direkt in SQL umsetzbar.</p>', q_: 'DBG' },
  { t: 'ap1', b: 'datenbank', j: 1, f: 'Welche Probleme entstehen ohne Datenbank (z. B. in Excel-Listen)?', a: '<ul><li><b>Redundanz</b>: dieselbe Information steht mehrfach.</li><li><b>Inkonsistenz</b>: die Kopien widersprechen sich.</li><li><b>Fehlende Datenunabhängigkeit</b>: Änderungen am Aufbau brechen Auswertungen.</li><li>Kein Mehrbenutzerbetrieb, keine Zugriffsrechte, keine Transaktionen.</li></ul>', q_: 'DBG' },
  { t: 'ap1', b: 'datenbank', j: 2, f: 'Was ist ein Schreibtischtest?', a: '<p>Ein Schreibtischtest prüft ein Modell oder einen Algorithmus <b>gedanklich mit konkreten Beispieldaten</b>, ohne es auszuführen.</p><p>Man geht Datensatz für Datensatz durch und kontrolliert, ob jede Beziehung und jeder Fremdschlüssel belegt werden kann. So findet man Lücken und Widersprüche, bevor die Datenbank gebaut wird.</p>', q_: 'NF' },
  { t: 'ap1', b: 'datenbank', j: 2, f: 'Der Design-Prozess einer Datenbank (7 Schritte)', a: '<ol><li>Ist-Zustand aufnehmen</li><li>Objekte/Entitäten identifizieren</li><li>Regeln und Beziehungen festlegen</li><li>Skizze des Modells anlegen</li><li>Kardinalitäten eintragen</li><li>Modell prüfen (Schreibtischtest)</li><li>Implementieren (CREATE TABLE)</li></ol>', q_: 'NF' },
  { t: 'ap1', b: 'datenbank', j: 2, f: 'Die drei Normalformen auf einen Blick', a: '<ul><li><b>1. NF</b>: Atomisierung – eine Zelle enthält genau einen Wert.</li><li><b>2. NF</b>: keine partiellen Abhängigkeiten – jedes Nicht-Schlüssel-Attribut hängt vom vollständigen (zusammengesetzten) Schlüssel ab.</li><li><b>3. NF</b>: keine transitiven Abhängigkeiten – kein Nicht-Schlüssel-Attribut hängt von einem anderen Nicht-Schlüssel-Attribut ab.</li></ul>', q_: 'NF' },
  { t: 'ap1', b: 'datenbank', j: 2, f: 'Warum normalisiert man? Ziel und Anomalien', a: '<p><b>Ziel</b>: Redundanz vermeiden und Anomalien verhindern.</p><p>Die drei Anomaliearten:</p><ul><li><b>Änderungsanomalie</b>: eine Änderung muss an mehreren Stellen nachgezogen werden.</li><li><b>Einfügeanomalie</b>: Daten können nicht erfasst werden, weil andere fehlen.</li><li><b>Löschanomalie</b>: Beim Löschen verschwinden ungewollt weitere Informationen.</li></ul>', q_: 'NF' },
  { t: 'ap1', b: 'datenbank', j: 2, f: 'Warum sollte der Primärschlüssel einfach gehalten werden?', a: '<p>Ein langer oder zusammengesetzter Primärschlüssel wird in jede referenzierende Tabelle übernommen und bläht die gesamte Datenbank auf.</p><p><b>Empfehlung</b>: ein künstlicher Integer-Schlüssel mit <span style="font-family:var(--mono)">AUTO_INCREMENT</span>. Fachliche Eindeutigkeit dann zusätzlich über <span style="font-family:var(--mono)">UNIQUE</span> absichern.</p>', q_: 'NF' },
  { t: 'ap1', b: 'datenbank', j: 2, f: 'SQL-Befehlsklassen: DDL, DML, DQL, DCL, TCL', a: '<ul><li><b>DDL</b> – Definition: CREATE, ALTER, DROP, TRUNCATE</li><li><b>DML</b> – Manipulation: INSERT, UPDATE, DELETE</li><li><b>DQL</b> – Abfrage: SELECT</li><li><b>DCL</b> – Rechte: GRANT, REVOKE</li><li><b>TCL</b> – Transaktionen: COMMIT, ROLLBACK</li></ul>', q_: 'DDL' },
  { t: 'ap1', b: 'datenbank', j: 2, f: 'CREATE TABLE mit Constraints – die wichtigsten', a: '<ul><li><span style="font-family:var(--mono)">PRIMARY KEY</span> – eindeutige Identifikation</li><li><span style="font-family:var(--mono)">FOREIGN KEY … REFERENCES</span> – Verweis auf andere Tabelle</li><li><span style="font-family:var(--mono)">NOT NULL</span> – Pflichtfeld</li><li><span style="font-family:var(--mono)">UNIQUE</span> – darf nur einmal vorkommen</li><li><span style="font-family:var(--mono)">AUTO_INCREMENT</span> – automatischer Zähler</li><li><span style="font-family:var(--mono)">DEFAULT</span> – Standardwert</li><li><span style="font-family:var(--mono)">CHECK</span> – Wertebereich einschränken</li></ul>', q_: 'DDL' },
  { t: 'ap1', b: 'datenbank', j: 2, f: 'DROP TABLE, TRUNCATE TABLE, DELETE – der Unterschied', a: '<ul><li><span style="font-family:var(--mono)">DROP TABLE</span>: löscht Tabelle samt Struktur. Weg ist weg.</li><li><span style="font-family:var(--mono)">TRUNCATE TABLE</span>: leert die Tabelle, Struktur bleibt. Schnell, kein WHERE möglich.</li><li><span style="font-family:var(--mono)">DELETE FROM</span>: löscht Zeilen, WHERE möglich. Ohne WHERE werden <b>alle</b> Zeilen gelöscht!</li></ul>', q_: 'DDL' },
  { t: 'ap1', b: 'datenbank', j: 2, f: 'ALTER TABLE – die vier Grundoperationen', a: '<ul><li><span style="font-family:var(--mono)">ADD COLUMN</span> – Spalte hinzufügen</li><li><span style="font-family:var(--mono)">MODIFY COLUMN</span> – Datentyp oder Eigenschaft ändern</li><li><span style="font-family:var(--mono)">DROP COLUMN</span> – Spalte entfernen</li><li><span style="font-family:var(--mono)">CHANGE / RENAME</span> – Spalte bzw. Tabelle umbenennen</li></ul>', q_: 'DDL' },
  { t: 'ap1', b: 'datenbank', j: 2, f: 'SELECT-Grundgerüst mit WHERE, ORDER BY, LIMIT', a: '<p><span style="font-family:var(--mono)">SELECT spalte, ausdruck AS alias<br>FROM tabelle<br>WHERE bedingung<br>ORDER BY spalte ASC|DESC<br>LIMIT anzahl;</span></p><p><b>Reihenfolge merken</b>: SELECT → FROM → WHERE → GROUP BY → HAVING → ORDER BY → LIMIT.</p>', q_: 'DQL' },
  { t: 'ap1', b: 'datenbank', j: 2, f: 'Aggregatfunktionen und GROUP BY / HAVING', a: '<p>Aggregatfunktionen: <span style="font-family:var(--mono)">COUNT, MIN, MAX, AVG, SUM</span></p><p><span style="font-family:var(--mono)">GROUP BY</span> fasst Zeilen mit gleichem Wert zusammen. Alle Spalten im SELECT müssen entweder gruppiert oder aggregiert sein.</p><p><span style="font-family:var(--mono)">HAVING</span> filtert die <b>Gruppen</b> – Aggregate gehören nie in WHERE, sondern immer in HAVING.</p>', q_: 'DQL' },
  { t: 'ap1', b: 'datenbank', j: 2, f: 'INNER JOIN vs. LEFT JOIN', a: '<ul><li><span style="font-family:var(--mono)">INNER JOIN</span>: nur Datensätze, die in <b>beiden</b> Tabellen vorkommen.</li><li><span style="font-family:var(--mono)">LEFT JOIN</span>: alle Datensätze der linken Tabelle, fehlende Partner werden NULL – z. B. „auch Kunden ohne Buchung anzeigen".</li></ul><p>Bei gleichnamigen Spalten immer Tabellenalias verwenden.</p>', q_: 'DQL' },
  { t: 'ap1', b: 'datenbank', j: 2, f: 'LIKE, IS NULL und logische Operatoren', a: '<ul><li><span style="font-family:var(--mono)">LIKE \'M%\'</span> – beginnt mit M</li><li><span style="font-family:var(--mono)">LIKE \'%er\'</span> – endet auf er</li><li><span style="font-family:var(--mono)">LIKE \'_a%\'</span> – zweites Zeichen ist a</li><li><span style="font-family:var(--mono)">IS NULL</span> / <span style="font-family:var(--mono)">IS NOT NULL</span> – NULL-Prüfung (nicht <span style="font-family:var(--mono)">= NULL</span>!)</li><li><span style="font-family:var(--mono)">AND, OR, NOT</span> – verknüpfen Bedingungen</li></ul>', q_: 'DQL' },
  { t: 'ap1', b: 'datenbank', j: 2, f: 'UNION vs. UNION ALL', a: '<p>Beide fügen die Ergebnisse zweier SELECTs zusammen. Voraussetzung: gleiche Spaltenzahl und kompatible Datentypen.</p><ul><li><span style="font-family:var(--mono)">UNION</span>: entfernt Duplikate, sortiert implizit.</li><li><span style="font-family:var(--mono)">UNION ALL</span>: behält alle Zeilen, schneller.</li></ul>', q_: 'DQL' },
  { t: 'ap1', b: 'datenbank', j: 2, f: 'SQL-Funktionen: Text, Zahl, Datum', a: '<ul><li><b>Zahl</b>: ROUND, FLOOR, CEILING, ABS, POWER, SQRT</li><li><b>Text</b>: LEFT, RIGHT, SUBSTR, CONCAT, UPPER, LOWER</li><li><b>Datum</b>: NOW(), CURRENT_DATE(), YEAR(), MONTH(), DAY(), WEEKDAY()</li></ul><p>Beispiel: <span style="font-family:var(--mono)">SUBSTR(\'Informatik\', 3)</span> ergibt „formatik".</p>', q_: 'DQL' },
  { t: 'ap1', b: 'datenbank', j: 2, f: 'Unterabfrage – typisches Muster', a: '<p>Eine Unterabfrage liefert einen Wert, mit dem die äußere Abfrage weiterarbeitet.</p><p><span style="font-family:var(--mono)">SELECT * FROM artikel<br>WHERE bruttovk = (SELECT MAX(bruttovk) FROM artikel);</span></p><p>So findet man den teuersten Artikel, ohne den Wert zu kennen. Im FROM-Teil braucht jede Unterabfrage einen Alias.</p>', q_: 'DQL' },
  { t: 'ap1', b: 'datenbank', j: 3, f: 'NoSQL: SQL-Begriffe ↔ MongoDB-Begriffe', a: '<ul><li>Datenbank → <b>Datenbank</b></li><li>Tabelle → <b>Collection</b></li><li>Zeile → <b>Dokument</b></li><li>Spalte → <b>Feld</b></li></ul><p>MongoDB-Befehle: <span style="font-family:var(--mono)">insertOne, insertMany, find, updateOne, deleteOne</span>; Operatoren wie <span style="font-family:var(--mono)">$gte</span> und <span style="font-family:var(--mono)">$set</span>.</p>', q_: 'NOS' },
  { t: 'ap1', b: 'datenbank', j: 3, f: 'JSON: Aufbau und warum es keine Datenbank ersetzt', a: '<p><b>Aufbau</b>: Objekte in geschweiften Klammern <span style="font-family:var(--mono)">{ }</span>, Listen in eckigen Klammern <span style="font-family:var(--mono)">[ ]</span>, dazu Schlüssel-Wert-Paare.</p><p><b>Keine echte DB</b>, weil Nebenläufigkeit, Transaktionen (ACID), referentielle Integrität, Mehrbenutzerzugriff und Zugriffskontrolle fehlen.</p>', q_: 'NOS' },
  { t: 'ap1', b: 'datenbank', j: 3, f: 'Backup und Restore in MariaDB', a: '<p><b>Sicherung</b>:<br><span style="font-family:var(--mono)">mariadb-dump.exe -u root -pXXX dbname &gt; c:\\sql\\backup.sql</span></p><p><b>Wiederherstellung</b>:<br><span style="font-family:var(--mono)">CREATE DATABASE dbname;</span><br><span style="font-family:var(--mono)">USE dbname;</span><br><span style="font-family:var(--mono)">SOURCE c:/sql/backup.sql;</span></p>', q_: 'NOS' },

  { t: 'ap1', b: 'netzwerk', j: 1, f: 'Subnetting: Wie rechnet man Host-Adressen aus?', a: '<p>Host-Bits = 32 − Präfixlänge.</p><p><b>Adressen im Subnetz</b> = 2^(Host-Bits)<br><b>Nutzbare Hosts</b> = 2^(Host-Bits) − 2 (Netz- und Broadcastadresse abziehen)</p><p>Beispiele: /24 → 254 Hosts, /25 → 126, /26 → 62, /27 → 30, /28 → 14, /29 → 6, /30 → 2.</p>', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 1, f: 'Subnetzmasken-Tabelle', a: '<ul><li>/24 → 255.255.255.0</li><li>/25 → 255.255.255.128</li><li>/26 → 255.255.255.192</li><li>/27 → 255.255.255.224</li><li>/28 → 255.255.255.240</li><li>/29 → 255.255.255.248</li><li>/30 → 255.255.255.252</li></ul><p>Die letzten drei Bit sind 11100000 = 224 bei /27.</p>', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 1, f: 'Was ist eine Subnetzmaske und wofür braucht man sie?', a: '<p>Die Subnetzmaske trennt den <b>Netzanteil</b> vom <b>Hostanteil</b> einer IP-Adresse.</p><p>Der Netzanteil ist bei allen Geräten im gleichen Subnetz identisch. Geräte erkennen daran, ob ein Ziel im eigenen Netz liegt (direkte Zustellung) oder über den Router gehen muss.</p>', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 1, f: 'Was ist ein VPN und wozu dient es?', a: '<p>Virtual Private Network – ein <b>verschlüsselter Tunnel</b> über ein unsicheres Netz (meist das Internet).</p><p>Die Teilnehmer kommunizieren, als wären sie im gleichen lokalen Netz. Einsatz: Homeoffice-Zugriff, Standortkopplung, Absicherung mobiler Geräte.</p>', q_: 'NW' },

  { t: 'ap1', b: 'sicherheit', j: 1, f: 'Verfügbarkeit: Wie rechnet man die Ausfallzeit aus?', a: '<p><b>Ausfallzeit = (100 % − Verfügbarkeit) × Zeitraum</b></p><p>Beispiel: 99,9 % im Jahr<br>0,1 % × 365 Tage × 24 h = 8,76 Stunden.</p><p>Übliche Stufen: 99 % ≈ 87,6 h/Jahr, 99,9 % ≈ 8,76 h, 99,99 % ≈ 52,6 min.</p>', q_: 'NW' },
  { t: 'ap1', b: 'sicherheit', j: 1, f: 'Datensicherheit vs. Datenschutz', a: '<p><b>Datensicherheit</b> (Safety/Security): Schutz der Daten selbst – Verfügbarkeit, Integrität, Vertraulichkeit. Gegen Verlust, Manipulation und unbefugten Zugriff.</p><p><b>Datenschutz</b>: Schutz der Person, auf die sich personenbezogene Daten beziehen. Rechtlich geregelt durch die DSGVO.</p>', q_: 'DBG' },
  { t: 'ap1', b: 'sicherheit', j: 1, f: 'ACID – die vier Eigenschaften einer Transaktion', a: '<ul><li><b>A</b>tomicity – ganz oder gar nicht</li><li><b>C</b>onsistency – die Datenbank bleibt konsistent</li><li><b>I</b>solation – parallele Transaktionen stören sich nicht</li><li><b>D</b>urability – nach COMMIT dauerhaft gespeichert</li></ul><p>Gegenmodell für verteilte Systeme: <b>BASE</b> (Basically Available, Soft state, Eventual consistency).</p>', q_: 'DBG' },

  { t: 'ap1', b: 'pm', j: 2, f: 'Netzplan: FAZ, FEZ, SAZ, SEZ, GP', a: '<ul><li><b>FAZ</b> – frühester Anfangszeitpunkt</li><li><b>FEZ</b> – frühester Endzeitpunkt = FAZ + Dauer</li><li><b>SEZ</b> – spätester Endzeitpunkt</li><li><b>SAZ</b> – spätester Anfangszeitpunkt = SEZ − Dauer</li><li><b>GP</b> – Gesamtpuffer = SAZ − FAZ</li></ul><p>Vorwärtsrechnung liefert FAZ/FEZ, Rückwärtsrechnung SAZ/SEZ.</p>', q_: 'PM' },
  { t: 'ap1', b: 'pm', j: 2, f: 'Kritischer Pfad – Definition und Bedeutung', a: '<p>Der <b>längste Weg</b> durch den Netzplan von Start bis Ende. Er bestimmt die kürzestmögliche Projektdauer.</p><p>Alle Vorgänge auf dem kritischen Pfad haben <b>Puffer 0</b>: FAZ = SAZ und FEZ = SEZ. Jede Verzögerung hier verzögert das ganze Projekt.</p>', q_: 'PM' },
  { t: 'ap1', b: 'pm', j: 2, f: 'Lastenheft vs. Pflichtenheft', a: '<ul><li><b>Lastenheft</b>: vom <b>Auftraggeber</b>. Beschreibt WAS gefordert ist – Ziele, Anforderungen, Rahmenbedingungen.</li><li><b>Pflichtenheft</b>: vom <b>Auftragnehmer</b>. Beschreibt WIE die Anforderungen umgesetzt werden – Lösungsweg, Technik, Aufwand.</li></ul><p>Eselsbrücke: Lasten = Auftraggeber trägt die Last der Anforderung.</p>', q_: 'PM' },
  { t: 'ap1', b: 'pm', j: 2, f: 'PDCA-Zyklus', a: '<ul><li><b>P</b>lan – planen</li><li><b>D</b>o – umsetzen</li><li><b>C</b>heck – überprüfen</li><li><b>A</b>ct – handeln / verbessern</li></ul><p>Demingkreis für kontinuierliche Verbesserung. Die Variante <b>PDSA</b> ersetzt „Check" durch „Study".</p>', q_: 'PM' },
  { t: 'ap1', b: 'pm', j: 2, f: 'Was leistet ein BPMN-Diagramm?', a: '<p>BPMN (Business Process Model and Notation) stellt <b>Geschäftsprozesse</b> standardisiert und für Fach- wie IT-Seite verständlich dar.</p><p>Grundelemente: Ereignis (Kreis), Aktivität (Rechteck), Gateway (Raute) für Verzweigungen, Sequenzfluss (Pfeil), Pools und Lanes für Verantwortlichkeiten.</p>', q_: 'PM' },
  { t: 'ap1', b: 'pm', j: 2, f: 'Was ist ein EPK (ereignisgesteuerte Prozesskette)?', a: '<p>Modell zur Darstellung von Geschäftsprozessen, das strikt zwischen <b>Ereignissen</b> (sechseckig) und <b>Funktionen</b> (abgerundetes Rechteck) abwechselt.</p><p>Verbindungselemente (Kreis mit +, ×, ∨) verknüpfen Verzweigungen: AND, XOR, OR.</p>', q_: 'PM' },

  { t: 'ap1', b: 'angebot', j: 1, f: 'Angebotsvergleich: Welche Kriterien zählen?', a: '<ul><li><b>Preis</b> (inkl. Nebenkosten, Rabatte, Skonto)</li><li><b>Qualität und Leistungsumfang</b></li><li><b>Lieferzeit</b> und Verfügbarkeit</li><li><b>Zahlungsbedingungen</b> und Fälligkeit</li><li><b>Gewährleistung und Service</b></li><li><b>Referenzen und Zuverlässigkeit</b></li><li><b>Energieeffizienz / Betriebskosten</b></li></ul>', q_: 'FIN' },
  { t: 'ap1', b: 'angebot', j: 1, f: 'Was gehört zwingend in ein Angebot?', a: '<ul><li>Leistungsumfang und Spezifikation</li><li>Preis und Nebenkosten</li><li>Liefer- und Zahlungsbedingungen</li><li>Liefertermin</li><li>Gewährleistung</li><li>Bindefrist des Angebots</li></ul><p>Fehlt einer dieser Punkte, ist ein Angebotsvergleich kaum möglich.</p>', q_: 'FIN' },
  { t: 'ap1', b: 'angebot', j: 1, f: 'Nutzwertanalyse – Rechenbeispiel', a: '<p>Kriterium „Leistung", Gewichtung 30 %, Anbieter A erfüllt zu 80 %:</p><p>Teilnutzen = 80 × 0,30 = <b>24 Punkte</b></p><p>Bei Skala 1–10: Erfüllung 8 Punkte × Gewichtung 3 = 24 Punkte. Über alle Kriterien summieren, dann vergleichen.</p>', q_: 'FIN' },
  { t: 'ap1', b: 'angebot', j: 1, f: 'Energiekosten eines Geräts – wie berechnet man sie?', a: '<p><b>Energiekosten = Leistung (kW) × Betriebsstunden × Strompreis (€/kWh)</b></p><p>Beispiel: 0,25 kW × 8 h/Tag × 250 Tage × 0,30 €/kWh = 150 €/Jahr.</p><p>Für die Amortisation: Mehrkosten der sparsameren Variante ÷ jährliche Einsparung.</p>', q_: 'FIN' },

  /* ===== Neu aus dem offiziellen Prüfungskatalog ===== */

  { t: 'ap1', b: 'kommunikation', j: 1, f: 'Das 4-Ohren-Modell von Schulz von Thun', a: '<p>Jede Nachricht hat vier Seiten, die der Empfänger auf vier „Ohren" hören kann:</p><ul><li><b>Sachebene</b> – der reine Inhalt („Das Licht ist grün.")</li><li><b>Appell</b> – was erreicht werden soll („Fahr los!")</li><li><b>Selbstoffenbarung</b> – was der Sender über sich verrät</li><li><b>Beziehung</b> – wie er zum Empfänger steht</li></ul><p>Missverständnisse entstehen, wenn Sender und Empfänger auf unterschiedlichen Ohren hören.</p>', q_: 'PK2' },
  { t: 'ap1', b: 'kommunikation', j: 1, f: 'Sender-Empfänger-Modell – die Bestandteile', a: '<p>Ein Sender <b>kodiert</b> eine Nachricht, überträgt sie über einen <b>Kanal</b> (Gespräch, Telefon, E-Mail), der Empfänger <b>dekodiert</b> sie.</p><p>Auf jeder Stufe können <b>Störungen</b> (Rauschen) auftreten. Deshalb ist die gesendete Nachricht nicht automatisch die verstandene.</p>', q_: 'PK2' },
  { t: 'ap1', b: 'kommunikation', j: 1, f: 'Fragetechnik im Kundenberatungsgespräch', a: '<ul><li><b>Offene Frage</b> („Was ist Ihnen wichtig?") – liefert die meisten Informationen</li><li><b>Geschlossene Frage</b> („Wünschen Sie Variante A?") – bestätigt, schränkt ein</li><li><b>Alternativfrage</b> – Wahl zwischen zwei Optionen (Abschlusstechnik)</li><li><b>Suggestivfrage</b> – manipulierend, zerstört Vertrauen</li></ul><p>Reihenfolge: erst öffnen (Bedarf ermitteln), dann schließen (Entscheidung herbeiführen).</p>', q_: 'PK2' },
  { t: 'ap1', b: 'kommunikation', j: 1, f: 'Marktformen: Monopol, Oligopol, Polypol', a: '<ul><li><b>Monopol</b> – ein Anbieter (große Marktmacht)</li><li><b>Oligopol</b> – wenige große Anbieter (Preisabsprachen möglich)</li><li><b>Polypol</b> – viele Anbieter (Preis entsteht durch Wettbewerb)</li></ul><p>Zusätzlich: <b>Käufermarkt</b> = Angebot > Nachfrage (Käufer verhandelt), <b>Verkäufermarkt</b> = Nachfrage > Angebot (Verkäufer bestimmt).</p>', q_: 'PK2' },
  { t: 'ap1', b: 'kommunikation', j: 1, f: 'Bedürfnis, Bedarf und Nachfrage – die Stufen', a: '<ul><li><b>Bedürfnis</b> – das reine Empfinden eines Mangels</li><li><b>Bedarf</b> – Bedürfnis, das mit Kaufkraft ausgestattet ist</li><li><b>Nachfrage</b> – Bedarf, der am Markt aktiv geäußert wird</li></ul><p>Merkhilfe: Jede Nachfrage ist ein Bedarf, jeder Bedarf ist ein Bedürfnis – aber nicht umgekehrt.</p>', q_: 'PK2' },
  { t: 'ap1', b: 'kommunikation', j: 1, f: 'Primär- und Sekundärforschung', a: '<ul><li><b>Primärforschung</b> (Feldforschung) – neue Daten selbst erheben: Befragung, Beobachtung, Experiment, Testmarkt.</li><li><b>Sekundärforschung</b> (Schreibtischforschung) – vorhandene Daten nutzen: interne Statistiken, Kammern, Verbände, Studien.</li></ul><p>Sekundär ist günstiger und schneller, aber oft weniger passgenau und älter.</p>', q_: 'PK2' },
  { t: 'ap1', b: 'kommunikation', j: 1, f: 'Zielgruppendefinition und -abgrenzung', a: '<p>Eine <b>Zielgruppe</b> ist die Teilmenge möglicher Kunden, die mit gemeinsamen Merkmalen gezielt angesprochen wird.</p><p>Merkmale: Branche, Unternehmensgröße, Standort/Region, Bedarf, Kaufverhalten, Budget.</p><p>Eine zu breite Zielgruppe streut die Mittel, eine zu enge verschenkt Potenzial.</p>', q_: 'PK2' },
  { t: 'ap1', b: 'kommunikation', j: 1, f: 'Was Präsentationen im Prüfungskontext leisten müssen', a: '<p>PK-02 fordert „Präsentation und Medienkompetenz". Qualitätsmerkmale:</p><ul><li>klare Gliederung: Einstieg – Kern – Fazit</li><li>zielgruppengerechte Sprache, Fachbegriffe nur mit Erklärung</li><li>Visualisierung statt Textwüsten (wenige Punkte je Folie)</li><li>eine klare Kernbotschaft je Folie</li><li>Medienkompetenz: passendes Medium wählen und sicher bedienen</li></ul><p>Auch der Umgang mit <b>englischsprachigen</b> Texten ist ausdrücklich Pflichtstoff.</p>', q_: 'PK2' },

  { t: 'ap1', b: 'vertrag', j: 2, f: 'Vertragsarten im Überblick (PK-07)', a: '<ul><li><b>Kaufvertrag</b> – Ware gegen Geld, Eigentum geht über</li><li><b>Mietvertrag</b> – Gebrauchsüberlassung gegen Entgelt, befristet</li><li><b>Leasing</b> – Nutzung gegen Raten, Eigentum bleibt beim Leasinggeber</li><li><b>Lizenzvertrag</b> – Nutzungsrecht an Software, kein Eigentum</li><li><b>Servicevertrag / SLA</b> – laufende Betreuung mit messbaren Zeiten</li><li><b>Werkvertrag</b> – geschuldet wird ein <b>Erfolg</b></li><li><b>Dienstvertrag</b> – geschuldet wird die <b>Tätigkeit</b></li></ul>', q_: 'PK7' },
  { t: 'ap1', b: 'vertrag', j: 2, f: 'Werkvertrag vs. Dienstvertrag – die Prüfungsfalle', a: '<p><b>Werkvertrag:</b> Geschuldet wird ein bestimmter <b>Erfolg</b>. Bezahlt wird erst nach Abnahme des Werkes. Beispiel: eine funktionsfähige Anwendung entwickeln.</p><p><b>Dienstvertrag:</b> Geschuldet wird die <b>Tätigkeit</b> als solche – der Erfolg ist nicht garantiert. Bezahlt wird die Arbeitsleistung. Beispiel: laufende Systembetreuung, Beratung.</p>', q_: 'PK7' },
  { t: 'ap1', b: 'vertrag', j: 2, f: 'Service Level Agreement (SLA) – was gehört hinein?', a: '<ul><li><b>Reaktionszeit</b> – bis zur ersten Rückmeldung</li><li><b>Wiederherstellungszeit</b> – bis zur Behebung</li><li><b>Verfügbarkeit</b> – z. B. 99,9 % im Jahr</li><li><b>Servicezeiten</b> – z. B. Mo–Fr 8–18 Uhr, oder 24/7</li><li><b>Eskalationsstufen</b> und Ansprechpartner</li><li><b>Sanktionen</b> bei Nichteinhaltung</li></ul><p>Ohne messbare Werte ist ein SLA nicht überprüfbar.</p>', q_: 'PK7' },
  { t: 'ap1', b: 'vertrag', j: 2, f: 'Die drei Mängelarten bei der Leistungsübergabe', a: '<ul><li><b>Schlechtleistung</b> – die richtige Sache, aber mangelhaft (Kratzer am Notebook)</li><li><b>Falschlieferung</b> (aliud) – eine andere Sache als bestellt (Tablet statt Notebook)</li><li><b>Minderlieferung</b> – zu wenig Menge (8 statt 10 Stück)</li></ul><p>Davon zu trennen ist der <b>Verzug</b>: die Leistung kommt zu spät. PK-07 verlangt ausdrücklich die Unterscheidung.</p>', q_: 'PK7' },
  { t: 'ap1', b: 'vertrag', j: 2, f: 'Inhalt eines Abnahmeprotokolls', a: '<ul><li>Datum und Ort</li><li>Beteiligte Personen</li><li>Prüfgegenstand und Umfang</li><li>Festgestellte Mängel und deren Fristen</li><li>Ergebnis: Abnahme erteilt, unter Vorbehalt oder verweigert</li><li>Unterschriften beider Seiten</li></ul><p>Das Protokoll weist die Leistung nach, begründet die Zahlungspflicht und sichert Ansprüche.', q_: 'PK7' },
  { t: 'ap1', b: 'vertrag', j: 2, f: 'Aufbauorganisationen im Vergleich', a: '<ul><li><b>Einliniensystem</b> – jede Stelle hat genau <b>einen</b> Vorgesetzten. Klare Zuständigkeit, aber lange Wege.</li><li><b>Mehrliniensystem</b> – mehrere fachliche Vorgesetzte. Kurze Wege, aber Kompetenzüberschneidungen.</li><li><b>Matrixorganisation</b> – fachliche und projektbezogene Leitung gleichzeitig. Flexibel, aber Konfliktpotenzial.</li></ul><p>Dazu: Handlungs- und Entscheidungsspielräume/Vollmachten. Das Stabliniensystem ist <b>nicht</b> PK-Pflicht.</p>', q_: 'PK7' },
  { t: 'ap1', b: 'vertrag', j: 2, f: 'Veränderungsprozesse begleiten – die vier Stakeholder-Typen', a: '<ul><li><b>Promoter</b> – treibt die Veränderung aktiv voran (Verbündeter)</li><li><b>Bremser</b> – hält still zurück, blockiert im Verborgenen (Beobachter)</li><li><b>Skeptiker</b> – zweifelt, will Argumente und Beweise</li><li><b>Widerständler</b> – lehnt offen ab</li></ul><p>Ursachen von Widerstand (PK-07): Angst vor Kompetenzverlust, Wissenslücken, persönliche Historie. Gegenmittel: Mitarbeiterqualifizierung (Blended-Learning, Multiplikatoren), Einbeziehung, Chancen betonen.</p>', q_: 'PK7' },
  { t: 'ap1', b: 'vertrag', j: 2, f: 'Soll-Ist-Vergleich, Abweichungsanalyse, Nachkalkulation', a: '<p><b>Soll-Ist-Vergleich:</b> geplante Werte (Soll) den tatsächlichen (Ist) gegenüberstellen.</p><p><b>Abweichungsanalyse:</b> Ursachen der Abweichung ermitteln – warum wurde es teurer, später, anders?</p><p><b>Nachkalkulation:</b> die tatsächlich angefallenen Kosten vollständig nachrechnen und mit der Vorkalkulation vergleichen.</p><p>Ergebnis: <b>Lessons Learned</b> und Ansatzpunkte für Nachfolgeaufträge.</p>', q_: 'PK7' },
  { t: 'ap1', b: 'vertrag', j: 2, f: 'Leistungserbringung: vor Ort, Remote und mit Kundenvorgaben', a: '<p><b>Vor Ort:</b> nötig bei Hardwaretausch, Verkabelung, Schulung. Höhere Kosten, direkter Kundenkontakt.</p><p><b>Remote:</b> über VPN oder Remote-Desktop. Schnell, günstig, sofort verfügbar – aber abhängig von der Verbindung.</p><p><b>Kundenvorgaben</b> (PK-07): Termin und Erfüllungsort, technische Voraussetzungen (Betriebssystem, Hersteller), Einhaltung des Budgets.</p>', q_: 'PK7' },
  { t: 'ap1', b: 'vertrag', j: 2, f: 'Was bedeutet Konventionalstrafe?', a: '<p>Eine <b>vertraglich vereinbarte</b> Geldstrafe für den Fall, dass eine Vertragspflicht nicht oder verspätet erfüllt wird.</p><p>Sie wird vorab in den Vertrag aufgenommen und muss angemessen sein – sie darf nicht allein dem Druckaufbau dienen. Sie gehört zu den Vertragsbestandteilen neben Leistungsbeschreibung, Terminen und Entgelten.</p>', q_: 'PK7' },
  { t: 'ap1', b: 'vertrag', j: 1, f: 'Wann kommt ein Kaufvertrag zustande?', a: '<p>Ein Kaufvertrag entsteht durch <b>zwei übereinstimmende Willenserklärungen</b>: Angebot und Annahme.</p><p><b>Wichtig für die Prüfung:</b> Die <b>Bestellung</b> des Kunden ist rechtlich bereits das <b>Angebot</b>. Die Auftragsbestätigung des Verkäufers ist die <b>Annahme</b>. Zahlung und Lieferung sind nur die Erfüllung – nicht die Entstehung.</p>', q_: 'FIN' },
  { t: 'ap1', b: 'vertrag', j: 2, f: 'Ökonomische, ökologische und soziale Unternehmensziele', a: '<p>PK-07 fordert, Ziele aus dem Leitbild zu entnehmen. Drei Dimensionen:</p><ul><li><b>Ökonomisch</b> – Umsatz, Gewinn, Rentabilität, Marktanteil</li><li><b>Ökologisch</b> – Ressourcenschonung, Energieverbrauch, Recycling, Nachhaltigkeit</li><li><b>Sozial</b> – Arbeitsbedingungen, Weiterbildung, Vereinbarkeit von Beruf und Familie</li></ul><p>Diese drei zusammen bilden die Grundlage der Nachhaltigkeitsbetrachtung.</p>', q_: 'PK7' },
  { t: 'ap1', b: 'vertrag', j: 1, f: 'Was ist Wertschöpfung?', a: '<p><b>Wertschöpfung = Wert der erbrachten Leistung − Wert der zugekauften Vorleistungen</b></p><p>Sie zeigt, welchen Wertzuwachs das Unternehmen selbst erzeugt – also welchen Anteil der Endleistung nicht nur durchgehandelt, sondern selbst hergestellt wurde. PK-03 nennt Wertschöpfung im Themenkreis Wirtschaftlichkeit.</p>', q_: 'PK3' },

  { t: 'ap1', b: 'recht', j: 1, f: 'Die drei Schutzziele der Informationssicherheit (PK-Stand)', a: '<ul><li><b>Vertraulichkeit</b> – nur Befugte haben Zugang</li><li><b>Integrität</b> – Daten sind unverfälscht und vollständig</li><li><b>Verfügbarkeit</b> – Systeme und Daten sind nutzbar, wenn sie gebraucht werden</li></ul><p><b>Achtung Prüfungsfalle:</b> Der offizielle Katalog nennt nur diese <b>drei</b>. Authentizität kommt in vielen Lehrbüchern als viertes Schutzziel dazu, ist im PK-Pflichtstoff aber nicht aufgeführt.</p>', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, f: 'Schutzbedarfsanalyse nach BSI IT-Grundschutz', a: '<p>Für vier <b>Objekt-Kategorien</b>: Anwendungen, IT-Systeme, Räume/Infrastruktur, Kommunikationsverbindungen.</p><p>Bewertet wird je Schutzziel mit den Kategorien <b>normal, hoch, sehr hoch</b> – und zwar getrennt für Verfügbarkeit, Vertraulichkeit und Integrität, jeweils mit Begründung.</p><p>Grundlage ist der BSI IT-Grundschutz-Katalog mit seinen Bausteinen.</p>', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, f: 'Datenschutzbeauftragter vs. IT-Sicherheitsbeauftragter', a: '<ul><li><b>Datenschutzbeauftragter</b> – überwacht die Einhaltung von DSGVO und BDSG, ist weisungsfrei, arbeitet für den Schutz <b>personenbezogener</b> Daten.</li><li><b>IT-Sicherheitsbeauftragter</b> – verantwortet die <b>Informationssicherheit insgesamt</b>, also auch nicht-personenbezogene Systeme, Netze und Anlagen.</li></ul><p>PK-06 verlangt die Unterscheidung der beiden Rollen.</p>', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, f: 'Personenbezogene Daten – was fällt darunter?', a: '<p>Alle Informationen, die sich auf eine <b>identifizierte oder identifizierbare natürliche Person</b> beziehen.</p><p>Dazu gehören auch: Name, Adresse, Geburtsdatum, Kundennummer, IP-Adresse, Standortdaten, Kennzeichen, Personalnummer, Foto – sobald ein Personenbezug herstellbar ist.</p><p>Der Begriff ist sehr weit gefasst; die Zuordenbarkeit genügt.</p>', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, f: 'Anonymisierung vs. Pseudonymisierung', a: '<p><b>Pseudonymisierung:</b> Der Name wird ersetzt, aber mit Zusatzwissen ist der Bezug wiederherstellbar. Die DSGVO gilt <b>weiter</b>.</p><p><b>Anonymisierung:</b> Der Personenbezug ist endgültig und irreversibel aufgehoben. Die DSGVO gilt <b>nicht mehr</b>.</p><p>Beide sind in PK-06 als Maßnahmen ausdrücklich genannt.</p>', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, f: 'Grundsätze der DSGVO-Verarbeitung', a: '<ul><li><b>Rechtmäßigkeit, Verarbeitung nach Treu und Glauben, Transparenz</b></li><li><b>Zweckbindung</b> – nur für den festgelegten Zweck</li><li><b>Datenminimierung</b> – so wenig Daten wie möglich</li><li><b>Richtigkeit</b> – Daten müssen korrekt sein</li><li><b>Speicherbegrenzung</b> – nur so lange wie nötig</li><li><b>Integrität und Vertraulichkeit</b></li><li><b>Rechenschaftspflicht</b> – Nachweisbarkeit</li></ul>', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, f: 'Rechte der Betroffenen (DSGVO)', a: '<ul><li><b>Auskunft</b> – welche Daten werden verarbeitet?</li><li><b>Berichtigung</b> unrichtiger Daten</li><li><b>Löschung</b> („Vergessenwerden")</li><li><b>Einschränkung</b> der Verarbeitung</li><li><b>Datenübertragbarkeit</b></li><li><b>Widerspruch</b> gegen die Verarbeitung</li></ul><p>Betroffene müssen über diese Rechte informiert werden – meist über eine Datenschutzerklärung.</p>', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, f: 'Technisch-organisatorische Maßnahmen (TOM) – die Kontrollarten', a: '<ul><li><b>Zutrittskontrolle</b> – wer kommt in den Serverraum?</li><li><b>Zugangskontrolle</b> – wer darf die IT-Systeme nutzen?</li><li><b>Zugriffskontrolle</b> – wer darf welche Daten sehen/ändern?</li><li><b>Weitergabekontrolle</b> – wer darf Daten übertragen?</li><li><b>Eingabekontrolle</b> – wer hat wann was eingegeben?</li><li><b>Verfügbarkeitskontrolle</b> – Schutz gegen Verlust und Ausfall</li><li><b>Trennungskontrolle</b> – Daten müssen nach Zweck getrennt werden</li></ul>', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, f: 'Symmetrische, asymmetrische und hybride Verschlüsselung', a: '<ul><li><b>Symmetrisch</b> – ein gemeinsamer Schlüssel für beide Richtungen (AES, DES). Schnell, aber Schlüsselverteilung ist das Problem.</li><li><b>Asymmetrisch</b> – Schlüsselpaar: öffentlich zum Verschlüsseln, privat zum Entschlüsseln (RSA). Löst die Schlüsselverteilung, ist aber langsam.</li><li><b>Hybrid</b> – über asymmetrisch wird ein Sitzungsschlüssel ausgetauscht, die Nutzdaten laufen symmetrisch (TLS). Sicher <b>und</b> schnell.</li></ul><p>PK-06 fordert ausdrücklich alle drei.</p>', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, f: 'Hashwert, Zertifikat und digitale Signatur', a: '<p><b>Hashwert:</b> Eine Prüfsumme fester Länge aus beliebigen Daten. Nicht umkehrbar, extrem kollisionsresistent – schon eine kleine Änderung ergibt einen völlig anderen Wert. Prüft die <b>Integrität</b>.</p><p><b>Zertifikat:</b> Bestätigt die Echtheit eines öffentlichen Schlüssels und damit die Identität des Inhabers – ausgestellt von einer Zertifizierungsstelle (CA).</p><p><b>Digitale Signatur:</b> Der Hashwert der Nachricht wird mit dem <b>privaten</b> Schlüssel des Senders verschlüsselt. Nachweisbar sind Integrität und Authentizität.</p>', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, f: 'Backup-Verfahren im Vergleich', a: '<ul><li><b>Vollsicherung</b> – alles wird gesichert. Einfachste Rücksicherung, größter Speicherbedarf und längste Dauer.</li><li><b>Differenziell</b> – alle Änderungen <b>seit der letzten Vollsicherung</b>. Rücksicherung braucht Voll + letzte Differenz.</li><li><b>Inkrementell</b> – alle Änderungen <b>seit der letzten Sicherung überhaupt</b>. Sparsamster Speicher, aber alle Sicherungen werden zur Rücksicherung gebraucht.</li></ul><p>Goldene Regel: <b>3-2-1</b> – drei Kopien, zwei Medien, eine davon extern.</p>', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, f: 'Security by Design und Security by Default', a: '<p><b>Security by Design:</b> Sicherheit wird schon beim <b>Entwurf</b> mitgedacht – nicht nachträglich angeflanscht. Bestandteil der Architektur.</p><p><b>Security by Default:</b> Die <b>ab Werk</b> voreingestellte Konfiguration ist bereits sicher: unnötige Dienste aus, Standardpasswörter müssen geändert werden, Verschlüsselung aktiv.</p><p>Beide Begriffe sind in PK-06 ausdrücklich genannt.</p>', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, f: 'Zwei-Faktor-Authentifizierung – die drei Faktorkategorien', a: '<ul><li><b>Wissen</b> – etwas, das man weiß (Passwort, PIN)</li><li><b>Besitz</b> – etwas, das man hat (Token, Smartcard, App/Handy)</li><li><b>Biometrie</b> – etwas, das man ist (Fingerabdruck, Gesicht, Iris)</li></ul><p>Echte 2FA kombiniert zwei <b>verschiedene</b> Kategorien. Benutzername + Passwort sind beide „Wissen" und damit nur <b>ein</b> Faktor.</p>', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, f: 'Anforderungen an eine Passwort-Policy', a: '<ul><li>ausreichende Länge (heute mindestens 12 Zeichen)</li><li>Zeichen aus mehreren Kategorien (Groß-, Kleinbuchstaben, Ziffern, Sonderzeichen)</li><li>keine Wiederverwendung für verschiedene Dienste</li><li>regelmäßiger Wechsel und Sperrung nach Fehlversuchen</li><li>Nutzung eines Passwortmanagers, niemals Zettel am Monitor</li></ul><p>Die Policy macht Anforderungen nachvollziehbar – Auditoren fragen sie regelmäßig ab.</p>', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, f: 'Wozu ein ISMS?', a: '<p>Ein <b>Informations-Sicherheitsmanagementsystem</b> ist kein Produkt, sondern ein Managementsystem: Es legt Sicherheitsziele, Verantwortlichkeiten, Maßnahmen und Prüfverfahren fest und verbessert sie kontinuierlich (PDCA).</p><p>International standardisiert in der <b>ISO/IEC 27001</b>. PK-06 verlangt, das ISMS zu kennen und zu unterstützen.</p>', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, f: 'Urheberrecht: Was ist geschützt und wie lange?', a: '<p>Geschützt sind Werke aus Literatur, Wissenschaft und Kunst – dazu zählen auch <b>Software</b>, Texte, Bilder, Grafiken, Musik und Datenbanken.</p><p>Der Schutz entsteht <b>automatisch</b> mit der Schöpfung; ein Copyright-Zeichen ist nicht nötig. In Deutschland gilt die Schutzfrist bis <b>70 Jahre nach dem Tod des Urhebers</b>.</p>', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, f: 'Was bedeutet Härtung eines Betriebssystems?', a: '<p>Das System wird auf ein sicheres Mindestmaß reduziert:</p><ul><li>unnötige Dienste und Ports deaktivieren</li><li>Software aktuell halten (Schwachstellen schließen)</li><li>Standardkonten ändern bzw. sperren</li><li>Rechte nach dem Minimalprinzip vergeben</li><li>Firewall und Virenschutz konfigurieren</li><li>Logging und Protokollauswertung aktivieren</li></ul><p>PK-06 nennt „Härtung Betriebssystem" ausdrücklich.</p>', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, f: 'Warum ist NAS eine Verfügbarkeitsmaßnahme?', a: '<p>Ein <b>NAS</b> (Network Attached Storage) stellt zentralen Speicher im Netz bereit – meist mit mehreren Platten (RAID) und damit gegen den Ausfall einzelner Platten geschützt.</p><p>Es dient als Ablage-, Sicherungs- und Versionierungsziel und sichert damit die <b>Verfügbarkeit</b> der Daten. PK-06 nennt NAS ausdrücklich als Maßnahme zur Sicherung der Verfügbarkeit.</p>', q_: 'PK6' },

  { t: 'ap1', b: 'software', j: 2, f: 'Compiler, Interpreter und Linker', a: '<ul><li><b>Compiler</b> – übersetzt den gesamten Quellcode vorab in Maschinencode. Schnell zur Laufzeit, aber Änderungen erfordern Neukompilieren.</li><li><b>Interpreter</b> – liest und führt den Code Anweisung für Anweisung aus. Flexibel, plattformunabhängig, langsamer.</li><li><b>Linker</b> – verbindet übersetzte Objektdateien und Bibliotheken zu einer ausführbaren Datei und löst Verweise auf.</li></ul>', q_: 'PK4' },
  { t: 'ap1', b: 'software', j: 2, f: 'Die drei Grundprinzipien der OOP', a: '<ul><li><b>Kapselung</b> – Daten sind nur über definierte Methoden zugänglich; Innenleben bleibt verborgen.</li><li><b>Vererbung</b> – Unterklassen übernehmen Attribute und Methoden der Oberklasse.</li><li><b>Polymorphie</b> – derselbe Aufruf verhält sich je nach Objekt unterschiedlich.</li></ul><p>Dazu die Sichtbarkeit: <span style="font-family:var(--mono)">public</span>, <span style="font-family:var(--mono)">protected</span>, <span style="font-family:var(--mono)">private</span>.</p>', q_: 'PK4' },
  { t: 'ap1', b: 'software', j: 2, f: 'Pseudocode und Kontrollstrukturen', a: '<p><b>Pseudocode</b> beschreibt einen Algorithmus sprachunabhängig in an Programmiersprachen angelehnter Notation – nicht ausführbar, aber eindeutig.</p><p>Die zwei geforderten <b>Kontrollstrukturen</b>:</p><ul><li><b>Verzweigung</b> – if / else / switch</li><li><b>Schleife</b> – for (Zählschleife), while (kopfgesteuert), do-while (fußgesteuert, mindestens ein Durchlauf)</li></ul>', q_: 'PK4' },
  { t: 'ap1', b: 'software', j: 2, f: 'UML-Diagramme im AP1-Katalog', a: '<ul><li><b>Anwendungsfalldiagramm</b> (Use Case) – Akteure und ihre Funktionen, Systemumfang. <i>Kam in AP1 mehrfach vor.</i></li><li><b>Klassendiagramm</b> – Klassen mit Attributen, Methoden, Sichtbarkeit und Beziehungen.</li><li><b>Aktivitätsdiagramm</b> – Ablauf von Arbeitsschritten mit Verzweigungen und Parallelität. <i>Neu in AP1.</i></li></ul><p>Nicht in AP1 gefordert: Sequenz- und Zustandsdiagramm (aber in AP2 möglich).</p>', q_: 'PK4' },
  { t: 'ap1', b: 'software', j: 2, f: 'Schreibtischtest – Vorgehen', a: '<ol><li>Konkrete Beispieldaten wählen (inklusive Randfälle: Null, negativ, Maximum).</li><li>Den Code oder Algorithmus Zeile für Zeile gedanklich durchgehen.</li><li>Nach jedem Schritt die aktuelle Variablenbelegung in einer Tabelle notieren.</li><li>Ergebnis mit dem erwarteten Wert vergleichen.</li></ol><p>Ziel: Logik- und Randfehler finden, <b>bevor</b> das Programm läuft. In AP1 2024 und 2025 abgefragt.</p>', q_: 'PK4' },
  { t: 'ap1', b: 'software', j: 2, f: 'Lizenzarten: EULA, OEM, GNU', a: '<ul><li><b>EULA</b> – End User License Agreement; regelt Nutzungsumfang, Anzahl Geräte, Übertragbarkeit, Verbote.</li><li><b>OEM</b> – an ein neues Gerät gebunden, günstiger, nicht auf andere Rechner übertragbar.</li><li><b>GNU GPL</b> – freie Lizenz mit Copyleft: nutzen, ändern, weitergeben erlaubt; abgeleitete Werke müssen wieder unter GPL stehen (Quellcodeoffenlegung).</li><li><b>Pay-per-Use</b> – Abrechnung nach tatsächlicher Nutzung.</li></ul>', q_: 'PK4' },
  { t: 'ap1', b: 'software', j: 2, f: 'Standardsoftware, Individualsoftware, Open Source', a: '<ul><li><b>Standardsoftware</b> – fertig für viele Kunden: günstig, schnell verfügbar, erprobt. Nachteil: passt nicht immer zum Prozess.</li><li><b>Individualsoftware</b> – für einen Bedarf neu entwickelt. Passgenau, aber teuer, langwierig, wartungsintensiv.</li><li><b>Open Source</b> – Quellcode offen und veränderbar. Nicht automatisch kostenlos (Support kostet).</li><li><b>Proprietär</b> – Quellcode geschlossen, Änderungen und Weitergabe verboten.</li></ul>', q_: 'PK4' },
  { t: 'ap1', b: 'software', j: 2, f: 'Geräteklassen für Arbeitsplätze', a: '<ul><li><b>Desktop</b> – ortsfest, gut aufrüstbar, bestes Preis-Leistungs-Verhältnis</li><li><b>All-in-One</b> – Rechner im Monitor, platzsparend, wenig aufrüstbar</li><li><b>Notebook</b> – mobil, aber teurer und schlechter aufrüstbar</li><li><b>Thin Client</b> – kaum eigene Rechenleistung, alles über Terminalserver; günstig, zentral administrierbar, energiesparend</li><li><b>Tablet / Smartphone</b> – mobil, für spezielle Anwendungen</li></ul><p>Barrierefreiheit ggf. über Zusatzhardware: größerer Monitor, breitere Tastatur, Lautsprecher/Mikrofon.</p>', q_: 'PK4' },
  { t: 'ap1', b: 'software', j: 2, f: 'Dateisysteme: NTFS, APFS, ext4, FAT32', a: '<ul><li><b>NTFS</b> – Windows: Rechteverwaltung, Journaling, große Dateien</li><li><b>ext4</b> – Linux-Standard, Journaling, sehr große Volumes</li><li><b>APFS</b> – macOS, optimiert für SSD, Snapshots, Verschlüsselung</li><li><b>FAT32</b> – herstellerübergreifend, aber auf 4 GB pro Datei begrenzt</li></ul><p>PK-04 nennt genau diese vier Beispiele als Lernstoff.</p>', q_: 'PK4' },
  { t: 'ap1', b: 'software', j: 2, f: 'BIOS und UEFI – Unterschied und Einstellungen', a: '<p><b>UEFI</b> ersetzt das klassische BIOS: schnellerer Start, Unterstützung von <b>GPT</b> und Datenträgern über 2 TB, grafische Oberfläche, Mausbedienung, Secure Boot.</p><p>Typische Einstellungen: Boot-Reihenfolge, Datum/Uhrzeit, Aktivierung/Deaktivierung von Schnittstellen, Virtualisierung, Passwortschutz, Secure Boot.</p><p>PK-04 nennt Einstellungsmöglichkeiten in BIOS und UEFI ausdrücklich.</p>', q_: 'PK4' },
  { t: 'ap1', b: 'software', j: 2, f: 'Konsolenbefehle für Dateioperationen und Netzwerk', a: '<p><b>Dateien:</b> <span style="font-family:var(--mono)">dir</span>/<span style="font-family:var(--mono)">ls</span> (auflisten), <span style="font-family:var(--mono)">mkdir</span> (erstellen), <span style="font-family:var(--mono)">cp</span>/<span style="font-family:var(--mono)">copy</span> (kopieren), <span style="font-family:var(--mono)">del</span> (löschen), <span style="font-family:var(--mono)">chmod</span> (Rechte setzen), <span style="font-family:var(--mono)">alias</span> (Kurzname).</p><p><b>Netzwerk:</b> <span style="font-family:var(--mono)">ipconfig</span>/<span style="font-family:var(--mono)">ifconfig</span>/<span style="font-family:var(--mono)">ip</span> (Konfiguration), <span style="font-family:var(--mono)">ping</span> (Erreichbarkeit), <span style="font-family:var(--mono)">traceroute</span> (Weg), <span style="font-family:var(--mono)">nslookup</span> (DNS), <span style="font-family:var(--mono)">arp</span> (MAC-Zuordnung).</p>', q_: 'PK4' },
  { t: 'ap1', b: 'software', j: 2, f: 'IDE, Debugger und Fehlerarten', a: '<p>Eine <b>IDE</b> bündelt Editor, Compiler/Interpreter, Debugger, Projektverwaltung und Versionskontrolle.</p><p>Der <b>Debugger</b> führt das Programm schrittweise aus, erlaubt Haltepunkte (Breakpoints) und zeigt Variablenwerte zur Laufzeit.</p><p><b>Fehlerarten:</b> <b>formale</b> Fehler (Syntax, findet der Compiler) und <b>inhaltliche</b> Fehler (Logik, findet nur der Test) – PK-04 nennt beide.</p>', q_: 'PK4' },
  { t: 'ap1', b: 'software', j: 1, f: 'Cloud-Modelle und virtuelle Desktops', a: '<ul><li><b>IaaS</b> – Infrastruktur: virtuelle Server, Speicher, Netze</li><li><b>PaaS</b> – Plattform: Laufzeitumgebung und Dienste für eigene Anwendungen</li><li><b>SaaS</b> – Software: fertige Anwendungen im Browser</li><li><b>DaaS / virtueller Desktop</b> – das Betriebssystem läuft auf einem Server, der Nutzer greift von überall zu</li></ul><p>Vorteile virtueller Desktops: zentrale Administration, Daten bleiben im Rechenzentrum, Geräteunabhängigkeit. PK-03 nennt virtuelle Desktops als Neuerung.</p>', q_: 'PK3' },
  { t: 'ap1', b: 'software', j: 1, f: 'Standard-, Branchen- und Systemsoftware', a: '<ul><li><b>Standardsoftware</b> – breit einsetzbar: Office, Browser, DBMS</li><li><b>Branchensoftware</b> – für eine Sparte: ERP (Unternehmensressourcen), CRM (Kundenbeziehungen), SCM (Lieferkette)</li><li><b>Systemsoftware</b> – Betriebssystem, Treiber, Dienstprogramme</li><li><b>Entwicklungssysteme</b> – Compiler, Interpreter, virtuelle Maschinen, Editoren, Debugger</li></ul><p>Alle vier Gruppen sind in PK-03 ausdrücklich aufgezählt.</p>', q_: 'PK3' },
  { t: 'ap1', b: 'software', j: 1, f: 'Ergonomie am Bildschirmarbeitsplatz', a: '<ul><li>Bildschirmoberkante etwa auf Augenhöhe, Neigung leicht nach hinten</li><li>Sehabstand rund 50–80 cm</li><li>Sitzhöhe so, dass Ober- und Unterschenkel etwa einen rechten Winkel bilden</li><li>Unterarme waagerecht, Handgelenke gerade</li><li>blendfreie Beleuchtung, keine Reflexionen</li><li>Bewegungspausen und regelmäßiger Haltungswechsel</li></ul><p>PK-03 nennt Ergonomie als funktionalen und gesundheitlichen Beurteilungsaspekt.</p>', q_: 'PK3' },
  { t: 'ap1', b: 'software', j: 1, f: 'Energieeffizienz und Green IT in der Beschaffung', a: '<p>Beurteilungskriterien (PK-03):</p><ul><li>Energieverbrauch im Betrieb (auch Standby)</li><li>Langlebigkeit und Aufrüstbarkeit → längere Nutzungsdauer</li><li>Recyclingfähigkeit der Materialien</li><li>Schadstofffreiheit (RoHS)</li><li>Gütesiegel wie <b>Energy Star</b> oder Blauer Engel</li></ul><p>Die offizielle Beispielaufgabe verlangt genau diese Begründung, wenn ein Kunde einer GreenIT-Initiative beigetreten ist.</p>', q_: 'PK3' },

  { t: 'ap1', b: 'qs', j: 1, f: 'Qualitätsmanagement: Normen, Zertifizierung, QM-System', a: '<ul><li><b>QM-System</b> – die Gesamtheit aller Regelungen, mit denen ein Betrieb Qualität sichert</li><li><b>QS-Norm</b> – z. B. <b>ISO 9001</b>: Anforderungen an ein QM-System. DIN EN ISO 9000 ist die Begriffsfamilie.</li><li><b>Zertifizierung</b> – ein unabhängiger Prüfer bestätigt, dass das QM-System die Norm erfüllt. Zertifiziert wird das <b>System</b>, nicht das einzelne Produkt.</li></ul><p>PK-05 fordert zu diesen Begriffen nur ein <b>Grundverständnis</b>.</p>', q_: 'PK5' },
  { t: 'ap1', b: 'qs', j: 1, f: 'Qualitätsplanung vs. Qualitätslenkung', a: '<p><b>Qualitätsplanung:</b> Ist-Zustand ermitteln und Ziel-Zustand festlegen. Welche Qualität wird gebraucht, welche Merkmale sind messbar, welches Ziel ist erreichbar?</p><p><b>Qualitätslenkung:</b> die Umsetzungsphase – die Prozesse werden so gesteuert, dass der geplante Ziel-Zustand erreicht wird.</p><p>Grundlage ist PDCA: Plan (Planung) → Do (Lenkung) → Check → Act.</p>', q_: 'PK5' },
  { t: 'ap1', b: 'qs', j: 1, f: 'Testprotokoll beim Einrichten eines Arbeitsplatzes', a: '<p>Das Testprotokoll hält nachvollziehbar fest:</p><ul><li>Prüfgegenstand und Umfang (Hardware, Netzwerk, Drucker, Software)</li><li>durchgeführte Prüfungen mit Datum</li><li>Ergebnis je Prüfung (bestanden / nicht bestanden)</li><li>festgestellte Mängel und Maßnahmen</li><li>durchführende Person und Unterschrift</li></ul><p>Es ist Prüfungsnachweis, Abnahmegrundlage und Beleg gegenüber dem Kunden.</p>', q_: 'PK5' },
  { t: 'ap1', b: 'qs', j: 1, f: 'Qualitätssicherungsmaßnahmen – typische Beispiele', a: '<ul><li><b>Vier-Augen-Prinzip</b> bei kritischen Schritten</li><li><b>Testprotokolle</b> und Checklisten</li><li><b>Peer-Review</b> von Konfigurationen und Code</li><li><b>Revisionen und Audits</b> in festen Abständen</li><li><b>Regelmäßige Schulungen</b> und Einweisungen</li><li><b>Fehlermeldesystem</b> mit Auswertung</li><li><b>KVP / PDCA</b> als kontinuierliche Verbesserung</li></ul><p>PK-05 verlangt, QS-Maßnahmen projektbegleitend durchzuführen und zu dokumentieren.</p>', q_: 'PK5' },

  { t: 'ap1', b: 'pm', j: 1, f: 'Projektmanagement: Ziele, Phasen, Rollen', a: '<ul><li><b>Merkmale eines Projekts</b>: einmalig, klar begrenzt, definiertes Ziel, Zeit- und Budgetrahmen, eigenes Team</li><li><b>SMART</b> als Zielprüfung: spezifisch, messbar, attraktiv/akzeptiert, realistisch, terminiert</li><li><b>Phasen</b>: Initialisierung – Planung – Durchführung – Abschluss (Wasserfall), bzw. Sprints (Scrum)</li><li><b>Meilenstein</b>: terminierbares Ereignis ohne Dauer</li></ul>', q_: 'PK1' },
  { t: 'ap1', b: 'pm', j: 1, f: 'Netzplan (PSP) vs. Gantt-Diagramm', a: '<p><b>Netzplan:</b> Knoten und Pfeile, zeigt <b>Abhängigkeiten</b>, früheste/späteste Termine, Puffer und den kritischen Pfad. Ideal zur Terminberechnung.</p><p><b>Gantt-Diagramm:</b> Balken über einer Zeitachse. Leicht lesbar und gut für die Kommunikation, aber schwächer bei Abhängigkeiten.</p><p><b>Projektstrukturplan:</b> hierarchische Zerlegung in Teilaufgaben und Arbeitspakete – Grundlage für Aufwand und Termine.</p>', q_: 'PK1' },
  { t: 'ap1', b: 'pm', j: 1, f: 'Machbarkeitsanalyse und Budgetvorgabe', a: '<p>Geprüft wird die Realisierbarkeit in mehreren Dimensionen:</p><ul><li><b>technisch</b> – ist es umsetzbar?</li><li><b>wirtschaftlich</b> – passt es in die Budgetvorgabe? Vor- und Nachkalkulation</li><li><b>rechtlich</b> – ist es zulässig?</li><li><b>terminlich</b> – ist der Zeitrahmen realistisch?</li><li><b>personell</b> – sind die Ressourcen verfügbar?</li></ul><p>Dazu gehört die Beurteilung des Einflusses der <b>Stakeholder</b> und eine Risikoanalyse.</p>', q_: 'PK1' },
  { t: 'ap1', b: 'pm', j: 1, f: 'Wasserfallmodell vs. Scrum', a: '<p><b>Wasserfallmodell:</b> strikt sequenziell – Analyse, Entwurf, Umsetzung, Test, Einführung. Klar planbar und gut dokumentierbar, aber Änderungen sind teuer und der Kunde sieht spät ein Ergebnis.</p><p><b>Scrum:</b> iterativ in kurzen <b>Sprints</b> (2–4 Wochen). Rollen: Product Owner, Scrum Master, Development Team. Ereignisse: Sprint Planning, Daily, Review, Retrospektive. Änderungen sind eingeplant, der Kunde sieht früh Ergebnisse.</p>', q_: 'PK1' },
  { t: 'ap1', b: 'pm', j: 1, f: 'Teamentwicklung: Phasen und Reflexion', a: '<p><b>Phasen nach Tuckman:</b> Forming (Orientierung) – Storming (Konflikte) – Norming (Regeln) – Performing (Leistung).</p><p><b>Reflexionsmethoden</b> (PK-01): Feedback-Kultur, Lessons Learned, Retrospektive. Ziel ist nicht Schuldzuweisung, sondern die Verbesserung der Arbeitsprozesse.</p><p>Nach der Performing-Phase kann eine Auflösungsphase (Adjourning) folgen.</p>', q_: 'PK1' },
  { t: 'ap1', b: 'pm', j: 1, f: 'Support-Ebenen: First, Second, Third Level', a: '<ul><li><b>First-Level</b> – erste Anlaufstelle: annahme, Erfassung, Klassifizierung, Lösung von Standardfällen. Größte Menge, kleinste Komplexität.</li><li><b>Second-Level</b> – Spezialisten für komplexere Fälle, die der First-Level nicht lösen kann.</li><li><b>Third-Level</b> – Hersteller oder Entwicklung, bei grundlegenden Produktfehlern.</li></ul><p>Ziel ist die Entlastung der höheren Ebene – „so tief wie nötig, so niedrig wie möglich".</p>', q_: 'PK1' },
  { t: 'ap1', b: 'pm', j: 1, f: 'Ticketsystem – Nutzen und typischer Ablauf', a: '<ol><li>Erfassung der Anfrage (per Mail, Telefon, Portal)</li><li>eindeutige Ticketnummer</li><li>Klassifizierung und <b>Priorisierung</b></li><li>Zuordnung zum Bearbeiter</li><li>Bearbeitung mit Dokumentation</li><li>Rückmeldung an den Kunden, Statusverfolgung</li><li>Abschluss und Auswertung</li></ol><p>Nutzen: Nachvollziehbarkeit, Auswertbarkeit (Häufigkeiten, Bearbeitungszeiten), keine verlorenen Anfragen. PK-01 nennt es zusammen mit KI-Unterstützung.</p>', q_: 'PK1' },
  { t: 'ap1', b: 'pm', j: 1, f: 'Verfügbarkeit in Prozent – die Ausfallzeiten', a: '<p>Bezugsgröße: 8.760 Stunden pro Jahr.</p><ul><li><b>99 %</b> ≈ 87,6 h/Jahr (3,65 Tage)</li><li><b>99,5 %</b> ≈ 43,8 h/Jahr</li><li><b>99,9 %</b> ≈ 8,76 h/Jahr</li><li><b>99,99 %</b> ≈ 52,6 min/Jahr</li></ul><p>Formel: Ausfallzeit = (100 % − Verfügbarkeit) × Zeitraum. Werte gehören immer in ein SLA mit definiertem Zeitraum.</p>', q_: 'PK1' },

  /* ---------- KI, ML & Deep Learning ---------- */
  { t: 'ap1', b: 'ki', j: 1, f: 'KI, ML und DL – die Hierarchie', a: '<p>Es gilt: <b>KI ⊃ ML ⊃ DL</b>.</p><ul><li><b>Künstliche Intelligenz (KI)</b>: Oberbegriff – Systeme, die Aufgaben „intelligent" lösen. Umfasst auch regelbasierte Systeme.</li><li><b>Maschinelles Lernen (ML)</b>: Teilgebiet der KI – lernt Muster aus Daten, ohne explizit programmiert zu werden.</li><li><b>Deep Learning (DL)</b>: Subfeld des ML – nutzt tiefe neuronale Netze mit vielen Schichten.</li></ul>', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 1, f: 'Was ist maschinelles Lernen?', a: '<p>Ein Teilgebiet der KI, in dem Algorithmen aus Beispieldaten statistische Zusammenhänge lernen, statt dass der Lösungsweg durch feste Regeln vorgegeben wird.</p><p>Man unterscheidet vor allem überwachtes, unüberwachtes und bestärkendes Lernen.</p>', q_: 'ML' },
  { t: 'ap1', b: 'ki', j: 1, f: 'Was ist Deep Learning?', a: '<p>Ein Teilbereich des maschinellen Lernens, der <b>tiefe neuronale Netze</b> mit vielen Schichten verwendet.</p><p>Es automatisiert die Merkmalsextraktion (Feature Engineering) und eignet sich für <b>große, unstrukturierte Datenmengen</b> – Bilder, Sprache, Text. Beispiele: Bild- und Spracherkennung, Übersetzung.</p>', q_: 'DL' },
  { t: 'ap1', b: 'ki', j: 1, f: 'Was ist ein künstliches Neuron?', a: '<p>Eine Verarbeitungseinheit: Sie bildet die gewichtete Summe ihrer Eingaben, addiert den Bias und leitet das Ergebnis durch eine Aktivierungsfunktion.</p><p style="font-family:var(--mono)">z = Σ (xᵢ · wᵢ) + b&nbsp;&nbsp;→&nbsp;&nbsp;a = f(z)</p>', q_: 'DL' },
  { t: 'ap1', b: 'ki', j: 1, f: 'Welche Schichten hat ein neuronales Netz?', a: '<ul><li><b>Eingabeschicht</b> – nimmt die Merkmale auf.</li><li><b>Verborgene Schichten</b> – verarbeiten und kombinieren die Signale (mehrere = „tief").</li><li><b>Ausgabeschicht</b> – liefert das Ergebnis (z. B. Klasse oder Wert).</li></ul>', q_: 'DL' },
  { t: 'ap1', b: 'ki', j: 1, f: 'Aktivierungsfunktionen: ReLU und Sigmoid', a: '<p><b>ReLU</b>: f(z) = max(0, z) – negative Werte werden 0, positive bleiben. Beliebt in tiefen Netzen, da die Gradienten nicht „verschwinden".</p><p><b>Sigmoid</b>: presst das Ergebnis auf einen Wert zwischen 0 und 1 – früher Standard, neigt aber zum Vanishing Gradient.</p>', q_: 'DL' },
  { t: 'ap1', b: 'ki', j: 1, f: 'Backpropagation – in fünf Schritten', a: '<ol><li>Gewichte und Bias zufällig initialisieren.</li><li>Vorwärtspropagation: Eingaben durch die Schichten leiten.</li><li>Fehler berechnen (Vorhersage vs. Zielwert).</li><li>Fehler rückwärts führen und Gewichte anpassen.</li><li>Wiederholen, bis das Modell konvergiert.</li></ol><p>Die <b>Lernrate</b> bestimmt, wie stark jede Anpassung ausfällt.</p>', q_: 'DL' },
  { t: 'ap1', b: 'ki', j: 1, f: 'Das Perzeptron', a: '<p>Das Ur-Modell eines künstlichen Neurons, vorgestellt <b>1957 von Frank Rosenblatt</b>. Es kombiniert Eingaben mit Gewichten und vergleicht die Summe mit einem Schwellenwert.</p><p>Es kann nur <b>linear trennbare</b> Probleme lösen – das XOR-Problem (Minsky/Papert 1969) führte zur ersten „KI-Winter"-Phase. Mehrschichtige Netze mit Backpropagation überwanden diese Grenze.</p>', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 1, f: 'Überwachtes Lernen', a: '<p>Lernen mit <b>gelabelten</b> Daten: zu jeder Eingabe ist die gewünschte Ausgabe (Label, Ground Truth) bekannt.</p><p>Typische Aufgaben: <b>Klassifikation</b> (Spam/Nicht-Spam) und <b>Regression</b> (Hauspreis). Algorithmen: lineare/logistische Regression, Entscheidungsbaum, SVM, neuronale Netze.</p>', q_: 'ML' },
  { t: 'ap1', b: 'ki', j: 1, f: 'Unüberwachtes Lernen', a: '<p>Lernen mit <b>unbeschrifteten</b> Daten: Es gibt keine Labels, das Modell entdeckt selbst Strukturen.</p><p>Typische Aufgaben: <b>Clustering</b> (Kundensegmente, K-Means) und <b>Dimensionsreduktion</b>. Ein Maß für die Clusterqualität ist der Silhouette-Score.</p>', q_: 'ML' },
  { t: 'ap1', b: 'ki', j: 1, f: 'Bestärkendes Lernen (Reinforcement Learning)', a: '<p>Ein <b>Agent</b> lernt durch Versuch und Irrtum. Für gute Aktionen gibt es eine <b>Belohnung</b>, für schlechte eine Bestrafung.</p><p>Ziel ist es, die Belohnung über die Zeit zu maximieren. Beispiele: Spiele, Robotik, autonome Systeme.</p>', q_: 'ML' },
  { t: 'ap1', b: 'ki', j: 1, f: 'K-Means – Ablauf', a: '<ol><li>Anzahl k festlegen und k Startzentroide wählen.</li><li>Jeden Punkt dem nächsten Zentroiden zuordnen.</li><li>Zentroiden als Mittelwert ihrer Punkte neu berechnen.</li><li>Wiederholen, bis die Zentroiden stabil bleiben.</li></ol><p>Die optimale Clusterzahl findet man oft über einen <b>Elbow-Plot</b> (Knick in der Kurve).</p>', q_: 'ML' },
  { t: 'ap1', b: 'ki', j: 1, f: 'Dendrogramm und Linkage-Methoden', a: '<p><b>Dendrogramm</b>: Baumdiagramm des hierarchischen Clusterings. Die vertikale Achse zeigt die Verschmelzungsdistanz.</p><p><b>Linkage</b>: <b>Single</b> = nächste Punkte, <b>Complete</b> = weiteste Punkte, <b>Average</b> = mittlerer Abstand aller Punktpaare.</p>', q_: 'ML' },
  { t: 'ap1', b: 'ki', j: 1, f: 'Distanzmaße: euklidisch und Manhattan', a: '<p><b>Euklidische Distanz</b>: „Luftlinie" zwischen zwei Punkten – vor allem bei metrischen Daten.</p><p><b>Manhattan-Distanz</b> (City-Block, L1): Summe der absoluten Koordinaten-Differenzen. Beispiel P1(4,5), P2(20,2): |20−4| + |2−5| = 16 + 3 = 19.</p><p>Weil Distanzmaße auf absoluten Werten beruhen, müssen Merkmale mit verschiedenen Einheiten vorher normiert werden.</p>', q_: 'ML' },
  { t: 'ap1', b: 'ki', j: 1, f: 'Entscheidungsbaum – Anatomie', a: '<ul><li><b>Wurzelknoten</b> – oberster Knoten, enthält den gesamten Datensatz.</li><li><b>Entscheidungsknoten</b> – prüft ein Merkmal und teilt den Datenstrom.</li><li><b>Blattknoten</b> – Endpunkt mit dem Ergebnis (Klasse oder Wert).</li></ul><p>Der Baum entsteht durch rekursive Partitionierung (Splitting). Ziel ist reine Teilmengen (Purity).</p>', q_: 'ML' },
  { t: 'ap1', b: 'ki', j: 1, f: 'Entscheidungsbaum: Entropie, Gini und Pruning', a: '<p><b>Entropie</b> misst die Unordnung; der <b>Informationsgewinn</b> ist die Abnahme der Entropie durch einen Split.</p><p><b>Gini-Index</b>: Wahrscheinlichkeit einer Fehlklassifikation; recheneffizienter als die Entropie (CART).</p><p><b>Pruning</b> gegen Overfitting: Pre-Pruning (früh stoppen, z. B. Tiefe begrenzen) und Post-Pruning (fertigen Baum nachträglich kürzen).</p>', q_: 'ML' },
  { t: 'ap1', b: 'ki', j: 1, f: 'Random Forest – Grundidee', a: '<p>Ein <b>Ensemble</b> aus vielen Entscheidungsbäumen. Jeder Baum wird auf einer <b>Bootstrap-Stichprobe</b> (mit Zurücklegen) trainiert und wählt pro Split eine zufällige Merkmalsmenge (Feature Bagging).</p><p>Ergebnis per <b>Mehrheitsvotum</b> (Klassifikation) oder <b>Mittelwert</b> (Regression). Das reduziert die Varianz und mindert Overfitting einzelner Bäume.</p>', q_: 'ML' },
  { t: 'ap1', b: 'ki', j: 2, f: 'Support Vector Machine (SVM)', a: '<p>Ein überwachter Klassifikationsalgorithmus. Er sucht die <b>Hyperplane</b> mit dem größten Abstand (<b>Margin</b>) zu den nächstgelegenen Punkten – den <b>Support Vectors</b>.</p><p>Für nichtlineare Daten hilft der <b>Kernel-Trick</b>: Die Daten werden implizit in einen höherdimensionalen Raum transformiert (z. B. RBF-Kernel).</p>', q_: 'ML' },
  { t: 'ap1', b: 'ki', j: 2, f: 'Evaluationsmetriken aus der Confusion Matrix', a: '<p>Grundlage: TP (richtig positiv), FP (falsch positiv), TN (richtig negativ), FN (falsch negativ).</p><ul><li><b>Accuracy</b> = (TP+TN) ÷ Gesamtzahl</li><li><b>Precision</b> = TP ÷ (TP+FP)</li><li><b>Recall</b> = TP ÷ (TP+FN)</li><li><b>F1</b> = harmonisches Mittel aus Precision und Recall</li></ul>', q_: 'ML' },
  { t: 'ap1', b: 'ki', j: 2, f: 'Overfitting und Underfitting', a: '<p><b>Overfitting</b>: Das Modell lernt die Trainingsdaten zu genau (inkl. Rauschen) und generalisiert schlecht.</p><p><b>Underfitting</b>: Das Modell ist zu einfach und erfasst das Muster nicht.</p><p>Gegenmaßnahmen: mehr Daten, Kreuzvalidierung, Regularisierung (Dropout, L2), Pruning, kürzere Trainingszeit.</p>', q_: 'ML' },
  { t: 'ap1', b: 'ki', j: 2, f: 'Vorgehen zur Entwicklung eines KI-Modells', a: '<ol><li>Daten sammeln</li><li>Daten vorverarbeiten (bereinigen, normalisieren)</li><li>Feature-Engineering (relevante Merkmale)</li><li>Modell trainieren</li><li>Evaluieren (Testdaten, Metriken)</li><li>Deployment (produktiver Einsatz)</li></ol><p>Im ML übernimmt der Mensch das Feature-Engineering, im DL erledigt das Netz es selbst.</p>', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 2, f: 'Warum braucht Deep Learning große Datenmengen und GPUs?', a: '<p><b>Datenmenge</b>: Viele Schichten haben viele Parameter – ohne genügend Beispiele droht Overfitting.</p><p><b>GPUs</b>: Das Training besteht aus sehr vielen parallelisierbaren Matrixoperationen. GPUs führen Tausende davon gleichzeitig aus.</p><p>Die Trainingszeit von DL liegt typischerweise bei Stunden bis Wochen, im klassischen ML bei Sekunden bis Stunden.</p>', q_: 'DL' },
  { t: 'ap1', b: 'ki', j: 2, f: 'Klassifikation vs. Regression', a: '<p><b>Klassifikation</b>: weist <b>diskrete Klassen</b> zu – Spam/Nicht-Spam, Tierart, Kredit ja/nein. Formen: binär, Multi-Class, Multi-Label.</p><p><b>Regression</b>: sagt einen <b>kontinuierlichen Zahlenwert</b> voraus – Hauspreis, Umsatz, Temperatur.</p>', q_: 'ML' },
  { t: 'ap1', b: 'ki', j: 3, f: 'Ethik der KI – typische Risiken', a: '<ul><li><b>Algorithmische Verzerrung (Bias)</b>: Vorurteile aus den Trainingsdaten.</li><li><b>Black Box / mangelnde Transparenz</b>: Entscheidungen sind nicht nachvollziehbar.</li><li><b>Datenschutz</b>: personenbezogene Daten – DSGVO beachten.</li><li><b>Regulierung</b>: der EU Artificial Intelligence Act ordnet KI nach Risikostufen ein.</li></ul>', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 1, f: 'Was ist generative KI (GenAI)?', a: '<p>KI, die <b>neue Inhalte erzeugt</b> – Text, Bilder, Audio oder Code.</p><p>Grundlage sind große neuronale Netze, die aus sehr vielen Beispielen Muster gelernt haben. Beispiele: Sprachmodelle (LLM) für Text, Diffusionsmodelle für Bilder.</p>', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 1, f: 'Was ist ein LLM?', a: '<p><b>Large Language Model</b> – ein großes Sprachmodell, ein neuronales Netz, das auf riesigen Textmengen trainiert wurde.</p><p>Es sagt die wahrscheinlichste Fortsetzung eines Textes voraus und „versteht" dadurch Sprache. Es kann plausibel klingen und trotzdem falsch sein (<b>Halluzination</b>).</p>', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 1, f: 'Prompt und Prompting', a: '<p><b>Prompt</b>: die Eingabe bzw. Anweisung an ein generatives Modell.</p><p>Gute Prompts nennen <b>Aufgabe, Kontext, Zielgruppe und gewünschtes Format</b>. Rollenangaben und Beispiele verbessern das Ergebnis. Das gezielte Formulieren heißt <b>Prompting</b>.</p>', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 1, f: 'Halluzination bei KI-Modellen', a: '<p>Ein Sprachmodell erzeugt eine <b>plausibel klingende, aber falsche</b> Aussage – etwa eine erfundene Quelle oder Zahl.</p><p>Ursache: Das Modell bildet Wahrscheinlichkeiten, nicht Wahrheit. Folge: Ergebnisse müssen immer fachlich geprüft werden („human in the loop").</p>', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 1, f: 'Feature vs. Label', a: '<p><b>Feature</b>: eine Eingabegröße, die das Modell zur Vorhersage nutzt (Wortanzahl, Absender, Alter).</p><p><b>Label</b>: die bekannte Zielausgabe (Spam / Nicht-Spam). Beim überwachten Lernen sind Labels vorhanden, beim unüberwachten nicht.</p>', q_: 'ML' },
  { t: 'ap1', b: 'ki', j: 1, f: 'Warum Merkmale normieren?', a: '<p>Liegen Merkmale auf stark verschiedenen Skalen, dominieren große Werte das Ergebnis.</p><p>Beispiel: Alter (0–100) und Einkommen (0–100.000). Deshalb werden Merkmale vor dem Training auf einen vergleichbaren Bereich (z. B. 0–1) <b>skaliert</b> – besonders wichtig für SVM und K-Means, die mit Abständen rechnen.</p>', q_: 'ML' },
  { t: 'ap1', b: 'ki', j: 2, f: 'Convolutional Neural Network (CNN)', a: '<p>Eine Netzarchitektur, die auf <b>Bilder</b> spezialisiert ist. Faltungsschichten (Convolution) erkennen lokale Muster – Kanten, Formen, Objekte.</p><p>Einsatz: Gesichtserkennung, Objekterkennung, Qualitätskontrolle. Für Sequenzen (Text, Zeitreihen) nutzt man dagegen RNN/LSTM oder Transformer.</p>', q_: 'DL' },
  { t: 'ap1', b: 'ki', j: 2, f: 'Computer Vision und NLP', a: '<p><b>Computer Vision</b>: KI deutet Bilder – Gesichtserkennung, Objekterkennung, Inspektion.</p><p><b>NLP</b> (Natural Language Processing): KI verarbeitet natürliche Sprache – Übersetzung, Spracherkennung, Chatbots, Textanalyse.</p>', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 2, f: 'KI im IT-Support', a: '<ul><li>Automatische <b>Klassifizierung</b> und Priorisierung eingehender Tickets</li><li><b>Antwortvorschläge</b> aus der Wissensdatenbank</li><li><b>Self-Service</b> für Standardfälle (Passwort, FAQ, Status)</li><li>Erkennung wiederkehrender Probleme (Musteranalyse)</li></ul><p>Der Mensch entscheidet Fälle und Ausnahmen – KI entlastet den First-Level-Support.</p>', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 2, f: 'KI und Datenschutz (DSGVO)', a: '<p>Auch für KI-Training und -Einsatz gilt die <b>DSGVO</b>: Rechtsgrundlage, Zweckbindung, Datenminimierung, Auskunfts- und Löschrechte.</p><p>Personenbezogene Daten dürfen nicht ohne Grundlage in Modelle einfließen. Für Hochrisiko-KI (z. B. Bewerberauswahl) gilt zusätzlich der <b>EU AI Act</b>.</p>', q_: 'KI' },

  /* ---------- KI, ML & Deep Learning — zweite Welle ---------- */
  { t: 'ap1', b: 'ki', j: 1, f: 'Symbolische KI vs. maschinelles Lernen', a: '<p><b>Symbolische KI</b> (klassisch): Der Mensch formuliert Regeln, z. B. ein <b>Expertensystem</b> (WENN … DANN …). Braucht keine großen Datenmengen, ist aber nur so gut wie die Regeln.</p><p><b>Maschinelles Lernen</b>: Das Modell leitet die Regeln selbst aus Beispieldaten ab. Braucht viele Daten, kann aber Muster finden, die niemand formuliert hat.</p>', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 2, f: 'Epoche und Batch', a: '<p><b>Batch</b>: die Teilmenge der Daten, die in einem Trainingsschritt verarbeitet wird.</p><p><b>Epoche</b>: ein vollständiger Durchlauf über den gesamten Trainingsdatensatz. Meist werden viele Epochen trainiert.</p>', q_: 'DL' },
  { t: 'ap1', b: 'ki', j: 2, f: 'Transformer (2017)', a: '<p>Eine Netzarchitektur, die auf dem <b>Attention-Mechanismus</b> beruht: Sie gewichtet, welche Wörter im Satz füreinander wichtig sind – unabhängig von ihrer Position.</p><p>Der Transformer ist die Grundlage großer Sprachmodelle (LLM) und damit heutiger generativer Text-KI.</p>', q_: 'DL' },
  { t: 'ap1', b: 'ki', j: 2, f: 'Transfer Learning', a: '<p>Ein bereits trainiertes Modell wird auf eine neue, ähnliche Aufgabe <b>übertragen und nachtrainiert</b> (Feintuning).</p><p>Vorteil: Das Modell kennt schon allgemeine Muster und braucht daher weniger Daten und Rechenzeit als ein Training von null.</p>', q_: 'DL' },
  { t: 'ap1', b: 'ki', j: 2, f: 'RAG – Retrieval Augmented Generation', a: '<p>Ein Sprachmodell wird mit einer <b>Wissensdatenbank verbunden</b>:<br>1. <b>Retrieval</b> – passende Dokumente suchen.<br>2. <b>Generation</b> – die Antwort daraus erzeugen.</p><p>Vorteil: Antworten bleiben aktuell und stützen sich auf Quellen – die Halluzinationsgefahr sinkt.</p>', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 2, f: 'Prompt Injection', a: '<p><b>Angriff</b>: In Text, den das Modell verarbeitet (E-Mail, Webseite, Dokument), ist eine versteckte Anweisung versteckt, die das Modell zu ungewollten Aktionen verleitet.</p><p><b>Gegenmaßnahmen</b>: Eingaben prüfen, Rechte des Modells stark begrenzen, Ergebnisse vor Ausführung menschlich freigeben.</p>', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 2, f: 'KI als Angriffswerkzeug', a: '<ul><li><b>Phishing</b>: individuelle, fehlerfreie Mails in jeder Sprache.</li><li><b>Deepfakes</b>: gefälschte Stimmen und Videos („CEO-Fraud").</li><li><b>Automatisierung</b>: massenhaftes Ausprobieren von Passwörtern.</li></ul><p>Folge: <b>Sensibilisierung</b> der Mitarbeiter und technische Schutzmaßnahmen werden wichtiger.</p>', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 3, f: 'Ressourcen- und Energieverbrauch von KI', a: '<p>Training großer Modelle und der Dauerbetrieb in Rechenzentren verbrauchen viel <b>Strom und Kühlung</b>.</p><p>Das ist ein Kosten- und Nachhaltigkeitsthema. Gegenmaßnahmen: passende (nicht maximale) Modellgröße, effiziente Hardware, gemietete statt eigener Ressourcen, sparsamer Betrieb.</p>', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 3, f: 'Human in the loop', a: '<p>Der Mensch bleibt in der Entscheidungskette: Er <b>prüft und bestätigt</b> das Ergebnis des KI-Systems, bevor es wirkt.</p><p>Pflicht bei kritischen Anwendungen (Personal, Medizin, Recht). Reduziert Fehler durch Halluzinationen, Bias und Fehlklassifikation.</p>', q_: 'KI' },
  { t: 'ap1', b: 'ki', j: 1, f: 'KI in der Prozessanalyse', a: '<ul><li><b>Mustererkennung</b>: wiederkehrende Abläufe sichtbar machen.</li><li><b>Prognose</b>: Vorhersage von Ausfällen (Predictive Maintenance) und Bedarfen.</li><li><b>Anomalieerkennung</b>: ungewöhnliche Vorgänge in Logs oder Messwerten finden.</li></ul><p>Die KI liefert Hinweise; die fachliche Bewertung und Entscheidung bleibt beim Menschen.</p>', q_: 'KI' },

  /* ============ Netzwerktechnik (PK-03/04) ============ */
  { t: 'ap1', b: 'netzwerk', j: 1, f: 'Das OSI-Modell – die sieben Schichten', a: '<ol><li>Bitübertragung (Physical) – Kabel, Stecker, LWL</li><li>Sicherung (Data Link) – Ethernet, MAC, ARP</li><li>Vermittlung (Network) – IP, ICMP, Routing</li><li>Transport – TCP, UDP</li><li>Sitzung (Session) – NetBIOS, RPC</li><li>Darstellung (Presentation) – TLS/SSL, MIME</li><li>Anwendung (Application) – HTTP, FTP, SMTP, DNS</li></ol><p>Merksatz von unten nach oben: <b>P</b>lease <b>D</b>o <b>N</b>ot <b>T</b>hrow <b>S</b>ausage <b>P</b>izza <b>A</b>way.</p>', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 1, f: 'OSI-Modell vs. TCP/IP-Modell', a: '<p><b>OSI</b>: 7 Schichten – Referenzmodell zum Verstehen.</p><p><b>TCP/IP</b>: 4 Schichten – das tatsächlich genutzte Modell:<br>Network Access · Internet · Transport · Application.</p><p>Die TCP/IP-Schichten entsprechen zusammengefassten OSI-Schichten.</p>', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 1, f: 'TCP vs. UDP im Vergleich', a: '<ul><li><b>TCP</b>: verbindungsorientiert, bestätigt Empfang, ordnet Pakete neu – Dateien, Web, E-Mail.</li><li><b>UDP</b>: verbindungslos, keine Bestätigung, geringer Overhead – Streaming, VoIP, DNS.</li></ul><p><b>3-Way-Handshake</b>: SYN → SYN-ACK → ACK.</p>', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 1, f: 'Netzwerkkomponenten und ihre Schicht', a: '<ul><li><b>Hub</b>: Schicht 1, verteilt an alle Ports (veraltet).</li><li><b>Switch</b>: Schicht 2, leitet anhand der <b>MAC-Adresse</b>.</li><li><b>Router</b>: Schicht 3, verbindet Netze anhand der <b>IP-Adresse</b>.</li><li><b>Gateway</b>: verbindet unterschiedliche Systeme/Protokolle.</li><li><b>Access Point</b>: drahtloser Zugang (WLAN).</li></ul>', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 1, f: 'DHCP und DNS – zwei Kerndienste', a: '<p><b>DHCP</b> vergibt automatisch IP-Adresse, Subnetzmaske, Gateway und DNS. Ablauf <b>DORA</b>: Discover → Offer → Request → Acknowledge.</p><p><b>DNS</b> löst Namen in IP-Adressen auf (das „Telefonbuch"). Einträge: A, AAAA, MX, CNAME, NS, PTR.</p><p>Adresse <b>169.254.x.x</b> (APIPA) = kein DHCP-Server erreichbar.</p>', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 1, f: 'Konsolenbefehle für das Netzwerk', a: '<ul><li><b>ipconfig</b> (Win) / <b>ip</b>, ifconfig (Linux) – IP-Konfiguration</li><li><b>ping</b> – Erreichbarkeit</li><li><b>traceroute</b> (Linux) / <b>tracert</b> (Win) – Weg/Hops zum Ziel</li><li><b>nslookup</b> – DNS-Abfrage</li><li><b>arp</b> – IP ↔ MAC</li></ul>', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 1, f: 'Übertragungszeit berechnen', a: '<p><b>Zeit = Datenmenge ÷ Übertragungsrate</b></p><p>Einheit beachten: <b>1 Byte = 8 Bit</b>. Aus MB also erst Mbit machen (× 8).</p><p>Beispiel: 12 MB ÷ 24 Mbit/s → 96 Mbit ÷ 24 = <b>4 s</b>.</p>', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 2, f: 'VPN – Zweck, Topologien und Protokolle', a: '<p><b>VPN</b> = verschlüsselter Tunnel über ein unsicheres Netz; die Teilnehmer wirken wie in einem lokalen Netz.</p><ul><li><b>Site-to-Site</b> – zwei Standorte verbinden</li><li><b>End-to-Site</b> – ein Gerät an ein Netz (Homeoffice)</li><li><b>End-to-End</b> – zwei Endgeräte direkt</li></ul><p>Protokolle: <b>IPsec</b>, <b>L2TP</b> (oft L2TP/IPsec), modern: OpenVPN, WireGuard.</p>', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 2, f: 'WLAN-Sicherheit: WEP, WPA2, WPA3', a: '<p><b>WEP</b>: gebrochen – nicht mehr verwenden.</p><p><b>WPA2</b>: sicher, Standard. <b>WPA3</b>: aktueller, noch sicherer.</p><p>Zwei Betriebsarten: <b>PSK</b> (Pre-shared Key, für Zuhause) und <b>Enterprise</b> (Anmeldung über RADIUS-Server, für Betriebe).</p><p>Standards: IEEE 802.11 ac/ax (Wi-Fi 5/6).</p>', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 2, f: 'Firewall-Arten', a: '<ul><li><b>Packet Filter</b>: prüft einzelne Pakete nach Adresse/Port.</li><li><b>Stateful Inspection</b>: führt eine Zustandstabelle und lässt nur erwartete Antworten durch.</li><li><b>Application Layer / WAF</b>: prüft Inhalte auf Anwendungsebene.</li><li><b>Personal Firewall</b>: schützt ein einzelnes Gerät.</li></ul>', q_: 'NW' },
