  { t: 'ap1', b: 'netzwerk', j: 2, f: 'DMZ und Port-Forwarding', a: '<p><b>DMZ</b> (Demilitarized Zone): Pufferzone zwischen Internet und internem Netz. Dort stehen öffentlich erreichbare Server (Web, Mail). Wird einer kompromittiert, bleibt das interne Netz geschützt.</p><p><b>Port-Forwarding</b>: Der Router leitet Anfragen an einen bestimmten Port an ein internes Gerät weiter.</p>', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 2, f: 'IPv4 vs. IPv6', a: '<ul><li><b>IPv4</b>: 32 Bit, etwa 4,3 Mrd. Adressen, Punktnotation, private Bereiche 10.x, 172.16–31.x, 192.168.x.</li><li><b>IPv6</b>: 128 Bit, praktisch unerschöpflich, Hexadezimal mit Doppelpunkten, SLAAC zur Auto-Konfiguration.</li></ul><p>Beide laufen heute oft parallel (<b>Dual-Stack</b>).</p>', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 2, f: 'LWL und Ethernet – Kabel und Standards', a: '<p><b>LWL</b> (Lichtwellenleiter): Daten als Licht, sehr hohe Bandbreite, große Reichweite, unempfindlich gegen EMV.</p><p><b>Ethernet</b>: LAN-Standard, Frames über MAC-Adressen, 100 Mbit/s bis 10 Gbit/s+. Kupfer (Twisted Pair) ist günstiger, aber störanfälliger und begrenzter in der Länge.</p>', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 3, f: 'VLAN und Virtualisierung', a: '<p><b>VLAN</b>: logisch getrenntes Netz auf derselben Hardware – trennt Abteilungen, erhöht Sicherheit, senkt Broadcast-Last.</p><p><b>Virtualisierung</b>: mehrere Systeme auf einer Hardware. Hypervisor <b>Typ 1</b> (Bare-Metal) und <b>Typ 2</b> (Hosted). Vorteile: Auslastung, Kosten, flexible Tests. Nachteil: ein Ausfall trifft mehrere Systeme.</p>', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 1, f: 'Subnetting: Adressen und nutzbare Hosts', a: '<p>Host-Bits = 32 − Präfixlänge.</p><p><b>Adressen im Subnetz</b> = 2^(Host-Bits)<br><b>Nutzbare Hosts</b> = 2^(Host-Bits) − 2</p><p>/24 → 254 · /25 → 126 · /26 → 62 · /27 → 30 · /28 → 14 · /29 → 6 · /30 → 2.</p>', q_: 'NW' },

  /* ============ IT-Sicherheit (PK-06) ============ */
  { t: 'ap1', b: 'sicherheit', j: 1, f: 'Die drei Schutzziele (CIA-Trio)', a: '<ul><li><b>Vertraulichkeit</b>: nur Berechtigte haben Zugriff.</li><li><b>Integrität</b>: Daten sind unverändert und korrekt.</li><li><b>Verfügbarkeit</b>: Daten und Systeme sind nutzbar, wenn benötigt.</li></ul><p>Der Katalog nennt diese drei. <b>Authentizität</b> (Echtheit) wird in Lehrbüchern oft als viertes Ziel ergänzt.</p>', q_: 'PK6' },
  { t: 'ap1', b: 'sicherheit', j: 1, f: 'Die Maßnahmen-Trias der IT-Sicherheit', a: '<ul><li><b>Technisch</b>: Virenschutz, Personal Firewall, Verschlüsselung.</li><li><b>Organisatorisch</b>: IT-Sicherheitsbeauftragter, Datenschutzbeauftragter, Passwort-Policy, Richtlinien.</li><li><b>Personell</b>: Sicherheitsbewusstsein der Mitarbeiter schulen.</li></ul><p>Erst das Zusammenspiel aller drei macht Sicherheit aus.</p>', q_: 'PK6' },
  { t: 'ap1', b: 'sicherheit', j: 1, f: 'Verschlüsselung: symmetrisch, asymmetrisch, hybrid', a: '<ul><li><b>Symmetrisch</b>: ein gemeinsamer Schlüssel (z. B. AES) – schnell, aber Schlüsselübergabe ist das Problem.</li><li><b>Asymmetrisch</b>: Schlüsselpaar öffentlich/privat (z. B. RSA) – löst die Schlüsselübergabe, ist aber langsam.</li><li><b>Hybrid</b>: Kombination, in der Praxis Standard (z. B. TLS) – asymmetrisch für den Schlüsselaustausch, symmetrisch für die Daten.</li></ul>', q_: 'PK6' },
  { t: 'ap1', b: 'sicherheit', j: 1, f: 'Schutzbedarfsanalyse und ISMS (BSI)', a: '<p><b>Schutzbedarfsanalyse</b> für vier Objekt-Kategorien: Anwendungen, IT-Systeme, Räume/Infrastruktur, Kommunikationsverbindungen.</p><p><b>Schutzbedarfskategorien</b>: normal, hoch, sehr hoch.</p><p><b>ISMS</b>: alle Regelungen und Prozesse, mit denen ein Betrieb Informationssicherheit steuert (BSI IT-Grundschutz, ISO 27001).</p>', q_: 'PK6' },
  { t: 'ap1', b: 'sicherheit', j: 1, f: 'Security by Design und Serverraum-Schutz', a: '<p><b>Security by Design</b>: Sicherheit von Anfang an mitentwickeln.</p><p><b>Security by Default</b>: sichere Grundeinstellung (Standardpasswörter ändern, unnötige Dienste aus).</p><p><b>Serverraum</b>: USV für Strom, Brandabschnitt und Löschanlage, Klimatisierung, Zutrittskontrolle – Verfügbarkeit ist auch eine bauliche Aufgabe.</p>', q_: 'PK6' },
  { t: 'ap1', b: 'sicherheit', j: 1, f: 'Authentifizierung und Passwort-Policy', a: '<p><b>Faktorkategorien</b>: Wissen (Passwort), Besitz (Token, Gerät), Biometrie (Fingerabdruck).</p><p><b>2FA/MFA</b> kombiniert Faktoren aus verschiedenen Kategorien.</p><p><b>Gute Passwort-Policy</b>: ausreichende Länge, keine Wiederverwendung, Komplexitäts- und Wechselregeln, keine Standardpasswörter.</p>', q_: 'PK6' },
  { t: 'ap1', b: 'sicherheit', j: 2, f: 'Angriffsarten – Überblick', a: '<ul><li><b>Phishing</b>: gefälschte Absender/Seiten erbeuten Zugangsdaten.</li><li><b>Sniffing</b>: Mitlesen des Datenverkehrs.</li><li><b>Spoofing</b>: Vortäuschen einer falschen Identität/Adresse.</li><li><b>Man-in-the-Middle</b>: Angreifer sitzt in der Mitte der Verbindung.</li><li><b>DoS/DDoS</b>: Überlastung – verletzt die Verfügbarkeit.</li><li><b>SQL-Injection / XSS</b>: Angriffe über ungeprüfte Eingaben in Webanwendungen.</li></ul>', q_: 'PK6' },
  { t: 'ap1', b: 'sicherheit', j: 2, f: 'Schadprogramm-Familien', a: '<ul><li><b>Virus</b>: hängt sich an Wirtsdateien, braucht einen Wirt.</li><li><b>Wurm</b>: verbreitet sich selbstständig über Netze.</li><li><b>Trojaner</b>: tarnt sich als nützliches Programm.</li><li><b>Ransomware</b>: verschlüsselt Daten und fordert Lösegeld.</li><li><b>Spyware/Keylogger</b>: spähen Daten/Tastatureingaben aus.</li><li><b>Rootkit</b>: versteckt Angreifer tief im System.</li></ul>', q_: 'PK6' },
  { t: 'ap1', b: 'sicherheit', j: 2, f: 'Hacker-Typen', a: '<ul><li><b>White Hat</b>: handelt mit Erlaubnis (Sicherheitsforschung).</li><li><b>Black Hat</b>: handelt kriminell.</li><li><b>Gray Hat</b>: ohne Erlaubnis, aber ohne Schädigungsabsicht.</li><li><b>Cracker</b>: bricht Schutzmechanismen.</li><li><b>Script-Kiddies</b>: nutzen fertige Werkzeuge ohne tiefes Wissen.</li></ul>', q_: 'PK6' },
  { t: 'ap1', b: 'sicherheit', j: 2, f: 'CIA im Alltag – welche Maßnahme wirkt auf welches Ziel?', a: '<ul><li><b>Vertraulichkeit</b>: Verschlüsselung, Rechtekonzept, Least Privilege.</li><li><b>Integrität</b>: Hashwerte, Signaturen, Rechtekonzept, Vier-Augen-Prinzip.</li><li><b>Verfügbarkeit</b>: USV, RAID, Redundanz, Backup, Brandabschnitt, Klima.</li></ul><p>Eine gute Antwort nennt Maßnahme <b>und</b> das Ziel, das sie schützt.</p>', q_: 'PK6' },
  { t: 'ap1', b: 'sicherheit', j: 3, f: 'Least Privilege und Need-to-know', a: '<p><b>Least Privilege</b>: Jeder Nutzer erhält nur die Rechte, die er für seine Aufgabe unbedingt braucht. Administratorrechte nur, wo nötig.</p><p><b>Need-to-know</b>: Zugriff nur auf Daten, die für die Aufgabe nötig sind.</p><p>Ziel: Schaden bei Missbrauch oder Kompromittierung begrenzen – ein zentrales Prinzip jeder Zugriffskontrolle.</p>', q_: 'PK6' },
  { t: 'ap1', b: 'sicherheit', j: 3, f: 'Ransomware-Abwehr und die Rolle des Backups', a: '<p>Ransomware verschlüsselt Daten und fordert Lösegeld. Schutz:</p><ul><li>aktuelle, getestete Backups – <b>eine Kopie offline/außer Haus</b></li><li>Virenschutz, Patching, E-Mail-Filter</li><li>Sensibilisierung der Mitarbeiter</li><li>Netztrennung (kein dauerhafter Backup-Zugriff)</li></ul><p>Keine Zahlung als Lösung – sie garantiert keine Entschlüsselung.</p>', q_: 'PK6' }
];

        feedback: 'Kundenorientierte Kommunikation heißt, die Sprache des Gegenübers zu treffen: Nutzen vor Technik, Fachbegriffe einmal einordnen, dann konkret werden. Der PK-02 verlangt ausdrücklich situationsgerechte Kommunikation und Präsentationskompetenz – das ist prüfungsrelevant.'

          { t: 'Die Abnahme ohne Mängelnennung durchführen und die Probleme informell klären.', p: 0 },

  {
    t: 'ap1', id: 'fall-ki-support', j: 1, b: 'ki', titel: 'Fallstudie: KI im First-Level-Support',
    einstieg: `<p>Sie arbeiten als IT-System-Manager bei der <b>Nordlicht Logistik GmbH</b>. Der Service-Desk
      wird von Anfragen überflutet, und die Geschäftsführung will ein KI-System zur automatischen
      Ticket-Klassifizierung einführen. Sie wurden gebeten, das Vorhaben fachlich zu begleiten.</p>`,
    schritte: [
      {
        situation: `<p><b>Kickoff mit der Geschäftsführung.</b> Der Geschäftsführer hat von „KI", „maschinellem
          Lernen" und „Deep Learning" gehört und fragt, was davon hier gebraucht wird.</p>`,
        kunde: '„Was ist der Unterschied zwischen KI, maschinellem Lernen und Deep Learning – und was davon brauchen wir?"',
        optionen: [
          { t: 'KI ist der Oberbegriff, ML ein Teilgebiet der KI und DL ein Subfeld des ML mit tiefen neuronalen Netzen. Für die Textklassifizierung kommen ML und ggf. DL in Frage.', p: 3 },
          { t: 'Alle drei Begriffe meinen dasselbe Verfahren und sind austauschbar.', p: 0 },
          { t: 'Deep Learning ist der Oberbegriff und enthält KI und ML.', p: 0 }
        ],
        feedback: 'Richtig ist die Hierarchie KI ⊃ ML ⊃ DL. Textklassifikation lässt sich oft schon mit klassischem ML lösen; DL lohnt sich bei sehr großen, unstrukturierten Datenmengen und mehr Rechenleistung.'
      },
      {
        situation: `<p><b>Welche Lernart?</b> Das System soll Tickets den Kategorien „Netzwerk", „Hardware",
          „Software" und „Zugang" zuordnen.</p>`,
        kunde: '„Welche Lernart brauchen wir dafür – und was setzt sie voraus?"',
        optionen: [
          { t: 'Überwachtes Lernen: Die vorhandenen Tickets müssen zuvor von Hand gelabelt werden.', p: 3 },
          { t: 'Unüberwachtes Lernen: Das System erfindet die Kategorien selbst, Labels sind nicht nötig.', p: 1 },
          { t: 'Bestärkendes Lernen durch Belohnung für jedes richtig sortierte Ticket.', p: 0 }
        ],
        feedback: 'Weil feste Zielkategorien vorgegeben sind, handelt es sich um überwachtes Lernen (Klassifikation). Voraussetzung sind historische Tickets mit Labels (Ground Truth). Unüberwachtes Lernen würde nur Gruppen bilden, keine festen Kategorien.'
      },
      {
        situation: `<p><b>Datengrundlage prüfen.</b> Sie sehen sich die historischen Tickets an: 9.000 Stück,
          davon 6.000 mit Label, 3.000 ohne. Bei den Labels fällt auf, dass „Netzwerk" viel öfter falsch
          vergeben wurde.</p>`,
        kunde: '„Reicht dieser Datensatz – und welche Risiken sehen Sie?"',
        optionen: [
          { t: 'Die gelabelten Tickets reichen als Startpunkt, sind aber fehlerhaft. Verzerrte Labels führen zu Bias im Modell – die Daten müssen bereinigt und repräsentativ sein.', p: 3 },
          { t: 'Label-Fehler sind egal, das Modell lernt von selbst das Richtige.', p: 0 },
          { t: 'Nur die 3.000 Tickets ohne Label sollten verwendet werden.', p: 0 }
        ],
        feedback: 'Ein Modell übernimmt die Fehler und Verzerrungen seiner Trainingsdaten (algorithmischer Bias). Vor dem Training stehen daher Datenqualität, Bereinigung und eine Überprüfung auf Verzerrungen.'
      },
      {
        situation: `<p><b>Bewertung des Modells.</b> Nach dem Training nennt der Entwickler eine Genauigkeit von
          99 % auf den Trainingsdaten. Auf den Testdaten sind es nur 82 %.</p>`,
        kunde: '„Welche Zahl gilt – und was ist hier passiert?"',
        optionen: [
          { t: 'Es liegt Overfitting vor: Das Modell hat die Trainingsdaten zu genau gelernt. Es muss getestet und regularisiert werden; die 82 % auf den Testdaten sind maßgeblich.', p: 3 },
          { t: 'Die 99 % sind maßgeblich, die Testdaten sind nur Zufall.', p: 0 },
          { t: 'Beide Werte sind gleichwertig, man nimmt den Mittelwert.', p: 0 }
        ],
        feedback: 'Bewertet wird immer auf zurückgehaltenen Testdaten. Ein großer Abstand zwischen Trainings- und Testergebnis ist ein typisches Overfitting-Signal. Gegenmaßnahmen: mehr Daten, Kreuzvalidierung, Regularisierung.'
      }
    ],
    fazit: `<p><b>Ergebnis der Fallstudie:</b> Für die Ticket-Klassifizierung ist überwachtes Lernen der passende
      Ansatz. Entscheidend sind saubere, repräsentative Labels – ein Modell ist niemals objektiver als seine
      Daten. Genau deshalb ist die ehrliche Bewertung auf Testdaten der Kern jeder KI-Einführung.</p>`
  },
  {
    t: 'ap1', id: 'fall-ki-ethik', j: 2, b: 'ki', titel: 'Fallstudie: KI-System bewerten und einführen',
    einstieg: `<p>Die <b>Harmonie-Service GmbH</b> möchte ein KI-Modell einsetzen, das Bewerbungen vorsortiert.

    schritte: [
      {
        situation: `<p><b>Erstes Gespräch mit dem Betriebsrat.</b> Gefragt wird, welche grundsätzlichen Risiken

        kunde: '„Welche Risiken sehen Sie bei einem KI-Modell zur Bewerberauswahl?"',
        optionen: [
          { t: 'Algorithmischer Bias durch verzerrte Trainingsdaten, mangelnde Transparenz (Black Box) und datenschutzrechtliche Fragen (DSGVO).', p: 3 },
          { t: 'Nur die Anschaffungskosten sind ein Risiko, sonst nichts.', p: 0 },
          { t: 'KI-Modelle sind grundsätzlich objektiv und können keine Vorurteile haben.', p: 0 }
        ],
        feedback: 'Die drei Kernrisiken sind Bias (Vorurteile aus den Daten), fehlende Transparenz (Black-Box-Entscheidungen) und Datenschutz. Bei personenbezogenen Daten greift die DSGVO, zusätzlich regelt der EU AI Act Hochrisiko-KI.'
      },
      {
        situation: `<p><b>Modellwahl.</b> Ein Anbieter schwärmt von einem tiefen neuronalen Netz, ein anderer

        optionen: [
          { t: 'Der Entscheidungsbaum (White-Box): Jeder Schritt ist erklärbar. Das tiefe Netz ist ein Black-Box-Modell und schwer zu begründen.', p: 3 },
          { t: 'Immer das tiefe neuronale Netz, weil es moderner ist.', p: 0 },
          { t: 'Beide sind gleich gut erklärbar.', p: 0 }
        ],
        feedback: 'Bei Entscheidungen, die begründet werden müssen, ist Erklärbarkeit entscheidend. Der Entscheidungsbaum ist ein White-Box-Modell; ein tiefes Netz gilt als Black Box. Wenn ein DL-Modell nötig ist, braucht es zusätzliche Erklärbarkeitsmethoden.'
      },
      {
        situation: `<p><b>Fachliche Prüfung.</b> Der Anbieter behauptet, das System „lerne aus Erfahrung und

        kunde: '„Stimmt diese Aussage so?"',
        optionen: [

          { t: 'Nur wenn man es lange genug laufen lässt, wird es von selbst fair.', p: 0 }

        feedback: 'Ein Modell kann Bias nicht „wegrechnen". Fairness ist ein Ergebnis von Datenqualität, bewusster Auswahl, regelmäßiger Kontrolle und Transparenz – nicht von selbst.'
      },
      {
        situation: `<p><b>Rechtlicher Rahmen.</b> Es sollen Bewerberdaten in einem EU-Land verarbeitet werden.</p>`,
        kunde: '„Welche Vorschriften sind einzuhalten?"',
        optionen: [
          { t: 'Die DSGVO (Datenschutz) und der EU AI Act (Risikostufen für KI-Systeme) – Bewerberauswahl gilt als Hochrisiko-Anwendung.', p: 3 },
          { t: 'Nur die Hausordnung des Betriebs.', p: 0 },
          { t: 'Keine – KI ist gesetzlich nicht geregelt.', p: 0 }
        ],
        feedback: 'Personenbezogene Daten fallen unter die DSGVO. Der EU AI Act ordnet KI nach Risiko ein; Bewerberauswahl zählt zu den Hochrisiko-Anwendungen mit besonderen Pflichten.'
      }
    ],
    fazit: `<p><b>Ergebnis der Fallstudie:</b> Der Einsatz von KI ist eine fachliche, rechtliche und ethische
      Entscheidung. Ein Modell ist nur so gut und fair wie seine Daten – und es muss erklärbar, datenschutzkonform
      und kontrollierbar sein. „Modern" ist kein Sachargument.</p>`
  },
  {

  {
    t: 'ap1', id: 'fall-ki-projekt', j: 2, b: 'ki', titel: 'Fallstudie: KI-Modell auswählen und bewerten',
    einstieg: `<p>Die <b>Müller Logistik AG</b> will vorhersagen, welche Sendungen sich verzögern. Sie
      vergleichen zwei Ansätze und müssen den besten auswählen.</p>`,
    schritte: [
      {
        situation: `<p><b>Ziel klären.</b> Gefragt ist eine Risikoeinschätzung je Sendung.</p>`,
        kunde: '„Ist das eine Klassifikation oder eine Regression – und wann welche?"',
        optionen: [
          { t: 'Klassifikation, wenn es um Klassen geht (Verzögerung ja/nein); Regression, wenn eine Zahl geschätzt wird (Verzögerung in Stunden).', p: 3 },
          { t: 'Immer Regression, weil Zahlen genauer sind.', p: 0 },
          { t: 'Immer Klassifikation, weil Klassen einfacher sind.', p: 0 }
        ],
        feedback: 'Zuerst das Ziel festlegen: Klasse oder Zahl. „Verzögert: ja/nein" ist Klassifikation, „wie viele Stunden" ist Regression. Beides gehört zum überwachten Lernen.'
      },
      {
        situation: `<p><b>Daten prüfen.</b> Von 50.000 Sendungen haben nur 800 ein Label
          „Verzögerung ja/nein".</p>`,
        kunde: '„Reicht das – und was ist das Problem?"',
        optionen: [
          { t: 'Die Klassen sind stark ungleich verteilt (wenige Verzögerungen). Accuracy allein täuscht – deshalb Precision, Recall und F1 prüfen und ggf. Daten ergänzen.', p: 3 },
          { t: 'Die Datenmenge ist immer ausreichend, unabhängig von der Verteilung.', p: 0 },
          { t: 'Ungleiche Klassen sind kein Problem, Accuracy genügt.', p: 0 }
        ],
        feedback: 'Bei ungleichen Klassen (z. B. 1,6 % Verzögerungen) ist Accuracy irreführend – ein Modell, das nie „Verzögerung" sagt, ist sehr genau, erkennt aber nichts. Precision und Recall zeigen das ehrlich.'
      },
      {
        situation: `<p><b>Modell bewerten.</b> Modell A hat Precision 90 %, Recall 40 %; Modell B hat
          Precision 60 %, Recall 85 %.</p>`,
        kunde: '„Welches Modell nehmen wir, wenn wir möglichst wenige Verzögerungen übersehen dürfen?"',
        optionen: [
          { t: 'Modell B, weil der Recall zählt: Wir dürfen möglichst keine echte Verzögerung übersehen.', p: 3 },
          { t: 'Modell A, weil Precision immer wichtiger ist als Recall.', p: 0 },
          { t: 'Es spielt keine Rolle, beide sind gleichwertig.', p: 0 }
        ],
        feedback: 'Welche Metrik zählt, hängt vom Ziel ab: Geht es darum, nichts zu übersehen (Recall), ist Recall entscheidend. Ist ein Fehlalarm teuer (Precision), zählt Precision. Der F1-Score balanciert beide.'
      },
      {
        situation: `<p><b>Ergebnis einsetzen.</b> Das Modell ist fertig.</p>`,
        kunde: '„Wer entscheidet künftig über die Sendungen?"',
        optionen: [
          { t: 'Das Modell liefert eine Einschätzung, der Mensch entscheidet. Vorhersagen sind Unterstützung, keine unfehlbare Wahrheit.', p: 3 },
          { t: 'Das Modell entscheidet allein und endgültig.', p: 0 },
          { t: 'Das Modell ist unnötig, sobald es gebaut ist.', p: 0 }
        ],
        feedback: 'KI unterstützt Entscheidungen, ersetzt aber nicht die Verantwortung. Besonders bei Auswirkungen auf Menschen und Betrieb gilt: Ergebnis prüfen, Verantwortung bleibt beim Menschen.'
      }
    ],
    fazit: `<p><b>Ergebnis der Fallstudie:</b> Ein Modell ist erst dann fertig, wenn Ziel und Metrik zum Problem
      passen, die Datenverteilung beachtet wird und die Verantwortung beim Menschen bleibt. Die richtige Metrik
      zu wählen ist so wichtig wie das Modell selbst.</p>`
  },
  {

          { t: 'Fast-Ausfälle werden von selbst zu Fehlern.', p: 1 }

        feedback: 'Überwachtes Lernen braucht Beispiele des Zielzustands – hier dokumentierte oder beinahe Ausfälle. Das zeigt die klassische Kette: zuerst Daten, dann Modell.'
      },
      {
        situation: `<p><b>Wirtschaftlichkeit.</b> Das System kostet 60.000 € einmalig und 1.200 €/Monat.

          { t: 'Es lohnt sich immer, weil KI immer Gewinn bringt.', p: 0 },

    const zvkpR = r2(lvp - zrabatt);
    const zskonto = r2(zvkpR * kskonto / 100);
    const bvpR = r2(zvkpR - zskonto);
    const gewinn = r2(bvpR - sk);
    const gewP = r1(gewinn / sk * 100);
    const machbar = gewP >= minGew;

    return {
      szenario: `<p>Ein Stammkunde fordert auf den Listenverkaufspreis ${pct(krabatt)} Rabatt und
        ${pct(kskonto)} Skonto. Ihr Selbstkostenpreis steht fest. <strong>Prüfen Sie, ob das Geschäft
        angenommen werden darf</strong> – die Geschäftsleitung verlangt mindestens ${pv(minGew)} Gewinn.</p>`,
      daten: `<table>
        <tr><th>Angaben</th><th class="z">Wert</th></tr>
        <tr><td>Selbstkostenpreis</td><td class="z">${eur(sk)} €</td></tr>
        <tr><td>Listenverkaufspreis netto</td><td class="z">${eur(lvp)} €</td></tr>
        <tr><td>geforderter Kundenrabatt</td><td class="z">${pct(krabatt)}</td></tr>
        <tr><td>gefordertes Kundenskonto</td><td class="z">${pct(kskonto)}</td></tr>
        <tr><td>geforderter Mindestgewinn</td><td class="z">${pct(minGew)}</td></tr>
      </table>`,
      rows: [
        { name: 'Listenverkaufspreis netto', op: '', unit: '€', gegeben: true, wert: eur(lvp) },
        { name: `− Kundenrabatt ${pct(krabatt)}`, op: '−', unit: '€', answer: zrabatt },
        { name: '= Zielverkaufspreis', op: '=', unit: '€', answer: zvkpR, ergebnis: true },
        { name: `− Kundenskonto ${pct(kskonto)}`, op: '−', unit: '€', answer: zskonto },
        { name: '= Barverkaufspreis', op: '=', unit: '€', answer: bvpR, ergebnis: true },
        { name: '− Selbstkosten', op: '−', unit: '€', gegeben: true, wert: eur(sk) },
        { name: '= Gewinn in €', op: '=', unit: '€', answer: gewinn, ergebnis: true },
        { name: 'Gewinnzuschlag in % der Selbstkosten', op: '', unit: '%', answer: gewP, tol: { abs: 0.2 } },
        { name: `Entscheidung – Auftrag annehmen? (ja / nein)`, op: '', unit: '', text: machbar ? 'ja' : 'nein', antwortText: machbar ? 'JA' : 'NEIN' }
      ],
      weg: [
        `Zielverkaufspreis = ${eur(lvp)} − ${eur(zrabatt)} = ${eur(zvkpR)} €`,
        `Barverkaufspreis = ${eur(zvkpR)} − ${eur(zskonto)} = ${eur(bvpR)} €`,
        `Gewinn = ${eur(bvpR)} − ${eur(sk)} = ${eur(gewinn)} €`,
        `Gewinnzuschlag = ${eur(gewinn)} ÷ ${eur(sk)} × 100 = ${num(gewP, 1)} %`,
        `Vergleich: ${num(gewP, 1)} % ${machbar ? '≥' : '<'} ${num(minGew, 0)} % → Auftrag ${machbar ? 'annehmen' : 'ablehnen'}`
      ],
      hinweis: 'Bei der Differenzkalkulation gehst du von oben nach unten und vergleichst am Schluss mit der Vorgabe. Achtung: Der Gewinnzuschlag bezieht sich immer auf die <em>Selbstkosten</em>, nicht auf den Verkaufspreis.'
    };
  }
},

/* ---------- 4. Stundensatzkalkulation ---------- */
{
  t: 'ap1', id: 'stunde', j: 3, bereich: 'wirtschaft', titel: 'Stundensatzkalkulation', punkte: 6,
  quelle: 'Kundenanfrage beantworten · „Stundensatz 2“ (7 Mitarbeiter, Excel-Mappe)',
  gen() {
    const kalender = 365, we = 104;
    const feiertage = R(8, 13);
    const urlaub = R(24, 30);
    const krank = R(6, 12);
    const weiter = R(3, 10);
    const sonstige = R(15, 30);
    const hTag = 8;
    const ma = R(3, 12);
    const jahreskosten = R(60, 90) * 1000;
    const hkGesamt = R(120, 320) * 1000;
    const gewP = pick([15, 20, 25, 30]);

    const arbeitstage = kalender - we - feiertage - urlaub - krank - weiter - sonstige;
    const stdProMA = arbeitstage * hTag;
    const stdGesamt = stdProMA * ma;
    const kosten = ma * jahreskosten + hkGesamt;
    const kostenSatz = r2(kosten / stdGesamt);
    const netto = r2(kostenSatz * (1 + gewP / 100));
    const brutto = r2(netto * 1.19);

    return {
      szenario: `<p>Ihr IT-Systemhaus beschäftigt <strong>${ma} Mitarbeiter in Vollzeit</strong> und muss
        seinen Abrechnungsstundensatz neu kalkulieren. Ermitteln Sie zuerst die tatsächlich
        <strong>verfügbaren Arbeitsstunden</strong> und daraus den Stundensatz.</p>`,
      daten: `<table>
        <tr><th>Angabe</th><th class="z">Wert</th></tr>
        <tr><td>Kalendertage je Jahr</td><td class="z">${kalender}</td></tr>
        <tr><td>Wochenendtage</td><td class="z">${we}</td></tr>
        <tr><td>Feiertage auf Werktage</td><td class="z">${feiertage}</td></tr>
        <tr><td>Urlaubstage je Mitarbeiter</td><td class="z">${urlaub}</td></tr>
        <tr><td>Krankheitstage je Mitarbeiter</td><td class="z">${krank}</td></tr>
        <tr><td>Tage Weiterbildung je Mitarbeiter</td><td class="z">${weiter}</td></tr>
        <tr><td>Akquise-, Warte-, Rüst- und Sonstige Zeiten</td><td class="z">${sonstige}</td></tr>
        <tr><td>Arbeitszeit je Arbeitstag</td><td class="z">${hTag} h</td></tr>
        <tr><td>Mitarbeiter (Vollzeit)</td><td class="z">${ma}</td></tr>
        <tr><td>Jahreskosten je Mitarbeiter (inkl. Sozialabgaben)</td><td class="z">${eur(jahreskosten)} €</td></tr>
        <tr><td>Handlungskosten gesamt je Jahr</td><td class="z">${eur(hkGesamt)} €</td></tr>
        <tr><td>Gewinnaufschlag</td><td class="z">${pct(gewP)}</td></tr>
        <tr><td>Umsatzsteuer</td><td class="z">19,0 %</td></tr>
      </table>`,
      rows: [
        { name: 'Produktive Arbeitstage je Mitarbeiter', op: '', unit: 'Tage', answer: arbeitstage, tol: { abs: 0 }, dec: 0 },
        { name: 'Verfügbare Stunden je Mitarbeiter', op: '', unit: 'h', answer: stdProMA, tol: { abs: 0 }, dec: 0 },
        { name: 'Verfügbare Stunden gesamt (alle Mitarbeiter)', op: '', unit: 'h', answer: stdGesamt, tol: { abs: 0 }, dec: 0 },
        { name: 'Gesamtkosten je Jahr (Personal + Handlungskosten)', op: '', unit: '€', answer: kosten },
        { name: 'Stundensatz (nur Kosten)', op: '', unit: '€/h', answer: kostenSatz },
        { name: `+ Gewinnaufschlag ${pct(gewP)} → Nettostundensatz`, op: '+', unit: '€/h', answer: netto, ergebnis: true },
        { name: '+ Umsatzsteuer 19 % → Bruttostundensatz', op: '+', unit: '€/h', answer: brutto, ergebnis: true }
      ],
      weg: [
        `Arbeitstage = 365 − 104 − ${feiertage} − ${urlaub} − ${krank} − ${weiter} − ${sonstige} = ${arbeitstage} Tage`,
        `Stunden je Mitarbeiter = ${arbeitstage} × ${hTag} = ${stdProMA} h`,
        `Stunden gesamt = ${stdProMA} × ${ma} = ${stdGesamt} h`,
        `Kosten = ${ma} × ${eur(jahreskosten)} + ${eur(hkGesamt)} = ${eur(kosten)} €`,
        `Stundensatz = ${eur(kosten)} ÷ ${stdGesamt} = ${eur(kostenSatz)} €/h`,
        `Nettostundensatz = ${eur(kostenSatz)} × ${num(1 + gewP / 100, 2)} = ${eur(netto)} €/h`,
        `Bruttostundensatz = ${eur(netto)} × 1,19 = ${eur(brutto)} €/h`
      ],
      hinweis: 'Merke: Nur <em>produktive</em> Stunden dürfen im Nenner stehen. Urlaub, Krankheit, Weiterbildung und Rüstzeiten sind bezahlte, aber nicht verrechenbare Zeit – sie treiben den Stundensatz nach oben.'
    };
  }
},

/* ---------- 5. USV / Autonomiezeit ---------- */
{
  t: 'ap1', id: 'usv', j: 1, bereich: 'hardware', titel: 'USV: Autonomiezeit & Dimensionierung', punkte: 4,
  quelle: 'Systemtechnik · Tag 1 (USV/UPS, Wirkleistung vs. Scheinleistung) + Crash-Energiekosten.pdf',
  gen() {
    const akkus = R(2, 8);
    const spannung = pick([12, 24]);
    const ah = R(7, 40);
    const cosphi = pick([0.65, 0.7, 0.8, 0.9]);
    const lastW = R(150, 900);
    const wirkungsgrad = pick([0.85, 0.9, 0.95]);

    const lastVA = r1(lastW / cosphi);
    const energie = akkus * spannung * ah;
    const zeitIdeal = r1(energie / lastVA);
    const zeit = r1(energie * wirkungsgrad / lastVA);

    return {
      szenario: `<p>Ein Serverraum soll mit einer USV abgesichert werden. Berechnen Sie die
        <strong>Scheinleistung</strong>, die die USV liefern muss, und die erreichbare
        <strong>Autonomiezeit</strong> (Überbrückungszeit).</p>`,
      daten: `<table>
        <tr><th>Angabe</th><th class="z">Wert</th></tr>
        <tr><td>Wirkleistung der angeschlossenen Verbraucher</td><td class="z">${lastW} W</td></tr>
        <tr><td>Leistungsfaktor cos φ</td><td class="z">${num(cosphi, 2)}</td></tr>
        <tr><td>Batterieblock: Anzahl Akkumulatoren</td><td class="z">${akkus}</td></tr>
        <tr><td>Spannung je Akkumulator</td><td class="z">${spannung} V</td></tr>
        <tr><td>Kapazität je Akkumulator</td><td class="z">${ah} Ah</td></tr>
        <tr><td>Wirkungsgrad des Wechselrichters</td><td class="z">${num(wirkungsgrad * 100, 0)} %</td></tr>
      </table>`,
      rows: [
        { name: 'Wirkleistung', op: '', unit: 'W', gegeben: true, wert: String(lastW) },
        { name: 'Benötigte Scheinleistung der USV (P ÷ cos φ)', op: '', unit: 'VA', answer: lastVA, tol: { abs: 1 }, dec: 1 },
        { name: 'Gespeicherte Energie der Akkumulatoren (n × U × Ah)', op: '', unit: 'Wh', answer: energie, tol: { abs: 0 }, dec: 0 },
        { name: 'Autonomiezeit ohne Verluste (Energie ÷ VA)', op: '', unit: 'h', answer: zeitIdeal, tol: { abs: 0.15 }, dec: 1 },
        { name: 'Autonomiezeit mit Wirkungsgrad', op: '', unit: 'h', answer: zeit, tol: { abs: 0.15 }, dec: 1, ergebnis: true }
      ],
      weg: [
        `Scheinleistung = ${lastW} W ÷ ${num(cosphi, 2)} = ${num(lastVA, 1)} VA`,
        `Energie = ${akkus} × ${spannung} V × ${ah} Ah = ${energie} Wh`,
        `Autonomiezeit (ideal) = ${energie} Wh ÷ ${num(lastVA, 1)} VA = ${num(zeitIdeal, 1)} h`,
        `Autonomiezeit (real) = ${energie} Wh × ${num(wirkungsgrad, 2)} ÷ ${num(lastVA, 1)} VA = ${num(zeit, 1)} h`
      ],
      hinweis: 'Die USV wird nach <em>VA</em> dimensioniert, nicht nach Watt – deshalb muss immer über den Leistungsfaktor cos φ umgerechnet werden. Die Formel aus dem Skript lautet: t = (Anzahl Akkus × Spannung × Ladung) ÷ Leistungsabnahme in VA.'
    };
  }
},

/* ---------- 6. Wirk-, Schein- und Blindleistung ---------- */
{
  t: 'ap1', id: 'leistung', j: 1, bereich: 'hardware', titel: 'Wirk-, Schein- und Blindleistung', punkte: 4,
  quelle: 'Systemtechnik · Tag 1 „physikalische Grundlagen“ (Wirkfaktor, Blindleistung)',
  gen() {
    const cosphi = pick([0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9]);
    const s = R(30, 200) * 10;
    const p = r1(s * cosphi);
    const q = r1(Math.sqrt(s * s - p * p));
    const strom = r1(s / 230);
    const stunden = R(1000, 3000);
    const preis = 0.32;
    const kwh = r1(p / 1000 * stunden);
    const kosten = r2(kwh * preis);

    return {
      szenario: `<p>Für eine Abteilung wird die elektrische Belastung gemessen. Aus der
        <strong>Scheinleistung</strong> und dem Leistungsfaktor sind Wirk- und Blindleistung zu ermitteln.
        Anschließend ist der Strom auf der 230-V-Zuleitung und die jährlichen Energiekosten
        (Strompreis ${num(preis, 2)} €/kWh, ${stunden} Betriebsstunden) zu berechnen.</p>`,
      daten: `<table>
        <tr><th>Messwert</th><th class="z">Wert</th></tr>
        <tr><td>Scheinleistung S</td><td class="z">${s} VA</td></tr>
        <tr><td>Leistungsfaktor cos φ</td><td class="z">${num(cosphi, 2)}</td></tr>
        <tr><td>Netzspannung</td><td class="z">230 V</td></tr>
      </table>`,
      rows: [
        { name: 'Wirkleistung P = S × cos φ', op: '', unit: 'W', answer: p, tol: { abs: 1 }, dec: 1 },
        { name: 'Blindleistung Q = √(S² − P²)', op: '', unit: 'var', answer: q, tol: { abs: 2 }, dec: 1 },
        { name: 'Stromstärke I = S ÷ U', op: '', unit: 'A', answer: strom, tol: { abs: 0.2 }, dec: 1 },
        { name: `Jahresenergie in kWh (P × ${stunden} h)`, op: '', unit: 'kWh', answer: kwh, tol: { abs: 0.5 }, dec: 1 },
        { name: 'Energiekosten je Jahr', op: '', unit: '€', answer: kosten, tol: { abs: 1 } }
      ],
      weg: [
        `Wirkleistung P = ${s} VA × ${num(cosphi, 2)} = ${num(p, 1)} W`,
        `Blindleistung Q = √(${s}² − ${num(p, 1)}²) = ${num(q, 1)} var`,
        `Stromstärke I = ${s} VA ÷ 230 V = ${num(strom, 1)} A`,
        `Energie = ${num(p / 1000, 2)} kW × ${stunden} h = ${num(kwh, 1)} kWh`,
        `Kosten = ${num(kwh, 1)} kWh × ${num(preis, 2)} €/kWh = ${eur(kosten)} €`
      ],
      hinweis: 'Nur die <em>Wirkleistung</em> wird in kWh abgerechnet – Blindleistung verrichtet keine Arbeit. Sie pendelt zwischen Netz und Verbraucher, belastet aber Leitungen und muss kompensiert werden. In der Prüfung wird oft mit dem Faktor 0,65 (P = S × 0,65) gerechnet.'
    };
  }
},

/* ---------- 7. Energiekosten & Amortisation ---------- */
{
  t: 'ap1', id: 'energie', j: 1, bereich: 'hardware', titel: 'Energiekosten & Amortisation', punkte: 4,
  quelle: 'Crash-Energiekosten.pdf (Wirkungsgrad, Energiekosten, Amortisation)',
  gen() {
    const altW = R(30, 60) * 10;
    const neuW = Math.round(altW * pick([0.4, 0.5, 0.6, 0.7]));
    const stunden = R(1500, 6000);
    const preis = pick([0.28, 0.30, 0.32, 0.35, 0.40]);
    const invest = R(20, 120) * 100;
    const anzahl = R(5, 60);

    const altKwh = r1(anzahl * altW / 1000 * stunden);
    const neuKwh = r1(anzahl * neuW / 1000 * stunden);
    const altKosten = r2(altKwh * preis);
    const neuKosten = r2(neuKwh * preis);
    const einsparung = r2(altKosten - neuKosten);
    const amort = r1(invest / einsparung * 12);

    return {
      szenario: `<p>In Ihrem Rechenzentrum sollen ${anzahl} Altgeräte mit je ${altW} W durch
        Neugeräte mit je ${neuW} W ersetzt werden. Prüfen Sie die Wirtschaftlichkeit: Wie hoch ist die
        jährliche Einsparung und nach wie vielen Monaten hat sich die Investition amortisiert?</p>`,
      daten: `<table>
        <tr><th>Angabe</th><th class="z">Wert</th></tr>
        <tr><td>Leistungsaufnahme Altgerät</td><td class="z">${altW} W</td></tr>
        <tr><td>Leistungsaufnahme Neugerät</td><td class="z">${neuW} W</td></tr>
        <tr><td>Anzahl Geräte</td><td class="z">${anzahl}</td></tr>
        <tr><td>Betriebsstunden je Jahr</td><td class="z">${stunden} h</td></tr>
        <tr><td>Strompreis</td><td class="z">${num(preis, 2)} €/kWh</td></tr>
        <tr><td>Investition gesamt</td><td class="z">${eur(invest)} €</td></tr>
      </table>`,
      rows: [
        { name: 'Jahresverbrauch Altbestand', op: '', unit: 'kWh', answer: altKwh, tol: { abs: 1 }, dec: 1 },
        { name: 'Jahresverbrauch Neugeräte', op: '', unit: 'kWh', answer: neuKwh, tol: { abs: 1 }, dec: 1 },
        { name: 'Stromkosten Altbestand je Jahr', op: '', unit: '€', answer: altKosten, tol: { abs: 1 } },
        { name: 'Stromkosten Neugeräte je Jahr', op: '', unit: '€', answer: neuKosten, tol: { abs: 1 } },
        { name: 'Jährliche Einsparung', op: '', unit: '€', answer: einsparung, tol: { abs: 1 }, ergebnis: true },
        { name: 'Amortisationszeit', op: '', unit: 'Monate', answer: amort, tol: { abs: 0.5 }, dec: 1, ergebnis: true }
      ],
      weg: [
        `Verbrauch alt = ${anzahl} × ${altW} W ÷ 1000 × ${stunden} h = ${num(altKwh, 1)} kWh`,
        `Verbrauch neu = ${anzahl} × ${neuW} W ÷ 1000 × ${stunden} h = ${num(neuKwh, 1)} kWh`,
        `Kosten alt = ${num(altKwh, 1)} × ${num(preis, 2)} = ${eur(altKosten)} €`,
        `Kosten neu = ${num(neuKwh, 1)} × ${num(preis, 2)} = ${eur(neuKosten)} €`,
        `Einsparung = ${eur(altKosten)} − ${eur(neuKosten)} = ${eur(einsparung)} €/Jahr`,
        `Amortisation = ${eur(invest)} ÷ ${eur(einsparung)} × 12 = ${num(amort, 1)} Monate`
      ],
      hinweis: 'Immer erst auf <em>kW</em> umrechnen (W ÷ 1000), dann mit den Betriebsstunden multiplizieren. Die Amortisationszeit wird in der IHK meist in Monaten verlangt: <span style="font-family:var(--mono)">Investition ÷ Einsparung × 12</span>.'
    };
  }
},

/* ---------- 8. RAID ---------- */
{
  t: 'ap1', id: 'raid', j: 1, bereich: 'hardware', titel: 'RAID: Nettokapazität & Ausfallsicherheit', punkte: 5,
  quelle: 'Systemtechnik · IHK-Aufgaben 2010–2019 „Speicher-RAID-USV“ (PPTX)',
  gen() {
    const level = pick(['0', '1', '5', '6', '10']);
    let n, kap;
    if (level === '0') { n = pick([2, 3, 4, 5, 6]); }
    else if (level === '1') { n = pick([2, 4, 6]); }
    else if (level === '5') { n = pick([3, 4, 5, 6]); }
    else if (level === '6') { n = pick([4, 5, 6]); }
    else { n = pick([4, 6]); }
    kap = pick([500, 1000, 2000, 4000, 8000, 16000]);

    let nutz, verlust, toleranz;
    if (level === '0') { nutz = n * kap; toleranz = 0; }
    else if (level === '1') { nutz = (n / 2) * kap; toleranz = n / 2; }
    else if (level === '5') { nutz = (n - 1) * kap; toleranz = 1; }
    else if (level === '6') { nutz = (n - 2) * kap; toleranz = 2; }
    else { nutz = (n / 2) * kap; toleranz = n / 2; }
    verlust = r1((n * kap - nutz) / (n * kap) * 100);
    const nutzTb = r2(nutz / 1000);

    return {
      szenario: `<p>Ein Server soll mit <strong>RAID ${level}</strong> und ${n} Festplatten zu je
        ${kap} GB betrieben werden. Ermitteln Sie die nutzbare Kapazität, den Kapazitätsverlust und
        wie viele Platten gleichzeitig ausfallen dürfen.</p>`,
      daten: `<table>
        <tr><th>Angabe</th><th class="z">Wert</th></tr>
        <tr><td>RAID-Level</td><td class="z">RAID ${level}</td></tr>
        <tr><td>Anzahl Festplatten</td><td class="z">${n}</td></tr>
        <tr><td>Kapazität je Festplatte</td><td class="z">${kap} GB</td></tr>
      </table>`,
      rows: [
        { name: 'Bruttokapazität aller Platten', op: '', unit: 'GB', answer: n * kap, tol: { abs: 0 }, dec: 0 },
        { name: 'Nutzbare Kapazität', op: '', unit: 'GB', answer: nutz, tol: { abs: 0 }, dec: 0, ergebnis: true },
        { name: 'Nutzbare Kapazität', op: '', unit: 'TB', answer: nutzTb, tol: { abs: 0.05 }, dec: 2 },
        { name: 'Kapazitätsverlust durch Redundanz', op: '', unit: '%', answer: verlust, tol: { abs: 0.2 } },
        { name: 'Gleichzeitig tolerierbare Plattenausfälle', op: '', unit: 'Platten', answer: toleranz, tol: { abs: 0 }, dec: 0, ergebnis: true }
      ],
      weg: [
        `Brutto = ${n} × ${kap} GB = ${num(n * kap, 0)} GB`,
        `Netto (RAID ${level}) = ${nutz === (n - 1) * kap ? `(${n} − 1)` : level === '0' ? `${n}` : level === '6' ? `(${n} − 2)` : `(${n} ÷ 2)`} × ${kap} GB = ${num(nutz, 0)} GB = ${num(nutzTb, 2)} TB`,
        `Verlust = (${num(n * kap, 0)} − ${num(nutz, 0)}) ÷ ${num(n * kap, 0)} × 100 = ${num(verlust, 1)} %`,
        `Ausfalltoleranz = ${toleranz} Platte(n)`
      ],
      hinweis: 'Eselsbrücke: RAID 0 = 0 Redundanz (nur Speed), RAID 1 = Spiegeln (halbe Kapazität), RAID 5 = eine Platte geht für Parität weg, RAID 6 = zwei, RAID 10 = Spiegelpaare im Stripe. In der IHK wird fast immer nach Netto-Kapazität <em>und</em> Ausfalltoleranz gefragt.'
    };
  }
},

/* ---------- 9. Netzplan (CPM) ---------- */
{
  t: 'ap1', id: 'netzplan', j: 2, bereich: 'pm', titel: 'Netzplan: Vorwärts- & Rückwärtsrechnung', punkte: 8,
  quelle: 'Kundenanfrage beantworten · „Aufgaben Netzplan“ 1–5 + Netzpläne 1–4 (PPT)',
  gen() {
    const namen = ['Bedarf analysieren', 'Angebote einholen', 'Hardware beschaffen', 'Software installieren',
      'Netzwerk konfigurieren', 'Daten migrieren', 'Testlauf durchführen', 'Schulung halten', 'Abnahme'];
    const buchstaben = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I'];
    const anzahl = R(6, 8);

    const vorgaenge = [];
    for (let i = 0; i < anzahl; i++) {
      const preds = [];
      if (i > 0) {
        preds.push(buchstaben[i - 1]);
        if (i > 2 && Math.random() < 0.45) preds.push(buchstaben[i - 2]);
      }
      vorgaenge.push({ id: buchstaben[i], name: namen[i], d: R(2, 12), preds });
    }

    /* Vorwärtsrechnung */
    const FA = {}, FE = {};
    for (const v of vorgaenge) {
      FA[v.id] = v.preds.length ? Math.max(...v.preds.map(p => FE[p])) : 0;
      FE[v.id] = FA[v.id] + v.d;
    }
    const ende = Math.max(...vorgaenge.map(v => FE[v.id]));
    /* Rückwärtsrechnung */
    const SA = {}, SE = {};
    for (let i = vorgaenge.length - 1; i >= 0; i--) {
      const v = vorgaenge[i];
      const nachf = vorgaenge.filter(x => x.preds.includes(v.id));
      SE[v.id] = nachf.length ? Math.min(...nachf.map(x => SA[x.id])) : ende;
      SA[v.id] = SE[v.id] - v.d;
    }
    const GP = {}; vorgaenge.forEach(v => GP[v.id] = SA[v.id] - FA[v.id]);
    const krit = vorgaenge.filter(v => GP[v.id] === 0).map(v => v.id);

    const ziel = pick(vorgaenge.filter(v => GP[v.id] > 0)) || vorgaenge[0];

    const tabelle = vorgaenge.map(v => `<tr>
        <td>${v.id}</td><td>${v.name}</td>
        <td class="z">${v.d}</td>
        <td>${v.preds.length ? v.preds.join(', ') : '–'}</td>
      </tr>`).join('');

    return {
      szenario: `<p>Für die Einführung eines IT-Systems wurde die folgende Vorgangsliste erstellt.
        Führen Sie die <strong>Vorwärts- und Rückwärtsrechnung</strong> durch, bestimmen Sie den
        <strong>Gesamtpuffer</strong> des Vorgangs <strong>${ziel.id}</strong> und den
        <strong>kritischen Weg</strong>.</p>`,
      daten: `<table>
        <tr><th>Vorgang</th><th>Tätigkeit</th><th class="z">Dauer (Tage)</th><th>Vorgänger</th></tr>
        ${tabelle}
      </table>`,
      rows: [
        { name: 'Gesamtdauer des Projekts', op: '', unit: 'Tage', answer: ende, tol: { abs: 0 }, dec: 0, ergebnis: true },
        { name: `Frühestes Ende von Vorgang ${ziel.id} (FE)`, op: '', unit: 'Tage', answer: FE[ziel.id], tol: { abs: 0 }, dec: 0 },
        { name: `Spätestes Ende von Vorgang ${ziel.id} (SE)`, op: '', unit: 'Tage', answer: SE[ziel.id], tol: { abs: 0 }, dec: 0 },
        { name: `Gesamtpuffer von Vorgang ${ziel.id} (SA − FA)`, op: '', unit: 'Tage', answer: GP[ziel.id], tol: { abs: 0 }, dec: 0, ergebnis: true },
        { name: 'Kritischer Weg (Buchstaben, z. B. A-C-F)', op: '', unit: '', text: krit.join('-'), antwortText: krit.join('-') }
      ],
      weg: [
        ...vorgaenge.map(v => `${v.id}: FA ${FA[v.id]} – FE ${FE[v.id]}   |   SA ${SA[v.id]} – SE ${SE[v.id]}   |   GP ${GP[v.id]}`),
        `Gesamtdauer = ${ende} Tage`,
        `Kritischer Weg = ${krit.join(' → ')} (Gesamtpuffer 0)`,
        `Gesamtpuffer ${ziel.id} = SA ${SA[ziel.id]} − FA ${FA[ziel.id]} = ${GP[ziel.id]} Tage`
      ],
      hinweis: 'Vorgehen: <em>Vorwärts</em> immer den größten FE der Vorgänger nehmen und die Dauer addieren. <em>Rückwärts</em> mit der Gesamtdauer starten und den kleinsten SA der Nachfolger nehmen, dann die Dauer abziehen. Vorgänge mit Gesamtpuffer 0 liegen auf dem kritischen Weg – Verzug hier verzögert das ganze Projekt.'
    };
  }
},

/* ---------- 10. Break-even / Systemvergleich ---------- */
{
  t: 'ap1', id: 'breakeven', j: 3, bereich: 'wirtschaft', titel: 'Break-even & Systemvergleich', punkte: 6,
  quelle: 'Kundenanfrage beantworten · „Probeklausur I“, Aufgabe 1 (System A vs. System B)',
  gen() {
    const fixA = R(15, 60) * 1000;
    const fixB = fixA + R(10, 60) * 1000;
    const varA = R(60, 140);
    const varB = varA - R(10, 50);
    const tage = R(200, 320);
    const stundenTag = R(4, 10);

    const stunden = tage * stundenTag;
    const kA = fixA + varA * stunden;
    const kB = fixB + varB * stunden;
    const schnitt = r1((fixB - fixA) / (varA - varB));
    const besser = kA < kB ? 'A' : 'B';
    const vorteil = r2(Math.abs(kA - kB));

    return {
      szenario: `<p>Ein Kunde wählt zwischen zwei Systemen. Das günstigere System hängt von der
        geplanten Nutzungsdauer ab. Berechnen Sie die Gesamtkosten beider Systeme für die geplante
        Betriebszeit und ermitteln Sie die <strong>kritische Menge</strong> (Break-even), ab der sich
        das andere System lohnt.</p>`,
      daten: `<table>
        <tr><th>Angabe</th><th class="z">System A</th><th class="z">System B</th></tr>
        <tr><td>Fixkosten je Jahr</td><td class="z">${eur(fixA)} €</td><td class="z">${eur(fixB)} €</td></tr>
        <tr><td>Variable Kosten je Betriebsstunde</td><td class="z">${eur(varA)} €</td><td class="z">${eur(varB)} €</td></tr>
        <tr><td>Nutzung: Tage je Jahr</td><td class="z" colspan="2">${tage}</td></tr>
        <tr><td>Betriebsstunden je Tag</td><td class="z" colspan="2">${stundenTag}</td></tr>
      </table>`,
      rows: [
        { name: 'Betriebsstunden je Jahr', op: '', unit: 'h', answer: stunden, tol: { abs: 0 }, dec: 0 },
        { name: 'Gesamtkosten System A', op: '', unit: '€', answer: kA, tol: { abs: 1 }, ergebnis: true },
        { name: 'Gesamtkosten System B', op: '', unit: '€', answer: kB, tol: { abs: 1 }, ergebnis: true },
        { name: 'Kritische Stundenzahl (Break-even)', op: '', unit: 'h', answer: schnitt, tol: { abs: 1 }, dec: 1 },
        { name: 'Empfehlung – welches System? (A / B)', op: '', unit: '', text: besser, antwortText: besser },
        { name: 'Kostenvorteil des empfohlenen Systems', op: '', unit: '€', answer: vorteil, tol: { abs: 1 } }
      ],
      weg: [
        `Betriebsstunden = ${tage} Tage × ${stundenTag} h = ${stunden} h`,
        `Kosten A = ${eur(fixA)} + ${eur(varA)} × ${stunden} = ${eur(kA)} €`,
        `Kosten B = ${eur(fixB)} + ${eur(varB)} × ${stunden} = ${eur(kB)} €`,
        `Break-even = (${eur(fixB)} − ${eur(fixA)}) ÷ (${eur(varA)} − ${eur(varB)}) = ${num(schnitt, 1)} h`,
        `Bei ${stunden} h ist System ${besser} günstiger – Vorteil ${eur(vorteil)} €`
      ],
      hinweis: 'Die Break-even-Menge ist der Schnittpunkt beider Kostengeraden: <span style="font-family:var(--mono)">x = (K<sub>fix,B</sub> − K<sub>fix,A</sub>) ÷ (k<sub>var,A</sub> − k<sub>var,B</sub>)</span>. Darunter ist das System mit den niedrigeren Fixkosten günstiger, darüber das mit den niedrigeren variablen Kosten.'
    };
  }
},

/* ---------- 11. Nutzwertanalyse ---------- */
{
  t: 'ap1', id: 'nutzwert', j: 1, bereich: 'angebot', titel: 'Nutzwertanalyse & Angebotsvergleich', punkte: 6,
  quelle: 'Systemtechnik · Tag 3/6 „Angebote bewerten“, „Nutzwertanalyse“ + Aufgaben 1–3',
  gen() {
    const kriterien = [
      { name: 'Anschaffungspreis', w: pick([20, 25, 30]) },
      { name: 'Betriebs- und Wartungskosten', w: pick([15, 20, 25]) },
      { name: 'Leistung / Performance', w: pick([15, 20, 25]) },
      { name: 'Support und Service', w: pick([10, 15, 20]) },
      { name: 'Erweiterbarkeit', w: pick([5, 10, 15]) }
    ];
    const summeW = kriterien.reduce((a, k) => a + k.w, 0);
    const namen = ['System Alpha', 'System Beta', 'System Gamma'];
    const punkte = kriterien.map(() => namen.map(() => R(1, 10)));
    const teilsummen = namen.map((_, j) => kriterien.map((k, i) => r2(punkte[i][j] * k.w / 100)));
    const gesamt = namen.map((_, j) => r2(teilsummen[j].reduce((a, b) => a + b, 0)));
    const bester = gesamt.indexOf(Math.max(...gesamt));

    const tabelle = kriterien.map((k, i) => `<tr>
        <td>${k.name}</td><td class="z">${k.w} %</td>
        ${namen.map((_, j) => `<td class="z">${punkte[i][j]}</td>`).join('')}
      </tr>`).join('');

    return {
      szenario: `<p>Drei Anbieter haben Angebote abgegeben. Bewerten Sie die Angebote mit einer
        <strong>Nutzwertanalyse</strong>: Multiplizieren Sie die erreichten Punkte je Kriterium mit der
        Gewichtung und summieren Sie zum Gesamtnutzwert.</p>`,
      daten: `<table>
        <tr><th>Kriterium</th><th class="z">Gewichtung</th>${namen.map(n => `<th class="z">${n}</th>`).join('')}</tr>
        ${tabelle}
      </table>`,
      rows: [
        ...namen.map((n, j) => ({
          name: `Gesamtnutzwert ${n}`, op: '', unit: 'Punkte',
          answer: gesamt[j], tol: { abs: 0.15 }, ergebnis: true
        })),
        { name: 'Summe der Gewichtungen (Kontrolle)', op: '', unit: '%', answer: summeW, tol: { abs: 0 }, dec: 0 },
        { name: 'Empfehlung – welches System? (Alpha / Beta / Gamma)', op: '', unit: '', text: namen[bester].split(' ')[1], antwortText: namen[bester] }
      ],
      weg: [
        ...kriterien.map((k, i) => `${k.name} (${k.w} %): ${namen.map((_, j) => `${punkte[i][j]} → ${num(teilsummen[j][i], 2)}`).join('  |  ')}`),
        ...namen.map((n, j) => `Gesamtnutzwert ${n} = ${teilsummen[j].map(x => num(x, 2)).join(' + ')} = ${num(gesamt[j], 2)} Punkte`),
        `Empfehlung: ${namen[bester]} (höchster Nutzwert)`
      ],
      hinweis: 'Kontrolle: Die Gewichtungen müssen zusammen 100 % ergeben. Der Nutzwert je Zelle ist <span style="font-family:var(--mono)">Punkte × Gewichtung ÷ 100</span>. Die Nutzwertanalyse ist ein <em>qualitatives</em> Verfahren – die reine Preisdifferenz sagt nichts über die Gesamteignung aus.'
    };
  }
},

/* ---------- 12. Zinsrechnung ---------- */
{

  quelle: 'Kundenanfrage beantworten · „Einfache Zinsrechnung“ (PPTX)',

    const kapital = R(5, 90) * 1000;

    const zinsTage = r2(kapital * zinsP * tage / (100 * 360));

    return {
      szenario: `<p>Für die Anschaffung von Hardware nimmt Ihr Unternehmen einen Kredit auf. Berechnen
        Sie die Zinsen für den angegebenen Zeitraum (kaufmännisch: 360 Tage / 12 Monate zu 30 Tagen)

        <tr><td>Zinssatz je Jahr</td><td class="z">${pct(zinsP)}</td></tr>
        <tr><td>Laufzeit</td><td class="z">${tage} Tage (${monate} Monate)</td></tr>
      </table>`,
      rows: [
        { name: `Zinsen für ${tage} Tage (Z = K × p × t ÷ 100 ÷ 360)`, op: '', unit: '€', answer: zinsTage, tol: { abs: 0.5 }, ergebnis: true },
        { name: 'Jahreszinsen (K × p ÷ 100)', op: '', unit: '€', answer: zinsJahr, tol: { abs: 0.5 } },
        { name: 'Zinsen je Monat', op: '', unit: '€', answer: zinsMonat, tol: { abs: 0.5 } },
        { name: `Monatliche Tilgungsrate (Kapital ÷ ${monate})`, op: '', unit: '€', answer: rate, tol: { abs: 0.5 } },
        { name: 'Gesamtbelastung bei 1 Jahr Laufzeit', op: '', unit: '€', answer: gesamt, tol: { abs: 0.5 } }
      ],
      weg: [
        `Tageszinsen = ${eur(kapital)} × ${num(zinsP, 1)} × ${tage} ÷ (100 × 360) = ${eur(zinsTage)} €`,
        `Jahreszinsen = ${eur(kapital)} × ${num(zinsP, 1)} ÷ 100 = ${eur(zinsJahr)} €`,
        `Monatszinsen = ${eur(zinsJahr)} ÷ 12 = ${eur(zinsMonat)} €`,
        `Tilgung = ${eur(kapital)} ÷ ${monate} = ${eur(rate)} €`,
        `Gesamt = ${eur(kapital)} + ${eur(zinsJahr)} = ${eur(gesamt)} €`
      ],
      hinweis: 'Bei der kaufmännischen Zinsrechnung gilt immer: <em>360 Tage</em> im Jahr, <em>30 Tage</em> im Monat. Deshalb werden 12 Monate mit 360 Tagen gerechnet, nicht mit 365.'
    };
  }
},

/* ---------- 13. Subnetting (Lücke Netzwerktechnik) ---------- */
{
  t: 'ap1', id: 'subnetz', j: 1, bereich: 'netzwerk', titel: 'IPv4-Subnetting', punkte: 5,
  quelle: 'Nicht im Material – Lücke. IHK-AP1-Häufigkeit Netzwerktechnik: 90 %',
  gen() {
    const cidr = pick([24, 25, 26, 27, 28, 29, 30]);
    const ip = [192, 168, R(0, 40), R(1, 250)];
    const oktette = [255, 255, 255, 256 - Math.pow(2, 32 - cidr)];
    const hostBits = 32 - cidr;
    const hostNutz = Math.pow(2, hostBits) - 2;
    const blockSize = Math.pow(2, 32 - cidr);
    const netzLetztes = Math.floor(ip[3] / blockSize) * blockSize;
    const netz = `${ip[0]}.${ip[1]}.${ip[2]}.${netzLetztes}`;
    const bcast = `${ip[0]}.${ip[1]}.${ip[2]}.${netzLetztes + blockSize - 1}`;
    const erste = `${ip[0]}.${ip[1]}.${ip[2]}.${netzLetztes + 1}`;
    const letzte = `${ip[0]}.${ip[1]}.${ip[2]}.${netzLetztes + blockSize - 2}`;

    return {
      szenario: `<p>Für einen neuen Standort ist ein Subnetz zu planen. Ermitteln Sie aus der
        angegebenen IP-Adresse mit Präfixlänge die <strong>Netzadresse</strong>, die
        <strong>Broadcast-Adresse</strong>, die <strong>Subnetzmaske</strong> und die Anzahl der
        nutzbaren Hosts.</p>`,
      daten: `<table>
        <tr><th>Angabe</th><th class="z">Wert</th></tr>
        <tr><td>IP-Adresse</td><td class="z">${ip.join('.')}</td></tr>
        <tr><td>Präfixlänge (CIDR)</td><td class="z">/${cidr}</td></tr>
      </table>`,
      rows: [
        { name: 'Subnetzmaske (dezimal)', op: '', unit: '', text: oktette.join('.'), antwortText: oktette.join('.') },
        { name: 'Netzadresse', op: '', unit: '', text: netz, antwortText: netz },
        { name: 'Erste nutzbare Host-Adresse', op: '', unit: '', text: erste, antwortText: erste },
        { name: 'Letzte nutzbare Host-Adresse', op: '', unit: '', text: letzte, antwortText: letzte },
        { name: 'Broadcast-Adresse', op: '', unit: '', text: bcast, antwortText: bcast },
        { name: 'Anzahl nutzbarer Hosts', op: '', unit: 'Hosts', answer: hostNutz, tol: { abs: 0 }, dec: 0, ergebnis: true }
      ],
      weg: [
        `Hostbits = 32 − ${cidr} = ${hostBits} Bit`,
        `Subnetzmaske = ${oktette.join('.')}  (Blockgröße ${blockSize})`,
        `Netzadresse = ${ip.join('.')} auf Blockgrenze abgerundet = ${netz}`,
        `Erster Host = ${erste}   |   Letzter Host = ${letzte}`,
        `Broadcast = ${bcast}`,
        `Nutzbare Hosts = 2^${hostBits} − 2 = ${hostNutz}`
      ],
      hinweis: 'Rechne immer in der Blockgröße: <span style="font-family:var(--mono)">Blockgröße = 256 − letztes Maskenoktett</span>. Das letzte Oktett der IP wird auf das nächste Vielfache der Blockgröße abgerundet – das ist die Netzadresse. Zwei Adressen gehen immer verloren: Netzadresse und Broadcast.'
    };
  }
},

/* ---------- 14. Verfügbarkeit (Lücke IT-Sicherheit) ---------- */
{
  t: 'ap1', id: 'verfuegbar', j: 2, bereich: 'sicherheit', titel: 'Verfügbarkeit & Ausfallzeit', punkte: 4,
  quelle: 'Nicht im Material – Lücke. IHK-AP1-Häufigkeit IT-Sicherheit: 80 % (Schutzziele)',
  gen() {
    const stundenJahr = 8760;
    const ausfall = pick([4, 8, 12, 24, 44, 87.6, 175]);
    const mtbf = R(1000, 20000);
    const mttr = pick([1, 2, 4, 6, 8, 12]);
    const sla = pick([99.0, 99.5, 99.9, 99.95, 99.99]);

    const verf = r2((stundenJahr - ausfall) / stundenJahr * 100);
    const verfMT = r2(mtbf / (mtbf + mttr) * 100);
    const erlaubt = r2(stundenJahr * (100 - sla) / 100);
    const minutenAusfall = Math.round(ausfall * 60);

    return {
      szenario: `<p>Für eine Servicevereinbarung müssen Sie die Verfügbarkeit eines Systems bewerten
        und belegen, ob die zugesagte Verfügbarkeit eingehalten wurde. Berechnen Sie die tatsächliche
        Verfügbarkeit in Prozent sowie die zulässige Ausfallzeit.</p>`,
      daten: `<table>
        <tr><th>Angabe</th><th class="z">Wert</th></tr>
        <tr><td>Stunden je Jahr (8760)</td><td class="z">${stundenJahr} h</td></tr>
        <tr><td>Gemessene Ausfallzeit</td><td class="z">${num(ausfall, 1)} h</td></tr>
        <tr><td>Zugesagte Verfügbarkeit (SLA)</td><td class="z">${num(sla, 2)} %</td></tr>
        <tr><td>MTBF (mittlere Zeit zwischen Ausfällen)</td><td class="z">${mtbf} h</td></tr>
        <tr><td>MTTR (mittlere Wiederherstellungszeit)</td><td class="z">${mttr} h</td></tr>
      </table>`,
      rows: [
        { name: 'Ausfallzeit in Minuten', op: '', unit: 'min', answer: minutenAusfall, tol: { abs: 0 }, dec: 0 },
        { name: 'Tatsächliche Verfügbarkeit', op: '', unit: '%', answer: verf, tol: { abs: 0.05 }, dec: 2, ergebnis: true },
        { name: 'Zulässige Ausfallzeit laut SLA', op: '', unit: 'h', answer: erlaubt, tol: { abs: 0.5 }, dec: 2 },
        { name: 'Verfügbarkeit aus MTBF / MTTR', op: '', unit: '%', answer: verfMT, tol: { abs: 0.05 }, dec: 2 },
        { name: 'SLA eingehalten? (ja / nein)', op: '', unit: '', text: verf >= sla ? 'ja' : 'nein', antwortText: verf >= sla ? 'JA' : 'NEIN' }
      ],
      weg: [
        `Ausfallzeit = ${num(ausfall, 1)} h × 60 = ${minutenAusfall} min`,
        `Verfügbarkeit = (${stundenJahr} − ${num(ausfall, 1)}) ÷ ${stundenJahr} × 100 = ${num(verf, 2)} %`,
        `Zulässige Ausfallzeit = ${stundenJahr} × (100 − ${num(sla, 2)}) ÷ 100 = ${num(erlaubt, 2)} h`,
        `Verfügbarkeit (MTBF/MTTR) = ${mtbf} ÷ (${mtbf} + ${mttr}) × 100 = ${num(verfMT, 2)} %`,
        `Vergleich: ${num(verf, 2)} % ${verf >= sla ? '≥' : '<'} ${num(sla, 2)} % → SLA ${verf >= sla ? 'eingehalten' : 'verletzt'}`
      ],
      hinweis: 'Verfügbarkeit ist das Schutziel der IT-Sicherheit, das am häufigsten berechnet wird. Merke: <span style="font-family:var(--mono)">MTBF ÷ (MTBF + MTTR)</span>. 99,9 % klingen viel, erlauben aber im Jahr noch 8,76 Stunden Ausfall.'
    };
  }
},

/* ---------- 15. Speicher- & Backup-Bedarf ---------- */
{
  t: 'ap1', id: 'speicher', j: 2, bereich: 'datenbank', titel: 'Speicher- & Backup-Bedarf', punkte: 5,
  quelle: 'Datenbank-Ordner · Datenmengen/Speicherbedarf + Systemtechnik Speichermedien',
  gen() {
    const saetze = R(20, 900) * 1000;
    const felder = R(8, 20);
    const feldGroesse = R(20, 120);
    const overhead = pick([1.1, 1.15, 1.2, 1.3]);
    const generationen = pick([7, 14, 30]);
    const kompression = pick([1.0, 1.5, 2.0, 2.5]);
    const wachstum = pick([5, 10, 15, 20]);

    const rohBytes = saetze * felder * feldGroesse;
    const dbMB = r2(rohBytes * overhead / 1024 / 1024);
    const backupMB = r2(dbMB * generationen / kompression);
    const jahr1 = r2(dbMB * (1 + wachstum / 100));

    return {
      szenario: `<p>Für die Planung eines neuen Datenbankservers ist der Speicherbedarf zu ermitteln.
        Berechnen Sie die Datenbankgröße, den Bedarf für die tägliche Sicherung
        (${generationen} Generationen, Kompression ×${num(kompression, 1)}) und die Prognose nach einem
        Jahr bei ${pv(wachstum)} Wachstum.</p>`,
      daten: `<table>
        <tr><th>Angabe</th><th class="z">Wert</th></tr>
        <tr><td>Anzahl Datensätze</td><td class="z">${num(saetze, 0)}</td></tr>
        <tr><td>Felder je Datensatz</td><td class="z">${felder}</td></tr>
        <tr><td>Durchschnittliche Feldgröße</td><td class="z">${feldGroesse} Byte</td></tr>
        <tr><td>Overhead (Indexe, Verwaltung)</td><td class="z">×${num(overhead, 2)}</td></tr>
        <tr><td>Backup-Generationen</td><td class="z">${generationen}</td></tr>
        <tr><td>Kompressionsfaktor</td><td class="z">×${num(kompression, 1)}</td></tr>
        <tr><td>Jährliches Datenwachstum</td><td class="z">${pct(wachstum)}</td></tr>
      </table>`,
      rows: [
        { name: 'Rohdatenmenge in Byte', op: '', unit: 'Byte', answer: rohBytes, tol: { abs: 0 }, dec: 0 },
        { name: 'Datenbankgröße in MB (mit Overhead)', op: '', unit: 'MB', answer: dbMB, tol: { abs: 0.5 }, dec: 2, ergebnis: true },
        { name: 'Datenbankgröße in GB', op: '', unit: 'GB', answer: r2(dbMB / 1024), tol: { abs: 0.01 }, dec: 3 },
        { name: 'Backup-Bedarf für alle Generationen', op: '', unit: 'MB', answer: backupMB, tol: { abs: 1 }, dec: 2, ergebnis: true },
        { name: `Datenbankgröße nach einem Jahr (+${wachstum} %)`, op: '', unit: 'MB', answer: jahr1, tol: { abs: 0.5 }, dec: 2 }
      ],
      weg: [
        `Rohdaten = ${num(saetze, 0)} Sätze × ${felder} Felder × ${feldGroesse} Byte = ${num(rohBytes, 0)} Byte`,
        `Datenbank = ${num(rohBytes, 0)} Byte × ${num(overhead, 2)} ÷ 1024 ÷ 1024 = ${num(dbMB, 2)} MB`,
        `In GB: ${num(dbMB, 2)} MB ÷ 1024 = ${num(r2(dbMB / 1024), 3)} GB`,
        `Backups = ${num(dbMB, 2)} MB × ${generationen} ÷ ${num(kompression, 1)} = ${num(backupMB, 2)} MB`,
        `Nach 1 Jahr = ${num(dbMB, 2)} MB × ${num(1 + wachstum / 100, 2)} = ${num(jahr1, 2)} MB`
      ],
      hinweis: 'Rechenweg in der Prüfung immer in dieser Reihenfolge: <em>Sätze × Felder × Feldgröße</em> ergibt die Rohdatenmenge in Byte, dann ÷ 1024 (KB), ÷ 1024 (MB), ÷ 1024 (GB). Overhead nicht vergessen – in der Praxis sind es 10 bis 30 %.'
    };
  }
},

/* ---------- 16. Neuron vorwärts rechnen & Lernregel ---------- */
{
  t: 'ap1', id: 'ki-neuron', j: 1, bereich: 'ki', titel: 'Neuron vorwärts rechnen & Lernregel', punkte: 6,
  quelle: 'Fidup-Wiki · neural-network und ki (Perzeptron)',
  gen() {
    const x1 = pick([0.5, 1, 1.5, 2]);
    const x2 = pick([0.4, 0.6, 0.8, 1]);
    const w1 = pick([0.2, 0.4, 0.5, 0.6]);
    const w2 = pick([-0.5, -0.3, 0.3, 0.5]);
    const b = pick([-0.1, 0.1, 0.2, 0.4]);
    const lern = pick([0.1, 0.2, 0.3]);
    const ziel = pick([1, 0]);
    const z = r2(x1 * w1 + x2 * w2 + b);
    const a = r2(Math.max(0, z));                 /* ReLU */
    const fehler = r2(ziel - a);
    const dw1 = r2(lern * fehler * x1);
    const dw2 = r2(lern * fehler * x2);
    const w1n = r2(w1 + dw1);
    const w2n = r2(w2 + dw2);
    return {
      szenario: `<p>Ein einzelnes künstliches Neuron mit zwei Eingaben soll nachvollzogen werden. Die
        Aktivierungsfunktion ist <em>ReLU</em> (f(z) = max(0, z)). Berechnen Sie die gewichtete Summe, die
        Ausgabe und die Anpassung nach der Lernregel Δw = α · (t − a) · x.</p>`,
      daten: `<table>
        <tr><th>Größe</th><th class="z">Wert</th></tr>
        <tr><td>Eingabe x₁</td><td class="z">${num(x1, 1)}</td></tr>
        <tr><td>Eingabe x₂</td><td class="z">${num(x2, 1)}</td></tr>
        <tr><td>Gewicht w₁</td><td class="z">${num(w1, 1)}</td></tr>
        <tr><td>Gewicht w₂</td><td class="z">${num(w2, 1)}</td></tr>
        <tr><td>Bias b</td><td class="z">${num(b, 1)}</td></tr>
        <tr><td>Lernrate α</td><td class="z">${num(lern, 1)}</td></tr>
        <tr><td>Zielausgabe t</td><td class="z">${ziel}</td></tr>
      </table>`,
      rows: [
        { name: 'Gewichtete Summe z', op: '', unit: '', answer: z, tol: { abs: 0.02 }, dec: 2, ergebnis: true },
        { name: 'Ausgabe a nach ReLU', op: '', unit: '', answer: a, tol: { abs: 0.02 }, dec: 2, ergebnis: true },
        { name: 'Fehler (t − a)', op: '', unit: '', answer: fehler, tol: { abs: 0.02 }, dec: 2 },
        { name: 'Δw₁ = α · (t−a) · x₁', op: '', unit: '', answer: dw1, tol: { abs: 0.02 }, dec: 2 },
        { name: 'Δw₂ = α · (t−a) · x₂', op: '', unit: '', answer: dw2, tol: { abs: 0.02 }, dec: 2 },
        { name: 'Neues w₁', op: '', unit: '', answer: w1n, tol: { abs: 0.02 }, dec: 2, ergebnis: true },
        { name: 'Neues w₂', op: '', unit: '', answer: w2n, tol: { abs: 0.02 }, dec: 2, ergebnis: true }
      ],
      weg: [
        `z = x₁·w₁ + x₂·w₂ + b = ${num(x1, 1)}·${num(w1, 1)} + ${num(x2, 1)}·${num(w2, 1)} + ${num(b, 1)} = ${num(z, 2)}`,
        `a = max(0, ${num(z, 2)}) = ${num(a, 2)}`,
        `Fehler = t − a = ${ziel} − ${num(a, 2)} = ${num(fehler, 2)}`,
        `Δw₁ = ${num(lern, 1)} × ${num(fehler, 2)} × ${num(x1, 1)} = ${num(dw1, 2)}`,
        `Δw₂ = ${num(lern, 1)} × ${num(fehler, 2)} × ${num(x2, 1)} = ${num(dw2, 2)}`,
        `Neues w₁ = ${num(w1, 1)} + ${num(dw1, 2)} = ${num(w1n, 2)}`,
        `Neues w₂ = ${num(w2, 1)} + ${num(dw2, 2)} = ${num(w2n, 2)}`
      ],
      hinweis: 'Die Lernregel Δw = α · (t − a) · x passt ein Gewicht umso stärker an, je größer der Fehler und je größer die Eingabe ist. Ist der Fehler null, ändert sich nichts.'
    };
  }
},

/* ---------- 17. Modell bewerten: Confusion Matrix ---------- */
{
  t: 'ap1', id: 'ki-metrik', j: 2, bereich: 'ki', titel: 'Modell bewerten: Accuracy, Precision, Recall, F1', punkte: 7,
  quelle: 'Fidup-Wiki · klassifikation (Confusion Matrix)',
  gen() {
    const tp = R(20, 90);
    const fp = R(5, 40);
    const fn = R(5, 40);
    const tn = R(40, 200);
    const gesamt = tp + fp + fn + tn;
    const acc = r2((tp + tn) / gesamt * 100);
    const prec = r2(tp / (tp + fp) * 100);
    const rec = r2(tp / (tp + fn) * 100);
    const f1 = r2(2 * prec * rec / (prec + rec));
    return {
      szenario: `<p>Ein Klassifikationsmodell (z. B. Spam-Erkennung) wurde an einem Testdatensatz geprüft.
        Die Confusion Matrix liefert die vier Werte TP, FP, FN und TN. Berechnen Sie die üblichen
        Bewertungsmaße in Prozent.</p>`,
      daten: `<table>
        <tr><th>Ausgang</th><th class="z">Wert</th></tr>
        <tr><td>TP – richtig positiv</td><td class="z">${tp}</td></tr>
        <tr><td>FP – falsch positiv</td><td class="z">${fp}</td></tr>
        <tr><td>FN – falsch negativ</td><td class="z">${fn}</td></tr>
        <tr><td>TN – richtig negativ</td><td class="z">${tn}</td></tr>
      </table>`,
      rows: [
        { name: 'Gesamtzahl der Fälle', op: '', unit: '', answer: gesamt, tol: { abs: 0 }, dec: 0 },
        { name: 'Accuracy (Trefferquote)', op: '', unit: '%', answer: acc, tol: { abs: 0.05 }, dec: 2 },
        { name: 'Precision', op: '', unit: '%', answer: prec, tol: { abs: 0.05 }, dec: 2 },
        { name: 'Recall', op: '', unit: '%', answer: rec, tol: { abs: 0.05 }, dec: 2 },
        { name: 'F1-Score', op: '', unit: '%', answer: f1, tol: { abs: 0.1 }, dec: 2, ergebnis: true }
      ],
      weg: [
        `Gesamt = ${tp} + ${fp} + ${fn} + ${tn} = ${gesamt}`,
        `Accuracy = (TP + TN) ÷ Gesamt = (${tp} + ${tn}) ÷ ${gesamt} = ${num(acc, 2)} %`,
        `Precision = TP ÷ (TP + FP) = ${tp} ÷ (${tp} + ${fp}) = ${num(prec, 2)} %`,
        `Recall = TP ÷ (TP + FN) = ${tp} ÷ (${tp} + ${fn}) = ${num(rec, 2)} %`,
        `F1 = 2 × (Precision × Recall) ÷ (Precision + Recall) = 2 × ${num(prec, 2)} × ${num(rec, 2)} ÷ (${num(prec, 2)} + ${num(rec, 2)}) = ${num(f1, 2)} %`
      ],
      hinweis: 'Accuracy kann bei ungleichen Klassen täuschen: Sind 95 % aller Mails kein Spam, wirkt ein Modell, das immer „kein Spam" sagt, mit 95 % genau – hat aber Recall 0. Deshalb immer Precision, Recall und F1 mit angeben.'
    };
  }
},

/* ---------- 18. GPU-Kosten & Trainingsdauer für ein Modell ---------- */
{
  t: 'ap1', id: 'ki-gpu-kosten', j: 2, bereich: 'ki', titel: 'GPU-Kosten & Trainingsdauer', punkte: 6,
  quelle: 'Eigene Ableitung aus Fidup-Wiki · ki-vs-ml-vs-dl (Rechenbedarf)',
  gen() {
    const gpUS = pick([1, 2, 4, 8]);
    const stunden = R(4, 60);
    const preisStunde = pick([1.5, 2.0, 2.5, 3.0, 3.5]);
    const datenGB = pick([50, 120, 250, 500]);
    const wiederholungen = pick([3, 5, 10]);

    const gpuStunden = r2(gpUS * stunden);
    const kosten = r2(gpuStunden * preisStunde);
    const datenVolumen = datenGB * wiederholungen;
    const kostenProEpoche = r2(kosten / wiederholungen);
    return {
      szenario: `<p>Für das Training eines neuronalen Netzes werden GPUs gemietet. Berechnen Sie die
        gesamte GPU-Zeit, die Kosten und das verarbeitete Datenvolumen. Eine Epoche ist ein vollständiger
        Durchlauf über alle Trainingsdaten.</p>`,
      daten: `<table>
        <tr><th>Angabe</th><th class="z">Wert</th></tr>
        <tr><td>Anzahl GPUs</td><td class="z">${gpUS}</td></tr>
        <tr><td>Trainingsdauer</td><td class="z">${stunden} h</td></tr>
        <tr><td>Preis je GPU und Stunde</td><td class="z">${eur(preisStunde)} €</td></tr>
        <tr><td>Trainingsdatensatz</td><td class="z">${datenGB} GB</td></tr>
        <tr><td>Anzahl Epochen</td><td class="z">${wiederholungen}</td></tr>
      </table>`,
      rows: [
        { name: 'Gesamte GPU-Stunden', op: '', unit: 'h', answer: gpuStunden, tol: { abs: 0.1 }, dec: 2, ergebnis: true },
        { name: 'Gesamtkosten', op: '', unit: '€', answer: kosten, tol: { abs: 0.5 }, dec: 2, ergebnis: true },
        { name: 'Kosten je Epoche', op: '', unit: '€', answer: kostenProEpoche, tol: { abs: 0.5 }, dec: 2 },
        { name: 'Verarbeitetes Datenvolumen (alle Epochen)', op: '', unit: 'GB', answer: datenVolumen, tol: { abs: 0 }, dec: 0, ergebnis: true }
      ],
      weg: [
        `GPU-Stunden = ${gpUS} × ${stunden} = ${num(gpuStunden, 2)} h`,
        `Kosten = ${num(gpuStunden, 2)} h × ${eur(preisStunde)} € = ${eur(kosten)} €`,
        `Kosten je Epoche = ${eur(kosten)} ÷ ${wiederholungen} = ${eur(kostenProEpoche)} €`,
        `Datenvolumen = ${datenGB} GB × ${wiederholungen} Epochen = ${datenVolumen} GB`
      ],
      hinweis: 'Deep Learning ist rechenintensiv: Kosten skalieren mit GPUs × Zeit. Weniger Epochen, kleinere Modelle oder gemietete statt eigener Hardware senken die Kosten – dürfen aber die Genauigkeit nicht unter das Ziel drücken.'
    };
  }
},

/* ---------- 19. Nutzen & Amortisation eines KI-Systems ---------- */
{
  t: 'ap1', id: 'ki-wirtschaft', j: 3, bereich: 'ki', titel: 'KI-System: Nutzen & Amortisation', punkte: 6,
  quelle: 'Eigene Ableitung – Wirtschaftlichkeitsrechnung für eine KI-Investition',
  gen() {
    const anschluss = R(30, 95) * 1000;      /* einmalige Investition */
    const monat = pick([800, 1000, 1200, 1500, 2000]);
    const ausfaelle = pick([2, 3, 4, 5, 6]);
    const kostenPro = R(4, 12) * 1000;

    const nutzen = ausfaelle * kostenPro;
    const laufend = monat * 12;
    const ueberschuss = nutzen - laufend;
    const amort = ueberschuss > 0 ? r2(anschluss / ueberschuss) : null;
    return {
      szenario: `<p>Für ein KI-System zur vorbeugenden Wartung liegen die Zahlen vor. Berechnen Sie den
        jährlichen Nutzen, die laufenden Kosten, den jährlichen Überschuss und die Amortisationszeit.
        Ist der Überschuss negativ, tragen Sie bei der Amortisation bitte <em>0</em> ein.</p>`,
      daten: `<table>
        <tr><th>Angabe</th><th class="z">Wert</th></tr>
        <tr><td>Einmalige Anschaffung</td><td class="z">${eur(anschluss)} €</td></tr>
        <tr><td>Laufende Kosten je Monat</td><td class="z">${eur(monat)} €</td></tr>
        <tr><td>Vermiedene Ausfälle je Jahr</td><td class="z">${ausfaelle}</td></tr>
        <tr><td>Kosten je Ausfall</td><td class="z">${eur(kostenPro)} €</td></tr>
      </table>`,
      rows: [
        { name: 'Jährlicher Nutzen (vermiedene Ausfälle)', op: '', unit: '€', answer: nutzen, tol: { abs: 0 }, dec: 2, ergebnis: true },
        { name: 'Laufende Kosten je Jahr', op: '', unit: '€', answer: laufend, tol: { abs: 0 }, dec: 2, ergebnis: true },
        { name: 'Jährlicher Überschuss', op: '', unit: '€', answer: ueberschuss, tol: { abs: 0 }, dec: 2, ergebnis: true },
        { name: 'Amortisationszeit', op: '', unit: 'Jahre', answer: amort === null ? 0 : amort, tol: { abs: 0.05 }, dec: 2, ergebnis: true },
        { name: 'Lohnt sich die Investition? (ja / nein)', op: '', unit: '', text: ueberschuss > 0 ? 'ja' : 'nein', antwortText: ueberschuss > 0 ? 'JA' : 'NEIN' }
      ],
      weg: [
        `Nutzen = ${ausfaelle} Ausfälle × ${eur(kostenPro)} € = ${eur(nutzen)} €/Jahr`,
        `Laufende Kosten = ${eur(monat)} € × 12 = ${eur(laufend)} €/Jahr`,
        `Überschuss = ${eur(nutzen)} − ${eur(laufend)} = ${eur(ueberschuss)} €/Jahr`,
        ueberschuss > 0
          ? `Amortisation = ${eur(anschluss)} ÷ ${eur(ueberschuss)} = ${num(amort, 2)} Jahre`
          : 'Der Überschuss ist negativ – die Investition amortisiert sich nach dieser Rechnung nicht.',
        `Entscheidung: ${ueberschuss > 0 ? 'Die Investition rechnet sich.' : 'Die Investition rechnet sich nicht.'}`
      ],
      hinweis: 'Wie bei jeder Investition gilt: Nutzen und laufende Kosten gegenüberstellen und dann amortisieren. Bei KI kommen weiche Faktoren hinzu (Qualität, Sicherheit, Kundenzufriedenheit) – sie ersetzen aber keine belastbare Rechnung.'
    };
  }
},

/* ---------- 20. Netzwerk: Übertragungszeit und Datenvolumen ---------- */
{
  t: 'ap1', id: 'netz-uebertragung', j: 1, bereich: 'netzwerk', titel: 'Übertragungszeit & Datenvolumen', punkte: 5,
  quelle: 'IHK-Prüfungskatalog · PK-03 (Übertragungsraten, -zeiten, Datenmengen)',
  gen() {
    const mb = pick([8, 12, 24, 48, 96, 120, 250, 400]);
    const rate = pick([8, 10, 16, 24, 50, 100, 200]);
    const wirkungsgrad = pick([0.6, 0.7, 0.8]);
    const zahlGeräte = pick([10, 15, 20, 25]);
    const streamMBh = pick([600, 800, 1200]);

    const mbit = mb * 8;
    const sekunden = r2(mbit / rate);
    const nettoSek = r2(mbit / (rate * wirkungsgrad));
    const mbitProStd = zahlGeräte * streamMBh * 8;
    return {
      szenario: `<p>Für die Planung einer Datenverbindung sind Übertragungszeiten und Datenmengen zu
        berechnen. Rechnen Sie MB immer in Mbit um (× 8) und beachten Sie die Nutzrate (Wirkungsgrad) der
        Leitung.</p>`,
      daten: `<table>
        <tr><th>Angabe</th><th class="z">Wert</th></tr>
        <tr><td>Zu übertragende Datei</td><td class="z">${mb} MB</td></tr>
        <tr><td>Übertragungsrate</td><td class="z">${rate} Mbit/s</td></tr>
        <tr><td>Nutzrate (Wirkungsgrad)</td><td class="z">${pct(wirkungsgrad * 100)}</td></tr>
        <tr><td>Geräte für Streaming</td><td class="z">${zahlGeräte}</td></tr>
        <tr><td>Daten je Gerät und Stunde</td><td class="z">${streamMBh} MB</td></tr>
      </table>`,
      rows: [
        { name: 'Dateigröße in Mbit', op: '', unit: 'Mbit', answer: mbit, tol: { abs: 0 }, dec: 0 },
        { name: 'Übertragungszeit bei voller Rate', op: '', unit: 's', answer: sekunden, tol: { abs: 0.1 }, dec: 2, ergebnis: true },
        { name: 'Übertragungszeit bei Nutzrate', op: '', unit: 's', answer: nettoSek, tol: { abs: 0.1 }, dec: 2, ergebnis: true },
        { name: 'Nötige Bandbreite für alle Geräte', op: '', unit: 'Mbit/s', answer: r2(mbitProStd / 3600), tol: { abs: 0.5 }, dec: 2, ergebnis: true }
      ],
      weg: [
        `Dateigröße = ${mb} MB × 8 = ${mbit} Mbit`,
        `Zeit = ${mbit} Mbit ÷ ${rate} Mbit/s = ${num(sekunden, 2)} s`,
        `Zeit bei Nutzrate = ${mbit} ÷ (${rate} × ${num(wirkungsgrad, 1)}) = ${num(nettoSek, 2)} s`,
        `Daten je Stunde = ${zahlGeräte} × ${streamMBh} MB × 8 = ${mbitProStd} Mbit/h → ÷ 3600 = ${num(mbitProStd / 3600, 2)} Mbit/s`
      ],
      hinweis: 'Der klassische Fehlerpunkt: <em>1 Byte = 8 Bit</em>. Wer MB durch Mbit/s teilt, ohne × 8, kommt um den Faktor 8 daneben. Die Nutzrate liegt in der Praxis unter 100 % – die Leitung erreicht die Nennrate selten voll.'
    };
  }
},

/* ---------- 21. Sicherheit: Verfügbarkeit und Backup-Volumen ---------- */
{
  t: 'ap1', id: 'sich-backup', j: 2, bereich: 'sicherheit', titel: 'Verfügbarkeit, SLA & Backup-Volumen', punkte: 6,
  quelle: 'IHK-Prüfungskatalog · PK-06 (Verfügbarkeit, Datensicherung, 3-2-1)',
  gen() {
    const stundenJahr = 8760;
    const sla = pick([99.0, 99.5, 99.9, 99.99]);
    const datenGB = pick([200, 500, 800, 1200]);
    const aenderung = pick([5, 10, 15, 20]);       /* tägliche Änderungsrate in % */
    const kompression = pick([1.0, 1.5, 2.0]);
    const generationen = pick([7, 14, 30]);

    const erlaubtH = r2(stundenJahr * (100 - sla) / 100);
    const erlaubtMin = Math.round(erlaubtH * 60);
    const vollGB = r2(datenGB / kompression);
    const diffTagGB = r2(datenGB * aenderung / 100 / kompression);
    const diffSatzGB = r2(diffTagGB * generationen);
    const inkTagGB = diffTagGB;                    /* pro Tag seit letzter Sicherung */
    return {
      szenario: `<p>Für ein System werden die zugesagte Verfügbarkeit und der Bedarf an Datensicherung
        berechnet. Ermitteln Sie die zulässige Ausfallzeit sowie das Volumen einer Vollsicherung und einer
        differenziellen Sicherung über alle Aufbewahrungsstufen.</p>`,
      daten: `<table>
        <tr><th>Angabe</th><th class="z">Wert</th></tr>
        <tr><td>Stunden je Jahr</td><td class="z">${stundenJahr} h</td></tr>
        <tr><td>Zugesagte Verfügbarkeit (SLA)</td><td class="z">${num(sla, 2)} %</td></tr>
        <tr><td>Zu sichernde Datenmenge</td><td class="z">${datenGB} GB</td></tr>
        <tr><td>Tägliche Änderungsrate</td><td class="z">${pct(aenderung)}</td></tr>
        <tr><td>Kompressionsfaktor</td><td class="z">${num(kompression, 1)}</td></tr>
        <tr><td>Aufbewahrte Sicherungsstände</td><td class="z">${generationen}</td></tr>
      </table>`,
      rows: [
        { name: 'Zulässige Ausfallzeit je Jahr', op: '', unit: 'h', answer: erlaubtH, tol: { abs: 0.5 }, dec: 2, ergebnis: true },
        { name: 'Zulässige Ausfallzeit in Minuten', op: '', unit: 'min', answer: erlaubtMin, tol: { abs: 1 }, dec: 0 },
        { name: 'Vollsicherung (komprimiert)', op: '', unit: 'GB', answer: vollGB, tol: { abs: 0.5 }, dec: 2, ergebnis: true },
        { name: 'Differenzielle Sicherung je Tag', op: '', unit: 'GB', answer: diffTagGB, tol: { abs: 0.5 }, dec: 2 },
        { name: 'Differenzielle Sicherung, alle Stände', op: '', unit: 'GB', answer: diffSatzGB, tol: { abs: 1 }, dec: 2, ergebnis: true }
      ],
      weg: [
        `Erlaubte Ausfallzeit = ${stundenJahr} × (100 − ${num(sla, 2)}) ÷ 100 = ${num(erlaubtH, 2)} h`,
        `in Minuten = ${num(erlaubtH, 2)} × 60 = ${erlaubtMin} min`,
        `Vollsicherung = ${datenGB} GB ÷ ${num(kompression, 1)} = ${num(vollGB, 2)} GB`,
        `Änderung je Tag = ${datenGB} GB × ${num(aenderung, 0)} % ÷ ${num(kompression, 1)} = ${num(diffTagGB, 2)} GB`,
        `Differenziell gesamt = ${num(diffTagGB, 2)} GB × ${generationen} = ${num(diffSatzGB, 2)} GB`
      ],
      hinweis: 'Verfügbarkeit ist ein Schutzziel und rechnet sich über den Zeitraum: 99,9 % klingen hoch, erlauben aber im Jahr noch 8,76 Stunden Ausfall. Beim Backup gilt die 3-2-1-Regel – und eine Kopie gehört offline.'
    };
  }
}

];

  { t: 'ap2', b: 'systemloesung', j: 1, f: 'Firewall-Zonen: WAN, DMZ, LAN', a: '<p><b>WAN</b> (unsicher) → <b>DMZ</b> (abgeschirmt, öffentliche Dienste) → <b>LAN</b> (intern, geschützt).</p><p>Firewallregeln arbeiten nach dem Prinzip: alles verbieten und nur das Nötige erlauben (Whitelist).</p><p>Die DMZ verhindert, dass ein Angriff auf einen öffentlichen Server direkt ins interne Netz vordringt.</p>', q_: 'AP2 · IT-Sicherheit' },
