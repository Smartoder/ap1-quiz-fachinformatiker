/* ============================================================
   QUIZ
   ============================================================ */
function starteQuiz(bereich) {
  modus = 'quiz';
  let reihe = hole('QUIZ', bereich);
  if (!reihe.length) return nichtsDa('Multiple-Choice-Quiz');
  reihe = reihe.slice().sort(() => Math.random() - 0.5).slice(0, 12);
  quizLauf = { reihe, idx: 0, richtig: 0, beantwortet: 0, gewaehlt: null, bereich: bereich || null };
  zeichneQuiz();
  railZeichnen();
}

/* Schmaler Balken unter dem Quizkopf – macht die Position in der Runde sichtbar,
   ohne die Punktzahl in der Kopfzeile zu wiederholen. */
function fortschrittsbalkenHTML(pos, gesamt) {
  const p = gesamt ? Math.round(pos / gesamt * 100) : 0;
  return `<div class="fortschrittsbalken" role="presentation"><i style="width:${p}%"></i></div>`;
}

function zeichneQuiz() {
  const q = quizLauf.reihe[quizLauf.idx];
  const b = achse().find(x => x.id === q.b);
  const buchstaben = ['A', 'B', 'C', 'D'];
  const beantwortet = quizLauf.gewaehlt !== null;

  blatt.innerHTML = `
    <div class="kopfstreifen">
      <h2>Multiple-Choice-Quiz</h2>
      <div class="meta">${b ? b.name : 'Alle Bereiche'}<br>
        <span class="quiz-fortschritt" id="quiz-kopf-fortschritt">Frage ${quizLauf.idx + 1} von ${quizLauf.reihe.length} · ${quizLauf.richtig} richtig</span></div>
    </div>
    ${fortschrittsbalkenHTML(quizLauf.idx + (beantwortet ? 1 : 0), quizLauf.reihe.length)}

    ${infoBlock(q, 'quiz', q.b)}
    <div class="quiz">
      <div class="quiz-frage" id="quiz-frage">${q.q}</div>
      <div class="quiz-optionen">
        ${q.a.map((t, i) => `<button class="quiz-opt" type="button" data-i="${i}"
            aria-label="Antwort ${buchstaben[i]}: ${t.replace(/"/g, '&quot;')}"
            ${beantwortet ? 'disabled' : ''}>
            <span class="buchstabe" aria-hidden="true">${buchstaben[i]}</span><span>${t}</span>
          </button>`).join('')}
      </div>
      <div id="quiz-erklaerung" role="status" aria-live="polite"></div>
    </div>

    <div class="aktionen">
      <button class="akt" id="btn-quiz-weiter" type="button" ${beantwortet ? '' : 'disabled'}>
        ${quizLauf.idx + 1 < quizLauf.reihe.length ? 'Weiter' : 'Auswertung'}
      </button>
      <button class="akt zweit" id="btn-quiz-neu" type="button">Neues Set</button>
      <span class="einheit" role="status" aria-live="polite">${beantwortet
        ? ''
        : quizLauf.idx === 0 && quizLauf.gewaehlt === null
          ? 'Antwort auswählen'
          : 'Antwort auswählen · ' + (quizLauf.richtig) + ' bisher richtig'}</span>
    </div>`;

  infoVerdrahten();
  blatt.querySelectorAll('.quiz-opt').forEach(btn => {
    btn.onclick = () => {
      if (quizLauf.gewaehlt !== null) return;
      quizLauf.gewaehlt = +btn.dataset.i;
      const ok = quizLauf.gewaehlt === q.r;
      quizLauf.beantwortet++;
      if (ok) quizLauf.richtig++;
      /* Punkte ins gleiche Fortschrittssystem wie die Rechenaufgaben */
      const key = 'quiz-' + q.b;
      const f = fortschritt.tasks[key] || { punkte: 0, max: 0 };
      f.punkte += ok ? 1 : 0; f.max += 1; f.versuche = (f.versuche || 0) + 1;
      fortschritt.tasks[key] = f;
      fortschritt.punkte = (fortschritt.punkte || 0) + (ok ? 1 : 0);
      serieSetzen(ok ? (istAp2() ? serieAp2 + 1 : (fortschritt.serie || 0) + 1) : 0);
      speichern(); statistikZeichnen();
      zeigeQuizAufloesung();
    };
  });

  const weiter = document.getElementById('btn-quiz-weiter');
  weiter.onclick = () => {
    if (quizLauf.idx + 1 < quizLauf.reihe.length) {
      quizLauf.idx++; quizLauf.gewaehlt = null; zeichneQuiz();
    } else {
      quizAuswertung();
    }
  };
  document.getElementById('btn-quiz-neu').onclick = () => starteQuiz(quizLauf.bereich);
  adresseSetzen(quizLauf.bereich);

  if (beantwortet) zeigeQuizAufloesung();
}

function zeigeQuizAufloesung() {
  const q = quizLauf.reihe[quizLauf.idx];
  const opts = blatt.querySelectorAll('.quiz-opt');
  opts.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.r) btn.classList.add('richtig');
    if (i === quizLauf.gewaehlt && i !== q.r) btn.classList.add('falsch');
    if (i === quizLauf.gewaehlt) btn.classList.add('gewaehlt');
    /* Klarzeichen direkt an der Zeile: die richtige Antwort bekommt ein Häkchen,
       die falsch gewählte ein Kreuz. Ohne Symbol ist nur die Farbe der Hinweis. */
    const marke = document.createElement('span');
    marke.className = 'urteil-marke';
    marke.setAttribute('aria-hidden', 'true');
    if (i === q.r) marke.textContent = '✓';
    else if (i === quizLauf.gewaehlt) marke.textContent = '✗';
    if (marke.textContent) btn.appendChild(marke);
  });
  const ok = quizLauf.gewaehlt === q.r;
  const erklaerung = document.getElementById('quiz-erklaerung');
  erklaerung.className = ok ? 'gut' : 'schlecht';
  erklaerung.innerHTML =
    `<div class="quiz-erklaerung"><b>${ok ? 'Richtig.' : 'Nicht ganz.'}</b> ${q.e}
      <div style="margin-top:8px;font-size:12.5px;color:var(--schwach)">Quelle: ${q.q_}</div></div>`;
  const w = document.getElementById('btn-quiz-weiter');
  w.disabled = false;
  blatt.querySelector('.einheit').textContent = '';
  /* Position laut mitteilen: der Balken allein ist für Vorleser unsichtbar. */
  const kopf = document.getElementById('quiz-kopf-fortschritt');
  if (kopf) kopf.textContent = `Frage ${quizLauf.idx + 1} von ${quizLauf.reihe.length} · ${quizLauf.richtig} richtig`;
  /* Balken nachziehen, damit der beantwortete Schritt sichtbar wird */
  const balken = document.querySelector('.fortschrittsbalken > i');
  if (balken) balken.style.width = Math.round((quizLauf.idx + 1) / quizLauf.reihe.length * 100) + '%';
}

function quizAuswertung() {
  const q = quizLauf;
  const quote = q.beantwortet ? Math.round(q.richtig / q.beantwortet * 100) : 0;
  const note = quote >= 90 ? 'Prüfungsreif.' : quote >= 75 ? 'Gute Basis – die Lücken gezielt nachlernen.' :
    quote >= 50 ? 'Grundwissen steht, aber es fehlt noch Sicherheit.' :
      'Erst die Karteikarten durchgehen, dann das Quiz wiederholen.';
  blatt.innerHTML = `
    <div class="kopfstreifen">
      <h2>Quiz-Auswertung</h2>
      <div class="meta">${q.reihe.length} Fragen<br>${q.bereich ? bereichName(q.bereich) : 'Alle Bereiche'}</div>
    </div>
    <div class="ergebnis">
      <h3>${q.richtig} von ${q.beantwortet} richtig</h3>
      <div class="quote">${quote} %</div>
      <div class="note">${note}</div>
      <p style="font-size:13.5px">Falsch beantwortete Themen lohnen sich als Karteikarten oder Lückentext zu
      wiederholen – die Karteikarten nutzen Spaced Repetition und fragen genau die Karten zuerst, die noch nicht
      sitzen.</p>
      <div class="aktionen" style="margin-top:18px">
        <button class="akt" type="button" id="q-nochmal">Noch einmal</button>
        <button class="akt zweit" type="button" id="q-karten">Zu den Karteikarten</button>
        <button class="akt zweit" type="button" id="q-start">Zur Startseite</button>
      </div>
    </div>`;
  document.getElementById('q-nochmal').onclick = () => starteQuiz(q.bereich);
  document.getElementById('q-karten').onclick = () => starteKarten(q.bereich);
  document.getElementById('q-start').onclick = startseiteZeigen;
}

/* ============================================================
   KARTEIKARTEN (Leitner-System: Fach 1 bis 4)
   ============================================================ */
const KARTEN_STORE = 'ap1-trainer-karten-v1';
let kartenFaecher = {};
try {
  const g = JSON.parse(localStorage.getItem(KARTEN_STORE));
  if (g && typeof g === 'object') kartenFaecher = g;
} catch (e) { /* kein Speicher */ }
const kartenSpeichern = () => {
  try { localStorage.setItem(KARTEN_STORE, JSON.stringify(kartenFaecher)); } catch (e) {}
  syncPlanen();
};

function starteKarten(bereich) {
  modus = 'karten';
  let stapel = hole('KARTEN', bereich);
  if (!stapel.length) return nichtsDa('Karteikarten');
  /* Karten in niedrigen Fächern zuerst – das ist der Kern von Spaced Repetition */
  stapel = stapel.slice().sort((a, b) => (kartenFaecher[a.f] || 0) - (kartenFaecher[b.f] || 0));
  kartenLauf = { stapel, idx: 0, aufgedeckt: false, gewusst: 0, nicht: 0, bereich: bereich || null };
  zeichneKarte();
  railZeichnen();
}

function zeichneKarte() {
  const k = kartenLauf.stapel[kartenLauf.idx];
  const b = achse().find(x => x.id === k.b);
  const fach = kartenFaecher[k.f] || 0;
  const auf = kartenLauf.aufgedeckt;

  blatt.innerHTML = `
    <div class="kopfstreifen">
      <h2>Karteikarten</h2>
      <div class="meta">${b ? b.name : 'Alle Bereiche'}<br>
        <span class="quiz-fortschritt">Karte ${kartenLauf.idx + 1} von ${kartenLauf.stapel.length} ·
        ${kartenLauf.gewusst} gewusst, ${kartenLauf.nicht} noch nicht</span></div>
    </div>

    ${infoBlock(k, 'karten', k.b)}
    <div class="karten-stapel">
      <div class="karte" id="karte" tabindex="0" role="button"
           aria-label="${auf ? 'Antwort eingeblendet. Weiter zur nächsten Karte.' : 'Antwort anzeigen'}">
        <span class="fach" title="Leitner-Fach: höher = sicherer">${fach ? 'Fach ' + fach : 'neu'}</span>
        <div class="seite">${auf ? 'ANTWORT' : 'FRAGE'}</div>
        ${auf
          ? `<div class="rueckseite">${k.a}</div>`
          : `<div class="vorderseite">${k.f}</div>
             <div class="hinweis-klick">Klick oder Leertaste zeigt die Antwort · Quelle: ${k.q_}</div>`}
      </div>

      ${auf ? `<div class="karten-aktionen">
        <button class="akt" type="button" id="k-gewusst">Gewusst</button>
        <button class="akt zweit" type="button" id="k-nicht">Noch nicht</button>
        <span class="karten-zaehler">${kartenLauf.idx + 1} / ${kartenLauf.stapel.length}</span>
      </div>` : `<div class="karten-aktionen">
        <button class="akt" type="button" id="k-zeigen">Antwort zeigen</button>
        <button class="akt zweit" type="button" id="k-ueberspringen">Überspringen</button>
        <span class="karten-zaehler">${kartenLauf.idx + 1} / ${kartenLauf.stapel.length}</span>
      </div>`}
    </div>`;

  const karte = document.getElementById('karte');
  karte.onclick = () => { if (!kartenLauf.aufgedeckt) { kartenLauf.aufgedeckt = true; zeichneKarte(); } };
  karte.onkeydown = e => {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); karte.click(); }
  };

  const zeigen = document.getElementById('k-zeigen');
  if (zeigen) zeigen.onclick = e => { e.stopPropagation(); kartenLauf.aufgedeckt = true; zeichneKarte(); };

  infoVerdrahten();
  const ueberspringen = document.getElementById('k-ueberspringen');
  if (ueberspringen) ueberspringen.onclick = e => { e.stopPropagation(); naechsteKarte(); };

  const gewusst = document.getElementById('k-gewusst');
  if (gewusst) gewusst.onclick = e => { e.stopPropagation(); bewerteKarte(true); };
  const nicht = document.getElementById('k-nicht');
  if (nicht) nicht.onclick = e => { e.stopPropagation(); bewerteKarte(false); };
}

function bewerteKarte(gewusst) {
  const k = kartenLauf.stapel[kartenLauf.idx];
  const fach = kartenFaecher[k.f] || 0;
  /* Leitner: richtig -> ein Fach höher (max 4), falsch -> zurück auf 1 */
  kartenFaecher[k.f] = gewusst ? Math.min(4, fach + 1) : 1;
  kartenSpeichern();
  if (gewusst) kartenLauf.gewusst++; else kartenLauf.nicht++;
  naechsteKarte();
}

function naechsteKarte() {
  if (kartenLauf.idx + 1 < kartenLauf.stapel.length) {
    kartenLauf.idx++; kartenLauf.aufgedeckt = false; zeichneKarte();
  } else {
    kartenAuswertung();
  }
}

function kartenAuswertung() {
  const gesamt = kartenLauf.gewusst + kartenLauf.nicht;
  const quote = gesamt ? Math.round(kartenLauf.gewusst / gesamt * 100) : 0;
  const faecherZaehler = [0, 0, 0, 0, 0];
  for (const f in kartenFaecher) faecherZaehler[kartenFaecher[f]] = (faecherZaehler[kartenFaecher[f]] || 0) + 1;
  blatt.innerHTML = `
    <div class="kopfstreifen">
      <h2>Karten-Auswertung</h2>
      <div class="meta">${kartenLauf.stapel.length} Karten<br>${kartenLauf.bereich ? bereichName(kartenLauf.bereich) : 'Alle Bereiche'}</div>
    </div>
    <div class="ergebnis">
      <h3>${kartenLauf.gewusst} von ${gesamt} gewusst</h3>
      <div class="quote">${quote} %</div>
      <div class="note">${quote >= 80 ? 'Sitzt. Diese Karten kommen erst nach längerer Zeit wieder.' :
        'Die unsicheren Karten sind wieder auf Fach 1 – beim nächsten Durchgang kommen sie zuerst.'}</div>
      <table>
        <tr><td>Fach 1 – noch nicht sicher</td><td class="z">${faecherZaehler[1] || 0}</td></tr>
        <tr><td>Fach 2</td><td class="z">${faecherZaehler[2] || 0}</td></tr>
        <tr><td>Fach 3</td><td class="z">${faecherZaehler[3] || 0}</td></tr>
        <tr><td>Fach 4 – sitzt sicher</td><td class="z">${faecherZaehler[4] || 0}</td></tr>
      </table>
      <p style="font-size:13.5px;margin-top:14px">Die Fächer folgen dem Leitner-System: Eine gewusste Karte
      steigt ein Fach auf, eine nicht gewusste fällt zurück auf Fach 1. Beim nächsten Start kommen die Karten
      aus den niedrigen Fächern zuerst.</p>
      <div class="aktionen" style="margin-top:18px">
        <button class="akt" type="button" id="k-nochmal">Noch einmal</button>
        <button class="akt zweit" type="button" id="k-reset">Kartenfortschritt zurücksetzen</button>
        <button class="akt zweit" type="button" id="k-start">Zur Startseite</button>
      </div>
    </div>`;
  document.getElementById('k-nochmal').onclick = () => starteKarten(kartenLauf.bereich);
  adresseSetzen(kartenLauf.bereich);
  document.getElementById('k-reset').onclick = () => {
    bestaetigen(
      'Kartenfortschritt zurücksetzen?',
      'Alle Karten dieses Prüfungsteils beginnen wieder in Fach 1. Das lässt sich nicht rückgängig machen.',
      () => {
        /* Nur die Karten des offenen Teils zurückstellen. Der Kartenstand ist
           an den Fragetext gebunden; ein pauschales Leeren träfe auch den
           anderen Prüfungsteil. */
        const texte = new Set(daten(teil).KARTEN.map(k => k.f));
        for (const key in kartenFaecher) if (texte.has(key)) delete kartenFaecher[key];
        kartenSpeichern(); starteKarten(kartenLauf.bereich);
      }
    );
  };
  document.getElementById('k-start').onclick = startseiteZeigen;
}

/* ============================================================
   LÜCKENTEXTE
   ============================================================ */
function starteLuecken(bereich) {
  modus = 'luecken';
  const pool = hole('LUECKEN', bereich);
  if (!pool.length) return nichtsDa('Lückentexte');
  const ex = pick(pool);
  /* {Wort} im Text durch Eingabefelder ersetzen */
  const teile = ex.text.split(/\{([^}]+)\}/g);
  const luecken = [];
  let html = '';
  teile.forEach((t, i) => {
    if (i % 2 === 1) {
      luecken.push(t);
      html += `<input type="text" autocomplete="off" spellcheck="false" name="luecke-${luecken.length - 1}"
        aria-label="Lücke ${luecken.length}" id="lk${luecken.length - 1}">`;
    } else {
      html += t;
    }
  });
  lueckenLauf = { ex, luecken, geprueft: false };
  blatt.innerHTML = `
    <div class="kopfstreifen">
      <h2>${ex.titel}</h2>
      <div class="meta">${bereichName(ex.b)}<br>${luecken.length} Lücken</div>
    </div>
    ${infoBlock(ex, 'luecken', ex.b)}
    <div class="szenario"><p>Ergänzen Sie die fehlenden Begriffe. Schreibweise wird tolerant geprüft –
      Groß- und Kleinschreibung spielt keine Rolle.</p></div>
    <div class="luecke">${html}</div>
    <div class="aktionen">
      <button class="akt" id="btn-lk-pruefen" type="button">Prüfen</button>
      <button class="akt zweit" id="btn-lk-weg" type="button">Lösung zeigen</button>
      <button class="akt zweit" id="btn-lk-neu" type="button">Anderer Text</button>
      <span class="einheit" id="rueckmeldung" role="status" aria-live="polite"></span>
    </div>
    <div id="wegbereich"></div>`;

  document.getElementById('btn-lk-pruefen').onclick = lueckenPruefen;
  infoVerdrahten();
  document.getElementById('btn-lk-weg').onclick = () => {
    lueckenLauf.luecken.forEach((l, i) => { document.getElementById('lk' + i).value = l; });
    lueckenPruefen();
  };
  document.getElementById('btn-lk-neu').onclick = () => starteLuecken(bereich);

  const felder = blatt.querySelectorAll('input[type=text]');
  felder.forEach((f, i) => f.addEventListener('keydown', e => {
    if (e.key === 'Enter') { i === felder.length - 1 ? lueckenPruefen() : felder[i + 1].focus(); }
  }));
  if (felder.length) felder[0].focus();
  railZeichnen();
}

function lueckenPruefen() {
  const { luecken } = lueckenLauf;
  let richtig = 0;
  luecken.forEach((soll, i) => {
    const el = document.getElementById('lk' + i);
    el.classList.remove('richtig', 'falsch');
    const ist = normText(el.value);
    const ziel = normText(soll);
    let ok = false;
    if (ist !== '') {
      if (ist === ziel) {
        ok = true;
      } else {
        /* Zahl und Zahl vergleichen: "20 %" zählt für "20", "0.65" für "0,65" */
        const zi = parseNum(el.value), zs = parseNum(soll);
        if (Number.isFinite(zi) && Number.isFinite(zs)) {
          ok = zi === zs;
        } else {
          /* Sonst nur Einheiten am Rand tolerieren – kein Präfix-Raten,
             damit "Red" nicht als "Redundanz" durchgeht. */
          const einheiten = /^(prozent|stunden|stunde|tage|tag|stück|stk|stueck|bit|byte|kb|mb|gb|tb)$/;
          const istTeile = ist.split(' ').filter(w => w && !einheiten.test(w));
          ok = istTeile.length === 1 && istTeile[0] === ziel;
        }
      }
    }
    if (ok) { richtig++; el.classList.add('richtig'); }
    else {
      el.classList.add('falsch');
      el.title = 'Richtig wäre: ' + soll;
    }
  });
  lueckenLauf.geprueft = true;
  const punkte = Math.round(richtig / luecken.length * 6);
  const key = lueckenLauf.ex.id;
  const f = fortschritt.tasks[key] || { punkte: 0, max: 0 };
  f.punkte += punkte; f.max += 6; f.versuche = (f.versuche || 0) + 1;
  fortschritt.tasks[key] = f;
  fortschritt.punkte = (fortschritt.punkte || 0) + punkte;
  serieSetzen(richtig === luecken.length ? (istAp2() ? serieAp2 + 1 : (fortschritt.serie || 0) + 1) : 0);
  speichern(); statistikZeichnen();
  document.getElementById('rueckmeldung').textContent =
    `${richtig} von ${luecken.length} richtig (${punkte} von 6 Punkten)`;
  document.getElementById('wegbereich').innerHTML =
    `<div class="weg">
      <h3>Hinweis</h3>
      <div class="hinweis">${lueckenLauf.ex.hinweis}</div>
      <div class="quelle">Material: ${lueckenLauf.ex.quelle}</div>
    </div>`;
  railZeichnen();
}

/* ============================================================
   FEHLERSUCHE
   ============================================================ */
function starteFehler(blockId) {
  modus = 'fehler';
  const pool = blockId ? daten(teil).FEHLER.filter(f => f.id === blockId) : hole('FEHLER');
  if (!pool.length) return nichtsDa('Fehlersuche');
  const ex = pick(pool);
  fehlerLauf = { ex, urteil: ex.zeilen.map(() => null), geprueft: false };
  zeichneFehler();
  railZeichnen();
}

function zeichneFehler() {
  const { ex, urteil } = fehlerLauf;
  blatt.innerHTML = `
    <div class="kopfstreifen">
      <h2>${ex.titel}</h2>
      <div class="meta">${bereichName(ex.b)}<br>${ex.zeilen.length} Zeilen · AP2-Stoff</div>
    </div>
    ${infoBlock(ex, 'fehler', ex.b)}
    <div class="szenario"><p>${ex.aufgabe}</p></div>
    <div class="schema">
      ${ex.zeilen.map((z, i) => `
        <div class="fehlerzeile ${fehlerLauf.geprueft ? (z.ok ? 'richtig' : 'fehlerhaft') : ''}" id="fz${i}">
          <span class="nr">${i + 1}</span>
          <span class="txt">${z.t.replace(/</g, '&lt;')}</span>
          <span class="urteil">
            <button type="button" data-i="${i}" data-ok="1" ${fehlerLauf.geprueft ? 'disabled' : ''}
              class="${urteil[i] === true ? 'an' : ''}">korrekt</button>
            <button type="button" data-i="${i}" data-ok="0" ${fehlerLauf.geprueft ? 'disabled' : ''}
              class="${urteil[i] === false ? 'an' : ''}">fehlerhaft</button>
          </span>
          <span class="marke">${fehlerLauf.geprueft ? (z.ok ? '✓' : '✗') : ''}</span>
        </div>`).join('')}
    </div>
    <div class="aktionen">
      <button class="akt" id="btn-fz-pruefen" type="button">Prüfen</button>
      <button class="akt zweit" id="btn-fz-neu" type="button">Anderer Block</button>
      <span class="einheit" id="rueckmeldung" role="status" aria-live="polite"></span>
    </div>
    <div id="wegbereich"></div>`;

  infoVerdrahten();
  blatt.querySelectorAll('.fehlerzeile button').forEach(b => {
    b.onclick = () => {
      if (fehlerLauf.geprueft) return;
      const i = +b.dataset.i;
      fehlerLauf.urteil[i] = b.dataset.ok === '1';
      zeichneFehler();
    };
  });
  document.getElementById('btn-fz-pruefen').onclick = fehlerPruefen;
  document.getElementById('btn-fz-neu').onclick = () => starteFehler();
  if (fehlerLauf.geprueft) {
    document.getElementById('wegbereich').innerHTML = `<div class="weg">
      <h3>Begründungen</h3>
      <ol>${ex.zeilen.map(z => `<li>${z.e}</li>`).join('')}</ol>
      <div class="quelle">Material: Datenbank · SQL-2609-Tag06 bis Tag08</div>
    </div>`;
  }
}

function fehlerPruefen() {
  const { ex, urteil } = fehlerLauf;
  if (urteil.some(u => u === null)) {
    document.getElementById('rueckmeldung').textContent = 'Bitte für jede Zeile ein Urteil abgeben.';
    return;
  }
  let richtig = 0;
  urteil.forEach((u, i) => { if (u === ex.zeilen[i].ok) richtig++; });
  fehlerLauf.geprueft = true;
  const punkte = Math.round(richtig / ex.zeilen.length * 8);
  const f = fortschritt.tasks[ex.id] || { punkte: 0, max: 0 };
  f.punkte += punkte; f.max += 8; f.versuche = (f.versuche || 0) + 1;
  fortschritt.tasks[ex.id] = f;
  fortschritt.punkte = (fortschritt.punkte || 0) + punkte;
  serieSetzen(richtig === ex.zeilen.length ? (istAp2() ? serieAp2 + 1 : (fortschritt.serie || 0) + 1) : 0);
  speichern(); statistikZeichnen();
  zeichneFehler();
  document.getElementById('rueckmeldung').textContent =
    `${richtig} von ${ex.zeilen.length} richtig beurteilt (${punkte} von 8 Punkten)`;
  railZeichnen();
}

/* ============================================================
   FALLSTUDIEN
   ============================================================ */
function starteFall(fallId) {
  modus = 'fall';
  const pool = fallId ? daten(teil).FAELLE.filter(f => f.id === fallId) : hole('FAELLE');
  if (!pool.length) return nichtsDa('Fallstudien');
  const fall = pick(pool);
  fallLauf = { fall, idx: 0, punkte: 0, max: 0, beantwortet: false, gewaehlt: null };
  zeichneFall();
  railZeichnen();
}

function zeichneFall() {
  const { fall, idx, beantwortet, gewaehlt } = fallLauf;
  const s = fall.schritte[idx];
  const buchstaben = ['A', 'B', 'C'];
  const fertig = fallLauf.idx >= fall.schritte.length;

  blatt.innerHTML = `
    <div class="kopfstreifen">
      <h2>${fall.titel}</h2>
      <div class="meta">${bereichName(fall.b)}<br>
        Schritt ${Math.min(idx + 1, fall.schritte.length)} von ${fall.schritte.length}</div>
    </div>

    ${infoBlock(fall, 'fall', fall.b)}
    <div class="fall">
      ${idx === 0 ? `<div class="fall-verlauf">${fall.einstieg}</div>`
        : `<div class="fall-verlauf">Bisher: <b>${fallLauf.punkte}</b> von <b>${fallLauf.max}</b> möglichen Punkten</div>`}

      ${beantwortet ? '' : `
        <div class="fall-schritt">
          <span class="nr">SCHRITT ${idx + 1}</span>
          <div style="margin-top:8px">${s.situation}</div>
          ${s.kundenmail ? `<div class="kundenmail">${s.kundenmail}</div>` : ''}
          ${s.daten || ''}
          <div class="kunde"><b>Kunde:</b> ${s.kunde}</div>
          <div class="fall-optionen">
            ${s.optionen.map((o, i) => `<button class="fall-opt" type="button" data-i="${i}">
              ${buchstaben[i]}) ${o.t}</button>`).join('')}
          </div>
        </div>`}

      ${beantwortet ? `
        <div class="fall-schritt">
          <span class="nr">SCHRITT ${idx + 1} · AUSWERTUNG</span>
          <div style="margin-top:8px">${s.situation}</div>
          ${s.kundenmail ? `<div class="kundenmail">${s.kundenmail}</div>` : ''}
          <div class="kunde"><b>Kunde:</b> ${s.kunde}</div>
          <div style="margin-top:12px">
            ${s.optionen.map((o, i) => `<div style="margin-bottom:6px;font-size:13.5px;
              ${i === gewaehlt ? 'font-weight:600' : 'color:var(--schwach)'}">
              ${buchstaben[i]}) ${o.t} ${i === gewaehlt ? '← Ihre Wahl' : ''}
              ${o.p === 3 ? '<span style="color:var(--gruen)"> (volle Punkte)</span>' : ''}
            </div>`).join('')}
          </div>
          <div class="fall-feedback">${s.feedback}</div>
        </div>` : ''}

      ${fertig ? `<div class="fall-schritt"><span class="nr">ERGEBNIS</span>${fall.fazit}</div>` : ''}
    </div>

    <div class="aktionen">
      <button class="akt" id="btn-fall-weiter" type="button" ${beantwortet ? '' : 'disabled'}>
        ${idx + 1 < fall.schritte.length ? 'Nächster Schritt' : 'Fall abschließen'}
      </button>
      <button class="akt zweit" id="btn-fall-neu" type="button">Anderer Fall</button>
      <span class="einheit" id="rueckmeldung" role="status" aria-live="polite"></span>
    </div>`;

  infoVerdrahten();
  blatt.querySelectorAll('.fall-opt').forEach(btn => {
    btn.onclick = () => {
      if (fallLauf.beantwortet) return;
      const i = +btn.dataset.i;
      fallLauf.gewaehlt = i;
      fallLauf.beantwortet = true;
      const p = s.optionen[i].p;
      fallLauf.punkte += p; fallLauf.max += 3;
      const f = fortschritt.tasks[fall.id] || { punkte: 0, max: 0 };
      f.punkte += p; f.max += 3; f.versuche = (f.versuche || 0) + 1;
      fortschritt.tasks[fall.id] = f;
      fortschritt.punkte = (fortschritt.punkte || 0) + p;
      serieSetzen(p === 3 ? (istAp2() ? serieAp2 + 1 : (fortschritt.serie || 0) + 1) : 0);
      speichern(); statistikZeichnen();
      zeichneFall();
    };
  });

  const weiter = document.getElementById('btn-fall-weiter');
  weiter.onclick = () => {
    if (fallLauf.idx + 1 < fallLauf.fall.schritte.length) {
      fallLauf.idx++; fallLauf.beantwortet = false; fallLauf.gewaehlt = null; zeichneFall();
    } else {
      fallAuswertung();
    }
  };
  document.getElementById('btn-fall-neu').onclick = () => starteFall();
}

function fallAuswertung() {
  const { fall, punkte, max } = fallLauf;
  const quote = max ? Math.round(punkte / max * 100) : 0;
  blatt.innerHTML = `
    <div class="kopfstreifen">
      <h2>Fallstudie abgeschlossen</h2>
      <div class="meta">${fall.titel}<br>${fall.schritte.length} Entscheidungen</div>
    </div>
    <div class="ergebnis">
      <h3>${punkte} von ${max} Punkten</h3>
      <div class="quote">${quote} %</div>
      <div class="note">${quote >= 90 ? 'Sehr sicher – auch in der Prüfung tragfähig begründet.' :
        quote >= 65 ? 'Gute Entscheidungen, einzelne Begründungen noch unsicher.' :
        'Die Karteikarten zum Bereich noch einmal durchgehen, dann den Fall wiederholen.'}</div>
      <div class="fall" style="margin-top:16px">${fall.fazit}</div>
      <div class="aktionen" style="margin-top:18px">
        <button class="akt" type="button" id="fa-nochmal">Fall wiederholen</button>
        <button class="akt zweit" type="button" id="fa-anders">Anderer Fall</button>
        <button class="akt zweit" type="button" id="fa-start">Zur Startseite</button>
      </div>
    </div>`;
  document.getElementById('fa-nochmal').onclick = () => starteFall(fall.id);
  document.getElementById('fa-anders').onclick = () => starteFall();
  document.getElementById('fa-start').onclick = startseiteZeigen;
}

/* ============================================================
   START
   ============================================================ */
document.getElementById('rail-toggle').addEventListener('click', e => {
  const offen = document.body.classList.toggle('rail-offen');
  e.currentTarget.setAttribute('aria-expanded', String(offen));
});
/* Rückweg zur Übersicht – behält den Fortschritt, im Gegensatz zum Zurücksetzen. */
/* Umschalter zwischen Teil 1 und Teil 2 — sitzt am Wortzeichen, damit immer
   sichtbar ist, welcher Teil offen ist. */
document.getElementById('btn-teil').addEventListener('click', () => { teilWechseln(); });
document.getElementById('btn-uebersicht').addEventListener('click', () => {
  sim = null; clearInterval(zeitGeber); startseiteZeigen();
});
/* Direkter Zugriff auf Name und Ausbildungsjahr – bisher nur in der Seitenleiste,
   die auf dem Handy eingeklappt ist. */
document.getElementById('btn-profil').addEventListener('click', () => {
  sim = null; clearInterval(zeitGeber);
  if (profil) abmelden(); else profilAuswahlZeigen();
  mobilEinklappen();
});
/* Das Ausbildungsjahr bestimmt den sichtbaren Stoff — es gehört in die
   Kopfzeile, nicht ins Menü „Mehr". */
document.getElementById('btn-jahr').addEventListener('click', () => {
  sim = null; clearInterval(zeitGeber);
  jahrAuswahlZeigen();
  mobilEinklappen();
});

/* ============================================================
   Verweis-Zustand: gewählter Bereich steht in der Adresse
   ------------------------------------------------------------
   Zweck: ein Link auf „genau dieses Thema" ist teilbar, der Zurück-Knopf
   führt nicht blind aus dem Trainer, und ein Lesezeichen landet wieder
   im richtigen Bereich. Bewusst nur EIN Parameter (?bereich=…), kein
   Nachbau der kompletten Oberfläche in der Adresse – die Aufgaben selbst
   werden bei jedem Aufruf neu erzeugt und sind nicht verlinkbar.
   ============================================================ */
const BEREICH_IDS_AP1 = BEREICHE.map(b => b.id);
const BEREICH_IDS_AP2 = BEREICHE2.map(b => b.id);
const bereichIds = () => istAp2() ? BEREICH_IDS_AP2 : BEREICH_IDS_AP1;

/* Ein ?bereich=… aus dem Link ist gemerkt, bis Profil und Jahr stehen.
   Ohne Profil zeigt der Trainer die Anmeldung – der Wunsch aus dem Link darf
   dabei nicht verloren gehen, sonst landet ein geteilter Link nie am Ziel. */
let wunschBereich = null;
try {
  const ausAdresse = new URL(window.location.href).searchParams.get('bereich');
  if (ausAdresse && bereichIds().includes(ausAdresse)) wunschBereich = ausAdresse;
} catch (e) { /* ohne Adresskontext kein Grund abzubrechen */ }

/* Wird von der Startseite aufgerufen, sobald Profil und Jahr feststehen. */
function wunschBereichAusfuehren() {
  /* In Teil 2 gibt es keine Jahr-Wahl, der Wunsch gilt dann sofort. */
  if (!wunschBereich || !profil || (!istAp2() && jahr === null)) return;
  const ziel = wunschBereich;
  wunschBereich = null;
  adresseSetzen(ziel);
  /* Ein Bereichslink soll in genau diesem Bereich landen. Reihenfolge:
     erst Quiz zu diesem Bereich (immer vorhanden), sonst die erste
     Rechenaufgabe dieses Bereichs, sonst ersatzweise irgendetwas. */
  const hatQuiz = hole('QUIZ', ziel).length > 0;
  if (hatQuiz) return starteQuiz(ziel);
  const aufgabe = hole('TASKS', ziel)[0];
  if (aufgabe) { modus = 'rechnen'; return starteAufgabe(aufgabe.id); }
  starteQuiz(ziel);
}

function adresseSetzen(bereich) {
  try {
    const url = new URL(window.location.href);
    if (bereich && bereichIds().includes(bereich)) url.searchParams.set('bereich', bereich);
    else url.searchParams.delete('bereich');
    const neu = url.pathname + (url.searchParams.toString() ? '?' + url.searchParams.toString() : '') + url.hash;
    history.replaceState(null, '', neu);
  } catch (e) { /* Adresse ohne history-Umgebung: kein Grund abzubrechen */ }
}

function starteBereich(id) {
  if (id === 'start') { modus = 'start'; adresseSetzen(null); startseiteZeigen(); return; }
  if (id === 'rechnen') { modus = 'rechnen'; adresseSetzen(null); starteAufgabe(ersteAufgabe().id); return; }
  if (id === 'quiz') { adresseSetzen(null); starteQuiz(); return; }
  if (id === 'karten') { adresseSetzen(null); starteKarten(); return; }
  if (id === 'luecken') { adresseSetzen(null); starteLuecken(); return; }
  if (id === 'fehler') { adresseSetzen(null); starteFehler(); return; }
  if (id === 'fall') { adresseSetzen(null); starteFall(); return; }
}

statistikZeichnen();
startseiteZeigen();
</script>
