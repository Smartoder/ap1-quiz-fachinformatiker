<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>AP1-Trainer · Kaufmann für IT-System-Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;

  /* =====================================================================
     FARBSYSTEM — genau DREI Kombinationen, exakte Farbwerte
     =====================================================================

     1) TINTE & PAPIER — neutrales Trägerdokument (eine Farbfamilie,
        alle Werte sind Abstufungen desselben Blau-Grau)
          #111C2E  Tinte        Text, Kopfleiste, Primärfläche, Fokus
          #26374F  Tinte-hoch   Hover/Active derselben Fläche
          #4E5F78  Tinte-mild   Sekundärtext, Beschriftungen, Feldränder
                               (6,5:1 auf Weiß — trägt auch Eingabegrenzen
                                mit den nötigen 3:1)
          #C7D1DE  Linie        rein dekorative Trenner
          #E4E9F0  Linie-fein   feine Trennungen
          #EEF1F5  Papier       Seitenhintergrund
          #FFFFFF  Blatt        Blatt / Karte

     2) KORREKTUR — Fehler, Warnung, Stempel
          #B32D25  Rot          Signal
          #FBE9E7  Rot-hell     Fläche

     3) FREIGABE — richtig, Fortschritt, Serie
          #0E6B45  Grün         Signal
          #E3F1EA  Grün-hell    Fläche

     Kein weiterer Farbwert im Blatt: Hinweisflächen und Fokusringe nutzen
     Tinte, Rot ist ausschließlich Korrektur, Grün ausschließlich Freigabe.
     Eingabegrenzen nehmen Tinte-mild statt Linie, damit sie den Kontrast
     von 3:1 für Bedienelemente erfüllen; Linie bleibt rein dekorativ.
     ===================================================================== */
  --tinte:#111C2E;
  --tinte-hoch:#26374F;
  --schwach:#4E5F78;
  --linie:#C7D1DE;
  --linie-hell:#E4E9F0;
  --papier:#EEF1F5;
  --blatt:#FFFFFF;
  --rot:#B32D25;
  --rot-hell:#FBE9E7;
  --gruen:#0E6B45;
  --gruen-hell:#E3F1EA;
  --sans:"IBM Plex Sans",system-ui,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Consolas",monospace;

  /* Zwei Radien mit Bedeutung, nicht einer überall:
       2 px = ein Feld (Knopf, Eingabe, Marke)
       3 px = eine Fläche (Blatt, Gruppe, Dialog)
     Ein Radius für alles ist die Signatur einer Vorlage; hier trennt er
     Bedienelement von Fläche. */
  --r:2px;
  --r-flaeche:3px;

  /* Ein Maß für „eine Fläche": Rahmen oben + unten, Innenseite, Abstand
     zwischen zwei Flächen. Überall dieselben Werte — sonst wandert die
     Kante und die Seite wirkt zusammengesetzt statt gesetzt. */
  --kante:3px;
  --schatten-blatt:0 1px 0 rgba(17,28,46,.05);

  /* Schriftskala — ruhig, aber abgestuft. Zwei Familien tun hier die Arbeit:
     Plex Sans für Sprache, Plex Mono für Zahlen. */
  --t-heft:24px;
  --t-titel:19px;
  --t-gross:15.5px;
  --t-text:14.5px;
  --t-klein:13px;
  --t-mikro:11px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--papier);
  color:var(--tinte);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
  -webkit-tap-highlight-color:rgba(17,28,46,.08);
  /* Kein Gummiband über die Kopfzeile hinaus — die Kopfzeile ist der
     Briefkopf, sie gehört nicht ins Wanken. */
  overscroll-behavior-y:none;
}
h1,h2,h3{text-wrap:balance;scroll-margin-top:14px}
h1,h2,h3,h4{margin:0}

/* Sprungmarke zum Inhalt */
.skip{
  position:absolute;left:-9999px;top:0;z-index:20;
  background:var(--tinte);color:var(--blatt);padding:9px 16px;
  font-size:13.5px;text-decoration:none;border-radius:var(--r);
}
.skip:focus{left:12px;top:12px}

/* ---------- Kopfzeile: Briefkopf des Dokuments ----------
   Drei Zonen mit drei Aufgaben:
     1. links   — was das hier ist (Titel, Fach, Katalog)
     2. rechts  — die Wahl: Jahr und Profil (Handlung)
     3. unten   — der Stand: Punkte, Quote, Serie, Fortschrittsmaß (Auskunft)
   Vorher lagen Wahl und Auskunft in einer undifferenzierten Reihe zwischen
   Titel und Zahlen; das Auge musste über die Knöpfe steigen, um zum Stand
   zu kommen. */
.kopf{
  display:flex;flex-wrap:wrap;align-items:center;gap:0 20px;
  padding:12px 24px 0;
  background:var(--blatt);
  color:var(--tinte);
  border-top:var(--kante) solid var(--tinte);
  border-bottom:1px solid var(--linie);
}
.kopf-oben{
  display:flex;align-items:baseline;gap:20px;
  flex:1 1 320px;min-width:0;padding-bottom:11px;
}
.kopf h1{
  display:flex;align-items:center;gap:11px;
  font-size:var(--t-titel);font-weight:700;letter-spacing:-.02em;
  white-space:nowrap;
}
/* ---------- Bildmarke ----------
   Eigenes Zeichen, kein Fremdmaterial — deshalb ohne Namensnennung, ohne
   zweite Anfrage und offline lauffähig.

   Ein Prüfungsbogen: Blatt mit Eselsohr, gebundener linker Kante und dem
   Korrekturhaken. Jeder Wert kommt aus dem Farbsystem:
     Blatt  — Tinte auf Weiß, die zwei Trägerfarben des ganzen Blattes
     Ecke   — Papier, also ein Ton statt einer zweiten Linie
     Haken  — Rot. Rot heißt hier ausschließlich Korrektur; ein
              Korrekturhaken in Korrekturrot ist die genaueste
              Verwendung, die diese Palette zulässt, und der einzige
              Farbtupfer in der sonst einfarbigen Kopfzeile.
     Rücken — 3 px, dasselbe Maß wie --kante. Dieses Maß trägt jede
              Fläche oben und steht vor jeder Überschrift; die Marke
              zitiert damit wörtlich das Raster. */
.logo{
  width:27px;height:27px;flex:0 0 27px;
  color:var(--tinte);
}
.logo-blatt{fill:var(--blatt);stroke:currentColor;stroke-width:1.5;stroke-linejoin:round}
.logo-falte{fill:var(--papier);stroke:currentColor;stroke-width:1.5;stroke-linejoin:round}
.logo-ruecken{fill:var(--tinte)}
.logo-haken{
  fill:none;stroke:var(--rot);stroke-width:2.6;
  stroke-linecap:square;stroke-linejoin:miter;
}
/* Im erzwungenen Farbmodus (Windows hoher Kontrast) werden Füllungen
   verworfen. Dann trägt nur die Kontur — der Haken muss also sichtbar
   bleiben und darf nicht mit dem Blatt verschmelzen. */
@media (forced-colors:active){
  .logo-blatt{fill:Canvas;stroke:CanvasText}
  .logo-falte{fill:Canvas;stroke:CanvasText}
  .logo-ruecken{fill:CanvasText}
  .logo-haken{stroke:CanvasText}
}
.kopf .unter{
  font-size:var(--t-klein);color:var(--schwach);font-weight:400;
  padding-left:20px;border-left:1px solid var(--linie);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ---------- Prüfungsteil-Marke ----------
   Der Trainer führt zwei getrennte Lernwelten: Teil 1 (AP1) und Teil 2 (AP2).
   Die Marke sitzt direkt am Wortzeichen und ist selbst der Umschalter — so ist
   zu jeder Zeit sichtbar, welcher Teil offen ist, und der Wechsel ist immer
   an derselben Stelle. Kein zusätzlicher Knopf in der Wahlreihe. */
button.teil-marke{
  font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.02em;
  background:var(--tinte);color:var(--blatt);border:1px solid var(--tinte);
  padding:2px 8px;border-radius:var(--r);cursor:pointer;
  line-height:1.5;
}
button.teil-marke:hover{background:var(--tinte-hoch);border-color:var(--tinte-hoch)}
button.teil-marke:focus-visible{outline:2px solid var(--tinte);outline-offset:2px}

/* Die Wahl: Jahr und Profil sitzen als geschlossene Gruppe beieinander.
   Der Zustand der Ablage („gespeichert") steht als kleine Zeile darüber —
   er ist eine Auskunft, kein Knopf, und wird deshalb nicht als Knopf gesetzt. */
.kopf-wahl{
  display:flex;flex-direction:column;align-items:flex-end;gap:5px;
  margin-left:auto;padding-bottom:11px;
}
.kopf-stand{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.01em;
  color:var(--schwach);font-variant-numeric:tabular-nums;
  min-height:14px;
}
.kopf-stand.gut{color:var(--gruen)}
.kopf-stand.fehler{color:var(--rot)}
.kopf-schalter{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

/* ---------- Stand: die Messwerte einer Prüfung, mit Maß ----------
   Eine Trennlinie zwischen den Werten (wie die Spalten eines Bogens), keine
   Karten, keine Kästchen. Darunter das Maß: Punkte sind eine Zahl, aber der
   Weg dorthin ist eine Strecke — deshalb ein Balken mit Viertelmarken. */
.stand{
  flex:1 0 100%;
  display:flex;align-items:center;gap:0;flex-wrap:wrap;
  border-top:1px solid var(--linie-hell);
  padding:9px 0 10px;
}
.stat{
  display:flex;align-items:baseline;gap:7px;
  padding-right:18px;margin-right:18px;
  border-right:1px solid var(--linie-hell);
}
.stat:last-of-type{border-right:0}
.stat b{
  font-family:var(--mono);font-size:16px;font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em;
}
.stat span{font-size:var(--t-mikro);color:var(--schwach)}

.stand-mass{
  display:flex;align-items:center;gap:10px;flex:1 1 190px;min-width:150px;
  margin-left:auto;
}
/* Viertelmarken: 0, ¼, ½, ¾, voll — man liest die Strecke ab, statt sie
   zu schätzen. */
.stand-balken{
  position:relative;flex:1 1 auto;height:7px;
  background:var(--linie-hell);
  border:1px solid var(--linie);
}
.stand-balken i{
  display:block;height:100%;width:0%;
  background:var(--tinte);
  transition:width .4s ease;
}
.stand-balken i.voll{background:var(--gruen)}
.stand-balken::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(to right,var(--linie) 0 1px,transparent 1px);
  background-size:25% 100%;
}
.stand-mass .etikett{
  font-family:var(--mono);font-size:var(--t-mikro);color:var(--schwach);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}

/* ---------- Info-Button: erklärt die Aufgabenstellung ---------- */
.info{margin:12px 0 0}
.info-knopf{
  display:inline-flex;align-items:center;gap:9px;
  padding:7px 13px;border:1px solid var(--schwach);border-radius:var(--r);
  background:var(--blatt);color:var(--tinte);
  font-family:var(--sans);font-size:13.5px;cursor:pointer;
}
.info-knopf:hover{background:var(--papier);border-color:var(--tinte)}
.info-knopf:focus-visible{outline:2px solid var(--tinte);outline-offset:1px}
.info-knopf b{
  font-family:var(--mono);font-size:12px;font-weight:600;
  border:1px solid var(--schwach);border-radius:var(--r);padding:1px 5px;
  color:var(--tinte);
}
.info-knopf span{color:var(--schwach)}
.info-text{
  margin-top:8px;padding:12px 15px;max-width:74ch;
  border:1px solid var(--linie);border-left:3px solid var(--tinte);
  background:var(--blatt);font-size:13.5px;
}
.info-text p{margin:0 0 7px}
.info-text p:last-child{margin-bottom:0;color:var(--schwach)}

@media (prefers-reduced-motion:reduce){
  .info-knopf{transition:none}
}

/* ---------- Raster ---------- */
.raster{
  display:grid;
  grid-template-columns:262px minmax(0,1fr);
  gap:0;
  min-height:calc(100vh - 66px);
  align-items:start;
}
/* ---------- Rail: Inhaltsverzeichnis ----------
   Vier Ebenen, vier Erscheinungen. Vorher waren alle vier 13,5 px auf
   38 px Höhe und unterschieden sich nur durch das Zeichen „↳" — eine
   Hierarchie, die im Code stand, aber nicht auf dem Schirm. */
.rail{
  border-right:1px solid var(--linie);
  padding:18px 0 40px;
  position:sticky;top:0;max-height:100vh;overflow:auto;
}
.rail-gruppe{margin-bottom:6px}
.rail-gruppe + .rail-gruppe{border-top:1px solid var(--linie-hell);padding-top:8px}
/* Gruppenkopf der Seitenleiste ist Navigation, keine Inhaltsüberschrift —
   deshalb ein div mit derselben Darstellung, kein h2. Sonst liest ein
   Screenreader 12 Bereichsnamen als Dokumentgliederung vor. */
.rail-kopf,.rail-gruppe > h2{
  font-size:10.5px;font-weight:600;color:var(--schwach);
  letter-spacing:.04em;
  margin:0 0 4px;padding:0 18px;
  display:flex;justify-content:space-between;gap:8px;align-items:baseline;
}
.haeufig{
  font-family:var(--mono);font-size:10px;font-weight:500;
  font-variant-numeric:tabular-nums;
  color:var(--tinte);background:var(--papier);
  padding:1px 5px;border-radius:var(--r);
}
.rail-item{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  width:100%;text-align:left;font:inherit;
  color:var(--tinte);
  background:none;border:0;border-left:var(--kante) solid transparent;
  padding:5px 16px 5px 13px;cursor:pointer;
  min-height:36px;
}
/* Auf Fingerbedienung: mindestens 44 px Zielpunkthöhe (Apple/Google-Richtwert). */
@media (pointer:coarse){ .rail-item{min-height:44px} }
.rail-item:hover{background:var(--blatt)}
/* Tastaturfokus: die Seitenleiste hatte bisher gar keinen sichtbaren
   Fokusring — 50 Knöpfe, durch die man nur mit Tab kommt, ohne je zu
   sehen, wo man steht. Der Ring liegt nach innen, damit er den
   Aktivbalken links nicht überdeckt. */
.rail-item:focus-visible{
  outline:2px solid var(--tinte);outline-offset:-2px;
}
.rail-item.aktiv{border-left-color:var(--tinte);background:var(--blatt)}
.rail-item .z{font-family:var(--mono);font-size:11px;color:var(--schwach);font-variant-numeric:tabular-nums}

/* Ebene 1 — die sechs Formate: größer, schwerer, nummeriert. Sie sind die
   Hauptwege; Nummern sind hier berechtigt, weil die Lernwege einer
   empfohlenen Reihenfolge folgen (rechnen → prüfen → abfragen …). */
.rail-formate{
  border:1px solid var(--linie);border-radius:var(--r-flaeche);
  margin:0 12px 10px;overflow:hidden;
}
.rail-formate .rail-item{
  min-height:40px;padding:6px 12px;
  border-left:0;border-top:1px solid var(--linie-hell);
  font-size:var(--t-klein);
}
.rail-formate .rail-item:first-child{border-top:0}
.rail-formate .rail-item.aktiv{
  background:var(--tinte);color:var(--blatt);
}
.rail-formate .rail-item.aktiv .z{color:rgba(255,255,255,.72)}
.rail-formate .rail-item.aktiv .nr{color:rgba(255,255,255,.72)}
.nr{
  font-family:var(--mono);font-size:10.5px;font-weight:600;
  color:var(--schwach);font-variant-numeric:tabular-nums;
  flex:0 0 15px;
}
.rail-formate .rail-item > span:first-child{
  flex:1;display:flex;gap:10px;align-items:baseline;
}
.rail-item b{font-weight:500}

/* Ebene 2 — Bereich: Titelzeile, kein Knopf. Sie gliedert, sie führt nicht. */
.rail-kopf.titel{
  color:var(--tinte);font-size:var(--t-klein);font-weight:600;
  letter-spacing:0;margin-top:9px;
}

/* Ebene 3 — eine Aufgabe (Rechenaufgabe): eingerückt.
   Ebene 4 — Quiz/Karten zu diesem Bereich: noch einmal eingerückt, klein,
   ohne Fortschrittszahl (die Zahl dort ist eine Menge, kein Fortschritt). */
.rail-item.tief{padding-left:26px;font-size:var(--t-klein)}
.rail-item.spross{
  padding-left:27px;font-size:12.5px;color:var(--schwach);min-height:32px;
}
.rail-item.spross:hover{color:var(--tinte)}
.rail-item.spross .z{color:var(--schwach)}
/* Fortschritt als kleine Marke statt als nackte Zahl: er ist ein Zustand,
   kein Wert. Ein leerer Zustand bekommt den neutralen Strich. */
.stand-marke{
  font-family:var(--mono);font-size:10px;font-variant-numeric:tabular-nums;
  border:1px solid var(--linie);border-radius:var(--r);
  padding:1px 5px;min-width:34px;text-align:center;color:var(--schwach);
}
.stand-marke.voll{color:var(--gruen);border-color:var(--gruen);background:var(--gruen-hell)}
.rail-item.aktiv .stand-marke{border-color:var(--tinte)}
.rail-fuss{border-top:1px solid var(--linie);margin-top:10px;padding-top:10px}
.rail-legende{
  font-size:11px;line-height:1.45;color:var(--schwach);
  margin:12px 0 0;padding:0 18px;
}

/* ---------- Blatt ---------- */
.blatt{padding:26px 30px 80px;max-width:920px;scroll-margin-top:14px}
/* Der Kopfstreifen ist die Bogenkennung: eine Zeile, die sagt, welcher Teil
   der Prüfung hier liegt. Der kurze Querstrich vor dem Titel ist dasselbe
   Zeichen wie in der Seitenleiste — es bindet Kopf und Liste aneinander. */
.kopfstreifen{
  display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;
  border-bottom:2px solid var(--tinte);padding-bottom:10px;margin-bottom:22px;
}
.kopfstreifen h2{
  font-size:var(--t-heft);font-weight:700;letter-spacing:-.028em;
  position:relative;padding-left:15px;
}
.kopfstreifen h2::before{
  content:"";position:absolute;left:0;top:.42em;
  width:9px;height:var(--kante);background:var(--tinte);
}
.kopfstreifen .meta{
  font-size:var(--t-klein);color:var(--schwach);margin-left:auto;text-align:right;
  max-width:46ch;
}
.kopfstreifen .meta b{font-family:var(--mono);color:var(--tinte);font-variant-numeric:tabular-nums}

.szenario{margin:0 0 18px;max-width:74ch}
.szenario p{margin:0 0 10px}
.daten{
  border:1px solid var(--linie);background:var(--blatt);
  margin:0 0 20px;font-size:13.5px;
}
.daten table{width:100%;border-collapse:collapse}
.daten th{
  text-align:left;font-weight:600;font-size:11.5px;color:var(--schwach);
  padding:7px 12px;border-bottom:1px solid var(--linie);background:var(--papier);
}
.daten td{padding:6px 12px;border-bottom:1px solid var(--linie-hell);overflow-wrap:anywhere}
.daten tr:last-child td{border-bottom:0}
.daten td.z{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:normal}

/* ---------- Startseite ----------
   Auf der Startseite steht die Wahl, nicht die Arbeit. Deshalb ruhige
   Flächen: Rahmen, matter Schatten, kein Kopfbalken. Die Gewichtskante
   bleibt allein dem Blatt vorbehalten, an dem gerade gearbeitet wird
   (Kalkulation, Quiz, Karte, Fallstudie, Dialog). Siehe `.schema`,
   `.quiz`, `.karte`, `.fall-schritt`, `.bestaetig`. */
.start{
  border:1px solid var(--linie);border-radius:var(--r-flaeche);
  background:var(--blatt);box-shadow:var(--schatten-blatt);
  padding:20px 22px;max-width:74ch;margin-bottom:16px;
}
.start h3{
  font-size:var(--t-gross);font-weight:600;
  position:relative;padding-left:13px;
}
.start h3::before{
  content:"";position:absolute;left:0;top:.42em;
  width:7px;height:var(--kante);background:var(--tinte);
}
.start p{margin:8px 0 14px;font-size:var(--t-klein);color:var(--schwach);max-width:68ch}
.start .formate{margin-top:14px}

/* ---------- Kalkulationsblatt: das Blatt, an dem gearbeitet wird ---------- */
.schema{
  border:1px solid var(--linie);border-top:var(--kante) solid var(--tinte);
  background:var(--blatt);border-radius:var(--r-flaeche);
  position:relative;
}
.schema-kopf{
  display:grid;grid-template-columns:30px minmax(0,1fr) 150px 62px;
  font-size:11px;font-weight:600;color:var(--schwach);
  padding:7px 14px 7px 8px;border-bottom:1px solid var(--linie);
  background:var(--papier);
}
.schema-kopf .r{text-align:right}
.zeile{
  display:grid;grid-template-columns:30px minmax(0,1fr) 150px 62px;
  align-items:center;padding:3px 14px 3px 8px;
  border-bottom:1px solid var(--linie-hell);
}
.zeile:last-child{border-bottom:0}
.zeile .marke{
  font-family:var(--mono);font-size:14px;font-weight:600;text-align:center;
  color:var(--linie);line-height:1;
}
.zeile.richtig .marke{color:var(--gruen)}
.zeile.falsch .marke{color:var(--rot)}
.zeile .name{font-size:13.5px;padding-right:10px}
.zeile .name .op{font-family:var(--mono);color:var(--schwach);margin-right:7px}
.zeile.ergebnis .name{font-weight:600}
.zeile .feld{display:flex;justify-content:flex-end}
.zeile input{
  font:inherit;font-family:var(--mono);font-size:14px;
  font-variant-numeric:tabular-nums;text-align:right;
  width:100%;padding:5px 8px;
  border:1px solid var(--schwach);border-radius:var(--r);
  background:var(--blatt);color:var(--tinte);
}
.zeile input:focus{outline:2px solid var(--tinte);outline-offset:-1px;border-color:var(--tinte)}
.zeile input::placeholder{color:var(--schwach)}
.zeile.gegeben{background:var(--papier)}
.zeile.gegeben .wert{
  font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;
  text-align:right;color:var(--schwach);
}
.zeile.falsch input{border-color:var(--rot);background:var(--rot-hell)}
.zeile.richtig input{border-color:var(--gruen);background:var(--gruen-hell)}
.zeile .korrektur{
  font-family:var(--mono);font-size:11.5px;color:var(--rot);
  text-align:right;padding-right:6px;
}
.einheit{font-size:12.5px;color:var(--schwach);padding-left:8px}

/* ---------- Aktionen ---------- */
.aktionen{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
button.akt{
  font:inherit;font-size:14px;font-weight:500;
  padding:9px 18px;border-radius:var(--r);cursor:pointer;
  border:1px solid var(--tinte);background:var(--tinte);color:var(--blatt);
}
button.akt:hover{background:var(--tinte-hoch);border-color:var(--tinte-hoch)}
button.akt.zweit{background:transparent;color:var(--tinte)}
button.akt.zweit:hover{background:var(--blatt)}
button.akt:disabled{opacity:.4;cursor:default}
button.akt:focus-visible{outline:2px solid var(--tinte);outline-offset:2px}

/* ---------- Stempel: Bewertung mit Doppellinie ---------- */
.stempel{
  position:absolute;top:-14px;right:-12px;
  background:var(--blatt);
  border:2px solid var(--rot);
  box-shadow:0 0 0 1px var(--blatt),0 0 0 2px var(--rot);
  color:var(--rot);
  padding:7px 15px 6px;
  font-family:var(--mono);text-align:center;line-height:1.15;
}
.stempel b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stempel span{font-size:10.5px;letter-spacing:.03em}
.stempel.gut{border-color:var(--gruen);color:var(--gruen);box-shadow:0 0 0 1px var(--blatt),0 0 0 2px var(--gruen)}

/* ---------- Lösungsweg ---------- */
.weg{
  margin-top:22px;border-top:1px solid var(--linie);padding-top:16px;
  font-size:13.5px;max-width:74ch;
}
.weg h3{font-size:12px;font-weight:600;color:var(--schwach);margin:0 0 10px}
.weg ol{margin:0;padding-left:22px}
.weg li{margin-bottom:5px;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.weg .hinweis{
  margin-top:12px;padding:10px 13px;background:var(--blatt);
  border-left:3px solid var(--tinte);font-size:13px;
}
.weg .quelle{margin-top:12px;font-size:12.5px;color:var(--schwach)}
.weg .quelle a{color:var(--tinte)}

/* ---------- Simulation ---------- */
.simleiste{
  display:flex;gap:16px;align-items:center;flex-wrap:wrap;
  background:var(--blatt);border:1px solid var(--linie);border-left:3px solid var(--tinte);
  padding:9px 14px;margin-bottom:20px;font-size:13px;
}
.simleiste .t{font-family:var(--mono);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.simleiste .fort{margin-left:auto;font-family:var(--mono);font-size:12.5px;color:var(--schwach);font-variant-numeric:tabular-nums}

/* ---------- Ergebnis ---------- */
.ergebnis{
  border:1px solid var(--linie);border-top:var(--kante) solid var(--tinte);
  background:var(--blatt);border-radius:var(--r-flaeche);
  padding:22px 24px;max-width:74ch;
}
.ergebnis h3{margin:0 0 4px;font-size:20px;font-weight:700}
.ergebnis .quote{
  font-family:var(--mono);font-size:46px;font-weight:600;line-height:1.05;
  font-variant-numeric:tabular-nums;
  margin:10px 0 2px;letter-spacing:-.03em;
}
.ergebnis .note{font-size:var(--t-klein);color:var(--schwach);margin-bottom:16px}
.ergebnis table{width:100%;border-collapse:collapse;font-size:var(--t-text);margin-top:8px}
.ergebnis td{padding:6px 0;border-bottom:1px solid var(--linie-hell)}
.ergebnis td.z{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- Quellen ----------
   Eine ruhige Fläche (kein Kopfbalken): Nachschlagen ist kein Arbeiten an
   einer Aufgabe. Sie darf leicht sein. */
.quellen{
  border:1px solid var(--linie);border-radius:var(--r-flaeche);
  background:var(--blatt);padding:20px 22px;max-width:74ch;
}
.quellen h3{
  font-size:var(--t-gross);font-weight:600;
  position:relative;padding-left:13px;
}
.quellen h3::before{
  content:"";position:absolute;left:0;top:.42em;
  width:7px;height:var(--kante);background:var(--tinte);
}
.quellen h3:not(:first-child){margin-top:26px;border-top:1px solid var(--linie-hell);padding-top:18px}
.quellen p{margin:6px 0 10px;font-size:var(--t-klein);color:var(--schwach);max-width:68ch}
.quellen ul{margin:0;padding-left:20px;font-size:var(--t-klein)}
.quellen li{margin-bottom:6px}
.quellen a{color:var(--tinte)}
.hinweis-box{
  margin-top:20px;padding:12px 15px;background:var(--papier);
  border-left:var(--kante) solid var(--rot);font-size:var(--t-klein);
}

/* ---------- Bestätigung: eigene Fläche statt confirm() ----------
   Ein dialog bringt Fokusfang, Escape und die richtige Rolle von Haus aus mit;
   confirm() ist nicht gestaltbar, blockiert den Hauptfaden und wirkt je nach
   Browser fremd. */
.bestaetig{
  border:1px solid var(--linie);border-top:var(--kante) solid var(--tinte);
  background:var(--blatt);color:var(--tinte);
  border-radius:var(--r-flaeche);
  padding:20px 22px;max-width:44ch;margin:auto;
  box-shadow:0 18px 45px rgba(17,28,46,.22);
  overscroll-behavior:contain;
}
.bestaetig::backdrop{background:rgba(17,28,46,.45)}
.bestaetig h2{margin:0 0 8px;font-size:17px;font-weight:700}
.bestaetig p{margin:0 0 18px;font-size:var(--t-klein);color:var(--schwach);line-height:1.5}
.bestaetig-aktionen{display:flex;gap:10px;flex-wrap:wrap}
/* Bestätigungsdialoge sind wartende Flächen: solange sie offen sind, soll
   die Seite dahinter stillhalten statt weiterzuscrollen. */
.bestaetig + *{overscroll-behavior:contain}
.leer{color:var(--schwach);font-size:var(--t-text)}

/* ---------- Formate als Wahl, nicht als Kartenreihe ----------
   Links die Nummer (die Lernwege folgen einer Reihenfolge), daneben
   Umfang, Name und ein Satz. Die ganze Fläche ist ein Zielpunkt. */
.formate{display:grid;grid-template-columns:repeat(auto-fit,minmax(216px,1fr));gap:0;
  border:1px solid var(--linie);border-radius:var(--r-flaeche);overflow:hidden}
.format{
  display:grid;grid-template-columns:22px minmax(0,1fr);gap:11px;
  align-items:start;text-align:left;font:inherit;cursor:pointer;
  border:0;border-top:1px solid var(--linie-hell);border-left:1px solid var(--linie-hell);
  background:var(--blatt);padding:13px 14px;
  min-height:44px;
}
.format:nth-child(-n+1){border-top:0}
.format:hover{background:var(--papier)}
.format:focus-visible{outline:2px solid var(--tinte);outline-offset:-2px}
.format .nr{margin-top:2px}
.format b{display:block;font-size:var(--t-text);font-weight:600;margin-bottom:3px}
.format span{font-size:var(--t-klein);color:var(--schwach);line-height:1.45}
.format .umfang{
  font-family:var(--mono);font-size:10.5px;color:var(--schwach);
  font-variant-numeric:tabular-nums;display:block;margin-bottom:4px;
}

/* ---------- Quiz ---------- */
.quiz{
  border:1px solid var(--linie);border-top:var(--kante) solid var(--tinte);
  background:var(--blatt);border-radius:var(--r-flaeche);
  padding:0 0 4px;position:relative;
}
.quiz-frage{padding:17px 20px 6px;font-size:var(--t-gross);font-weight:600;max-width:72ch;text-wrap:pretty}
.quiz-optionen{display:flex;flex-direction:column;gap:2px;padding:8px 12px 12px}
.quiz-opt{
  display:flex;gap:11px;align-items:flex-start;
  font:inherit;font-size:var(--t-text);text-align:left;cursor:pointer;
  border:1px solid transparent;background:none;border-radius:var(--r);
  padding:9px 11px;color:var(--tinte);min-height:44px;
}
.quiz-opt:hover{background:var(--papier);border-color:var(--linie)}
.quiz-opt .buchstabe{
  font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--schwach);
  border:1px solid var(--linie);border-radius:50%;width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;flex:0 0 22px;margin-top:1px;
}
.quiz-opt.gewaehlt{border-color:var(--tinte);background:var(--papier)}
.quiz-opt.richtig{border-color:var(--gruen);background:var(--gruen-hell)}
.quiz-opt.richtig .buchstabe{border-color:var(--gruen);color:var(--gruen)}
.quiz-opt.falsch{border-color:var(--rot);background:var(--rot-hell)}
.quiz-opt.falsch .buchstabe{border-color:var(--rot);color:var(--rot)}
.quiz-opt .urteil-marke{
  margin-left:auto;padding-left:10px;font-family:var(--mono);
  font-size:15px;font-weight:600;line-height:1.2;
}
.quiz-opt.richtig .urteil-marke{color:var(--gruen)}
.quiz-opt.falsch .urteil-marke{color:var(--rot)}
.quiz-opt:disabled{cursor:default}
.quiz-opt:focus-visible{outline:2px solid var(--tinte);outline-offset:-1px}
.quiz-erklaerung{
  margin:4px 20px 16px;padding:11px 14px;background:var(--blatt);
  border-left:var(--kante) solid var(--tinte);font-size:var(--t-klein);max-width:70ch;
}
.quiz-erklaerung b{font-weight:600}
#quiz-erklaerung.gut .quiz-erklaerung{border-left-color:var(--gruen);background:var(--gruen-hell)}
#quiz-erklaerung.schlecht .quiz-erklaerung{border-left-color:var(--rot);background:var(--rot-hell)}
.quiz-fortschritt{font-family:var(--mono);font-size:12.5px;color:var(--schwach);font-variant-numeric:tabular-nums}
/* Schmaler Fortschrittsbalken unter dem Quizkopf – zeigt Position in der Runde */
.fortschrittsbalken{height:var(--kante);background:var(--linie-hell);margin:-22px 0 20px;overflow:hidden}
.fortschrittsbalken > i{display:block;height:100%;background:var(--tinte);transition:width .25s ease}

/* ---------- Karteikarten ---------- */
.karten-stapel{max-width:620px}
/* Die Karte ist ein echter Karton: sie darf schwerer sein als alles andere,
   weil sie das einzige Element ist, das man in die Hand nimmt. */
.karte{
  border:1px solid var(--linie);border-top:var(--kante) solid var(--tinte);
  background:var(--blatt);border-radius:var(--r-flaeche);
  box-shadow:var(--schatten-blatt);
  min-height:210px;padding:26px 28px;display:flex;flex-direction:column;
  justify-content:center;cursor:pointer;position:relative;
}
.karte .fach{
  position:absolute;top:11px;right:14px;
  font-family:var(--mono);font-size:10px;color:var(--schwach);
  border:1px solid var(--linie);padding:1px 6px;border-radius:var(--r);
}
.karte .seite{
  font-size:var(--t-mikro);font-weight:600;color:var(--schwach);
  letter-spacing:.04em;margin-bottom:12px;
  padding-bottom:6px;border-bottom:1px solid var(--linie-hell);
}
.karte .vorderseite{font-size:18px;font-weight:600;line-height:1.35;text-wrap:balance}
.karte .rueckseite{font-size:var(--t-text);line-height:1.55;margin-top:4px}
.karte .rueckseite ul{margin:8px 0 0;padding-left:20px}
.karte .rueckseite li{margin-bottom:4px}
.karte .hinweis-klick{font-size:12px;color:var(--schwach);margin-top:16px}
.karte:hover{border-color:var(--tinte);background:var(--papier)}
.karte:focus-visible{outline:2px solid var(--tinte);outline-offset:2px}
.karten-aktionen{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.karten-zaehler{font-family:var(--mono);font-size:12.5px;color:var(--schwach);margin-left:auto;align-self:center;font-variant-numeric:tabular-nums}

/* ---------- Lückentext / Fehlersuche ---------- */
.luecke{font-size:var(--t-gross);line-height:1.9;max-width:74ch}
.luecke input{
  font:inherit;font-family:var(--mono);font-size:14px;
  border:0;border-bottom:2px solid var(--schwach);background:var(--blatt);
  padding:2px 6px;margin:0 3px;text-align:center;
  min-width:120px;color:var(--tinte);
}
.luecke input:focus{outline:2px solid var(--tinte);outline-offset:1px;border-bottom-color:var(--tinte)}
.luecke input.richtig{border-bottom-color:var(--gruen);background:var(--gruen-hell)}
.luecke input.falsch{border-bottom-color:var(--rot);background:var(--rot-hell)}
.luecke .leer{color:var(--schwach);font-size:12.5px;font-family:var(--mono)}
.fehlerzeile{
  display:flex;gap:12px;align-items:flex-start;padding:10px 14px;
  border-bottom:1px solid var(--linie-hell);
}
.fehlerzeile:last-child{border-bottom:0}
.fehlerzeile .nr{font-family:var(--mono);font-size:12.5px;color:var(--schwach);flex:0 0 22px;padding-top:2px;font-variant-numeric:tabular-nums}
.fehlerzeile .txt{flex:1;min-width:0;font-family:var(--mono);font-size:var(--t-klein);line-height:1.6}
.fehlerzeile.fehlerhaft .txt{background:var(--rot-hell);border-left:var(--kante) solid var(--rot);padding:6px 10px;margin-left:-13px}
.fehlerzeile .urteil{display:flex;gap:6px;flex:0 0 auto}
.fehlerzeile button{
  font:inherit;font-size:12.5px;padding:4px 11px;cursor:pointer;
  border:1px solid var(--linie);background:var(--blatt);border-radius:var(--r);color:var(--tinte);
  min-height:36px;
}
.fehlerzeile button:hover{border-color:var(--tinte)}
.fehlerzeile button.an{background:var(--tinte);color:var(--blatt);border-color:var(--tinte)}
.fehlerzeile button:disabled{cursor:default;opacity:.75}
.fehlerzeile button:focus-visible{outline:2px solid var(--tinte);outline-offset:-1px}
.fehlerzeile .marke{font-family:var(--mono);font-size:14px;font-weight:600;flex:0 0 18px;padding-top:3px}
.fehlerzeile.richtig .marke{color:var(--gruen)}
.fehlerzeile.falsch .marke{color:var(--rot)}

/* ---------- Fallstudie ---------- */
.fall{max-width:74ch}
.fall-schritt{
  border:1px solid var(--linie);border-top:var(--kante) solid var(--tinte);
  background:var(--blatt);border-radius:var(--r-flaeche);
  padding:18px 22px;margin-bottom:14px;
}
.fall-schritt .nr{font-family:var(--mono);font-size:var(--t-mikro);font-weight:600;color:var(--schwach);letter-spacing:.04em}
.fall-schritt h4{margin:5px 0 9px;font-size:var(--t-gross);font-weight:600}
.fall-schritt p{margin:0 0 12px;font-size:var(--t-text)}
.fall-schritt .kunde{
  font-size:var(--t-klein);background:var(--papier);border-left:var(--kante) solid var(--linie);
  padding:10px 13px;margin:0 0 14px;
}
.fall-schritt .kunde b{font-weight:600}
.fall-optionen{display:flex;flex-direction:column;gap:7px}
.fall-opt{
  text-align:left;font:inherit;font-size:var(--t-klein);cursor:pointer;
  border:1px solid var(--linie);background:var(--blatt);border-radius:var(--r);padding:10px 13px;
  min-height:44px;
}
.fall-opt:hover{border-color:var(--tinte)}
.fall-opt.gewaehlt{border-color:var(--tinte);background:var(--tinte);color:var(--blatt)}
.fall-opt.richtig{border-color:var(--gruen);background:var(--gruen-hell)}
.fall-opt.falsch{border-color:var(--rot);background:var(--rot-hell)}
.fall-opt:focus-visible{outline:2px solid var(--tinte);outline-offset:-1px}
.fall-feedback{
  margin-top:12px;padding:11px 14px;font-size:var(--t-klein);
  border-left:var(--kante) solid var(--tinte);background:var(--blatt);
}
.fall-verlauf{font-size:var(--t-klein);color:var(--schwach);margin-bottom:16px}
.fall-verlauf b{font-family:var(--mono);color:var(--tinte);font-variant-numeric:tabular-nums}
.fall-schritt .kundenmail{
  font-size:var(--t-klein);background:var(--blatt);border:1px solid var(--linie);
  border-top:var(--kante) solid var(--tinte);padding:12px 15px;margin:0 0 14px;max-width:70ch;
}
.fall-schritt .kundenmail p{margin:0 0 8px;font-size:var(--t-klein)}
.fall-schritt .kundenmail p:last-child{margin-bottom:0}

@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }

/* ---------- Mobil ---------- */
.rail-toggle{
  display:none;font:inherit;font-size:13px;font-weight:500;
  background:transparent;color:var(--tinte);border:1px solid var(--tinte);
  padding:6px 13px;border-radius:var(--r);cursor:pointer;
  align-items:center;min-height:44px;
}
.rail-toggle:focus-visible{outline:2px solid var(--tinte);outline-offset:2px}
/* Rückweg zur Übersicht – im Lernfluss sichtbar, ohne den Fortschritt zu löschen */
.heim{
  font:inherit;font-size:13px;font-weight:500;
  background:transparent;color:var(--tinte);border:1px solid var(--schwach);
  padding:6px 13px;border-radius:var(--r);cursor:pointer;
  display:inline-flex;align-items:center;min-height:44px;
}
.heim[hidden]{display:none}
.heim:hover{background:var(--papier);border-color:var(--tinte)}
.heim:focus-visible{outline:2px solid var(--tinte);outline-offset:2px}

@media (max-width:900px){
  /* minmax(0,1fr) statt 1fr: sonst erzwingt der min-content der Zelle
     einen waagerechten Ueberlauf der ganzen Seite. */
  .raster{grid-template-columns:minmax(0,1fr)}
  .rail{
    display:none;position:static;max-height:none;overflow:visible;
    border-right:0;border-bottom:1px solid var(--linie);
    padding-bottom:calc(16px + env(safe-area-inset-bottom));
  }
  body.rail-offen .rail{display:block}
  .rail-formate{margin:0 12px 10px}
  .rail-toggle{display:inline-flex}
  /* Erklärender Hinweis steht im „Mehr"-Block als letzter Eintrag — er
     schiebt sich sonst zwischen Kopfzeile und ersten Lernschritt und
     drängt den Inhalt aus dem Bild. */
  .rail-legende{margin-top:14px}
  /* Kopfzeile mobil: Titel, dann Stand, dann die Wahl — der Stand gehört
     unter den Titel, weil er die Auskunft zum gerade Geöffneten ist.
     Die Wahl steht als Spalte, nicht als Zeile: sonst drängt der
     Speicher-Zustand die Knöpfe in zwei Reihen und die Kopfzeile wächst
     auf ein Drittel des Schirms. */
  .kopf{gap:0;padding:11px max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
  .kopf-oben{flex:1 1 100%;gap:12px;padding-bottom:8px}
  .kopf .unter{display:none}
  .kopf-wahl{
    order:3;flex:1 1 100%;flex-direction:column;align-items:stretch;gap:6px;
    margin-left:0;padding:8px 0 10px;
    border-top:1px solid var(--linie-hell);
  }
  .kopf-stand{order:-1;text-align:right;font-size:10px}
  .kopf-schalter{justify-content:space-between;flex-wrap:nowrap;gap:6px}
  .heim{flex:0 1 auto;padding:6px 10px}
  .rail-toggle{flex:0 1 auto;padding:6px 10px}
  .stand{order:2;padding:8px 0;gap:0}
  .stand-mass{flex:1 1 110px;margin-left:0}
  .blatt{padding:18px max(16px,env(safe-area-inset-right)) calc(64px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));min-width:0}
  .kopfstreifen h2{font-size:20px}
  .kopfstreifen .meta{margin-left:0;text-align:left;max-width:none}
  /* Breite Tabellen duerfen im eigenen Rahmen scrollen statt die Seite zu dehnen */
  .daten{overflow-x:auto}
  .daten table{min-width:max-content}
}

@media (max-width:700px){
  /* Kalkulationsblatt: pro Position zwei Zeilen statt vier Spalten */
  .schema-kopf{display:none}
  .zeile{
    grid-template-columns:22px minmax(0,1fr) 118px;
    grid-template-areas:
      "marke name name"
      ".     feld einheit";
    row-gap:3px;padding:9px 12px 9px 8px;
  }
  .zeile .marke{grid-area:marke;align-self:start;padding-top:2px}
  .zeile .name{grid-area:name;padding-right:0}
  .zeile .feld{grid-area:feld}
  .zeile .einheit{grid-area:einheit;padding-left:6px}
  .zeile .einheit .korrektur{display:block;padding-right:0}
  .stempel{top:-11px;right:-6px;padding:5px 10px}
  .stempel b{font-size:18px}
  .stempel span{font-size:9.5px}
  .ergebnis .quote{font-size:36px}
  /* Quiz & Karten */
  .quiz-frage{font-size:14.5px;padding:14px 14px 4px}
  .quiz-optionen{padding:6px 8px 10px}
  .quiz-erklaerung{margin:4px 14px 14px}
  .karte{padding:20px 18px;min-height:180px}
  .karte .vorderseite{font-size:16px}

  /* Sechs Formate als Wahl: zwei Spalten bleiben lesbar, eine wäre sechs
     Bildschirmhöhen. Unter 380 px wird daraus eine Spalte. */
  .formate{grid-template-columns:repeat(2,minmax(0,1fr))}

}

@media (max-width:379px){
  .formate{grid-template-columns:minmax(0,1fr)}
  .format{border-left:0;border-top:1px solid var(--linie-hell)}

}

<script>
/* ============================================================
   AP1-Trainer — Rechen-Generator für die IHK-Abschlussprüfung Teil 1
   Alle Aufgaben werden bei jedem Aufruf mit neuen Zahlen erzeugt.
   ============================================================ */

/* ---------- Hilfsfunktionen ---------- */
const R = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
const r2 = n => Math.round(n * 100) / 100;
const r1 = n => Math.round(n * 10) / 10;

const eur = n => n.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const num = (n, d = 2) => n.toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = n => num(n, 1) + ' %';
/* Prozentwert für Rechenwege: "15 %" statt "15.0 %" */
const pv = n => num(n, Number.isInteger(n) ? 0 : 1) + ' %';
/* Dezimalzahl im deutschen Format, ohne Einheit */
const dz = (n, d = 2) => num(n, d);

/* Eingaben tolerant lesen: "1.234,50 €" und "1.234" -> 1234.5 bzw. 1234 */
function parseNum(s) {
  if (s == null) return NaN;
  let t = String(s).trim().replace(/\s|€|%|h|Std\.|Stunden|Tage|Stk\.|Stück/gi, '');
  if (t === '') return NaN;
  const hatKomma = t.includes(',');
  const hatPunkt = t.includes('.');
  if (hatKomma && hatPunkt) {
    t = t.lastIndexOf(',') > t.lastIndexOf('.')
      ? t.replace(/\./g, '').replace(',', '.')
      : t.replace(/,/g, '');
  } else if (hatKomma) {
    t = t.replace(',', '.');
  } else if (hatPunkt) {
    /* Nur Punkte: als Tausenderpunkte lesen, wenn jeder Punkt genau 3 Ziffern trennt
       und die Zahl nicht mit "0." beginnt (sonst ist es ein Dezimalpunkt). */
    const teile = t.split('.');
    const tausender = teile[0] !== '0' && teile[0] !== '' && teile.length > 1
      && teile.slice(1).every(x => x.length === 3);
    if (tausender) t = teile.join('');
  }
  const v = Number(t);
  return Number.isFinite(v) ? v : NaN;
}
function normText(s) {
  return String(s).toUpperCase().replace(/[^A-Z0-9]/g, '');
}
/* Buchstabenkette vergleichen – Reihenfolge tolerant */
function gleichBuchstaben(a, b) {
  const s = x => normText(x).split('').sort().join('');
  return s(a) === s(b);
}

/* ---------- Punkte & Fortschritt ---------- */
const STORE = 'ap1-trainer-v1';
const SERIE2_STORE = 'ap1-trainer-serie-ap2';
let fortschritt = { tasks: {}, serie: 0, punkte: 0 };
try {
  const g = JSON.parse(localStorage.getItem(STORE));
  if (g && g.tasks) fortschritt = Object.assign(fortschritt, g);
} catch (e) { /* Speicher nicht verfügbar */ }
/* Die Serie (aufeinanderfolgende richtige Antworten) gehört zum Prüfungsteil.
   AP1 und AP2 bekommen deshalb je einen eigenen Zähler — sonst würde eine
   AP2-Antwort die AP1-Serie zurücksetzen und umgekehrt. */
let serieAp2 = 0;
try { serieAp2 = Number(localStorage.getItem(SERIE2_STORE)) || 0; } catch (e) { }
const serieSetzen = (v) => {
  if (istAp2()) { serieAp2 = v; try { localStorage.setItem(SERIE2_STORE, String(v)); } catch (e) { } }
  else fortschritt.serie = v;
};
const speichern = () => {
  try { localStorage.setItem(STORE, JSON.stringify(fortschritt)); } catch (e) {}
  syncPlanen();
};

function quote() {
  let p = 0, m = 0;
  for (const k in fortschritt.tasks) {
    if (k.startsWith('ap2-') !== istAp2()) continue;
    p += fortschritt.tasks[k].punkte || 0; m += fortschritt.tasks[k].max || 0;
  }
  return m ? Math.round(p / m * 100) : null;
}
/* Wie viel des Stoffs ist überhaupt schon angefasst? Der Server liefert nur
   Profile und Namen, kein Maß für den gesamten Umfang — zwei Tabellen
   (`trainer_profile`, `trainer_progress`) sind die vereinbarte Grenze. Das
   Vertragstor prüft sie, deshalb wird hier nichts nachgeladen, sondern aus
   dem gerechnet, was schon im Browser liegt. */
function bearbeitet() {
  let erreicht = 0, gesamt = 0;
  for (const t of daten(teil).TASKS) {
    if (teil === 'ap1' && !passtJahr(t)) continue;
    gesamt++;
    const f = fortschritt.tasks[t.id];
    if (f && f.max && f.punkte / f.max >= 0.8) erreicht++;
  }
  return gesamt ? Math.round(erreicht / gesamt * 100) : 0;
}
function statistikZeichnen() {
  document.getElementById('st-punkte').textContent = fortschritt.punkte || 0;
  const q = quote();
  document.getElementById('st-quote').textContent = q === null ? '–' : q + ' %';
  /* Die Serie ist eine Eigenschaft des offenen Teils: sie wird im Quiz, im
     Lückentext und in der Fallstudie fortgeschrieben und darf nicht
     zwischen AP1 und AP2 hin- und herspringen. */
  document.getElementById('st-serie').textContent = (istAp2() ? serieAp2 : fortschritt.serie) || 0;
  /* Das Maß: der Fortschritt ist eine Strecke, keine Zahl. Der Balken trägt
     Viertelmarken, damit man die Position abliest statt sie zu schätzen. */
  const b = bearbeitet();
  const balken = document.getElementById('st-balken');
  if (balken) {
    balken.style.width = b + '%';
    balken.classList.toggle('voll', b >= 80);
  }
  const mass = document.getElementById('st-mass');
  if (mass) mass.textContent = b + ' % bearbeitet';
}

/* ============================================================
   LERNINHALTE (aus den Unterlagen im Ordner abgeleitet)
   Quellenkürzel:
     USV  = Systemtechnik · 03-System-USV.pptx
     FIN  = Systemtechnik · 10-System-Finanzierungsarten.pptx
     HK   = Systemtechnik · 15-System-Handelskalkulation-Lösung.pptx
     DBG  = Datenbank · DB-2609-Tag01/Tag02.pdf
     NF   = Datenbank · DB-2609-Tag05.pdf

/* ---------- Multiple-Choice-Quiz ---------- */
const QUIZ = [

    r: 2, e: 'Die Blindleistung pendelt zwischen Erzeuger und Verbraucher und wird nicht bezahlt – aber Kabel und USV müssen sie übertragen können. Deshalb gelten zwei Grenzen: maximale Wirkleistung und maximale Scheinleistung.', q_: 'USV' },
  { t: 'ap1', b: 'hardware', j: 1, q: 'Wie lautet der Leistungsfaktor (Wirkleistung ÷ Scheinleistung) in der Formel der Unterlagen?',
    a: ['0,50', '1,00', '0,80', '0,65'],
    r: 3, e: 'Im Material gilt: Wirkleistung = Scheinleistung × 0,65, entsprechend Scheinleistung = Wirkleistung × 1,55. Der Kehrwert 1 ÷ 0,65 ergibt rund 1,54.', q_: 'USV' },
  { t: 'ap1', b: 'hardware', j: 1, q: 'Welche USV-Bauart arbeitet nach dem Dauerwandlerprinzip und hat keine Umschaltzeit?',
    a: ['VFI-USV (Online)', 'VI-USV (Netzinteraktiv)', 'VFD-USV (Offline)', 'USV mit Netzfilter'],

    r: 1, e: 'Die Einzelwirkungsgrade werden multipliziert: 90 % × 90 % = 81 %. Genau dieses Beispiel steht in der USV-Präsentation.', q_: 'USV' },

  { t: 'ap1', b: 'hardware', j: 1, q: 'Wozu dient ein Netzfilter in elektronischen Geräten?',

  { t: 'ap1', b: 'hardware', j: 1, q: 'Welche Aufgabe hat ein Gleichrichter?',

  { t: 'ap1', b: 'wirtschaft', j: 3, q: 'Bei der Handelskalkulation: Was bedeutet „im Hundert“ rechnen?',

    r: 2, e: 'Beim Rechnen „im Hundert" steckt der Prozentsatz schon im Zielwert. Deshalb wird geteilt: Betrag ÷ (1 − Prozentsatz). Typisch für Kundenrabatt, Kundenskonto und Umsatzsteuer.', q_: 'HK' },
  { t: 'ap1', b: 'wirtschaft', j: 3, q: 'Welche Positionen werden „im Hundert“ gerechnet?',

  { t: 'ap1', b: 'wirtschaft', j: 3, q: 'In welcher Reihenfolge verläuft die Vorwärtskalkulation korrekt?',

  { t: 'ap1', b: 'wirtschaft', j: 3, q: 'Bei der Rückwärtskalkulation – bei welchen Positionen muss man besonders auf die richtige Bezugsbasis achten?',

    r: 2, e: 'Vorwärts ist es Kundenrabatt und Kundenskonto, rückwärts sind es Lieferrabatt und Lieferskonto – dort dreht sich die Rechenrichtung um (÷ statt ×).', q_: 'HK' },
  { t: 'ap1', b: 'wirtschaft', j: 1, q: 'Was ist Factoring?',

    r: 3, e: 'Beim Factoring verkauft ein Unternehmen seine Forderungen an einen Factoring-Dienstleister und erhält den Großteil des Geldes vor dem eigentlichen Fälligkeitstermin. Es gehört zur Außenfinanzierung.', q_: 'FIN' },
  { t: 'ap1', b: 'wirtschaft', j: 1, q: 'Welche Finanzierungsform gehört zur Innenfinanzierung?',

    r: 2, e: 'Bei 1:n wandert der Primärschlüssel der 1-Seite als Fremdschlüssel in die n-Seite. Nur so kann ein Datensatz der 1-Seite mehrfach referenziert werden.', q_: 'DBG' },
  { t: 'ap1', b: 'datenbank', j: 1, q: 'Wann ist eine 1:1-Beziehung sinnvoll?',
    a: ['Wenn zwei Tabellen gleich viele Spalten haben', 'Wenn beide Tabellen dieselbe Zeilenzahl haben', 'Immer, wenn es keinen Primärschlüssel gibt', 'Aus Datenschutz-, Performance- oder Strukturierungsgründen'],
    r: 3, e: '1:1 wird bewusst eingesetzt: um sensible Daten getrennt zu halten (Datenschutz), um selten genutzte Spalten auszulagern (Performance) oder um optionale Daten zu separieren.', q_: 'DBG' },
  { t: 'ap1', b: 'datenbank', j: 2, q: 'Was bedeutet Redundanz in einer Datenbank?',
    a: ['Mehrfache, unnötige Speicherung derselben Information', 'Die Sicherung der Daten auf einem zweiten Server', 'Ein doppelter Primärschlüssel', 'Die Wiederholung einer Abfrage'],
    r: 0, e: 'Redundanz ist die mehrfache Speicherung derselben Information. Sie kostet Speicher und führt zu Inkonsistenz, wenn nur eine der Kopien geändert wird – deshalb normalisiert man.', q_: 'NF' },
  { t: 'ap1', b: 'datenbank', j: 2, q: 'Was fordert die 1. Normalform?',
    a: ['Keine transitiven Abhängigkeiten', 'Jede Zelle enthält genau einen Wert (Atomisierung)', 'Keine partiellen Abhängigkeiten', 'Jede Tabelle hat genau einen Fremdschlüssel'],
    r: 1, e: 'Die 1. NF verlangt Atomisierung: In jeder Zelle steht genau ein Wert – keine Listen wie „Maus, Tastatur, Monitor" in einem Feld.', q_: 'NF' },
  { t: 'ap1', b: 'datenbank', j: 2, q: 'Was fordert die 2. Normalform?',
    a: ['Atomisierung aller Zellen', 'Keine transitiven Abhängigkeiten', 'Keine partiellen Abhängigkeiten von einem Teil des zusammengesetzten Schlüssels', 'Verzicht auf Fremdschlüssel'],
    r: 2, e: 'Die 2. NF setzt einen zusammengesetzten Schlüssel voraus und verlangt, dass jedes Nicht-Schlüssel-Attribut vom vollständigen Schlüssel abhängt – nicht nur von einem Teil davon.', q_: 'NF' },
  { t: 'ap1', b: 'datenbank', j: 2, q: 'Was fordert die 3. Normalform?',
    a: ['Keine mehrfachen Werte pro Zelle', 'Einen künstlichen Primärschlüssel', 'Keine Fremdschlüssel', 'Keine transitiven Abhängigkeiten über Nicht-Schlüssel-Attribute'],
    r: 3, e: 'Die 3. NF verbietet transitive Abhängigkeiten: Ein Nicht-Schlüssel-Attribut darf nicht von einem anderen Nicht-Schlüssel-Attribut abhängen. Beispiel: PLZ → Ort gehört in eine eigene Tabelle.', q_: 'NF' },
  { t: 'ap1', b: 'datenbank', j: 2, q: 'Welche drei Anomaliearten werden durch Normalisierung vermieden?',
    a: ['Änderungs-, Einfüge- und Löschanomalie', 'Lese-, Schreib- und Sperranomalie', 'Syntax-, Logik- und Laufzeitfehler', 'Redundanz-, Konsistenz- und Integritätsanomalie'],
    r: 0, e: 'Man unterscheidet Änderungs-, Einfüge- und Löschanomalie. Sie entstehen durch Redundanz und sind der Hauptgrund für Normalisierung.', q_: 'NF' },
  { t: 'ap1', b: 'datenbank', j: 2, q: 'Warum soll der Primärschlüssel einfach gehalten werden?',
    a: ['Weil er sonst nicht indiziert werden kann', 'Weil er sich sonst in jeder Fremdschlüsseltabelle wiederholt', 'Weil er sonst nicht eindeutig ist', 'Weil die Datenbank ihn sonst nicht akzeptiert'],
    r: 1, e: 'Ein langer oder zusammengesetzter Primärschlüssel wird in jede referenzierende Tabelle übernommen und bläht die Datenbank auf. Deshalb empfiehlt sich ein künstlicher Integer-Schlüssel mit AUTO_INCREMENT.', q_: 'NF' },
  { t: 'ap1', b: 'datenbank', j: 2, q: 'Welche Befehle gehören zur DDL (Data Definition Language)?',
    a: ['SELECT, INSERT, UPDATE', 'GRANT, REVOKE', 'CREATE, ALTER, DROP', 'COMMIT, ROLLBACK'],
    r: 2, e: 'DDL = Datendefinition: CREATE, ALTER, DROP, TRUNCATE. DML ändert Daten (INSERT, UPDATE, DELETE), DQL liest (SELECT), DCL regelt Rechte (GRANT, REVOKE), TCL steuert Transaktionen (COMMIT, ROLLBACK).', q_: 'DDL' },
  { t: 'ap1', b: 'datenbank', j: 2, q: 'Was ist der Unterschied zwischen DROP TABLE und TRUNCATE TABLE?',
    a: ['DROP löscht nur die Daten, TRUNCATE die Struktur', 'TRUNCATE kann nicht rückgängig gemacht werden, DROP schon', 'Beide löschen nur Daten', 'DROP löscht die ganze Tabelle samt Struktur, TRUNCATE nur die Daten'],
    r: 3, e: 'DROP TABLE entfernt die Tabelle vollständig mit ihrer Struktur. TRUNCATE TABLE leert die Tabelle, behält aber die Struktur – und ist deutlich schneller als DELETE ohne WHERE.', q_: 'DDL' },
  { t: 'ap1', b: 'datenbank', j: 2, q: 'Welche SQL-Klausel gehört NICHT in eine WHERE-Bedingung?',
    a: ['COUNT', 'IS NULL', 'LIKE', 'BETWEEN'],
    r: 0, e: 'Aggregatfunktionen wie COUNT, SUM, AVG, MIN und MAX dürfen nicht in WHERE stehen. Für Bedingungen auf Aggregate verwendet man HAVING nach GROUP BY.', q_: 'DQL' },
  { t: 'ap1', b: 'datenbank', j: 2, q: 'Wofür stehen die Wildcards % und _ in LIKE?',
    a: ['% = genau ein Zeichen, _ = beliebig viele Zeichen', '% = beliebig viele Zeichen, _ = genau ein Zeichen', 'Beide stehen für beliebig viele Zeichen', 'Beide stehen für genau ein Zeichen'],
    r: 1, e: 'Das Prozentzeichen ersetzt beliebig viele Zeichen (auch null), der Unterstrich genau ein Zeichen. Beispiel: LIKE \'M_ier%\' findet „Maier" und „Meier".', q_: 'DQL' },
  { t: 'ap1', b: 'datenbank', j: 2, q: 'Was bewirkt UNION ALL gegenüber UNION?',
    a: ['Es entfernt Duplikate', 'Es sortiert automatisch', 'Es behält Duplikate', 'Es erlaubt unterschiedliche Spaltenzahlen'],
    r: 2, e: 'UNION entfernt doppelte Zeilen und sortiert, UNION ALL gibt alle Zeilen unverändert zurück und ist dadurch schneller. Voraussetzung bei beiden: gleiche Spaltenzahl und kompatible Datentypen.', q_: 'DQL' },
  { t: 'ap1', b: 'datenbank', j: 2, q: 'Welche SQL-Klausel liest den Text „Informatik" ab dem dritten Zeichen?',
    a: ['LEFT(\'Informatik\', 3)', 'CONCAT(\'Informatik\', 3)', 'RIGHT(\'Informatik\', 3)', 'SUBSTR(\'Informatik\', 3)'],
    r: 3, e: 'SUBSTR(Text, start[, länge]) liest ab der angegebenen Position – SUBSTR(\'Informatik\', 3) ergibt „formatik". LEFT und RIGHT arbeiten von den Rändern aus.', q_: 'DQL' },
  { t: 'ap1', b: 'datenbank', j: 2, q: 'Wozu dient ein Index in einer Datenbank?',
    a: ['Er beschleunigt das Suchen und Sortieren', 'Er verschlüsselt die Daten', 'Er verhindert doppelte Datensätze', 'Er sichert die Daten gegen Verlust'],
    r: 0, e: 'Ein Index ist eine zusätzliche Sortierstruktur, die Such- und Sortiervorgänge beschleunigt – erkauft aber durch Schreibaufwand und Speicherplatz. Eindeutigkeit erzwingt erst UNIQUE oder PRIMARY KEY.', q_: 'DDL' },
  { t: 'ap1', b: 'datenbank', j: 3, q: 'Was kennzeichnet eine NoSQL-Datenbank wie MongoDB?',
    a: ['Sie speichert ausschließlich in Tabellen mit festem Schema', 'Sie ist schemalos und speichert Dokumente im JSON-ähnlichen Format', 'Sie ist immer schneller als eine relationale Datenbank', 'Sie kennt keine Abfragesprache'],
    r: 1, e: 'MongoDB ist dokumentenorientiert: Datenbank → Collection → Dokument → Feld entspricht SQL → Datenbank → Tabelle → Zeile → Spalte. Das Schema ist flexibel, Abfragen laufen über die MongoDB-Shell.', q_: 'NOS' },
  { t: 'ap1', b: 'datenbank', j: 3, q: 'Warum ist eine reine JSON-Datei keine echte Datenbank?',
    a: ['Weil sie kein Format für Computer ist', 'Weil sie zu klein ist', 'Weil Nebenläufigkeit, Integrität, Transaktionen und Mehrbenutzerzugriff fehlen', 'Weil sie sich nicht auslesen lässt'],
    r: 2, e: 'Eine JSON-Datei speichert nur strukturierte Daten. Es fehlen Transaktionen (ACID), referentielle Integrität, Mehrbenutzerbetrieb und Zugriffskontrolle – genau das leistet ein DBMS.', q_: 'NOS' },

  { t: 'ap1', b: 'netzwerk', j: 1, q: 'Wie viele nutzbare Host-Adressen hat das Subnetz 192.168.10.0/26?',
    a: ['126', '64', '30', '62'],
    r: 3, e: '/26 bedeutet 32 − 26 = 6 Host-Bits, also 2⁶ = 64 Adressen. Netz- und Broadcastadresse abziehen ergibt 62 nutzbare Hosts.', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 1, q: 'Welche Subnetzmaske gehört zu /27?',
    a: ['255.255.255.224', '255.255.255.240', '255.255.255.192', '255.255.255.248'],
    r: 0, e: 'Die letzten drei Bit sind 11100000 = 224. Merkhilfe: /25 = 128, /26 = 192, /27 = 224, /28 = 240, /29 = 248, /30 = 252.', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 1, q: 'Welche Adresse darf NICHT an einen Host vergeben werden?',
    a: ['Die zweite Adresse im Subnetz', 'Die erste Adresse im Subnetz (Netzadresse)', 'Die vorletzte Adresse im Subnetz', 'Die mittlere Adresse im Subnetz'],
    r: 1, e: 'Die erste Adresse (alle Host-Bits 0) ist die Netzadresse, die letzte (alle Host-Bits 1) die Broadcastadresse. Beide sind für Hosts reserviert und nicht nutzbar.', q_: 'NW' },
  { t: 'ap1', b: 'netzwerk', j: 1, q: 'Wofür steht das Kürzel VPN?',
    a: ['Virtual Public Network', 'Very Protected Node', 'Virtual Private Network', 'Verified Private Node'],
    r: 2, e: 'Ein Virtual Private Network baut über ein unsicheres Netz (meist das Internet) einen verschlüsselten Tunnel auf, durch den die Teilnehmer so kommunizieren, als wären sie im gleichen lokalen Netz.', q_: 'NW' },

  { t: 'ap1', b: 'sicherheit', j: 1, q: 'Was ist der Unterschied zwischen Datensicherheit und Datenschutz?',
    a: ['Datensicherheit schützt Personen, Datenschutz schützt Daten', 'Datenschutz betrifft nur Behörden', 'Beide Begriffe meinen dasselbe', 'Datensicherheit schützt Daten vor Verlust und Manipulation, Datenschutz schützt personenbezogene Daten'],
    r: 3, e: 'Datensicherheit (Safety/Security) zielt auf die Daten selbst: Verfügbarkeit, Integrität, Vertraulichkeit. Datenschutz schützt das Recht der Person an ihren personenbezogenen Daten – rechtlich geregelt durch die DSGVO.', q_: 'DBG' },
  { t: 'ap1', b: 'sicherheit', j: 1, q: 'Was besagt das „A" in ACID?',
    a: ['Atomicity – eine Transaktion läuft ganz oder gar nicht', 'Availability – die Datenbank ist immer erreichbar', 'Authentication – jeder Nutzer wird geprüft', 'Authorization – Rechte werden vergeben'],
    r: 0, e: 'ACID steht für Atomicity (ganz oder gar nicht), Consistency (Konsistenz), Isolation (Nebenläufigkeit ohne Störung) und Durability (Dauerhaftigkeit). BASE ist das lockerere Gegenmodell verteilter Systeme.', q_: 'DBG' },
  { t: 'ap1', b: 'sicherheit', j: 1, q: 'Was beschreibt die Verfügbarkeit in Prozent (z. B. 99,9 %)?',
    a: ['Den Anteil der fehlerfreien Datensätze', 'Den Anteil der Zeit, in der das System vertraglich nutzbar ist', 'Die Zahl der gleichzeitigen Nutzer', 'Die Geschwindigkeit der Antwortzeiten'],
    r: 1, e: 'Verfügbarkeit ist der Anteil der vereinbarten Betriebszeit, in der das System nutzbar ist. Sie wird meist über die jährliche Ausfallzeit angegeben: 99,9 % bedeutet rund 8,76 Stunden Ausfall im Jahr.', q_: 'NW' },
  { t: 'ap1', b: 'sicherheit', j: 1, q: 'Was ist ein Brandabschnitt?',
    a: ['Ein Netzsegment mit eigenem VLAN', 'Die Absicherung eines Servers mit einem Passwort', 'Ein Bereich, der Feuer und Rauch für eine bestimmte Zeit zurückhält', 'Der Teil eines Rechners, der heiß wird'],
    r: 2, e: 'Brandabschnitte unterteilen Gebäude so, dass Feuer und Rauch für eine definierte Zeit (meist 30, 60 oder 90 Minuten) zurückgehalten werden. Sie schützen Serverräume und Fluchtwege.', q_: 'USV' },

  { t: 'ap1', b: 'pm', j: 2, q: 'Was ist der kritische Pfad im Netzplan?',
    a: ['Der Weg mit den meisten Vorgängen', 'Der Weg mit den meisten Pufferzeiten', 'Der Weg mit den geringsten Kosten', 'Der längste Weg durch den Netzplan, der die Gesamtdauer bestimmt'],
    r: 3, e: 'Der kritische Pfad ist der längste Weg von Start bis Ende. Alle Vorgänge darauf haben keine freie Pufferzeit (FAZ = FEZ, SAZ = SEZ) – jede Verzögerung verzögert das ganze Projekt.', q_: 'PM' },
  { t: 'ap1', b: 'pm', j: 2, q: 'Was bedeutet ein Puffer von 0 Tagen für einen Vorgang?',
    a: ['Er liegt auf dem kritischen Pfad', 'Er ist nicht durchführbar', 'Er kann beliebig verschoben werden', 'Er wurde noch nicht geplant'],
    r: 0, e: 'Puffer 0 heißt: frühester und spätester Termin fallen zusammen. Der Vorgang liegt auf dem kritischen Pfad und darf sich nicht verzögern.', q_: 'PM' },
  { t: 'ap1', b: 'pm', j: 2, q: 'Wozu dient ein Lastenheft?',
    a: ['Der Auftragnehmer beschreibt seine Lösung', 'Der Auftraggeber beschreibt seine Anforderungen', 'Der Prüfer dokumentiert das Ergebnis', 'Die Kosten werden abgerechnet'],
    r: 1, e: 'Das Lastenheft kommt vom Auftraggeber und beschreibt WAS gefordert ist. Das Pflichtenheft kommt vom Auftragnehmer und beschreibt WIE die Anforderung umgesetzt wird.', q_: 'PM' },
  { t: 'ap1', b: 'pm', j: 2, q: 'Wofür steht PDCA?',
    a: ['Prepare, Do, Confirm, Adjust', 'Plan, Develop, Control, Apply', 'Plan, Do, Check, Act', 'Plan, Document, Check, Archive'],
    r: 2, e: 'Der PDCA-Zyklus (Demingkreis) beschreibt kontinuierliche Verbesserung: Planen, Umsetzen, Überprüfen, Handeln. PDSA ersetzt „Check" durch „Study".', q_: 'PM' },

  { t: 'ap1', b: 'angebot', j: 1, q: 'Was ist der Zweck einer Nutzwertanalyse?',
    a: ['Den billigsten Anbieter zu finden', 'Die Lieferzeit zu verkürzen', 'Die Umsatzsteuer zu berechnen', 'Mehrere Angebote nach gewichteten Kriterien vergleichbar zu machen'],
    r: 3, e: 'Die Nutzwertanalyse bewertet Angebote nach mehreren Kriterien mit unterschiedlicher Gewichtung. Für jeden Anbieter wird Erfüllung × Gewichtung summiert – der höchste Gesamtnutzwert gewinnt.', q_: 'FIN' },
  { t: 'ap1', b: 'angebot', j: 1, q: 'Ein Kriterium hat die Gewichtung 30 %, der Anbieter erfüllt es zu 80 %. Welchen Teilnutzen bringt das?',
    a: ['24 Punkte', '80 Punkte', '110 Punkte', '2,4 Punkte'],
    r: 0, e: 'Teilnutzen = Erfüllungsgrad × Gewichtung = 80 × 0,30 = 24 Punkte. Bei einer Skala von 1 bis 10 wäre es 8 × 3 = 24.', q_: 'FIN' },
  { t: 'ap1', b: 'angebot', j: 1, q: 'Was sollte ein Angebot in jedem Fall enthalten?',
    a: ['Nur den Preis', 'Preis, Leistungsumfang, Liefer- und Zahlungsbedingungen', 'Nur die technischen Daten', 'Die Gehälter der Mitarbeiter'],
    r: 1, e: 'Ein Angebot muss den Leistungsumfang, den Preis, die Lieferzeit, die Zahlungsbedingungen (Skonto, Fälligkeit), Gewährleistung und die Bindefrist enthalten – sonst ist kein Vergleich möglich.', q_: 'FIN' },
  { t: 'ap1', b: 'angebot', j: 1, q: 'Was bedeutet Amortisation?',
    a: ['Die Verzinsung eines Kredits', 'Die Abschreibung über die Nutzungsdauer', 'Die Zeit, bis eine Investition ihre Kosten wieder eingespielt hat', 'Der Wiederverkaufswert eines Geräts'],
    r: 2, e: 'Die Amortisationszeit ergibt sich aus Anschaffungskosten ÷ jährliche Einsparung. Sie sagt, wie viele Jahre es dauert, bis sich eine Investition bezahlt gemacht hat.', q_: 'FIN' },

  /* ===== Neu aus dem offiziellen Prüfungskatalog (PK-01 … PK-07) =====
     Optionen bewusst längen-balanciert: die richtige Antwort ist nie die
     eindeutig längste, damit man sie nicht an der Länge erkennt. */

  { t: 'ap1', b: 'kommunikation', j: 1, q: 'Wie viele Seiten hat eine Nachricht nach dem 4-Ohren-Modell von Schulz von Thun?',
    a: ['Zwei: Sender und Empfänger der Nachricht', 'Eine: nur der reine Sachinhalt der Nachricht', 'Drei: Inhalt, Ton und Wirkung der Nachricht', 'Vier: Sachebene, Appell, Selbstoffenbarung, Beziehung'],
    r: 3, e: 'Jede Nachricht hat vier Aspekte, die der Empfänger auf vier „Ohren" hören kann: Sachebene (der Inhalt), Appell (was erreicht werden soll), Selbstoffenbarung (was der Sender über sich verrät) und Beziehung (wie er zum Empfänger steht).', q_: 'PK2' },
  { t: 'ap1', b: 'kommunikation', j: 1, q: 'Der Kunde sagt: „Das Licht ist grün." Nach dem 4-Ohren-Modell – welche Deutung entspricht dem Appell?',
    a: ['Fahr endlich los! – eine Aufforderung', 'Die Ampel zeigt Grün – reine Information', 'Ich kenne die Verkehrsregeln – Selbstoffenbarung', 'Du fährst immer viel zu langsam'],
    r: 0, e: 'Dieselbe Aussage kann unterschiedlich gehört werden. Der Appell ist die Aufforderung („Fahr los!"), die Sachebene die reine Information, die Selbstoffenbarung der Hinweis auf die eigene Person und die Beziehungsebene die Aussage über das Verhältnis der Beteiligten.', q_: 'PK2' },
  { t: 'ap1', b: 'kommunikation', j: 1, q: 'Welche Bestandteile hat das Sender-Empfänger-Modell?',
    a: ['Sender, Empfänger und ein Störfilter im Kanal', 'Sender, Empfänger, Nachricht, Kodierung und Störquelle', 'Nur Sender und Empfänger ohne weitere Elemente', 'Sachebene, Appell, Selbstoffenbarung und Beziehung'],
    r: 1, e: 'Der Sender kodiert eine Nachricht, der Empfänger dekodiert sie. Auf jeder Stufe können Störungen (Rauschen) auftreten – deshalb ist die gesendete nicht automatisch die verstandene Nachricht.', q_: 'PK2' },
  { t: 'ap1', b: 'kommunikation', j: 1, q: 'Sie wollen vom Kunden möglichst viele Informationen erhalten. Welche Frageform eignet sich?',
    a: ['Die geschlossene Frage mit zwei Antwortmöglichkeiten', 'Die Suggestivfrage, die die Antwort bereits nahelegt', 'Die offene Frage, etwa „Was ist Ihnen wichtig?"', 'Die rhetorische Frage ohne echte Antwortoption'],
    r: 2, e: 'Offene Fragen (W-Fragen) liefern die meisten Informationen, weil sie nicht auf Ja/Nein oder vorgegebene Optionen einschränken. Geschlossene Fragen nutzt man später zur Bestätigung, Suggestivfragen sind manipulativ und zerstören Vertrauen.', q_: 'PK2' },
  { t: 'ap1', b: 'kommunikation', j: 1, q: 'Was bezeichnet der Kanal im Sender-Empfänger-Modell?',
    a: ['Die Störung, die während der Übertragung auftritt', 'Die emotionale Stimmung des Senders beim Sprechen', 'Die Rückmeldung des Empfängers an den Sender', 'Das Übertragungsmedium wie Gespräch, Telefon oder E-Mail'],
    r: 3, e: 'Der Kanal ist das Übertragungsmedium (Gespräch, Telefon, E-Mail, Chat). Jeder Kanal hat eigene Stärken und Störrisiken: Beim Telefon fehlt die Mimik, bei E-Mail der Tonfall – Missverständnisse entstehen besonders leicht bei rein schriftlicher Kommunikation.', q_: 'PK2' },
  { t: 'ap1', b: 'kommunikation', j: 1, q: 'Welche Marktform liegt vor, wenn wenige große Anbieter den Markt beherrschen?',
    a: ['Das Oligopol', 'Das Monopol', 'Das Polypol', 'Der Käufermarkt'],
    r: 0, e: 'Monopol = ein Anbieter, Oligopol = wenige Anbieter, Polypol = viele Anbieter. Der Käufer-/Verkäufermarkt beschreibt dagegen, wer die stärkere Verhandlungsposition hat (Angebot größer oder kleiner als Nachfrage).', q_: 'PK2' },
  { t: 'ap1', b: 'kommunikation', j: 1, q: 'Auf einem Polypol mit vielen Anbietern und geringer Nachfrage – wer ist in der stärkeren Position?',
    a: ['Der Verkäufer, weil er die Ware besitzt und liefern kann', 'Der Käufer, weil er zwischen vielen Anbietern wählen kann', 'Beide gleich stark, weil der Staat die Preise reguliert', 'Der Hersteller, weil er die Produktionskosten bestimmt'],
    r: 1, e: 'Das ist ein Käufermarkt: Das Angebot übersteigt die Nachfrage, der Käufer kann wählen und Preise drücken. Im Verkäufermarkt ist es umgekehrt – dort kann der Verkäufer seine Konditionen durchsetzen.', q_: 'PK2' },
  { t: 'ap1', b: 'kommunikation', j: 1, q: 'Welche Reihenfolge beschreibt den Weg vom Mangelgefühl bis zum konkret geäußerten Kaufwunsch am Markt?',
    a: ['Nachfrage → Bedarf → Bedürfnis', 'Bedarf → Bedürfnis → Nachfrage', 'Bedürfnis → Bedarf → Nachfrage', 'Bedürfnis → Nachfrage → Bedarf'],
    r: 2, e: 'Das Bedürfnis ist das reine Empfinden eines Mangels. Erst mit Kaufkraft wird daraus Bedarf. Wenn dieser Bedarf am Markt tatsächlich geäußert wird, spricht man von Nachfrage.', q_: 'PK2' },
  { t: 'ap1', b: 'kommunikation', j: 1, q: 'Sie werten bereits vorhandene Verkaufszahlen Ihres Unternehmens aus. Um welche Forschungsart handelt es sich?',
    a: ['Um Primärforschung, weil die Zahlen aus dem eigenen Haus stammen', 'Um Testmarktforschung, weil Zahlen verglichen werden', 'Um Feldforschung, weil sie im Markt entstanden sind', 'Um Sekundärforschung, weil bereits erhobene Daten genutzt werden'],
    r: 3, e: 'Primärforschung erhebt neue Daten selbst (Befragung, Beobachtung, Experiment). Sekundärforschung nutzt vorhandene Quellen wie interne Statistiken, Verbände, Kammern oder Studien. Sie ist günstiger, aber weniger passgenau.', q_: 'PK2' },
  { t: 'ap1', b: 'kommunikation', j: 1, q: 'Was bedeutet die Abgrenzung einer Zielgruppe?',
    a: ['Die Eingrenzung auf Kunden mit gemeinsamen Merkmalen', 'Die Auswahl aller denkbaren Kunden ohne Einschränkung', 'Die Liste der Kunden, die bereits gekauft haben', 'Die Abteilungen, die am Verkauf beteiligt sind'],
    r: 0, e: 'Eine Zielgruppe wird über Merkmale wie Branche, Unternehmensgröße, Bedarf oder Region abgegrenzt. Eine zu breite Zielgruppe streut die Mittel, eine zu enge verschenkt Potenzial – deshalb ist die Abgrenzung Teil des Prüfungsstoffs.', q_: 'PK2' },
  { t: 'ap1', b: 'kommunikation', j: 1, q: 'Welches Kriterium ist ein quantitatives Kriterium im Angebotsvergleich?',
    a: ['Der Kundenservice des Anbieters', 'Der Liefertermin in Wochen', 'Der Referenzkunde des Anbieters', 'Das Image des Anbieters'],
    r: 1, e: 'Quantitative Kriterien lassen sich in Zahlen fassen: Preis, Lieferzeit, Menge, Rabatt, Verbrauch. Qualitative Kriterien wie Service, Reputation oder Zukunftssicherheit sind nicht direkt messbar und müssen über Bewertungspunkte vergleichbar gemacht werden.', q_: 'PK2' },
  { t: 'ap1', b: 'kommunikation', j: 1, q: 'Ihr Kunde versteht ein Fachwort nicht. Welches Verhalten ist professionell?',
    a: ['Das Fachwort mehrfach wiederholen, bis es bekannt ist', 'Den Kunden auf seine Wissenslücke hinweisen', 'Allgemein verständlich formulieren und den Nutzen erklären', 'Die Beratung an eine Fachabteilung abgeben'],
    r: 2, e: 'Kundenorientierte Kommunikation heißt, die Sprache des Gegenübers zu treffen und den Nutzen statt der Technik zu erklären. Fachbegriffe sind erlaubt, müssen aber erklärt werden – der PK fordert ausdrücklich, deutsche und englische Fachbegriffe sicher anzuwenden.', q_: 'PK2' },

  { t: 'ap1', b: 'vertrag', j: 2, q: 'Worin liegt der zentrale Unterschied zwischen Werkvertrag und Dienstvertrag?',
    a: ['Der Unterschied betrifft nur die Höhe der Vergütung', 'Der Dienstvertrag schuldet einen Erfolg, der Werkvertrag die Tätigkeit', 'Beide Vertragsarten schulden einen konkreten Erfolg', 'Der Werkvertrag schuldet einen Erfolg, der Dienstvertrag die Tätigkeit'],
    r: 3, e: 'Beim Werkvertrag wird ein bestimmter Erfolg geschuldet (der Kunde zahlt erst, wenn das Werk abgenommen ist). Beim Dienstvertrag wird die Tätigkeit selbst geschuldet – das Ergebnis ist nicht garantiert. Klassische Begriffsfalle in der AP1.', q_: 'PK7' },
  { t: 'ap1', b: 'vertrag', j: 2, q: 'Ein IT-Systemhaus soll einen Server dauerhaft betreuen und Störungen innerhalb festgelegter Zeiten bearbeiten. Welcher Vertrag passt?',
    a: ['Ein Servicevertrag mit Service Level Agreement', 'Ein Werkvertrag über die Einrichtung des Servers', 'Ein Kaufvertrag über die Serverhardware', 'Ein Mietvertrag über die Serverräume'],
    r: 0, e: 'Ein Servicevertrag regelt die laufende Betreuung; das SLA legt messbare Qualitätsparameter fest, etwa Reaktionszeit, Wiederherstellungszeit und Verfügbarkeit (z. B. 99,9 %). SLAs sind in PK-07 ausdrücklich genannt.', q_: 'PK7' },
  { t: 'ap1', b: 'vertrag', j: 2, q: 'Der Lieferant schickt 8 von 10 bestellten Notebooks. Um welche Mängelart handelt es sich?',
    a: ['Schlechtleistung', 'Minderlieferung', 'Falschlieferung', 'Verzug'],
    r: 1, e: 'Minderlieferung = zu wenig geliefert. Schlechtleistung = mangelhafte Qualität, Falschlieferung = falscher Artikel (aliud). Verzug ist dagegen eine Terminüberschreitung. Die drei Mängelarten sind PK-07-Pflichtstoff.', q_: 'PK7' },
  { t: 'ap1', b: 'vertrag', j: 2, q: 'Der Kunde bestellt 10 Notebooks, geliefert werden 10 Tablets. Wie heißt diese Mängelart?',
    a: ['Minderlieferung', 'Schlechtleistung', 'Falschlieferung', 'Sachmangel'],
    r: 2, e: 'Bei einer Falschlieferung wird eine andere Sache geliefert als bestellt (aliud). Sie ist von der Schlechtleistung (mangelhafte Beschaffenheit der richtigen Sache) und der Minderlieferung (zu geringe Menge) zu unterscheiden.', q_: 'PK7' },
  { t: 'ap1', b: 'vertrag', j: 2, q: 'Was gehört typischerweise NICHT in ein Abnahmeprotokoll?',
    a: ['Datum, Ort und beteiligte Personen', 'Festgestellte Mängel und ihre Fristen', 'Ergebnis der Abnahme und Unterschriften', 'Die Gehälter der beteiligten Techniker'],
    r: 3, e: 'Das Abnahmeprotokoll dokumentiert Datum, Beteiligte, Prüfgegenstand, festgestellte Mängel, Fristen zur Behebung, das Abnahmeergebnis und die Unterschriften. Interne Gehaltsdaten gehören niemals in ein Kundendokument.', q_: 'PK7' },
  { t: 'ap1', b: 'vertrag', j: 2, q: 'In welcher Aufbauorganisation hat jede Stelle genau eine vorgesetzte Instanz?',
    a: ['Einliniensystem', 'Mehrliniensystem', 'Matrixorganisation', 'Stabliniensystem'],
    r: 0, e: 'Im Einliniensystem hat jede Stelle genau einen Vorgesetzten (klare Zuständigkeit, aber lange Wege). Im Mehrliniensystem kann eine Stelle mehrere fachliche Vorgesetzte haben. Die Matrixorganisation kombiniert fachliche und projektbezogene Leitung. Das Stabliniensystem ist nicht PK-Pflicht.', q_: 'PK7' },
  { t: 'ap1', b: 'vertrag', j: 2, q: 'Wodurch ist die Matrixorganisation gekennzeichnet?',
    a: ['Jede Abteilung arbeitet völlig unabhängig vom Projekt', 'Es gilt gleichzeitig fachliche und projektbezogene Leitung', 'Es gibt nur eine einzige Führungsebene im Betrieb', 'Es gibt keine festen Verantwortlichkeiten im Team'],
    r: 1, e: 'In der Matrixorganisation überlagern sich eine horizontale (fachliche, z. B. Abteilung) und eine vertikale (projektbezogene) Weisungslinie. Vorteil ist die flexible Nutzung von Fachwissen, Nachteil sind Kompetenzkonflikte und höherer Abstimmungsaufwand.', q_: 'PK7' },
  { t: 'ap1', b: 'vertrag', j: 2, q: 'Bei einem Veränderungsprojekt im Unternehmen – wie werden die Personengruppen nach ihrer Haltung bezeichnet?',
    a: ['Treiber, Helfer, Beobachter und Gegner', 'Sponsor, Kunde, Nutzer und Betreiber', 'Promoter, Bremser, Skeptiker und Widerständler', 'Forming, Storming, Norming und Performing'],
    r: 2, e: 'PK-07 verlangt, Promoter, Bremser, Skeptiker und Widerständler zu erkennen. Promoter treiben aktiv voran, Bremser halten still zurück, Skeptiker zweifeln und wollen Argumente, Widerständler lehnen offen ab. Jede Gruppe braucht eine andere Ansprache.', q_: 'PK7' },
  { t: 'ap1', b: 'vertrag', j: 2, q: 'Welche ist eine typische Ursache für Widerstand gegen eine Veränderung?',
    a: ['Zu hohe Gehälter im betroffenen Team', 'Fehlende Überstunden im Projekt', 'Zu viel direkter Kundenkontakt', 'Angst vor Kompetenzverlust und Wissenslücken'],
    r: 3, e: 'PK-07 nennt drei Ursachen: Angst vor Kompetenzverlust, Wissenslücken und die persönliche Historie (schlechte Erfahrungen mit früheren Projekten). Deshalb setzt man auf Mitarbeiterqualifizierung (z. B. Blended-Learning, Multiplikatoren) und Einbeziehung der Betroffenen.', q_: 'PK7' },
  { t: 'ap1', b: 'vertrag', j: 2, q: 'Sie vergleichen die geplanten Kosten einer Leistung mit den tatsächlich angefallenen Kosten. Wie heißt das?',
    a: ['Soll-Ist-Vergleich', 'Machbarkeitsanalyse', 'Nutzwertanalyse', 'Break-even-Analyse'],
    r: 0, e: 'Der Soll-Ist-Vergleich stellt geplante und tatsächliche Werte gegenüber. Abweichungen werden analysiert (Abweichungsanalyse) und die tatsächlichen Kosten nachgerechnet (Nachkalkulation). Daraus entstehen Lessons Learned und Nachfolgeaufträge.', q_: 'PK7' },
  { t: 'ap1', b: 'vertrag', j: 2, q: 'Wodurch kommt ein Kaufvertrag wirksam zustande?',
    a: ['Durch die Bestellung des Kunden allein', 'Durch Angebot und Annahme, also zwei Willenserklärungen', 'Durch die Zahlung des Kaufpreises an den Verkäufer', 'Durch die Rechnungsstellung nach der Lieferung'],
    r: 1, e: 'Ein Kaufvertrag entsteht durch Angebot und Annahme. Wichtig: Die Bestellung eines Kunden ist rechtlich bereits ein Angebot – die Auftragsbestätigung des Verkäufers ist die Annahme. Die Zahlung ist nur die Erfüllung, nicht die Entstehung.', q_: 'PK7' },
  { t: 'ap1', b: 'vertrag', j: 2, q: 'Was ist eine Konventionalstrafe?',
    a: ['Eine vom Gericht verhängte Strafe', 'Eine Strafe für den Kunden bei Rückgabe', 'Eine vertraglich vereinbarte Geldstrafe bei Verzug', 'Eine Steuer auf abgeschlossene Verträge'],
    r: 2, e: 'Die Konventionalstrafe (Vertragsstrafe) wird bereits im Vertrag vereinbart und greift, wenn eine Vertragspflicht nicht oder verspätet erfüllt wird. Sie gehört zu den Vertragsbestandteilen, die PK-07 neben Leistungsbeschreibung, Terminen und Entgelten nennt.', q_: 'PK7' },
  { t: 'ap1', b: 'vertrag', j: 2, q: 'Was bedeutet Leistungserbringung „Remote" im Gegensatz zu „vor Ort"?',
    a: ['Die Leistung wird vorab pauschal berechnet', 'Die Leistung wird direkt beim Kunden vor Ort erbracht', 'Die Leistung wird vollständig an Dritte ausgelagert', 'Die Leistung wird über eine Fernverbindung erbracht'],
    r: 3, e: 'Remote heißt Fernbetreuung über VPN oder Remote-Desktop: schnell, kostengünstig und ohne Fahrtzeit. Vor-Ort-Einsätze sind nötig, wenn Hardware getauscht oder verkabelt werden muss. Kunden geben oft vor, welche Variante zulässig ist.', q_: 'PK7' },
  { t: 'ap1', b: 'vertrag', j: 2, q: 'Ein Projektpartner liefert nicht zum vereinbarten Termin. Was liegt rechtlich vor?',
    a: ['Ein Lieferverzug', 'Eine Falschlieferung', 'Eine Minderlieferung', 'Eine Schlechtleistung'],
    r: 0, e: 'Verzug ist keine Mängelart der Lieferung, sondern eine Terminüberschreitung. Vertragsstörungen sind in PK-07 ein eigenes Lernziel; typische Rechtsfolgen sind Schadensersatz, Rücktritt oder eine vereinbarte Konventionalstrafe.', q_: 'PK7' },
  { t: 'ap1', b: 'vertrag', j: 2, q: 'Was unterscheidet einen Lizenzvertrag von einem Kaufvertrag bei Software?',
    a: ['Bei der Lizenz geht volles Eigentum an der Software über', 'Bei der Lizenz geht kein Eigentum über, nur ein Nutzungsrecht', 'Beide Vertragsarten sind rechtlich völlig identisch', 'Ein Lizenzvertrag ist ohne Unterschrift unwirksam'],
    r: 1, e: 'Software wird nicht verkauft, sondern zur Nutzung überlassen. Der Hersteller behält das Urheberrecht, der Kunde erhält definierte Nutzungsrechte – je nach Lizenz etwa Anzahl Arbeitsplätze, Laufzeit und Nutzungsumfang. Deshalb gehört der Lizenzvertrag neben Kauf-, Miet- und Leasingvertrag zu den PK-07-Vertragsarten.', q_: 'PK7' },
  { t: 'ap1', b: 'vertrag', j: 1, q: 'Was bedeutet Wertschöpfung im betrieblichen Sinne?',
    a: ['Der Umsatz eines Unternehmens in einem Geschäftsjahr', 'Der Gewinn nach Abzug aller Steuern und Abgaben', 'Der Wertzuwachs abzüglich zugekaufter Vorleistungen', 'Die Summe aller an Mitarbeiter gezahlten Gehälter'],
    r: 2, e: 'Wertschöpfung ist der Wertzuwachs, den ein Unternehmen selbst erzeugt – also der Wert der Ausgangsleistung minus der zugekauften Vorleistungen. Sie steht in PK-03 im Themenkreis Wirtschaftlichkeit und zeigt, welchen Anteil das Unternehmen selbst beiträgt.', q_: 'PK3' },
  { t: 'ap1', b: 'vertrag', j: 2, q: 'Welche drei Zieldimensionen nennt der Prüfungskatalog für das Unternehmensleitbild?',
    a: ['Gewinn, Umsatz und Marktanteil', 'Plan, Do und Check', 'Kunde, Mitarbeiter und Lieferant', 'Ökonomisch, ökologisch und sozial'],
    r: 3, e: 'PK-07 Themenkreis 02 fordert, Ziele dem Leitbild zu entnehmen: ökonomische Ziele (Umsatz, Gewinn), ökologische Ziele (Ressourcenschonung, Nachhaltigkeit) und soziale Ziele (Arbeitsbedingungen). Dieses Dreigestirn ist der Standardbegriff der Nachhaltigkeit.', q_: 'PK7' },

  { t: 'ap1', b: 'recht', j: 1, q: 'Welche Schutzziele nennt der offizielle Prüfungskatalog für die Informationssicherheit?',
    a: ['Vertraulichkeit, Integrität und Verfügbarkeit', 'Vertraulichkeit, Integrität, Verfügbarkeit und Authentizität', 'Sicherheit, Datenschutz und Datensicherung', 'Verfügbarkeit, Redundanz und Verschlüsselung'],
    r: 0, e: 'Achtung, klassische Falle: Der offizielle PK nennt nur drei Schutzziele – Vertraulichkeit, Integrität und Verfügbarkeit. Authentizität wird oft als viertes ergänzt, ist im PK-Pflichtstoff aber nicht aufgeführt.', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, q: 'Welche Schutzbedarfskategorien sieht der BSI IT-Grundschutz vor?',
    a: ['Niedrig, mittel und hoch', 'Normal, hoch und sehr hoch', 'Gering, erhöht und kritisch', 'Klasse 1 bis Klasse 5'],
    r: 1, e: 'Der BSI IT-Grundschutz arbeitet mit den drei Kategorien normal, hoch und sehr hoch. Der Schutzbedarf wird je Schutzziel (Verfügbarkeit, Vertraulichkeit, Integrität) getrennt bewertet und begründet – das ist genau der Aufbau der offiziellen Beispielaufgabe 3.1.', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, q: 'Für welche Objekt-Kategorien wird eine Schutzbedarfsanalyse durchgeführt?',
    a: ['Nur für Server und Netzwerkkomponenten', 'Nur für personenbezogene Datenbestände im Betrieb', 'Anwendungen, IT-Systeme, Räume und Verbindungen', 'Hardware und Software getrennt'],
    r: 2, e: 'PK-06 Themenkreis 02 nennt vier Objekt-Kategorien: Anwendungen, IT-Systeme, Räume und Infrastruktur sowie Kommunikationsverbindungen. Für jede wird der Schutzbedarf getrennt ermittelt – oft in einer Matrix.', q_: 'PK6' },
  { t: 'ap1', b: 'recht', j: 1, q: 'Wofür steht die Abkürzung TOM im Datenschutz?',
    a: ['Technische Oberflächen-Messung', 'Total Operations Management', 'Transaktionsorientierte Modellierung', 'Technisch-organisatorische Maßnahmen'],
